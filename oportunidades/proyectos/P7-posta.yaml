una_frase: "El inquilino que se va avisa primero (y se ahorra la multa por irse antes si el dueño acepta al reemplazo), el que busca se entera antes que nadie por su barrio, y todos ven reseñas honestas del edificio."
problema: "Los mejores departamentos de dueño directo se van en horas en grupos de Facebook de 50 mil personas; el inquilino que se va antes paga el 10% del alquiler que falta; el dueño pierde meses vacío; y nadie sabe si el edificio tiene humedad, ruido o un dueño imposible."
para_quien:
  - "Inquilinos de CABA y GBA que buscan (primero estudiantes que llegan del interior y jóvenes profesionales)."
  - "Inquilinos que se van antes de terminar el contrato (contratos desde el 29-12-2023: 10% del alquiler restante)."
  - "Dueños directos que no quieren meses vacíos."
mision: "Que mudarse sea más justo y más rápido para el que se va, el que llega y el dueño."
vision: "Para 2030, el lugar donde aparecen primero los departamentos de las ciudades grandes de Argentina, con la base de reseñas de edificios más útil del país."
objetivos:
  - {cuando: "may-2027", que: "Tu agente de alquileres cargado al repositorio."}
  - {cuando: "oct-2027", que: "Encuesta de validación y cuenta temática con 2.000 seguidores antes del lanzamiento."}
  - {cuando: "mar-2028", que: "Temporada alta (febrero–marzo) con 100 relevos publicados en 3 barrios."}
  - {cuando: "dic-2028", que: "150 suscriptores de alertas y 15 relevos concretados por mes."}
  - {cuando: "dic-2030", que: "GBA, Córdoba y Rosario; 700 suscriptores."}

alcance:
  incluye:
    - "Publicar un relevo: fotos, precio, fecha, condiciones y si el dueño acepta reemplazo"
    - "Alertas por barrio y precio (app, WhatsApp y Telegram)"
    - "Reseñas anónimas de edificios (humedad, ruido, expensas, seguridad, trato)"
    - "Calculadoras: multa por irse antes (10%) y ajuste por IPC/ICL"
    - "Modelo de acuerdo de traspaso para presentarle al dueño"
    - "Afiliados útiles: garantías (seguros de caución) y mudanzas"
    - "Tu agente de alquileres integrado"
  no_incluye:
    - "Copiar avisos de otros portales (sus términos lo prohíben)"
    - "Cobrar comisión inmobiliaria, manejar contratos o pagos"
    - "Reseñas con nombre y apellido de personas (solo edificios y experiencias)"

