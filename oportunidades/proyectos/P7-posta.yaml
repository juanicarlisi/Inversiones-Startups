nombres:
  - {n: "Posta", por_que: "Doble sentido perfecto en Argentina: «la posta» (el dato bueno, lo que no sabe nadie) y la «posta» de la carrera de relevos (el que se va le pasa el depto al que llega).", estado: "Sin app de alquileres con ese nombre en la búsqueda del 28-09-2026; verificar INPI"}
