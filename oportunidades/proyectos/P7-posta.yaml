# P7 · Buscador de alquileres con aviso anticipado del inquilino que se va → nombre recomendado "Posta". Definición (28-09-2026).
# Fuentes: conocimiento/2026-09-28-musica-alquileres-microtareas-fabrica.md (sección 2)
