diferencial:
  - "Le damos un incentivo al que se va (ahorrarse la multa del 10%, vender muebles, irse tranquilo): por eso publica antes que nadie."
  - "Reseñas de edificios en español: lo que Openigloo hizo en Nueva York."
  - "No competimos con Zonaprop ni Mercado Libre: llegamos antes de que el depto esté ahí."

benchmark:
  - {de: "Leasebreak y Flip (Nueva York)", tomamos: "El mercado de traspasos y subalquileres: el que se va vende «los meses que le quedan»."}
  - {de: "Openigloo", tomamos: "Reseñas anónimas de edificios y dueños; gratis si dejás una reseña."}
  - {de: "Grupos de Facebook de dueño directo", tomamos: "Dónde está hoy la demanda (y la difusión)."}
  - {de: "Roomix y las calculadoras de ajuste (Chequeado, Rents)", tomamos: "La IA para buscar y las calculadoras como puerta de entrada."}

difusion:
  principal: "Cuenta temática «deptos antes que nadie» (Instagram, TikTok, Facebook) + grupos de dueño directo + canal de WhatsApp por barrio."
  apoyo:
    - "Búsquedas de «multa por irme antes del alquiler» y «cuánto aumenta mi alquiler»."
    - "Universidades y residencias de estudiantes del interior (tu red de la UNNOBA)."
  tacticas:
    - "Arrancar la cuenta temática 3 meses antes del lanzamiento."
    - "Densidad por barrio: primero 3 barrios (Palermo, Caballito, Almagro) antes de abrir todo."
    - "Cada relevo concretado es un caso para contar (con permiso)."

metodologia:
  - "Validar antes de construir: encuesta anónima en grupos y 20 conversaciones por mensaje (con tu OK)."
  - "Verificación de avisos (anti-estafa) y moderación de reseñas."
  - "Tablero semanal: relevos publicados, alertas enviadas, relevos concretados."

quien:
  claude:
    - "Integra tu agente de alquileres, programa la web y la app, modera y arma el contenido de la cuenta temática"
  vos:
    - "Cargás tu agente, aprobás publicaciones y respondés a los primeros usuarios"

