# Las 40 formas de difusión a costo cero y sin poner la cara (28-09-2026). Fuente: conocimiento/2026-09-28-difusion-costo-cero.md
grupos:
  - g: "Cuentas temáticas sin cara"
    icono: "📸"
    items:
      - {n: 1, f: "Instagram temático: Reels de prueba (primero a no seguidores), carruseles, historias con encuestas", usa: "Senda, Posta, música"}
      - {n: 2, f: "TikTok con presentaciones de imágenes y clips de pantalla, 1–2 por día programados", usa: "Senda, juegos, fábrica"}
      - {n: 3, f: "YouTube: Shorts y videos largos con voz sintética y guion propio (con aviso de IA)", usa: "Andén, Senda, música"}
      - {n: 4, f: "Pinterest: pines que traen visitas durante meses", usa: "Senda, plantillas, Andén"}
      - {n: 5, f: "Facebook: página + grupo propio (el grupo llega a 20–40%)", usa: "Senda, Posta, Rutea"}
      - {n: 6, f: "Threads y X: frases, datos y respuestas rápidas", usa: "Senda, Andén"}
      - {n: 7, f: "Kwai: los mismos videos cortos (Brasil y Latinoamérica popular)", usa: "Senda en portugués"}
      - {n: 8, f: "Un personaje o mascota de marca que habla en todas las redes (identidad sin exponerte)", usa: "Senda (Semi), juegos (el carpincho)"}
  - g: "Crecer la cuenta conversando (lo que proponías)"
    icono: "🤝"
    items:
      - {n: 9, f: "Seguir y conversar con el público objetivo a ritmo humano (≈ 20–40 follows y 10–20 comentarios útiles por día en cuentas nuevas)", usa: "Todas las cuentas"}
      - {n: 10, f: "Comentar primero y con aporte en publicaciones grandes del nicho", usa: "Senda, Andén"}
      - {n: 11, f: "Colaboraciones entre cuentas del mismo tamaño (posteos conjuntos, menciones cruzadas)", usa: "Senda, música"}
      - {n: 12, f: "Mensajes a líderes de jóvenes y pastores ofreciendo Senda Reunión gratis (con tu OK)", usa: "Senda"}
  - g: "Donde la gente ya está reunida"
    icono: "👥"
    items:
      - {n: 13, f: "Tus grupos de WhatsApp (iglesia, facultad) y tus estados", usa: "Senda, Andén"}
      - {n: 14, f: "Canal de WhatsApp propio de cada proyecto", usa: "Senda, Posta, Me Toca"}
      - {n: 15, f: "Telegram: canal y bot de alertas", usa: "Posta, Andén"}
      - {n: 16, f: "Grupos de Facebook ajenos, con sus reglas", usa: "Posta, Rutea, Sobremesa"}
      - {n: 17, f: "Reddit con la regla 90/10 (90% aporte)", usa: "Andén, juegos"}
      - {n: 18, f: "Discord de jugadores y estudiantes", usa: "Juegos, Andén Aula"}
      - {n: 19, f: "Foros, centros de estudiantes y comunidades profesionales", usa: "Andén"}
  - g: "La gente te encuentra buscando"
    icono: "🔎"
    items:
      - {n: 20, f: "Optimizar la ficha de la tienda (título, palabras, capturas, video)", usa: "Todas las apps"}
      - {n: 21, f: "Ficha en español, portugués e inglés (+38% descargas por país)", usa: "Todas las apps"}
      - {n: 22, f: "Nominación a destacados de Google Play (apps nuevas) y programas para indies", usa: "Senda, fábrica, juegos"}
      - {n: 23, f: "Páginas útiles para Google: calculadoras y datos que la IA no reemplaza", usa: "Andén, Posta, Me Toca"}
      - {n: 24, f: "Páginas pensadas para que ChatGPT, Perplexity y Google las citen", usa: "Andén, Senda"}
      - {n: 25, f: "Directorios y vidrieras (Product Hunt, AlternativeTo, directorios de IA, faith.tools)", usa: "Andén, Senda"}
      - {n: 26, f: "Marketplaces con demanda propia (portales de juegos, Chrome, ChatGPT, Etsy, Amazon)", usa: "Juegos, canales de Andén"}
  - g: "El producto se difunde solo"
    icono: "🔁"
    items:
      - {n: 27, f: "Resultado para compartir (cuadraditos, puntaje de la liga, resumen del año)", usa: "Senda, juegos"}
      - {n: 28, f: "Imágenes para compartir con marca discreta y enlace", usa: "Senda"}
      - {n: 29, f: "Invitar con premio para los dos (semanas de premium, vidas extra)", usa: "Senda, fábrica"}
      - {n: 30, f: "Juego que necesita al otro (duelos, ligas de iglesias, modo proyector sin instalar)", usa: "Senda"}
      - {n: 31, f: "Widget en la pantalla de inicio: la app a la vista todo el día", usa: "Senda, Todo Bien"}
      - {n: 32, f: "Insertables en otros sitios con enlace de vuelta", usa: "Andén"}
      - {n: 33, f: "Desafíos con fecha (21 días de enero, Semana Santa, Hot Sale)", usa: "Senda, ofertas"}
  - g: "Personas que difunden por vos (sin pagar por adelantado)"
    icono: "🙌"
    items:
      - {n: 34, f: "Embajadores: líderes de jóvenes, docentes y estudiantes con beneficios", usa: "Senda, Andén"}
      - {n: 35, f: "Cátedras: un docente adopta y 100 alumnos por cuatrimestre la usan", usa: "Andén"}
      - {n: 36, f: "Afiliados o creadores que cobran por resultado", usa: "Senda, fábrica"}
      - {n: 37, f: "Notas de prensa de la marca a medios de nicho (con tu OK)", usa: "Senda, Andén"}
  - g: "La cartera como red"
    icono: "🕸️"
    items:
      - {n: 38, f: "Promoción cruzada gratis entre las apps propias (anuncios propios de AdMob)", usa: "Todas"}
      - {n: 39, f: "Un contenido, diez canales: Claude recorta cada pieza para cada red", usa: "Todas"}
      - {n: 40, f: "Recomendaciones cruzadas entre boletines del mismo nicho", usa: "Andén"}
