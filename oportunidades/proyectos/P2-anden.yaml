cortes:
  - "Septiembre de 2027: si no hay 500 usuarios por mes ni una cátedra usándola, queda solo lo gratis (se mantiene sola) y las horas pasan a la fábrica."
  - "Plan Pro: si a los 6 meses hay menos de 10 pagos, se revisa precio y valor antes de seguir invirtiendo en el simulador."

riesgos:
  - "Fórmula equivocada → cada una con fuente, ejemplo resuelto y tu validación."
  - "AnyLogic, Siemens o FlexSim lanzan algo parecido en español y barato → velocidad, costos locales y comunidad."
  - "Propiedad intelectual de tu empleador (Ley 11.723 art. 4 inc. d; LCT arts. 82, 85 y 88) → solo tu conocimiento general; nada de código, datos, tarifas ni nombres de la empresa; consulta de 1 hora con un abogado laboral antes del módulo de última milla."
  - "B2B lento → cátedras y búsquedas antes que ventas; nada de llamadas en frío."

pi:
  - "Marca «Andén» en el INPI (clases 9, 42 y 41)."
  - "Modelos de costos, plantillas y datos propios: secreto comercial; no patentar (hay antecedentes públicos del texto → simulación)."

recordatorios:
  - "Mayo de 2027: escribir una descripción general de tu simulador de última milla (qué preguntas responde, qué variables usa), sin código, archivos, datos ni nombres de la empresa. Claude construye desde cero un modelo genérico."
  - "Revisar tu contrato por cláusulas de confidencialidad o de no competencia."
  - "Pasarme tus planillas personales de costos, si tenés y no son de la empresa."

