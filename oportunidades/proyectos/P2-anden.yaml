una_frase: "El laboratorio logístico en español: calculadoras con costos argentinos que se actualizan solas y un simulador al que le contás tu operación (con texto, audio, un diagrama o un PDF) y te devuelve el cuello de botella, el costo por paquete y qué cambiar."
problema: "Pymes, operadores de reparto y estudiantes deciden a ojo: FlexSim cuesta ~USD 6.000 por año y AnyLogic USD 12–19 mil; en español casi no hay herramientas; y los costos (combustible, paritarias, índices) cambian todos los meses."
para_quien:
  - "Jefes de depósito y de transporte de pymes y operadores logísticos."
  - "Empresas de reparto de última milla y repartidores de Envíos Flex (más de 200 empresas solo en Buenos Aires; ~1 millón de entregas por día en el país)."
  - "Consultores e ingenieros industriales."
  - "Estudiantes y cátedras de ingeniería industrial y logística."
mision: "Que cualquier persona que maneja una operación logística pueda calcular y simular sus decisiones en minutos, en español y con números locales."
vision: "Para 2030, la herramienta de cabecera de la logística en Latinoamérica: 10 mil usuarios por mes, 200 profesionales pagos, 15 cátedras y la puerta de entrada a la logística pública de los municipios."
objetivos:
  - {cuando: "mar-2027", que: "Las 5 calculadoras de tu lista online, con índices que se actualizan solos."}
  - {cuando: "jul-2027", que: "«Contame tu operación» v1 con plantillas de depósito, cross-dock y hub de clasificación; plan Pro."}
  - {cuando: "sep-2027", que: "500 usuarios por mes o una cátedra usándola (hito de corte)."}
  - {cuando: "dic-2027", que: "2.000 usuarios por mes, 25 pagos y 2 cátedras."}
  - {cuando: "dic-2028", que: "Entrada con foto de diagrama o PDF; 5.000 usuarios por mes, 70 pagos, 5 cátedras; un piloto municipal si ganamos un desafío."}
  - {cuando: "dic-2030", que: "13.000 usuarios por mes, 200 pagos, 14 cátedras y 12 equipos."}

alcance:
  incluye:
    - "Calculadoras: tarifa a transportistas vs ingreso y volumen; costo por recorrido (troncal y última milla); costo laboral por operario; costo por paquete clasificado; costo por proceso de depósito; después ruteo, dotación por curva de volumen, Full vs Flex, stock de seguridad"
    - "Índices argentinos que se actualizan solos: FADEEAC (transporte), CEDOL/UTN (logística), AECAUM (última milla), escalas de Camioneros (CCT 40/89) y Comercio (130/75)"
    - "Simulador conversacional: contás tu operación (texto, audio, foto de un diagrama, PDF del procedimiento, planilla de volúmenes), la IA pregunta lo que falta y arma el modelo"
    - "Plantillas: depósito, cross-dock, hub de clasificación, última milla, planta"
    - "Informe en lenguaje llano: cuello de botella, costo por unidad, personas o vehículos necesarios, 3 escenarios «qué pasa si»"
    - "Andén Aula: versión para cátedras (guías, cuentas de alumnos) y micro-lecciones tipo Duolingo"
    - "Andén Ciudad: plantilla de recolección de residuos y otros recorridos municipales"
  no_incluye:
    - "Sistemas de gestión diaria (WMS, TMS)"
    - "Consultoría a medida (queda en pausa, P4 del catálogo)"
    - "Código, datos o procesos de la empresa donde trabajás"

versiones:
  - v: "Lanzamiento · febrero–marzo de 2027"
    funciones:
      - "5 calculadoras de tu lista, con ejemplo resuelto y fuente de cada número"
      - "Calculadora de peso volumétrico y cubicaje como puerta de entrada por búsquedas"
      - "Índices actualizados cada mes"
  - v: "v1 · junio–julio de 2027"
    funciones:
      - "«Contame tu operación»: entrevista con IA + simulación de eventos discretos con plantillas"
      - "Informe en lenguaje llano y comparación de escenarios"
      - "Plan Pro"
  - v: "v2 · segundo cuatrimestre de 2027"
    funciones:
      - "Andén Aula para cátedras (empezando por tu red de la UNNOBA) y micro-lecciones"
      - "Las calculadoras como app dentro de ChatGPT y como plantillas (canales extra)"
  - v: "v3 · 2028"
    funciones:
      - "Foto del diagrama o PDF del procedimiento → modelo"
      - "Ruteo y dotación por curva de volumen (picos de Hot Sale y CyberMonday)"
      - "Inglés y portugués; plan equipos"
      - "Andén Ciudad presentada a desafíos de innovación municipal"
  - v: "v4 · 2029–2030"
    funciones:
      - "Exportar a Excel y a sistemas de gestión; biblioteca de plantillas de la comunidad"
      - "Pilotos con municipios que asumen en diciembre de 2027"

diferencial:
  - "Entrevista de ingeniero: la IA no solo arma el modelo, pregunta lo que falta en criollo y sugiere valores de referencia."
  - "Entrada como la da una persona real: texto, audio, foto de un diagrama hecho a mano, PDF o planilla."
  - "Costos argentinos actualizados solos: nadie lo ofrece a pymes."
  - "Sale una decisión, no un modelo: costo por paquete, cuello de botella y qué cambiar."
  - "En español, en el navegador y a precio latinoamericano (contra USD 6.000–19.000 de las licencias)."
  - "Honestidad: AnyLogic y Siemens ya tienen asistentes que arman modelos simples desde texto, en inglés y para expertos; el diferencial está en todo lo anterior junto."

benchmark:
  - {de: "AnyLogic (asistente de IA) y Siemens Plant Simulation (copiloto)", tomamos: "Pasar de lenguaje natural a modelo; nosotros sumamos la entrevista, la entrada multimodal y el precio."}
  - {de: "Text2Sim MCP (código abierto)", tomamos: "Motor de simulación con SimPy que Claude ya sabe usar: base técnica barata."}
  - {de: "FlexSim", tomamos: "Plantillas logísticas (almacenamiento, picking, cross-dock)."}
  - {de: "Omni Calculator y PackCalc", tomamos: "Calculadoras simples como puerta de entrada por búsquedas."}
  - {de: "The Fresh Connection", tomamos: "El juego de cadena de suministro para cátedras, en español."}
  - {de: "Duolingo", tomamos: "Micro-lecciones con racha para estudiantes."}
  - {de: "Spoke/Circuit (ruteadores)", tomamos: "El ruteo para repartidores, que va como producto aparte en la fábrica (P5)."}

contenido:
  - "Fórmulas con fuente y fecha, validadas por vos (tu conocimiento es el control de calidad)."
  - "Índices públicos mensuales: FADEEAC, CEDOL/UTN, AECAUM, escalas de convenios, tarifas de Envíos Flex."
  - "Casos resueltos y tutoriales en video sin cara (grabación de pantalla + voz sintética)."

difusion:
  principal: "Búsquedas muy específicas en Google y en las respuestas de IA («cuánto cobrar por paquete en CABA», «costo por kilómetro de un camión 2027») + tutoriales en YouTube sin cara."
  apoyo:
    - "Cátedras y estudiantes de tu red (UNNOBA) y de otras facultades."
    - "Grupos de logística y de repartidores en Facebook, WhatsApp, Telegram y Reddit (r/supplychain, r/logistics), con la regla 90/10."
  tacticas:
    - "Calculadoras insertables en blogs y medios del sector, con enlace de vuelta."
    - "Informe mensual de costos logísticos con los índices (lo citan medios y la IA)."
    - "App dentro de ChatGPT y plantillas en marketplaces: mismo trabajo, más vidrieras."
    - "LinkedIn de empresa solo como vidriera: en 2026 las páginas de empresa llegan a ~2–5% de sus seguidores."

metodologia:
  - "Cada calculadora: vos definís qué decisión resuelve y validás el ejemplo; Claude la programa con fuentes; se publica con fecha."
  - "Índices con actualización automática mensual y aviso si una fuente cambia."
  - "Versión nueva cada dos semanas; tablero semanal; comité mensual."
  - "Simulador: primero plantillas acotadas y probadas, después la entrada libre."

quien:
  claude:
    - "Programa las calculadoras, el simulador y la entrevista con IA"
    - "Mantiene los índices, escribe los casos y graba los tutoriales"
    - "Arma la versión para cátedras y el informe mensual de costos"
  vos:
    - "Elegís y validás las fórmulas y los casos (tu ventaja)"
    - "Describís tu experiencia de última milla en términos generales (sin nada de tu empresa)"
    - "Presentás Andén Aula a 2–3 docentes de tu red (con tu OK)"

