lema: "Contale tu operación. Andén te dice cuánto cuesta y dónde se traba."
nombres:
  - {n: "Andén", por_que: "La palabra que todo logístico usa todos los días; corta, cálida y de acá. «Subilo a Andén».", estado: "Sin software logístico con ese nombre en la búsqueda del 28-09-2026; verificar INPI y dominio"}
  - {n: "Estiba", por_que: "Término técnico con sonido fuerte: «Estiba: calculá, simulá, decidí».", estado: "Verificar"}
