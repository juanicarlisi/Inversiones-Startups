# El holding: identidad, reglas, costos fijos y capital (28-09-2026).
# Lo procesa herramientas/holding.py (casos de negocio, simulación, horas, gantt) y el informe 3 v3.
# Fechas en formato AAAA-MM. Mes 0 = 2026-10. Horizonte del caso de negocio: 2026-10 → 2031-09 (60 meses).

nombre_trabajo: "El holding"
nombre: "Palanca"
lema: "Con poco, muchísimo."
nombres:
  - {n: "Palanca", por_que: "Arquímedes: con un punto de apoyo se mueve el mundo. Resume la filosofía (con poco hacer muchísimo) y suena bien como editor de apps: «una app de Palanca».", estado: "Sin conflicto visible en software (búsqueda del 28-09-2026); verificar INPI"}
  - {n: "Brote", por_que: "Lo que nace chico y crece; corto y amable.", estado: "Verificar"}
  - {n: "Nido", por_que: "Donde nacen los proyectos; cálido, corto.", estado: "Verificar (nombre común)"}
  - {n: "Ceibo", por_que: "Flor nacional argentina; identidad local.", estado: "Verificar (usado por varias empresas)"}
  - {n: "Hornero", por_que: "El pájaro que construye su casa con paciencia.", estado: "Existe Hornero Game Studio (Argentina): descartado"}
  - {n: "Fulcro", por_que: "El punto de apoyo de la palanca.", estado: "Existen Fulcro Labs y Fulcro (México): descartado"}

mision: "Construir con IA una cartera de productos digitales y activos que generen dólares sin salir a vender, reinvertir lo que dejan y componer durante años."
vision: "A fines de 2030, un holding anónimo con 10–15 productos vivos, 2–3 motores que se sostienen solos, una renta en dólares creciente y activos que se pueden vender."
objetivos:
  - {cuando: "dic-2026", que: "Suite cristiana publicada antes del 1 de enero; cuenta de renta funcionando con el agente de inversiones cargado; decisión sobre la empresa y sobre Claude Max."}
  - {cuando: "dic-2027", que: "Nueve líneas activas (dos motores, renta, una app comprada, fábrica, juegos, alquileres y dos de música), al menos un motor funcionando y la empresa del holding dueña de marcas y cuentas."}
  - {cuando: "dic-2028", que: "Versiones en portugués de lo que funcione, un producto nuevo por trimestre y un ingreso que ya paga todas las herramientas y deja excedente para renta."}
  - {cuando: "dic-2030", que: "Cartera diversificada, con renta y activos vendibles; decidir si se contrata ayuda o se vende algún activo."}
reglas:
  - "Tope de 10 horas por semana en total; Claude hace el 80–90% del trabajo técnico y de contenido."
  - "Dos motores a la vez como máximo en construcción intensa; el resto son líneas de pocas horas."
  - "Cada proyecto tiene regla de corte escrita antes de empezar; las horas que se liberan pasan al siguiente del backlog."
  - "Nada con plata ni con terceros sin tu OK (regla 8)."
  - "El 50% de la ganancia neta de los proyectos va a la renta en dólares; el otro 50% queda disponible para vos o para reinvertir."
  - "Cuentas, dominios y marcas a nombre de la empresa del holding, no personales."

capital:
  aporte_mensual: 400          # USD/mes del fundador
  ahorro_inicial: 2000         # USD disponibles (compra de la app, empresa, marcas)
  tasa_renta: 0.065            # rendimiento anual de la renta en dólares (escalera ON + letras + índice)
  reinversion: 0.5             # fracción de la ganancia neta de proyectos que va a renta

costos_fijos:                  # USD/mes del holding (no de un proyecto)
  - {que: "Claude Pro", desde: "2026-10", hasta: "2026-12", usd: 20}
  - {que: "Claude Max 5x (se decide en diciembre de 2026)", desde: "2027-01", hasta: "2031-09", usd: 100}
  - {que: "Empresa del holding + contador (estimado)", desde: "2027-03", hasta: "2031-09", usd: 45}
  - {que: "Dominios, hosting general y herramientas", desde: "2026-10", hasta: "2031-09", usd: 15}
  - {que: "Cuenta de Apple para versiones iOS", desde: "2027-09", hasta: "2031-09", usd: 8}
gastos_unicos:
  - {que: "Cuenta de Google Play", cuando: "2026-10", usd: 25}
  - {que: "Constitución de la empresa (LLC o SAS, estimado)", cuando: "2027-02", usd: 500}
  - {que: "Marcas en el INPI (≈ USD 27 por clase, 3 clases por proyecto que siga)", cuando: "2027-03", usd: 160}
  - {que: "Marcas en el INPI (segunda tanda)", cuando: "2027-11", usd: 240}

hitos:
  - {cuando: "2026-12", que: "¿Pasamos a Claude Max? Sí, si la suite está lista para publicarse y Logistic Lab arranca en enero."}
  - {cuando: "2027-02", que: "Empresa del holding (LLC o SAS) con un contador: antes de activar cobros."}
  - {cuando: "2027-04", que: "Suite cristiana: ¿1.000 usuarios activos por semana y 10% que vuelve? Si no, modo mantenimiento."}
  - {cuando: "2027-07", que: "Compra de la app (si alguna pasa los criterios) y lanzamiento del primer producto de la fábrica."}
  - {cuando: "2027-09", que: "Logistic Lab: ¿500 usuarios por mes o una cátedra? Si no, queda lo gratis."}
  - {cuando: "2027-12", que: "Comité anual: qué se acelera en 2028, qué se corta, ¿Max 20x o ayuda de un moderador?"}
  - {cuando: "2028-06", que: "Versión en portugués de lo que funcione; ¿segunda compra más grande con caja propia?"}
  - {cuando: "2028-12", que: "Comité anual: cartera contra renta; primer secundario del backlog si hay horas."}
  - {cuando: "2029-12", que: "Comité anual: ¿contratar ayuda (moderación, soporte) o vender un activo?"}
  - {cuando: "2030-12", que: "Revisión a 5 años: estrategia 2031–2035."}
