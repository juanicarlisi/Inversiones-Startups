# P12 · Inversión inmobiliaria en Argentina → nombre interno "Ladrillo". Definición de proyecto (17-11-2026).
# Fuente: conocimiento/2026-11-17-inmobiliario-argentina.md (bitácora con fuentes, tablas por plaza y cálculo de TIR).
# Análisis para decisión propia del fundador, no asesoramiento financiero regulado (regla 9). Nada se compra sin su OK (regla 8).
# Es un sub-balde de Cimiento (P3): la plata vive en el mismo pozo de renta; esta ficha define cuánto de ese pozo va a ladrillo y cuándo.
id: P12
orden: 12
catalogo: [G3]
tipo: renta
rol: "Patrimonio y opción (sub-balde de Cimiento)"
icono: "🧱"
color: "#9c4221"
nombre_trabajo: "Inversión inmobiliaria"
nombre: "Ladrillo"
lema: "Ladrillo cuando pague más que el dólar quieto; mientras tanto, ladrillo de papel."
nombres:
  - {n: "Ladrillo", por_que: "Es como se dice en Argentina («invertir en ladrillo») y dice exactamente qué es. Recomendado: es interno y gana la claridad.", estado: "Uso interno"}
  - {n: "Zaguán", por_que: "La entrada de la casa porteña, donde se espera antes de pasar: la línea espera en la puerta hasta que se abre la compuerta de compra.", estado: "Uso interno"}
  - {n: "Umbral", por_que: "La regla central es un umbral (renta neta ≥ 6% o precio 15% abajo): se cruza solo cuando se cumple.", estado: "Uso interno"}
  - {n: "Medianera", por_que: "La pared que comparten dos casas: la línea comparte el pozo con Cimiento y los datos con Posta.", estado: "Uso interno"}
  - {n: "Teja", por_que: "Corto y concreto, techo propio de a poco.", estado: "Uso interno"}

una_frase: "Una línea de inversión inmobiliaria por tramos: hoy, con poco capital, exposición al ladrillo solo por vehículos regulados que pagan en dólares (fondo cerrado de hipotecas, REIT local y CEDEAR de REIT); un tablero trimestral hecho por Claude que mide renta y precio de cierre plaza por plaza; y la compra de una unidad entera recién cuando el capital alcance y el precio deje más que la renta fija en dólares."
problema: "El ahorro argentino quiere ladrillo, pero hoy un departamento en CABA rinde ~4% neto y una TIR esperada a 10 años de ~4,5-5,5% en dólares, debajo de las ON (~6,3-7%); el temporario rinde menos desde que el alquiler de vivienda dejó de pagar Ganancias en 2026; y con USD 400 por mes una unidad entera recién entra hacia 2031-2033. Sin reglas, se compra en el momento equivocado o se cae en plataformas que prometen 10-15% sin regulación."
para_quien:
  - "El holding: diversificar el patrimonio en activos reales sin resignar rendimiento ni liquidez antes de tiempo."
  - "El fundador: una casa de inversión propia a largo plazo, con reglas escritas antes de poner la plata."
mision: "Que cada dólar que vaya a ladrillo rinda al menos lo que rendiría en la tesorería, y que la compra de un inmueble se haga en el momento del ciclo en que conviene, no cuando sobra la plata."
vision: "Para 2031, una unidad comprada con descuento en una plaza con renta neta ≥ 6%, o la certeza documentada de que no convino y la plata rindió más en otro lado."
objetivos:
  - {cuando: "dic-2026", que: "Decidir si entra el primer tramo de ladrillo de papel (≤ USD 500 en el fondo de hipotecas en dólares) después de leer su reglamento y comisiones."}
  - {cuando: "mar-2027", que: "Observatorio Ladrillo v1: tablero trimestral de 8 plazas (renta bruta, precio de cierre, temporario, regulación) con la compuerta de compra en rojo o verde."}
  - {cuando: "dic-2027", que: "Revisión post-elecciones: ¿cayó el precio de cierre o subió la renta lo suficiente para abrir la compuerta?"}
  - {cuando: "dic-2028", que: "Ladrillo de papel ≤ 20% de la tesorería, rindiendo ≥ la vara; lista corta de 3 plazas y tipologías para la primera compra."}
  - {cuando: "dic-2030", que: "Con capital libre ≥ USD 40-60 mil: primera unidad solo si la compuerta da verde; si no, informe de por qué no."}

alcance:
  incluye:
    - "Ladrillo de papel regulado por la CNV: FCIC de hipotecas en dólares (Allaria-Lendar), REIT local (Ciclo Nova), CEDEAR de REIT o ETF inmobiliario (VNQ, PLD, O)"
    - "Observatorio Ladrillo: tablero trimestral con fuentes públicas (Index Zonaprop, UCEMA/REMAX, Colegio de Escribanos, Mudafy, Roomix, AirDNA)"
    - "Compuerta de compra escrita y su control en el comité de diciembre"
    - "Compra de una unidad para alquiler tradicional de vivienda (exento de Ganancias desde 2026) cuando la compuerta lo habilite"
    - "Tu agente de alquileres, integrado al observatorio cuando lo cargues"
  no_incluye:
    - "Plataformas de inversión fraccionada o tokenizada sin oferta pública ni prospecto en la CNV; fideicomisos de oferta privada"
    - "Pozo en cuotas ajustadas por el costo de construcción, cocheras (K24), lotes sin tesis propia (para eso está OP-10)"
    - "Rent-to-rent sin permiso escrito del dueño (CCyC 1213-1214) y operar temporarios con horas del fundador"
    - "Copiar avisos de portales (sus términos lo prohíben)"
    - "Asesoramiento financiero regulado: son análisis para decisión propia"

tramos:
  - tramo: "0 · Hoy (USD 0-2.000 y parte de los USD 400 por mes)"
    que: "Ladrillo de papel dentro de la tesorería: hasta USD 500 en el FCIC de hipotecas en dólares y, si se quiere cobertura global, un CEDEAR de REIT chico. Claude arma el observatorio."
    compuerta_para_pasar: "Haber leído reglamento, comisiones y precio en el secundario; nada de ladrillo físico."
    tope: "≤ 20% de la tesorería y ≤ USD 1.000 por vehículo durante los primeros 12 meses de historia propia."
  - tramo: "1 · USD 10.000-40.000 acumulados (~2028-2032)"
    que: "Más ladrillo de papel si rindió lo prometido; lista corta de unidades de USD 35-55 mil (1 dormitorio en Mendoza o Córdoba, barrio sur de CABA) con renta bruta 8-10%."
    compuerta_para_pasar: "Compuerta de compra en verde (abajo) y capital que alcance sin vaciar la tesorería."
    tope: "Una unidad ≤ 40% del patrimonio del holding."
  - tramo: "2 · USD 60.000 o más"
    que: "Mono o 2 ambientes en CABA para alquiler tradicional, o 1-2 dormitorios en Córdoba o Neuquén con administración local; temporario o amoblado mensual solo si el cálculo neto le gana al tradicional."
    compuerta_para_pasar: "La misma compuerta, con tasación independiente y salida pensada."
    tope: "Sin deuda salvo la que se pague sola con la renta del inmueble."
compuerta_compra:
  - "Capital libre ≥ precio + 10% de gastos, sin dejar la tesorería debajo de su mínimo."
  - "TIR esperada a 10 años ≥ vara + 1 punto (hoy ~8%): en la práctica, renta neta ≥ 6% sobre el precio de compra o precio de cierre ≥ 15% por debajo del de noviembre de 2026 en esa plaza."
  - "Visita y tasación independientes, contrato tradicional de vivienda y comprador probable identificado para la salida."

