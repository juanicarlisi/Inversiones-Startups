cortes:
  - "Ladrillo de papel: si un vehículo informa mora > 5% de la cartera, cotiza con descuento > 15% o cambia reglas, no se suma más y se evalúa salir en el comité."
  - "Si a diciembre de 2029 la compuerta nunca dio verde y el ladrillo de papel rindió menos que las ON, la línea queda solo como observatorio (0 h y 0 USD nuevos) hasta que la compuerta cambie."
  - "Nunca: plataformas no reguladas, pozo, cochera o rent-to-rent sin permiso; ni comprar a precio de mercado porque «el ladrillo nunca pierde» (perdió ~24% en dólares entre 2020 y 2023)."

riesgos:
  - "Riesgo Argentina 2027: el ladrillo local y las ON se mueven con el riesgo país (405 pb en julio, 855 pb el 16-11-2026); el ladrillo local no diversifica → parte en CEDEAR de REIT global y la compra solo con descuento."
  - "Crédito del fondo de hipotecas (mora si sube el desempleo) → aforo ≤ 35%, tope por vehículo, corte por mora."
  - "Liquidez: fondos cerrados chicos y un inmueble tardan meses en venderse → solo plata que no se necesita en 5 años."
  - "Regulación del temporario más dura donde hay emergencia habitacional (Bariloche, El Calafate) → la tesis es alquiler tradicional."
  - "Impuestos: la exención de Ganancias a alquileres de vivienda (Ley 27.802 y Decreto 406/2026) puede revertirse con otro gobierno."
  - "Inquilino que no paga o vacancia larga → contrato tradicional con garantía (seguro de caución) y barrios con demanda probada."
  - "Costo de oportunidad: si los precios suben 4-5% por año sin crisis, esperar cuesta upside; se acepta porque la vara rinde igual."

