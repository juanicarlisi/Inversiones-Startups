diferencial:
  - "Disciplina de ciclo: la plata espera rindiendo 6-7% y el ladrillo se compra cuando el precio de cierre cae o la renta sube, no cuando sobra la plata."
  - "Datos propios cada trimestre con precio de cierre (no solo el pedido de los portales), renta y regulación por plaza."
  - "Ladrillo de papel regulado como puente: renta en dólares con garantía real antes de poder comprar una unidad."
  - "Los mismos datos alimentan a Posta (P7): una sola investigación, dos usos."

benchmark:
  - {de: "Inversor tradicional argentino (compra en pozo o usado y alquila)", tomamos: "El alquiler tradicional de vivienda, que desde 2026 no paga Ganancias ni cedular al vender."}
  - {de: "REITs de EE. UU. (VNQ, Prologis)", tomamos: "Diversificación y liquidez; como cobertura, no como renta (30% de retención a dividendos)."}
