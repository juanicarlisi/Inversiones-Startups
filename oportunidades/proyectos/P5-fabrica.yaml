una_frase: "Una suite de apps chicas y útiles: cada trimestre Claude trae 3 candidatas con datos (lo que ya funciona afuera y no existe acá), vos elegís una, se lanza en el canal donde la demanda ya existe y a los 90 días se sigue o se corta."
problema: "Una sola app es una apuesta; muchas apps chicas, hechas en días con Claude y conectadas entre sí, suben las chances de acertar y se promocionan unas a otras."
para_quien:
  - "Cada producto tiene su público (abajo). El holding gana con la cartera: promoción cruzada, aprendizaje y activos vendibles."
mision: "Llevar al español (y al portugués) lo que ya probó funcionar afuera, en versiones simples, útiles y baratas."
vision: "Para 2030, 10–12 apps vivas, 2–3 que dejan USD 500+ por mes cada una y una red de promoción cruzada con decenas de miles de usuarios."
objetivos:
  - {cuando: "jul-2027", que: "Producto 1 (Todo Bien) publicado en español y portugués."}
  - {cuando: "oct-2027", que: "Producto 2 (Rutea) publicado."}
  - {cuando: "jun-2028", que: "4 productos vivos; al menos 1 que supera USD 300 por mes."}
  - {cuando: "dic-2030", que: "10+ productos vivos y red de promoción cruzada."}

alcance:
  incluye:
    - "Radar en segundo plano desde enero de 2027 (Claude, sin horas tuyas): tiendas, listados de Flippa, apps que crecen en inglés, portugués o chino sin versión en español"
    - "Un producto por trimestre desde julio de 2027, con regla de 90 días"
    - "Promoción cruzada entre todas las apps del holding"
  no_incluye:
    - "Apps que compiten de frente con gigantes gratis (linternas, escáneres, VPN)"
    - "Crecer comprando descargas"

