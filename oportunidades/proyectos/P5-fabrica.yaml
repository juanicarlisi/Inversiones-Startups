diferencial:
  - "Nada nuevo por capricho: cada producto es algo que ya probó funcionar afuera, adaptado a lo local (idioma, WhatsApp, pesos, costumbres)."
  - "Construir cuesta días; por eso se prueban muchos y se corta a los 90 días lo que no prende."
  - "La cartera se promociona sola: cada usuario de una app ve las otras."

