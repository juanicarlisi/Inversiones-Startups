metricas:
  norte: "Procesos con datos cargados (no valores por defecto) por semana"
  otras: ["Simulaciones corridas", "Exportaciones", "Pagos y cátedras", "Impresiones y anotados de las 30 páginas"]

cortes:
  - "Hasta el 15-01-2027: cero horas del fundador."
  - "Prueba a ciegas: si 3 de 5 no eligen el prototipo con diferencia clara, o la salida del chat se corrige en menos de 15 minutos, muere la puerta propia."
  - "30 páginas: menos de 2.000 impresiones o menos de 30 anotados en 8 semanas → muere la puerta propia."
  - "El modelador nunca más del 20 % de las horas de Andén; si se pasa dos semanas seguidas, se congela."
  - "Si Andén no pasa su corte (sep-2027), el modelador queda gratis y sin más horas."
  - "Si más del 70 % de los usuarios deja los valores por defecto o el análisis no cambia ninguna decisión en 3 casos reales, se mata también el modelador."

riesgos:
  - "Dispersión en el año de Senda → cero horas hasta el 15-01; dentro de Andén; tope del 20 %."
  - "IA genérica suficiente → prueba a ciegas antes de construir."
  - "Canal inexistente → 30 páginas medidas."
  - "Trabajo de una vez → lo recurrente viene de la simulación, no del manual."
  - "Precisión falsa con datos inventados → datos marcados como medidos o estimados y resultados en rango."
  - "Licencias de motores (bpmn-js exige su marca de agua; tldraw es pago) → ver bitácora 05."

pi:
  - "Marca en el INPI solo si se abre la puerta propia (clases 9 y 42)."
  - "Motor de análisis y plantillas con tiempos de referencia: secreto comercial."

