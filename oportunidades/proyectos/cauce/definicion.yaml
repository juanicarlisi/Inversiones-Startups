# Cauce · definición del proyecto (17-11-2026). Propuesta: espera la decisión del fundador (DEC-2026-11-17-5).
# No está en oportunidades/proyectos/P*.yaml a propósito: entra al modelo del holding (herramientas/holding.py) solo si se aprueba.
# Fuentes: conocimiento/2026-11-17-cauce-01 … 07; ficha OP-17; visión en oportunidades/proyectos/cauce/vision.html.
id: P10-propuesto
op: OP-17
rol: "Motor compartido con Andén (P2); puerta propia condicionada a dos pruebas"
nombre_trabajo: "Plataforma de flujogramas y gestión inteligente de procesos"
nombre: "Cauce"
lema: "El proceso, con números."
nombres:
  - {n: "Cauce", por_que: "«Darle cauce» es ordenar algo para que fluya. Corto, castellano, igual en portugués; el logo sale solo (una línea que fluye y se ordena).", estado: "SIN VERIFICAR: el cupo de búsquedas de la sesión del 17-11 se agotó. Verificar INPI (clases 9 y 42), dominio, tiendas y redes"}
  - {n: "Caudal", por_que: "Lo que pasa por un proceso por hora: volumen y simulación.", estado: "Sin verificar; palabra muy usada en finanzas"}
  - {n: "Circuito", por_que: "Así se dice en Argentina: «circuito administrativo», «circuito de pagos».", estado: "Sin verificar; genérico, difícil de registrar solo"}
  - {n: "Esclusa", por_que: "La compuerta que regula el paso: decisiones y colas.", estado: "Sin verificar; suena técnico"}
  - {n: "Trama", por_que: "Cómo se entrelazan áreas, sistemas y personas.", estado: "Sin verificar; muy usado"}
  - {n: "Acequia", por_que: "El canal que lleva el agua adonde hace falta; muy de acá.", estado: "Sin verificar; largo para afuera"}

una_frase: "Dibujás o contás un proceso y ves en vivo cuánto cuesta, quién está saturado y cuánto tarda; lo simulás en el navegador y te llevás el diagrama y el manual sin pagar por exportar."
problema: "Los procesos se dibujan en un programa (Miro, Visio, draw.io), se calculan en otro (Excel), se simulan en un tercero caro y de especialistas (USD 2.000–19.000 por puesto y año) y se documentan a mano en Word. Nadie calcula mientras se dibuja."
para_quien:
  - "Jefes de operaciones y de depósito de pymes (primero, dentro de Andén)."
  - "Consultores de procesos, ISO y calidad (puerta propia, si pasa las pruebas)."
  - "Docentes y alumnos de Ingeniería Industrial y Ciencias Económicas (cursograma IRAM, plan académico gratis)."
  - "Las unidades del holding (uso propio; hoy draw.io alcanza para dibujar)."
mision: "Que cualquier persona que maneja un proceso pueda ver en minutos cuánto cuesta, dónde se traba y qué cambiar, en su idioma y sin licencias que le retengan su trabajo."
vision: "Para 2031, la forma en que las pymes de habla hispana diseñan, entienden, documentan y mejoran sus procesos: un solo modelo vivo con datos, del dibujo a la operación real."

objetivos:
  - {cuando: "ene-2027", que: "Prueba a ciegas hecha (3 procesos genéricos, 5 evaluadores)."}
  - {cuando: "mar-2027", que: "30 páginas medidas 8 semanas; decisión sobre la puerta propia."}
  - {cuando: "jul-2027", que: "El modelador y el motor de Cauce dentro de Andén v1 («Contame tu operación»)."}
  - {cuando: "sep-2027", que: "Corte de Andén: 500 usuarios por mes o una cátedra."}
  - {cuando: "2028", que: "Si hay puerta propia: app dentro de Claude y ChatGPT, rediseños simulados, mining desde planillas."}

alcance:
  incluye:
    - "Lienzo con carriles por responsable, crear desde el borde, ordenar solo, deshacer"
    - "Datos por bloque (responsable, tiempo y variabilidad, costo del rol, volumen, porcentajes) marcados como medidos o estimados"
    - "Capas de análisis 0–3: revisión, números en vivo (carga, costo por caso), colas (Erlang C ajustado), simulación de eventos discretos en el navegador"
    - "Escenarios lado a lado; «qué pasa si» (+1 persona, automatizar, pico de demanda, sin reprocesos)"
    - "IA: armar desde texto con supuestos declarados, revisar con números, preguntarle al proceso"
    - "Exportación completa gratis: PDF vectorial con rótulo (A4, A3, A1, a medida), SVG, PNG, BPMN 2.0 XML, Mermaid, manual, formato abierto"
    - "Vistas: BPMN, cursograma IRAM 34501/34502, SIPOC, RACI (v1–v2)"
  no_incluye:
    - "Pizarra genérica para talleres que compita con Miro (K27)"
    - "Motor propio de ejecución de procesos, grabación de pantalla, generación de apps"
    - "Plan Organización y portal antes de que alguien lo pida con plata"
    - "Consultoría o relevamientos a medida"

versiones:
  - v: "Prototipo · 17-11-2026 (hecho)"
    funciones: ["Carriles, datos por bloque, capas 0–3, escenarios, IA, exportación PDF/SVG/PNG/BPMN/Mermaid/manual, 3 plantillas"]
  - v: "Pruebas · ene–mar 2027"
    funciones: ["Prueba a ciegas", "30 páginas en el dominio de Andén con lista de espera"]
  - v: "Dentro de Andén v1 · jul-2027"
    funciones: ["Motor compartido", "Plantillas logísticas con costos argentinos", "Simulación con turnos y lotes", "Manual del proceso"]
  - v: "Puerta propia (condicionada) · 2º semestre 2027"
    funciones: ["Cursograma IRAM validado", "Manual ISO con marca propia (Pro)", "App dentro de Claude y ChatGPT", "Importar Bizagi, Visio, draw.io"]
  - v: "v2 · 2028"
    funciones: ["Tres rediseños simulados por la IA", "Mining liviano desde CSV que calibra el modelo", "Comparación de versiones con impacto", "Proceso → capacitación y → instrucciones para agentes"]

diferencial:
  - "Números mientras dibujás: ninguna herramienta revisada calcula carga, espera y costo en vivo (bitácora 03)."
  - "Simulación sin especialista, contada en castellano sobre el diagrama."
  - "Un modelo, todas las vistas: BPMN, cursograma IRAM, SOP, SIPOC, RACI, manual."
  - "Exportación sin muros y formato abierto (draw.io lo hace; Miro, FigJam y Lucid no del todo)."
  - "Honestidad: generar diagramas con IA ya es commodity; el diferencial es la suma, no una función."

benchmark:
  - {de: "Miro y FigJam", tomamos: "Crear desde el borde, conectores que se re-rutean, presencia, lectores gratis."}
  - {de: "Lucid", tomamos: "Datos vinculados a figuras con formato condicional."}
  - {de: "draw.io", tomamos: "Exportar todo gratis y vender donde el comprador ya compra."}
  - {de: "Bizagi", tomamos: "Simulación por niveles explicada para no expertos; documentación con un clic."}
  - {de: "SAP Signavio", tomamos: "Diccionario de objetos compartido; lector casi gratis."}
  - {de: "Camunda", tomamos: "Validación estricta en vivo."}
  - {de: "IcePanel", tomamos: "Un modelo, muchas vistas."}
  - {de: "Simul8 / AnyLogic", tomamos: "Las preguntas que responde la simulación, sin su curva ni su precio."}

