<title>Cauce · prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: mesa de trabajo de una sola pantalla — barra superior, paleta a la izquierda, lienzo infinito al centro, panel a la derecha, franja de indicadores abajo. */
:root{
  --bg:#eef1f0; --paper:#ffffff; --ink:#16202a; --ink2:#4a5a66; --line:#d3dbdb; --grid:#cfd8d7;
  --accent:#0d6e6e; --accent-ink:#ffffff; --accent-soft:#d6ecea;
  --ok:#2f8f4e; --warn:#c98a10; --bad:#c2410c; --crit:#9f1239;
  --panel:#f8faf9; --shadow:0 1px 2px rgba(22,32,42,.08),0 4px 14px rgba(22,32,42,.06);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",Arial Narrow,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --paper:#18222a; --ink:#e4ebee; --ink2:#9fb0ba; --line:#2b3a44; --grid:#24323b;
  --accent:#3fb5ad; --accent-ink:#06201f; --accent-soft:#163a3a; --panel:#141d23;
  --ok:#4fbf72; --warn:#e3a92b; --bad:#f07a3e; --crit:#f0587a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --paper:#18222a; --ink:#e4ebee; --ink2:#9fb0ba; --line:#2b3a44; --grid:#24323b;
  --accent:#3fb5ad; --accent-ink:#06201f; --accent-soft:#163a3a; --panel:#141d23;
  --ok:#4fbf72; --warn:#e3a92b; --bad:#f07a3e; --crit:#f0587a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:56px 1fr minmax(300px,360px);grid-template-areas:"top top top" "pal cv side" "kpi kpi side"}
header{grid-area:top;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand svg{flex:none}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:10.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
#procName{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-weight:600;min-width:0;flex:1 1 180px;max-width:360px}
#procName:hover,#procName:focus{border-color:var(--line);background:var(--bg)}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.pal{grid-area:pal;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.pal button{width:42px;height:42px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center}
.pal button:hover{background:var(--bg);border-color:var(--line)}
.pal .sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.cvwrap{grid-area:cv;position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
#cv{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.zoom button{border:0;background:transparent;border-radius:6px;width:30px;height:30px}
.zoom button:hover{background:var(--bg)}
.hint{position:absolute;left:12px;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink2);max-width:330px;box-shadow:var(--shadow)}
.hint b{color:var(--ink)}
.play{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-family:var(--f-mono);font-size:12.5px;flex-wrap:wrap;max-width:calc(100% - 140px)}
.play input[type=range]{width:110px}
aside{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--paper)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px;overflow:auto;flex:1;min-height:0}
.pane h3{font-family:var(--f-head);font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.pane h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px;font-weight:600}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--ink2)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.45}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t input{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:3px 5px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lint{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lint li{font-size:12.5px;padding:7px 9px;border-radius:7px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--warn)}
.lint li.ok{border-left-color:var(--ok)}
.lint li.err{border-left-color:var(--crit)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.callout{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.callout b{font-weight:600}
.kpis{grid-area:kpi;display:flex;gap:0;background:var(--paper);border-top:1px solid var(--line);overflow-x:auto;padding-left:max(0px,env(safe-area-inset-left,0px))}
.kpi{padding:8px 16px;border-right:1px solid var(--line);min-width:140px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.kpi.live .l::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px}
.chip:hover{border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(10,16,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{background:var(--paper);border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-family:var(--f-head)}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.exgrid button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.exgrid button:hover{border-color:var(--accent)}
.exgrid b{display:block;font-size:13.5px}
.exgrid span{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
.ai-out{white-space:pre-wrap;font-size:13px;line-height:1.5}
.find{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:6px}
.find .tag{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:6px}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto auto;grid-template-areas:"top" "pal" "cv" "kpi" "side"}
  .pal{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:4px}
  .pal .sep{width:1px;height:26px;margin:0 4px}
  aside{border-left:0;border-top:1px solid var(--line);min-height:420px}
  .hint{display:none}
  .play{max-width:calc(100% - 24px);bottom:60px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
<header>
  <div class="brand" title="Cauce: el proceso, con números">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M4 6 C11 6 9 13 13 13 S16 20 22 20" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round"/><circle cx="4" cy="6" r="2.6" fill="var(--accent)"/><rect x="18.6" y="16.6" width="6.8" height="6.8" rx="1.6" fill="var(--ink)"/></svg>
    Cauce <small>prototipo</small>
  </div>
  <input id="procName" aria-label="Nombre del proceso" value="">
  <div class="tb">
    <button class="btn" id="bNew" title="Plantillas y ejemplos">Plantillas</button>
    <button class="btn" id="bLayout" title="Ordenar automáticamente">Ordenar</button>
    <button class="btn" id="bLanes" title="Carriles por responsable">Carriles</button>
    <button class="btn pri" id="bSim">▶ Simular</button>
    <button class="btn" id="bExport">Exportar</button>
  </div>
</header>

<nav class="pal" aria-label="Agregar elementos">
  <button data-add="task" title="Actividad (si hay una seleccionada, la conecta)"><svg width="26" height="20"><rect x="1.5" y="2.5" width="23" height="15" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-add="gateway" title="Decisión"><svg width="24" height="24"><path d="M12 2 L22 12 L12 22 L2 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <button data-add="start" title="Inicio"><svg width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-add="end" title="Fin"><svg width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3.4"/></svg></button>
  <span class="sep"></span>
  <button id="bUndo" title="Deshacer (Ctrl+Z)"><svg width="20" height="20"><path d="M7 5 L3 9 L7 13 M3 9 H12 A5 5 0 0 1 12 19 H8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button id="bDel" title="Borrar selección (Supr)"><svg width="20" height="20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
</nav>

<div class="cvwrap" id="wrap">
  <svg id="cv" aria-label="Lienzo del proceso">
    <defs>
      <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
    </defs>
    <rect id="bgpat" x="0" y="0" width="100%" height="100%" fill="url(#dots)"/>
    <g id="vp"><g id="world"></g><g id="tokens"></g><path id="tmp" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/></g>
  </svg>
  <div class="hint" id="hint"><b>Probalo:</b> arrastrá las actividades, tocá una para ver sus datos, mové una actividad a otro carril para cambiar el responsable y apretá <b>Simular</b>. Los números de abajo (punto verde) se recalculan en vivo mientras editás.</div>
  <div class="play" id="play" hidden>
    <button class="btn sm" id="pPause">❚❚</button>
    <span id="clock">Día 1 · 08:00</span>
    <label class="muted" for="pSpeed">velocidad</label><input type="range" id="pSpeed" min="5" max="240" value="60">
    <button class="btn sm" id="pClose">Cerrar animación</button>
  </div>
  <div class="zoom"><button id="zOut" title="Alejar">−</button><button id="zFit" title="Ver todo">⤢</button><button id="zIn" title="Acercar">+</button></div>
</div>

<div class="kpis" id="kpis"></div>

<aside>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="props" aria-selected="true">Propiedades</button>
    <button role="tab" data-tab="res" aria-selected="false">Resultados</button>
    <button role="tab" data-tab="esc" aria-selected="false">Escenarios</button>
    <button role="tab" data-tab="ia" aria-selected="false">IA</button>
  </div>
  <div class="pane" id="pane"></div>
</aside>
</div>

<div id="modalHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js"></script>
<script>
"use strict";
/* ============================================================
   Cauce — prototipo del núcleo: modelo con datos, análisis en
   vivo (teoría de colas), simulación de eventos discretos con
   animación, escenarios, IA y exportación profesional.
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const ROLE_COLORS=["#0d6e6e","#7c4dbd","#c26a12","#2f6fb3","#b23a63","#5b7d1a","#8a6d3b","#3f5873"];
const CV={baja:.25,media:.5,alta:1};
const SIZE={task:{w:156,h:66},gateway:{w:58,h:58},start:{w:44,h:44},end:{w:44,h:44}};
const LANE_X0=-150, LANE_LABEL=120, LANE_H=140;

/* ---------- Ejemplos ---------- */
function exDeposito(){
  const R=[{id:"r1",name:"Administración",count:2,cost:6},{id:"r2",name:"Picking",count:4,cost:5},{id:"r3",name:"Control de calidad",count:1,cost:6},{id:"r4",name:"Embalaje y despacho",count:2,cost:5}];
  const N=[
    {id:"s",type:"start",label:"Entra el pedido",role:"r1"},
    {id:"a1",type:"task",label:"Validar pago y stock",role:"r1",t:2.5,cv:"media"},
    {id:"g1",type:"gateway",label:"¿Hay stock?",role:"r1"},
    {id:"a2",type:"task",label:"Avisar al cliente y reprogramar",role:"r1",t:6,cv:"alta"},
    {id:"e2",type:"end",label:"Reprogramado",role:"r1"},
    {id:"a3",type:"task",label:"Preparar pedido (picking)",role:"r2",t:6,cv:"media"},
    {id:"a4",type:"task",label:"Controlar pedido",role:"r3",t:1.45,cv:"baja"},
    {id:"g2",type:"gateway",label:"¿Está bien?",role:"r3"},
    {id:"a5",type:"task",label:"Corregir pedido",role:"r2",t:4,cv:"media"},
    {id:"a6",type:"task",label:"Embalar y etiquetar",role:"r4",t:3,cv:"baja"},
    {id:"e1",type:"end",label:"Pedido despachado",role:"r4"}];
  const E=[["s","a1"],["a1","g1"],["g1","a3",95,"Sí"],["g1","a2",5,"No"],["a2","e2"],["a3","a4"],["a4","g2"],["g2","a6",92,"Sí"],["g2","a5",8,"No"],["a5","a4"],["a6","e1"]];
  return mk("Despacho de pedidos e-commerce (depósito)",36,9,5,R,N,E);
}
function exProveedor(){
  const R=[{id:"r1",name:"Compras",count:2,cost:8},{id:"r2",name:"Legales",count:1,cost:12},{id:"r3",name:"Tesorería",count:1,cost:9},{id:"r4",name:"Sistemas",count:1,cost:10}];
  const N=[
    {id:"s",type:"start",label:"Pedido de alta",role:"r1"},
    {id:"a1",type:"task",label:"Revisar formulario y documentos",role:"r1",t:25,cv:"media"},
    {id:"g1",type:"gateway",label:"¿Completo?",role:"r1"},
    {id:"a2",type:"task",label:"Pedir documentación faltante",role:"r1",t:15,cv:"alta"},
    {id:"a3",type:"task",label:"Verificar AFIP/ARCA y antecedentes",role:"r2",t:40,cv:"media"},
    {id:"a4",type:"task",label:"Validar datos bancarios (CBU)",role:"r3",t:20,cv:"baja"},
    {id:"a5",type:"task",label:"Cargar en el ERP",role:"r4",t:15,cv:"baja"},
    {id:"e1",type:"end",label:"Proveedor activo",role:"r4"}];
  const E=[["s","a1"],["a1","g1"],["g1","a3",70,"Sí"],["g1","a2",30,"No"],["a2","a1"],["a3","a4"],["a4","a5"],["a5","e1"]];
  return mk("Alta de proveedor (administración)",1.2,8,10,R,N,E);
}
function exAtencion(){
  const R=[{id:"r1",name:"Bot / autoservicio",count:20,cost:0.2},{id:"r2",name:"Agentes nivel 1",count:5,cost:5},{id:"r3",name:"Especialistas",count:2,cost:9}];
  const N=[
    {id:"s",type:"start",label:"Llega un reclamo",role:"r1"},
    {id:"a1",type:"task",label:"Clasificar y responder lo simple",role:"r1",t:1.5,cv:"media"},
    {id:"g1",type:"gateway",label:"¿Resuelto?",role:"r1"},
    {id:"e0",type:"end",label:"Resuelto por bot",role:"r1"},
    {id:"a2",type:"task",label:"Atender reclamo",role:"r2",t:9,cv:"alta"},
    {id:"g2",type:"gateway",label:"¿Escala?",role:"r2"},
    {id:"a3",type:"task",label:"Resolver caso complejo",role:"r3",t:25,cv:"alta"},
    {id:"e1",type:"end",label:"Cerrado",role:"r2"}];
  const E=[["s","a1"],["a1","g1"],["g1","e0",45,"Sí"],["g1","a2",55,"No"],["a2","g2"],["g2","a3",12,"Sí"],["g2","e1",88,"No"],["a3","e1"]];
  return mk("Atención de reclamos (centro de contacto)",50,10,5,R,N,E);
}
function mk(name,arr,hours,days,R,N,E){
  R.forEach((r,i)=>r.color=ROLE_COLORS[i%ROLE_COLORS.length]);
  N.forEach(n=>{n.x=0;n.y=0;if(n.type==="task"){n.t=n.t??5;n.cv=n.cv??"media";}});
  const m={name,arrivals:arr,hours,days,lanes:true,roles:R,nodes:N,edges:E.map((e,i)=>({id:"f"+i,from:e[0],to:e[1],prob:e[2]??null,label:e[3]??""}))};
  autoLayout(m);return m;
}

/* ---------- Estado ---------- */
let M=exDeposito();
let sel=null;            // {kind:'node'|'edge', id}
let view={tx:80,ty:60,k:.82};
let tab="props";
let sim=null;            // último resultado de simulación
let scenarios=[];
let undoStack=[];
let playback=null;
let heat=false;

function snapshot(){undoStack.push(JSON.stringify(M));if(undoStack.length>60)undoStack.shift();}
function undo(){const s=undoStack.pop();if(!s)return toast("No hay nada para deshacer");M=JSON.parse(s);sel=null;changed(false);}

/* ---------- Geometría ---------- */
const node=id=>M.nodes.find(n=>n.id===id);
const role=id=>M.roles.find(r=>r.id===id)||{name:"Sin responsable",color:"#7a8791",count:1,cost:0};
function laneTop(roleId){let y=0;for(const r of M.roles){if(r.id===roleId)return y;y+=r.h||LANE_H;}return y;}
function lanesHeight(){return M.roles.reduce((a,r)=>a+(r.h||LANE_H),0);}
function roleAtY(y){let t=0;for(const r of M.roles){const h=r.h||LANE_H;if(y<t+h)return r.id;t+=h;}return M.roles[M.roles.length-1]?.id;}
function sz(n){return SIZE[n.type];}
function center(n){const s=sz(n);return {x:n.x+s.w/2,y:n.y+s.h/2};}
function edgePath(e){
  const a=node(e.from),b=node(e.to);if(!a||!b)return null;
  const sa=sz(a),sb=sz(b),ca=center(a),cb=center(b);
  const dx=cb.x-ca.x, dy=cb.y-ca.y;
  if(cb.x>=a.x+sa.w+16){ // hacia la derecha
    const sx=a.x+sa.w, sy=ca.y, tx=b.x, ty=cb.y;
    if(Math.abs(sy-ty)<2) return [[sx,sy],[tx,ty]];
    if(a.type==="gateway"&&Math.abs(dy)>sa.h/2){ // sale por arriba/abajo del rombo
      const py=dy>0?a.y+sa.h:a.y; return [[ca.x,py],[ca.x,ty],[tx,ty]];
    }
    const mx=Math.round((sx+tx)/2); return [[sx,sy],[mx,sy],[mx,ty],[tx,ty]];
  }
  if(Math.abs(dx)<sa.w/2+sb.w/2 && Math.abs(dy)>0){ // vertical
    const down=dy>0, sy=down?a.y+sa.h:a.y, ty=down?b.y:b.y+sb.h;
    if(Math.abs(ca.x-cb.x)<2)return [[ca.x,sy],[cb.x,ty]];
    const my=Math.round((sy+ty)/2);return [[ca.x,sy],[ca.x,my],[cb.x,my],[cb.x,ty]];
  }
  // vuelve hacia atrás: rodea por abajo
  const low=Math.max(a.y+sa.h,b.y+sb.h)+34;
  return [[ca.x,a.y+sa.h],[ca.x,low],[cb.x,low],[cb.x,b.y+sb.h]];
}
function polyLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function pointAt(p,f){let L=polyLen(p)*f;for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(L<=d){const t=d?L/d:0;return [p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t];}L-=d;}return p[p.length-1];}

/* ---------- Diagramado automático ---------- */
function autoLayout(m){
  const out={},inc={};m.nodes.forEach(n=>{out[n.id]=[];inc[n.id]=0;});
  m.edges.forEach(e=>{if(out[e.from])out[e.from].push(e.to);});
  // detectar flechas que vuelven (ciclos) con DFS
  const back=new Set(),state={};
  const starts=m.nodes.filter(n=>n.type==="start").map(n=>n.id);
  const dfs=u=>{state[u]=1;for(const v of out[u]||[]){if(state[v]===1)back.add(u+">"+v);else if(!state[v])dfs(v);}state[u]=2;};
  (starts.length?starts:m.nodes.slice(0,1).map(n=>n.id)).forEach(dfs);m.nodes.forEach(n=>{if(!state[n.id])dfs(n.id);});
  const rank={};m.nodes.forEach(n=>rank[n.id]=0);
  for(let it=0;it<m.nodes.length+2;it++){let ch=false;m.edges.forEach(e=>{if(back.has(e.from+">"+e.to))return;if(rank[e.to]<rank[e.from]+1){rank[e.to]=rank[e.from]+1;ch=true;}});if(!ch)break;}
  const colX=r=>r*200;
  if(m.lanes&&m.roles.length){
    const stack={};let maxStack={};
    m.nodes.forEach(n=>{const k=n.role+"|"+rank[n.id];stack[k]=(stack[k]||0)+1;n._s=stack[k]-1;maxStack[n.role]=Math.max(maxStack[n.role]||1,stack[k]);});
    m.roles.forEach(r=>r.h=LANE_H*(maxStack[r.id]||1));
    let top=0;const tops={};m.roles.forEach(r=>{tops[r.id]=top;top+=r.h;});
    m.nodes.forEach(n=>{const s=SIZE[n.type];n.x=colX(rank[n.id])+(156-s.w)/2;const t=tops[n.role]??0;n.y=t+n._s*LANE_H+LANE_H/2-s.h/2;delete n._s;});
  }else{
    const cnt={};m.nodes.forEach(n=>{const r=rank[n.id];cnt[r]=(cnt[r]||0)+1;const s=SIZE[n.type];n.x=colX(r)+(156-s.w)/2;n.y=(cnt[r]-1)*130+(66-s.h)/2;});
  }
}

/* ---------- Análisis en vivo (sin simular) ---------- */
function outEdges(id){return M.edges.filter(e=>e.from===id);}
function branchProbs(id){
  const es=outEdges(id);if(!es.length)return [];
  const n=node(id);
  if(n.type==="gateway"){const tot=es.reduce((a,e)=>a+(+e.prob||0),0);if(tot>0)return es.map(e=>[e,(+e.prob||0)/tot]);}
  return es.map(e=>[e,1/es.length]);
}
function analyze(){
  const v={};M.nodes.forEach(n=>v[n.id]=0);
  const starts=M.nodes.filter(n=>n.type==="start");
  for(let it=0;it<400;it++){
    const nv={};M.nodes.forEach(n=>nv[n.id]=0);
    starts.forEach(s=>nv[s.id]+=1/starts.length);
    M.nodes.forEach(n=>{if(n.type==="end")return;for(const [e,p] of branchProbs(n.id))if(nv[e.to]!==undefined)nv[e.to]+=v[n.id]*p;});
    let d=0;for(const k in nv)d=Math.max(d,Math.abs(nv[k]-v[k]));Object.assign(v,nv);if(d<1e-9)break;
  }
  const lam=M.arrivals/60; // casos por minuto
  const R={};M.roles.forEach(r=>R[r.id]={work:0,visits:0,cs2:0,role:r});
  let touch=0,touchCost=0;
  M.nodes.forEach(n=>{if(n.type!=="task")return;const r=R[n.role];const t=+n.t||0;touch+=v[n.id]*t;touchCost+=v[n.id]*t/60*(role(n.role).cost||0);
    if(r){r.work+=lam*v[n.id]*t;r.visits+=lam*v[n.id];r.cs2+=lam*v[n.id]*t*t*(1+CV[n.cv]**2);}});
  let worst=null,stable=true;
  for(const id in R){const r=R[id];const c=Math.max(1,r.role.count|0);r.rho=r.work/c;
    if(r.visits>0){const s=r.work/r.visits;const es2=r.cs2/r.visits;const cs2=Math.max(0,es2/(s*s)-1);
      r.cs2n=cs2;if(r.rho<1){r.wq=erlangC(c,r.work)*s/(c-r.work)*(1+cs2)/2;}else{r.wq=Infinity;stable=false;}}else r.wq=0;
    if(!worst||r.rho>worst.rho)worst=r;}
  // variabilidad de llegada a cada actividad (aproximación de redes de colas, tipo QNA): la variabilidad se suaviza aguas abajo
  const ca2={},cd2={};M.nodes.forEach(n=>{ca2[n.id]=1;cd2[n.id]=1;});
  for(let it=0;it<40;it++){
    M.nodes.forEach(n=>{if(n.type==="start"){cd2[n.id]=1;return;}
      let F=0,S=0;M.nodes.forEach(u=>{if(u.type==="end")return;for(const [e,p] of branchProbs(u.id)){if(e.to!==n.id)continue;const f=v[u.id]*p;F+=f;S+=f*(p*cd2[u.id]+1-p);}});
      ca2[n.id]=F>0?S/F:1;
      if(n.type==="task"){const r=R[n.role];const rho=r?Math.min(.99,r.rho/Math.max(1,Math.sqrt(r.role.count))):0;cd2[n.id]=rho*rho*CV[n.cv]**2+(1-rho*rho)*ca2[n.id];}else cd2[n.id]=ca2[n.id];});
  }
  let cycle=0;M.nodes.forEach(n=>{if(n.type!=="task")return;const r=R[n.role];let wq=0;
    if(r){if(!isFinite(r.wq))wq=Infinity;else if(r.visits>0){const c=Math.max(1,r.role.count|0);const s=r.work/r.visits;wq=erlangC(c,r.work)*s/(c-r.work)*(ca2[n.id]+r.cs2n)/2;}}
    n._wq=wq;cycle+=v[n.id]*(wq+(+n.t||0));});
  const capHour=M.roles.reduce((a,r)=>a+r.count*r.cost,0);
  const thr=Math.min(M.arrivals,worst&&worst.rho>0?M.arrivals/Math.max(worst.rho,1):M.arrivals);
  return {v,R,touch,touchCost,cycle,stable,worst,costCase:thr>0?capHour/thr:0,thrDay:thr*M.hours};
}
function erlangC(c,a){let B=1;for(let k=1;k<=c;k++)B=a*B/(k+a*B);const rho=a/c;return B/(1-rho*(1-B));}
function loadColor(rho){return rho>=1?"var(--crit)":rho>=.9?"var(--bad)":rho>=.75?"var(--warn)":"var(--ok)";}
function loadHex(rho){return rho>=1?"#9f1239":rho>=.9?"#c2410c":rho>=.75?"#c98a10":"#2f8f4e";}
const fmtMin=m=>!isFinite(m)?"∞":m<60?m.toFixed(m<10?1:0)+" min":(m/60).toFixed(1)+" h";
const fmtUsd=x=>"USD "+(x<10?x.toFixed(2):x.toFixed(1));
const pct=x=>!isFinite(x)?"—":Math.round(x*100)+"%";

/* ---------- Validación del modelo ---------- */
function lint(){
  const L=[];const ids=new Set(M.nodes.map(n=>n.id));
  if(!M.nodes.some(n=>n.type==="start"))L.push(["err","Falta un inicio: sin él no se sabe por dónde entran los casos."]);
  if(!M.nodes.some(n=>n.type==="end"))L.push(["err","Falta un fin."]);
  M.nodes.forEach(n=>{
    const o=outEdges(n.id),i=M.edges.filter(e=>e.to===n.id);
    if(n.type!=="end"&&!o.length)L.push(["err",`«${n.label}» no tiene salida: los casos se quedan ahí.`]);
    if(n.type!=="start"&&!i.length)L.push(["warn",`«${n.label}» no tiene entrada: nunca se ejecuta.`]);
    if(n.type==="gateway"){const t=o.reduce((a,e)=>a+(+e.prob||0),0);if(o.length<2)L.push(["warn",`La decisión «${n.label}» tiene una sola salida.`]);else if(Math.abs(t-100)>0.5)L.push(["warn",`Las salidas de «${n.label}» suman ${t}% (deberían sumar 100%).`]);}
    if(n.type==="task"&&o.length>1)L.push(["warn",`«${n.label}» tiene ${o.length} salidas sin decisión: se reparten por igual. Agregá una decisión.`]);
    if(n.type==="task"&&!M.roles.some(r=>r.id===n.role))L.push(["warn",`«${n.label}» no tiene responsable.`]);
    if(n.type==="task"&&!(+n.t>0))L.push(["warn",`«${n.label}» no tiene tiempo cargado.`]);
  });
  M.edges.forEach(e=>{if(!ids.has(e.from)||!ids.has(e.to))L.push(["err","Hay una flecha suelta."]);});
  return L;
}

/* ---------- Dibujo (mismo motor para pantalla y exportación) ---------- */
function wrapText(s,max){const w=String(s).split(/\s+/);const lines=[];let cur="";for(const x of w){if((cur+" "+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+" "+x).trim();}if(cur)lines.push(cur);if(lines.length>3){lines.length=3;lines[2]=lines[2].slice(0,max-1)+"…";}return lines;}
function palette(exp){
  if(exp)return {paper:"#ffffff",ink:"#16202a",ink2:"#4a5a66",line:"#b9c4c6",lane:"#f4f7f7",lane2:"#ffffff",accent:"#0d6e6e",sel:"#0d6e6e",node:"#ffffff"};
  const cs=getComputedStyle(document.documentElement);const g=k=>cs.getPropertyValue(k).trim();
  return {paper:g("--paper"),ink:g("--ink"),ink2:g("--ink2"),line:g("--line"),lane:g("--panel"),lane2:g("--bg"),accent:g("--accent"),sel:g("--accent"),node:g("--paper")};
}
function drawWorld(opt={}){
  const P=palette(opt.exp);const A=opt.A||analyze();const out=[];
  const font=`font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"`;
  const bx=bounds();
  if(M.lanes&&M.roles.length){
    let y=0;const x0=Math.min(LANE_X0,bx.x-40),x1=Math.max(bx.x+bx.w+60,x0+900);
    M.roles.forEach((r,i)=>{const h=r.h||LANE_H;
      out.push(`<rect x="${x0}" y="${y}" width="${x1-x0}" height="${h}" fill="${i%2?P.lane2:P.lane}" stroke="${P.line}" stroke-width="1"/>`);
      out.push(`<rect x="${x0}" y="${y}" width="${LANE_LABEL-24}" height="${h}" fill="${r.color}" fill-opacity="0.10" stroke="${P.line}" stroke-width="1"/>`);
      out.push(`<rect x="${x0}" y="${y}" width="5" height="${h}" fill="${r.color}"/>`);
      const ly=wrapText(r.name,13);ly.forEach((t,j)=>out.push(`<text x="${x0+14}" y="${y+h/2-(ly.length-1)*8+j*16+4}" ${font} font-size="13" font-weight="600" fill="${P.ink}">${esc(t)}</text>`));
      out.push(`<text x="${x0+14}" y="${y+h/2+ly.length*8+12}" font-family="IBM Plex Mono, Courier, monospace" font-size="10.5" fill="${P.ink2}">${r.count} ${r.count===1?"persona":"personas"}</text>`);
      y+=h;});
  }
  // flechas
  M.edges.forEach(e=>{const p=edgePath(e);if(!p)return;const isSel=!opt.exp&&sel?.kind==="edge"&&sel.id===e.id;
    const col=isSel?P.sel:P.ink2;const d="M"+p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" L");
    if(!opt.exp)out.push(`<path d="${d}" stroke="transparent" stroke-width="14" fill="none" data-edge="${e.id}" style="cursor:pointer"/>`);
    out.push(`<path d="${d}" stroke="${col}" stroke-width="${isSel?2.4:1.6}" fill="none" stroke-linejoin="round" pointer-events="none"/>`);
    const [x2,y2]=p[p.length-1],[x1,y1]=p[p.length-2];const ang=Math.atan2(y2-y1,x2-x1);const L=9,W=4.5;
    const pts=[[x2,y2],[x2-L*Math.cos(ang)+W*Math.sin(ang),y2-L*Math.sin(ang)-W*Math.cos(ang)],[x2-L*Math.cos(ang)-W*Math.sin(ang),y2-L*Math.sin(ang)+W*Math.cos(ang)]];
    out.push(`<polygon points="${pts.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}" fill="${col}" pointer-events="none"/>`);
    const src=node(e.from);const lab=(e.label||"")+(src?.type==="gateway"&&e.prob!=null?` ${e.prob}%`:"");
    if(lab.trim()){const [lx,ly]=pointAt(p,p.length>2?.3:.5);const tw=lab.length*6.4+10;
      out.push(`<rect x="${(lx-tw/2).toFixed(1)}" y="${(ly-9).toFixed(1)}" width="${tw.toFixed(1)}" height="18" rx="9" fill="${P.paper}" stroke="${P.line}" pointer-events="none"/>`);
      out.push(`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, Courier, monospace" font-size="11" fill="${P.ink}" pointer-events="none">${esc(lab.trim())}</text>`);}
  });
  // nodos
  M.nodes.forEach(n=>{const s=sz(n),r=role(n.role),isSel=!opt.exp&&sel?.kind==="node"&&sel.id===n.id;
    const da=opt.exp?"":` data-node="${n.id}" style="cursor:grab"`;
    if(n.type==="task"){
      const RR=A.R[n.role];const rho=RR?RR.rho:0;
      let fill=P.node;
      if(heat&&sim&&sim.nodeStats[n.id]){const w=sim.nodeStats[n.id].avgWait;const f=Math.max(0,(w/Math.max(3,sim.maxWait)-.35)/.65);if(f>0)fill=mixHex("#ffffff","#e4572e",Math.min(1,f)*.8);}
      out.push(`<g${da}>`);
      out.push(`<rect x="${n.x}" y="${n.y}" width="${s.w}" height="${s.h}" rx="9" fill="${fill}" stroke="${isSel?P.sel:P.line}" stroke-width="${isSel?2.4:1.2}"/>`);
      out.push(`<rect x="${n.x}" y="${n.y+8}" width="4" height="${s.h-16}" rx="2" fill="${r.color}"/>`);
      const lines=wrapText(n.label,21);const ty=n.y+(lines.length===1?24:lines.length===2?18:13);
      lines.forEach((t,j)=>out.push(`<text x="${n.x+14}" y="${ty+j*14.5}" ${font} font-size="12.5" font-weight="600" fill="${heat&&sim?"#16202a":P.ink}">${esc(t)}</text>`));
      out.push(`<text x="${n.x+14}" y="${n.y+s.h-10}" font-family="IBM Plex Mono, Courier, monospace" font-size="10.5" fill="${heat&&sim?"#4a5a66":P.ink2}">${fmtMin(+n.t||0)} · ${n.cv}</text>`);
      // indicador de carga del responsable
      out.push(`<rect x="${n.x+s.w-44}" y="${n.y+s.h-17}" width="32" height="5" rx="2.5" fill="${P.line}"/>`);
      out.push(`<rect x="${n.x+s.w-44}" y="${n.y+s.h-17}" width="${(32*Math.min(1,rho)).toFixed(1)}" height="5" rx="2.5" fill="${loadHex(rho)}"/>`);
      if(!opt.exp&&isSel)out.push(`<circle cx="${n.x+s.w}" cy="${n.y+s.h/2}" r="7" fill="${P.accent}" stroke="${P.paper}" stroke-width="2" data-handle="${n.id}" style="cursor:crosshair"/>`);
      out.push(`</g>`);
    }else if(n.type==="gateway"){
      const cx=n.x+s.w/2,cy=n.y+s.h/2;
      out.push(`<g${da}><path d="M${cx},${n.y} L${n.x+s.w},${cy} L${cx},${n.y+s.h} L${n.x},${cy}Z" fill="${P.node}" stroke="${isSel?P.sel:r.color}" stroke-width="${isSel?2.4:1.8}"/>`);
      out.push(`<path d="M${cx-8},${cy-8} L${cx+8},${cy+8} M${cx+8},${cy-8} L${cx-8},${cy+8}" stroke="${r.color}" stroke-width="2.2"/>`);
      const lines=wrapText(n.label,18);lines.forEach((t,j)=>out.push(`<text x="${cx}" y="${n.y-8-(lines.length-1-j)*14}" text-anchor="middle" ${font} font-size="12" font-weight="600" fill="${P.ink}">${esc(t)}</text>`));
      if(!opt.exp&&isSel)out.push(`<circle cx="${n.x+s.w}" cy="${cy}" r="7" fill="${P.accent}" stroke="${P.paper}" stroke-width="2" data-handle="${n.id}" style="cursor:crosshair"/>`);
      out.push(`</g>`);
    }else{
      const cx=n.x+s.w/2,cy=n.y+s.h/2,end=n.type==="end";
      out.push(`<g${da}><circle cx="${cx}" cy="${cy}" r="${s.w/2-1}" fill="${P.node}" stroke="${isSel?P.sel:(end?P.ink:r.color)}" stroke-width="${end?4:2}"/>`);
      const lines=wrapText(n.label,16);lines.forEach((t,j)=>out.push(`<text x="${cx}" y="${n.y+s.h+15+j*14}" text-anchor="middle" ${font} font-size="11.5" fill="${P.ink}">${esc(t)}</text>`));
      if(!end&&!opt.exp)out.push(`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="IBM Plex Mono, Courier, monospace" font-size="10" fill="${P.ink2}">${M.arrivals}/h</text>`);
      if(!opt.exp&&isSel&&!end)out.push(`<circle cx="${n.x+s.w}" cy="${cy}" r="7" fill="${P.accent}" stroke="${P.paper}" stroke-width="2" data-handle="${n.id}" style="cursor:crosshair"/>`);
      out.push(`</g>`);
    }
  });
  return out.join("");
}
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");}
function bounds(){
  if(!M.nodes.length)return {x:0,y:0,w:400,h:300};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  M.nodes.forEach(n=>{const s=sz(n);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y-30);x1=Math.max(x1,n.x+s.w);y1=Math.max(y1,n.y+s.h+40);});
  M.edges.forEach(e=>{const p=edgePath(e);if(p)p.forEach(q=>{y1=Math.max(y1,q[1]+10);});});
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function fullBounds(){const b=bounds();if(M.lanes&&M.roles.length){const x0=Math.min(LANE_X0,b.x-40);const x1=Math.max(b.x+b.w+60,x0+900);return {x:x0,y:Math.min(0,b.y),w:x1-x0,h:Math.max(lanesHeight(),b.y+b.h)-Math.min(0,b.y)};}return b;}

/* ---------- Render ---------- */
let lastA=null;
function render(){
  lastA=analyze();
  $("#world").innerHTML=drawWorld({A:lastA});
  $("#vp").setAttribute("transform",`translate(${view.tx},${view.ty}) scale(${view.k})`);
  $("#bgpat").setAttribute("transform",`translate(${view.tx%20},${view.ty%20})`);
  renderKpis();
}
function changed(snap=true){if(snap)snapshot();render();renderPane();}
function renderKpis(){
  const A=lastA;const w=A.worst;
  const items=[
    ["Casos por día",(M.arrivals*M.hours).toFixed(0),`${M.arrivals}/h · ${M.hours} h`,true],
    ["Tiempo de trabajo",fmtMin(A.touch),"por caso, sin esperas",true],
    ["Ciclo estimado",A.stable?fmtMin(A.cycle):"no se estabiliza",A.stable?"con colas (teoría de colas)":"la cola crece sin límite",true],
    ["Costo por caso",fmtUsd(A.costCase),`trabajo: ${fmtUsd(A.touchCost)}`,true],
    ["Más cargado",w?pct(w.rho):"—",w?w.role.name:"",true],
  ];
  if(sim)items.push(["Simulado: ciclo",fmtMin(sim.avgCycle),`p90 ${fmtMin(sim.p90)} · ${sim.done} casos`,false]);

 "Liquidación de sueldos mensual de 400 empleados: RR. HH. junta novedades (horas extra, licencias) en 6 minutos por empleado; en 10% hay errores y se corrigen con el supervisor en 15 minutos. Un liquidador (2 personas) calcula en 4 minutos por recibo; control interno revisa una muestra del 30% en 5 minutos. Tesorería paga por transferencia, 1 minuto por recibo.",
 "Recepción de camiones en un centro de distribución: llegan 5 camiones por hora en 10 horas. Portería registra el camión (4 minutos, 1 persona). Hay 3 dársenas con 2 operarios cada una para descargar (45 minutos). Control de recepción (2 personas) cuenta y compara con la orden de compra (20 minutos); si hay diferencias (15%) se arma un reclamo al proveedor (10 minutos, compras). Luego se ubica la mercadería (autoelevadoristas, 3 personas, 25 minutos)."];

function bindPane(){
  const p=$("#pane");
  p.querySelectorAll("[data-k]").forEach(inp=>{inp.addEventListener("change",()=>{const n=node(sel.id);if(!n)return;const k=inp.dataset.k;
    if(k==="role"&&inp.value==="__new"){const r=addRole();if(r){snapshot();n.role=r.id;if(M.lanes)placeInLane(n);}changed(false);return;}
    snapshot();n[k]=k==="t"?Math.max(0,+inp.value||0):inp.value;if(k==="role"&&M.lanes)placeInLane(n);changed(false);});});
  p.querySelectorAll("[data-edge]").forEach(inp=>inp.addEventListener("change",()=>{const e=M.edges.find(x=>x.id===inp.dataset.edge);snapshot();e[inp.dataset.ek]=inp.dataset.ek==="prob"?Math.max(0,Math.min(100,+inp.value||0)):inp.value;changed(false);}));
  p.querySelectorAll("[data-g]").forEach(inp=>inp.addEventListener("change",()=>{snapshot();M[inp.dataset.g]=Math.max(inp.dataset.g==="arrivals"?0:1,+inp.value||0);changed(false);}));
  p.querySelectorAll("[data-role]").forEach(inp=>inp.addEventListener("change",()=>{const r=M.roles.find(x=>x.id===inp.dataset.role);snapshot();const k=inp.dataset.rk;r[k]=k==="name"?inp.value:Math.max(k==="count"?1:0,+inp.value||0);if(k==="count")r.count=Math.round(r.count);changed(false);}));
  p.querySelectorAll("[data-what]").forEach(b=>b.addEventListener("click",()=>{const n=node(sel.id);snapshot();
    if(b.dataset.what==="auto"){n.t=+(n.t*.2).toFixed(2);n.label=n.label.includes("(auto)")?n.label:n.label+" (auto)";}
    if(b.dataset.what==="half")n.t=+(n.t/2).toFixed(2);
    if(b.dataset.what==="plus"){const r=M.roles.find(x=>x.id===n.role);if(r)r.count++;}
    changed(false);toast("Cambio aplicado: mirá los números de abajo");}));
  p.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>quick(b.dataset.q)));
  p.querySelectorAll("[data-load]").forEach(b=>b.addEventListener("click",()=>{snapshot();M=JSON.parse(scenarios[+b.dataset.load].model);sim=scenarios[+b.dataset.load].simFull;changed(false);toast("Escenario abierto");}));
  p.querySelectorAll("[data-ex]").forEach(b=>b.addEventListener("click",()=>{aiState.desc=EXAMPLES[+b.dataset.ex];$("#aiDesc").value=aiState.desc;}));
  const on=(id,f)=>{const el=$("#"+id);if(el)el.addEventListener("click",f);};
  on("pDel",delSel);on("addRole",()=>{const r=addRole();if(r)changed(false);});on("goSim",runSim);
  on("tHeat",()=>{heat=!heat;render();renderPane();});on("replay",()=>startPlayback());on("saveEsc",saveScenario);
  on("aiGen",aiGenerate);on("aiRev",aiReview);on("aiAsk",aiAsk);
  const d=$("#aiDesc");if(d)d.addEventListener("input",()=>aiState.desc=d.value);
}
function addRole(){snapshot();const i=M.roles.length;const r={id:uid("r"),name:"Nuevo responsable",count:1,cost:5,color:ROLE_COLORS[i%ROLE_COLORS.length],h:LANE_H};M.roles.push(r);return r;}
function placeInLane(n){const s=sz(n);const t=laneTop(n.role);const h=role(n.role).h||LANE_H;n.y=Math.max(t+8,Math.min(t+h-s.h-8,t+h/2-s.h/2));}

/* ---------- Edición en el lienzo ---------- */
const wrap=$("#wrap"),svg=$("#cv");
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return {x:(cx-r.left-view.tx)/view.k,y:(cy-r.top-view.ty)/view.k};}
let drag=null;
svg.addEventListener("pointerdown",ev=>{
  if(playback&&ev.target.closest("[data-node]")==null&&!ev.target.closest("[data-handle]")){/* sigue paneo */}
  const h=ev.target.closest("[data-handle]");const nd=ev.target.closest("[data-node]");const ed=ev.target.closest("[data-edge]");
  svg.setPointerCapture(ev.pointerId);$("#hint").hidden=true;
  if(h){drag={mode:"link",from:h.dataset.handle};return;}
  if(nd){const n=node(nd.dataset.node);const w=toWorld(ev.clientX,ev.clientY);sel={kind:"node",id:n.id};drag={mode:"move",n,dx:w.x-n.x,dy:w.y-n.y,moved:false,snap:JSON.stringify(M)};render();if(tab!=="props")setTab("props");else renderPane();return;}
  if(ed){sel={kind:"edge",id:ed.dataset.edge};render();if(tab!=="props")setTab("props");else renderPane();return;}
  drag={mode:"pan",x:ev.clientX,y:ev.clientY,tx:view.tx,ty:view.ty,moved:false};
});
svg.addEventListener("pointermove",ev=>{
  if(!drag)return;
  if(drag.mode==="pan"){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.tx=drag.tx+dx;view.ty=drag.ty+dy;$("#vp").setAttribute("transform",`translate(${view.tx},${view.ty}) scale(${view.k})`);$("#bgpat").setAttribute("transform",`translate(${view.tx%20},${view.ty%20})`);return;}
  const w=toWorld(ev.clientX,ev.clientY);
  if(drag.mode==="move"){drag.moved=true;drag.n.x=Math.round((w.x-drag.dx)/10)*10;drag.n.y=Math.round((w.y-drag.dy)/10)*10;$("#world").innerHTML=drawWorld({A:lastA});return;}
  if(drag.mode==="link"){const a=node(drag.from),s=sz(a);$("#tmp").setAttribute("d",`M${a.x+s.w},${a.y+s.h/2} L${w.x},${w.y}`);}
});
svg.addEventListener("pointerup",ev=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.mode==="pan"&&!d.moved&&sel){sel=null;render();renderPane();}
  if(d.mode==="move"&&d.moved){undoStack.push(d.snap);
    if(M.lanes&&M.roles.length){const s=sz(d.n);const rid=roleAtY(d.n.y+s.h/2);if(rid&&rid!==d.n.role){d.n.role=rid;toast("Responsable: "+role(rid).name);}placeInLaneSoft(d.n);}
    render();renderPane();}
  if(d.mode==="link"){$("#tmp").setAttribute("d","");const el=document.elementFromPoint(ev.clientX,ev.clientY);const nd=el&&el.closest&&el.closest("[data-node]");
    if(nd&&nd.dataset.node!==d.from){const to=nd.dataset.node;if(!M.edges.some(e=>e.from===d.from&&e.to===to)){snapshot();const isG=node(d.from).type==="gateway";M.edges.push({id:uid("f"),from:d.from,to,prob:isG?0:null,label:""});if(isG)rebalance(d.from);changed(false);}}}
});
function placeInLaneSoft(n){const s=sz(n);const t=laneTop(n.role);const h=role(n.role).h||LANE_H;n.y=Math.max(t+8,Math.min(t+h-s.h-8,n.y));}
function rebalance(gid){const es=outEdges(gid);const each=Math.floor(100/es.length);es.forEach((e,i)=>e.prob=i===0?100-each*(es.length-1):each);}
svg.addEventListener("wheel",ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*0.0015));},{passive:false});
function zoomAt(cx,cy,f){const r=svg.getBoundingClientRect();const k=Math.max(.2,Math.min(3,view.k*f));const wx=(cx-r.left-view.tx)/view.k,wy=(cy-r.top-view.ty)/view.k;view.k=k;view.tx=cx-r.left-wx*k;view.ty=cy-r.top-wy*k;render();}
function fit(){const b=fullBounds();const r=svg.getBoundingClientRect();if(!r.width)return;const k=Math.min(1.2,Math.min((r.width-40)/b.w,(r.height-90)/b.h));view.k=Math.max(.2,k);view.tx=(r.width-b.w*view.k)/2-b.x*view.k;view.ty=Math.max(14,(r.height-60-b.h*view.k)/2)-b.y*view.k;render();}
$("#zIn").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2);};
$("#zOut").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2);};

/* ---------- Simulación de eventos discretos ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function simulate(model,seed=7){
  const R=rng(seed);const H=model.days*model.hours*60;const nodes={};model.nodes.forEach(n=>nodes[n.id]=n);
  const outs={};model.nodes.forEach(n=>outs[n.id]=[]);model.edges.forEach(e=>{if(outs[e.from])outs[e.from].push(e);});
  const normal=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const dur=(t,cv)=>{if(t<=0)return 0;const c=CV[cv]??.5;const s2=Math.log(1+c*c);return Math.exp(Math.log(t)-s2/2+Math.sqrt(s2)*normal());};
  const pick=id=>{const es=outs[id];if(!es.length)return null;const n=nodes[id];
    if(n.type==="gateway"){const tot=es.reduce((a,e)=>a+(+e.prob||0),0);if(tot>0){let u=R()*tot;for(const e of es){u-=(+e.prob||0);if(u<=0)return e;}}}
    return es[Math.floor(R()*es.length)];};
  const res={};model.roles.forEach(r=>res[r.id]={free:Math.max(1,r.count|0),q:[],busy:0});
  const heap=[];const push=ev=>{heap.push(ev);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p].t<=heap[i].t)break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l].t<heap[m].t)m=l;if(r<heap.length&&heap[r].t<heap[m].t)m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top;};
  const cases=[];const moves=[];const nodeStats={};model.nodes.forEach(n=>nodeStats[n.id]={count:0,wait:0,serv:0,maxQ:0});
  const LIMIT_LOG=4000;
  const starts=model.nodes.filter(n=>n.type==="start");
  const route=(c,fromId,t)=>{let cur=fromId;for(let hop=0;hop<50;hop++){const e=pick(cur);if(!e){finish(c,t);return;}if(c.log)moves.push({t,e:e.id,c:c.id});const nx=nodes[e.to];if(!nx){finish(c,t);return;}
      if(nx.type==="end"){finish(c,t);return;} if(nx.type==="gateway"||nx.type==="start"){cur=nx.id;continue;} arriveTask(c,nx,t);return;} finish(c,t);};
  const arriveTask=(c,n,t)=>{const r=res[n.role];const seg={n:n.id,q:t,s:null,e:null};c.segs.push(seg);
    if(!r){const d=dur(+n.t||0,n.cv);seg.s=t;seg.e=t+d;nodeStats[n.id].count++;nodeStats[n.id].serv+=d;push({t:t+d,k:"done",c,n,seg});return;}
    if(r.free>0){r.free--;startServ(c,n,seg,t);}else{r.q.push({c,n,seg});const ql=r.q.filter(x=>x.n.id===n.id).length;nodeStats[n.id].maxQ=Math.max(nodeStats[n.id].maxQ,ql);}};
  const startServ=(c,n,seg,t)=>{const d=dur(+n.t||0,n.cv);seg.s=t;seg.e=t+d;const st=nodeStats[n.id];st.count++;st.wait+=t-seg.q;st.serv+=d;const r=res[n.role];if(r&&t<H)r.busy+=Math.min(t+d,H)-t;push({t:t+d,k:"done",c,n,seg});};
  const finish=(c,t)=>{c.end=t;};
  // llegadas (Poisson)
  const lam=model.arrivals/60;let id=0;
  if(lam>0&&starts.length){let t=0;for(;;){t+=-Math.log(1-R())/lam;if(t>=H)break;const s=starts[id%starts.length];const c={id:id++,arr:t,end:null,segs:[],log:id<=LIMIT_LOG,start:s.id};cases.push(c);push({t,k:"arr",c});}}
  let guard=0;const TMAX=H*4;
  while(heap.length&&guard++<2e6){const ev=pop();if(ev.t>TMAX)break;
    if(ev.k==="arr"){route(ev.c,ev.c.start,ev.t);}
    else{const r=res[ev.n.role];if(r){if(r.q.length){const nx=r.q.shift();startServ(nx.c,nx.n,nx.seg,ev.t);}else r.free++;} route(ev.c,ev.n.id,ev.t);}
  }
  const done=cases.filter(c=>c.end!=null);const doneIn=done.filter(c=>c.end<=H);
  const cyc=done.map(c=>c.end-c.arr).sort((a,b)=>a-b);
  const avg=cyc.length?cyc.reduce((a,b)=>a+b,0)/cyc.length:0;const p90=cyc.length?cyc[Math.floor(cyc.length*.9)]:0;
  const wip=cases.filter(c=>c.arr<=H&&(c.end==null||c.end>H)).length;
  const roles=model.roles.map(r=>({name:r.name,color:r.color,count:r.count,util:res[r.id].busy/(Math.max(1,r.count)*H)}));
  const costTot=model.roles.reduce((a,r)=>a+r.count*r.cost*H/60,0);
  const ns={};let maxWait=0;for(const k in nodeStats){const s=nodeStats[k];ns[k]={count:s.count,avgWait:s.count?s.wait/s.count:0,avgServ:s.count?s.serv/s.count:0,maxQ:s.maxQ};maxWait=Math.max(maxWait,ns[k].avgWait);}
  const unstable=wip>Math.max(20,cases.length*.1);
  return {H,days:model.days,hours:model.hours,arrived:cases.length,done:done.length,doneIn:doneIn.length,wip,avgCycle:avg,p90,roles,nodeStats:ns,maxWait,costCase:doneIn.length?costTot/doneIn.length:0,
    thrDay:doneIn.length/model.days,cases:cases.filter(c=>c.log),moves:moves.sort((a,b)=>a.t-b.t),unstable};
}
function story(S){
  const tasks=M.nodes.filter(n=>n.type==="task");let worstN=null;tasks.forEach(n=>{const s=S.nodeStats[n.id];if(s&&(!worstN||s.avgWait>S.nodeStats[worstN.id].avgWait))worstN=n;});
  const wr=[...S.roles].sort((a,b)=>b.util-a.util)[0];
  let t=`En ${S.days} días entraron <b>${S.arrived}</b> casos y se terminaron <b>${S.doneIn}</b>. Un caso tarda en promedio <b>${fmtMin(S.avgCycle)}</b> hábiles (9 de cada 10, menos de ${fmtMin(S.p90)}). `;
  if(worstN&&S.nodeStats[worstN.id].avgWait>1)t+=`La espera más larga está antes de <b>«${esc(worstN.label)}»</b> (${fmtMin(S.nodeStats[worstN.id].avgWait)} por caso). `;
  if(wr)t+=`<b>${esc(wr.name)}</b> trabaja al <b>${pct(wr.util)}</b> de su capacidad`+(wr.util>.9?`: es el cuello de botella. Probá sumar una persona o bajar su tiempo y compará.`:`.`);
  if(S.unstable)t+=` <b style="color:var(--crit)">Atención: el proceso no da abasto, quedan ${S.wip} casos acumulados.</b>`;
  return t;
}
function runSim(){const errs=lint().filter(l=>l[0]==="err");if(errs.length){setTab("props");return toast("Corregí los errores del modelo antes de simular");}
  sim=simulate(M);sim.story=story(sim);heat=true;render();setTab("res");startPlayback();}
$("#bSim").onclick=runSim;

/* ---------- Animación ---------- */
function startPlayback(){
  if(!sim)return;stopPlayback();$("#play").hidden=false;
  const paths={};M.edges.forEach(e=>{const p=edgePath(e);if(p)paths[e.id]=p;});
  playback={T:0,last:performance.now(),paused:false,paths,raf:0};
  const tick=now=>{if(!playback)return;const dt=(now-playback.last)/1000;playback.last=now;
    if(!playback.paused)playback.T+=dt*(+$("#pSpeed").value);
    if(playback.T>sim.H){playback.T=sim.H;playback.paused=true;$("#pPause").textContent="▶";}
    drawTokens(playback.T);playback.raf=requestAnimationFrame(tick);};
  playback.raf=requestAnimationFrame(tick);
}
function stopPlayback(){if(playback){cancelAnimationFrame(playback.raf);playback=null;}$("#tokens").innerHTML="";$("#play").hidden=true;}
$("#pPause").onclick=()=>{if(!playback)return;if(playback.T>=sim.H){playback.T=0;}playback.paused=!playback.paused;$("#pPause").textContent=playback.paused?"▶":"❚❚";};
$("#pClose").onclick=stopPlayback;
function drawTokens(T){
  const day=Math.floor(T/(M.hours*60));const mins=T-day*M.hours*60;const hh=8+Math.floor(mins/60),mm=Math.floor(mins%60);
  $("#clock").textContent=`Día ${Math.min(day+1,M.days)} · ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  const wait={},serv={};
  for(const c of sim.cases){if(c.arr>T)break;for(const s of c.segs){if(s.q<=T&&(s.s==null||T<s.s))wait[s.n]=(wait[s.n]||0)+1;else if(s.s!=null&&s.s<=T&&T<s.e)serv[s.n]=(serv[s.n]||0)+1;}}
  const out=[];const speed=+$("#pSpeed").value;const D=Math.max(.5,speed*.45);
  // fichas en movimiento sobre las flechas
  const mv=sim.moves;let lo=0,hi=mv.length;while(lo<hi){const m=(lo+hi)>>1;if(mv[m].t<T-D)lo=m+1;else hi=m;}
  let drawn=0;for(let i=lo;i<mv.length&&mv[i].t<=T&&drawn<400;i++){const p=playback.paths[mv[i].e];if(!p)continue;const f=(T-mv[i].t)/D;const [x,y]=pointAt(p,Math.min(1,f));out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="#0d6e6e" stroke="#fff" stroke-width="1.2"/>`);drawn++;}
  M.nodes.forEach(n=>{if(n.type!=="task")return;const s=sz(n);const w=wait[n.id]||0,v=serv[n.id]||0;
    for(let i=0;i<Math.min(v,8);i++)out.push(`<circle cx="${n.x+16+i*9}" cy="${n.y-7}" r="3.6" fill="#2f6fb3"/>`);
    if(w>0){const col=w>15?"#9f1239":w>6?"#c2410c":"#c98a10";const lab=String(w);const bw=12+lab.length*7;
      out.push(`<rect x="${n.x+s.w-bw+6}" y="${n.y-12}" width="${bw}" height="20" rx="10" fill="${col}"/><text x="${n.x+s.w-bw/2+6}" y="${n.y+2}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#fff">${lab}</text>`);}
  });
  $("#tokens").innerHTML=out.join("");
}

/* ---------- Escenarios ---------- */
function saveScenario(){
  const S=sim&&sim._model===JSON.stringify(M)?sim:simulate(M);if(!S.story)S.story=story(S);
  const name="Escenario "+String.fromCharCode(65+scenarios.length);
  scenarios.push({name,model:JSON.stringify(M),people:M.roles.reduce((a,r)=>a+r.count,0),arrivals:M.arrivals,thrDay:S.thrDay,avgCycle:S.avgCycle,p90:S.p90,costCase:S.costCase,maxUtil:Math.max(...S.roles.map(r=>r.util)),wip:S.wip,simFull:S});
  setTab("esc");toast(name+" guardado");
}
function quick(q){
  if(!scenarios.length)saveScenario();
  snapshot();const A=analyze();
  if(q==="plusBottleneck"&&A.worst){const r=M.roles.find(x=>x.id===A.worst.role.id);r.count++;toast(`+1 persona en ${r.name}`);}
  if(q==="peak"){M.arrivals=+(M.arrivals*1.4).toFixed(1);toast("Demanda +40%");}
  if(q==="noRework"){M.nodes.filter(n=>n.type==="gateway").forEach(g=>{const es=outEdges(g.id);const back=es.filter(e=>{const t=node(e.to);return t&&(t.x<g.x||/corregir|faltante|rehacer|reproceso/i.test(t.label));});if(back.length){back.forEach(e=>e.prob=0);const fw=es.filter(e=>!back.includes(e));fw.forEach(e=>e.prob=Math.round(100/fw.length));}});toast("Sin reprocesos");}
  sim=simulate(M);sim.story=story(sim);render();saveScenario();
}

/* ---------- Exportación ---------- */
function exportSVG(opt={}){
  const fb=fullBounds();const pad=40;const tbH=96;
  const W=Math.ceil(fb.w+pad*2),Hh=Math.ceil(fb.h+pad*2+tbH+20);
  const ox=pad-fb.x,oy=pad-fb.y;const A=analyze();
  const date=new Date().toLocaleDateString("es-AR");
  const people=M.roles.reduce((a,r)=>a+r.count,0);
  const tbW=Math.min(W-2*pad,620),tbX=W-pad-tbW,tbY=Hh-pad-tbH+20;
  const f=`font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"`,mono=`font-family="IBM Plex Mono, Courier, monospace"`;
  const cells=[["Proceso",M.name],["Versión",opt.version||"Borrador"],["Fecha",date],["Volumen",`${M.arrivals} casos/h · ${M.hours} h/día`],["Personas",String(people)],["Ciclo estimado",A.stable?fmtMin(A.cycle):"no se estabiliza"]];
  let tb=`<g><rect x="${tbX}" y="${tbY}" width="${tbW}" height="${tbH-20}" fill="#ffffff" stroke="#16202a" stroke-width="1"/>`;
  const cw=tbW/3;cells.forEach((c,i)=>{const cx=tbX+(i%3)*cw,cy=tbY+Math.floor(i/3)*38;tb+=`<rect x="${cx}" y="${cy}" width="${cw}" height="38" fill="none" stroke="#16202a" stroke-width="0.6"/><text x="${cx+8}" y="${cy+13}" ${mono} font-size="8" fill="#4a5a66">${esc(c[0].toUpperCase())}</text><text x="${cx+8}" y="${cy+29}" ${f} font-size="11.5" font-weight="600" fill="#16202a">${esc(String(c[1]).slice(0,44))}</text>`;});
  tb+=`<text x="${pad}" y="${tbY+12}" ${f} font-size="16" font-weight="700" fill="#16202a">${esc(M.name)}</text>`;
  tb+=`<text x="${pad}" y="${tbY+30}" ${mono} font-size="9" fill="#4a5a66">Hecho con Cauce · exportación vectorial sin marca de agua</text>`;
  M.roles.forEach((r,i)=>{tb+=`<rect x="${pad+(i%3)*150}" y="${tbY+42+Math.floor(i/3)*16}" width="9" height="9" rx="2" fill="${r.color}"/><text x="${pad+14+(i%3)*150}" y="${tbY+50+Math.floor(i/3)*16}" ${f} font-size="10" fill="#16202a">${esc(r.name)}</text>`;});
  tb+=`</g>`;
  const savedSel=sel;sel=null;const world=drawWorld({exp:true,A});sel=savedSel;
  return {W,H:Hh,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}"><rect width="${W}" height="${Hh}" fill="#ffffff"/><g transform="translate(${ox},${oy})">${world}</g>${tb}</svg>`};
}
function toBPMN(){
  const X=s=>esc(s);const pid="Process_1";const typ={task:"bpmn:userTask",gateway:"bpmn:exclusiveGateway",start:"bpmn:startEvent",end:"bpmn:endEvent"};
  const inc={},out={};M.nodes.forEach(n=>{inc[n.id]=[];out[n.id]=[];});M.edges.forEach(e=>{out[e.from]?.push(e.id);inc[e.to]?.push(e.id);});
  let p=`<bpmn:process id="${pid}" name="${X(M.name)}" isExecutable="false">`;
  if(M.roles.length){p+=`<bpmn:laneSet id="LaneSet_1">`+M.roles.map(r=>`<bpmn:lane id="Lane_${r.id}" name="${X(r.name)}">`+M.nodes.filter(n=>n.role===r.id).map(n=>`<bpmn:flowNodeRef>N_${n.id}</bpmn:flowNodeRef>`).join("")+`</bpmn:lane>`).join("")+`</bpmn:laneSet>`;}
  M.nodes.forEach(n=>{p+=`<${typ[n.type]} id="N_${n.id}" name="${X(n.label)}">`+(n.type==="task"?`<bpmn:documentation>Tiempo: ${n.t} min; variabilidad: ${n.cv}; responsable: ${X(role(n.role).name)}</bpmn:documentation>`:"")+inc[n.id].map(i=>`<bpmn:incoming>E_${i}</bpmn:incoming>`).join("")+out[n.id].map(i=>`<bpmn:outgoing>E_${i}</bpmn:outgoing>`).join("")+`</${typ[n.type]}>`;});
  M.edges.forEach(e=>{p+=`<bpmn:sequenceFlow id="E_${e.id}" name="${X((e.label||"")+(e.prob!=null&&node(e.from)?.type==="gateway"?" ("+e.prob+"%)":""))}" sourceRef="N_${e.from}" targetRef="N_${e.to}"/>`;});
  p+=`</bpmn:process>`;
  const fb=fullBounds();const lanes=M.lanes&&M.roles.length;
  let di=`<bpmndi:BPMNDiagram id="Diagram_1"><bpmndi:BPMNPlane id="Plane_1" bpmnElement="${lanes?"Collab_1":pid}">`;
  if(lanes){di+=`<bpmndi:BPMNShape id="Pool_di" bpmnElement="Pool_1" isHorizontal="true"><dc:Bounds x="${fb.x.toFixed(0)}" y="0" width="${fb.w.toFixed(0)}" height="${lanesHeight()}"/></bpmndi:BPMNShape>`;
    let y=0;M.roles.forEach(r=>{const h=r.h||LANE_H;di+=`<bpmndi:BPMNShape id="Lane_${r.id}_di" bpmnElement="Lane_${r.id}" isHorizontal="true"><dc:Bounds x="${(fb.x+30).toFixed(0)}" y="${y}" width="${(fb.w-30).toFixed(0)}" height="${h}"/></bpmndi:BPMNShape>`;y+=h;});}
  const bs={task:[100,80],gateway:[50,50],start:[36,36],end:[36,36]};
  M.nodes.forEach(n=>{const s=sz(n),b=bs[n.type];const c=center(n);di+=`<bpmndi:BPMNShape id="N_${n.id}_di" bpmnElement="N_${n.id}"><dc:Bounds x="${(c.x-b[0]/2).toFixed(0)}" y="${(c.y-b[1]/2).toFixed(0)}" width="${b[0]}" height="${b[1]}"/></bpmndi:BPMNShape>`;});
  M.edges.forEach(e=>{const pth=edgePath(e);if(!pth)return;di+=`<bpmndi:BPMNEdge id="E_${e.id}_di" bpmnElement="E_${e.id}">`+pth.map(q=>`<di:waypoint x="${q[0].toFixed(0)}" y="${q[1].toFixed(0)}"/>`).join("")+`</bpmndi:BPMNEdge>`;});
  di+=`</bpmndi:BPMNPlane></bpmndi:BPMNDiagram>`;
  const collab=lanes?`<bpmn:collaboration id="Collab_1"><bpmn:participant id="Pool_1" name="${X(M.name)}" processRef="${pid}"/></bpmn:collaboration>`:"";
  return `<?xml version="1.0" encoding="UTF-8"?>\n<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Defs_1" targetNamespace="https://cauce.app/bpmn" exporter="Cauce" exporterVersion="0.1">${collab}${p}${di}</bpmn:definitions>`;
}
function toMermaid(){const sh=n=>n.type==="gateway"?`{"${n.label}"}`:n.type==="task"?`["${n.label}"]`:`(("${n.label}"))`;
  return "flowchart LR\n"+M.nodes.map(n=>`  ${n.id}${sh(n).replace(/"/g,"'").replace(/^(\W+)'/,'$1"').replace(/'(\W+)$/,'"$1')}`).join("\n")+"\n"+M.edges.map(e=>`  ${e.from} -->${e.label||e.prob!=null&&node(e.from)?.type==="gateway"?`|${(e.label||"")+(e.prob!=null?" "+e.prob+"%":"")}|`:""} ${e.to}`).join("\n");}
function toManual(){const A=analyze();let t=`# ${M.name}\n\nProcedimiento generado por Cauce el ${new Date().toLocaleDateString("es-AR")}.\n\n## Alcance y volumen\n\n- Volumen: ${M.arrivals} casos por hora, ${M.hours} horas por día.\n- Tiempo de trabajo por caso: ${fmtMin(A.touch)}. Ciclo estimado: ${A.stable?fmtMin(A.cycle):"no se estabiliza"}.\n\n## Responsables\n\n| Rol | Personas | Carga |\n|---|---|---|\n`+M.roles.map(r=>`| ${r.name} | ${r.count} | ${pct(A.R[r.id]?.rho||0)} |`).join("\n")+`\n\n## Actividades\n\n| # | Actividad | Responsable | Tiempo | Sigue |\n|---|---|---|---|---|\n`;
  M.nodes.filter(n=>n.type!=="start").forEach((n,i)=>{t+=`| ${i+1} | ${n.label} | ${role(n.role).name} | ${n.type==="task"?n.t+" min":"—"} | ${outEdges(n.id).map(e=>(e.label?e.label+": ":"")+(node(e.to)?.label||"")+(e.prob!=null&&n.type==="gateway"?` (${e.prob}%)`:"")).join("; ")||"fin"} |\n`;});
  return t;}

async function doExport(kind,size){
  const base=(M.name||"proceso").replace(/[^\wáéíóúñü ()-]/gi,"").trim().replace(/\s+/g,"-").toLowerCase().slice(0,60)||"proceso";
  if(kind==="svg"){return save(base+".svg",exportSVG().svg);}
  if(kind==="png"){const {svg:s,W,H}=exportSVG();const sc=3;const img=new Image();const url=URL.createObjectURL(new Blob([s],{type:"image/svg+xml"}));
    await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url;});const c=document.createElement("canvas");c.width=W*sc;c.height=H*sc;const g=c.getContext("2d");g.scale(sc,sc);g.drawImage(img,0,0);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));return save(base+".png",blob);}
  if(kind==="pdf"){
    if(!window.jspdf)return toast("No cargó el generador de PDF");
    const {svg:s,W,H}=exportSVG({version:"Escenario actual"});
    const mm=size==="A4"?[297,210]:size==="A3"?[420,297]:size==="A1"?[841,594]:[W*0.2646,H*0.2646];
    const pdf=new window.jspdf.jsPDF({orientation:mm[0]>=mm[1]?"landscape":"portrait",unit:"mm",format:size==="real"?mm:size.toLowerCase(),compress:true});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();const m=8;const k=Math.min((pw-2*m)/W,(ph-2*m)/H);
    const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-99999px;top:0";holder.innerHTML=s;document.body.appendChild(holder);
    try{const el=holder.firstChild;const opts={x:(pw-W*k)/2,y:(ph-H*k)/2,width:W*k,height:H*k};
      if(pdf.svg)await pdf.svg(el,opts);else await window.svg2pdf.svg2pdf(el,pdf,opts);
      pdf.setProperties({title:M.name,creator:"Cauce (prototipo)",subject:"Diagrama de proceso"});
      const blob=pdf.output("blob");await save(base+"-"+size.toLowerCase()+".pdf",blob);}catch(e){console.error(e);toast("No se pudo armar el PDF");}finally{holder.remove();}
    return;}
  if(kind==="bpmn")return save(base+".bpmn.txt",toBPMN());
  if(kind==="mmd")return save(base+"-mermaid.md","```mermaid\n"+toMermaid()+"\n```\n");
  if(kind==="md")return save(base+"-procedimiento.md",toManual());
  if(kind==="json")return save(base+".cauce.json",JSON.stringify(M,null,1));
}

function compactModel(){const A=analyze();return {proceso:M.name,llegadas_por_hora:M.arrivals,horas_por_dia:M.hours,
  roles:M.roles.map(r=>({nombre:r.name,personas:r.count,costo_hora_usd:r.cost,ocupacion_estimada:+(A.R[r.id]?.rho||0).toFixed(2)})),
  nodos:M.nodes.map(n=>({id:n.id,tipo:n.type,nombre:n.label,rol:role(n.role).name,minutos:n.t,variabilidad:n.cv,pasa_por_aca:+(A.v[n.id]||0).toFixed(3)})),
  flechas:M.edges.map(e=>({de:e.from,a:e.to,prob:e.prob,etiqueta:e.label})),
  analisis:{tiempo_trabajo_min:+A.touch.toFixed(1),ciclo_estimado_min:A.stable?+A.cycle.toFixed(1):"inestable",costo_por_caso_usd:+A.costCase.toFixed(2)},
  simulacion:sim?{dias:sim.days,entraron:sim.arrived,terminados:sim.doneIn,en_curso:sim.wip,ciclo_prom_min:+sim.avgCycle.toFixed(1),p90_min:+sim.p90.toFixed(1),ocupacion:sim.roles.map(r=>({rol:r.name,ocup:+r.util.toFixed(2)})),espera_por_actividad:M.nodes.filter(n=>n.type==="task").map(n=>({actividad:n.label,espera_min:+(sim.nodeStats[n.id]?.avgWait||0).toFixed(1)}))}:null};}
function aiErr(e){return e?.code==="not_granted"?"No diste permiso para usar Claude en esta página.":e?.code==="rate_limited"?"Demasiados pedidos seguidos; esperá un minuto.":"La IA no respondió. Probá de nuevo.";}
async function aiGenerate(){
  const desc=($("#aiDesc")?.value||"").trim();if(desc.length<20)return toast("Contá un poco más del proceso");
  aiState={busy:true,desc};renderPane();
  const prompt=`Sos un analista de procesos experto. Convertí esta descripción en un modelo de proceso simulable. Respondé SOLO con JSON válido, sin texto extra, con esta forma:
{"nombre":"...","llegadas_por_hora":número,"horas_por_dia":número,"roles":[{"id":"r1","nombre":"...","personas":entero,"costo_hora_usd":número}],"nodos":[{"id":"n1","tipo":"inicio|actividad|decision|fin","nombre":"verbo + objeto, máx. 5 palabras","rol":"r1","minutos":número (solo actividades),"variabilidad":"baja|media|alta"}],"flechas":[{"de":"n1","a":"n2","prob":número 0-100 solo si sale de una decisión,"etiqueta":"Sí/No u otra, solo si sale de una decisión"}],"supuestos":["cada dato que inventaste o estimaste, en una frase"]}
Reglas: exactamente un inicio; al menos un fin; toda decisión con 2 o más salidas cuyos prob suman 100; las actividades tienen una sola salida (si hay alternativas, poné una decisión); los reprocesos vuelven con una flecha a la actividad anterior; si un dato falta, estimalo de forma razonable y anotalo en supuestos; si la descripción menciona volumen por mes o por día, convertilo a por hora; costo_hora_usd con cargas sociales en Argentina si no se dice otra cosa. Español rioplatense.
Descripción: """${desc}"""`;
  try{const j=await sampleFn.json(prompt,{modelTier:"default"});const m=fromAI(j);snapshot();M=m;sel=null;sim=null;heat=false;stopPlayback();$("#procName").value=M.name;aiState={busy:false,desc,assumptions:j.supuestos||[]};changed(false);fit();toast("Proceso armado: revisá los supuestos");}
  catch(e){aiState={busy:false,desc,err:aiErr(e)};renderPane();}
}
function fromAI(j){
  const tmap={inicio:"start",actividad:"task",decision:"gateway",decisión:"gateway",fin:"end"};
  const R=(j.roles||[]).map((r,i)=>({id:String(r.id||"r"+i),name:r.nombre||"Rol",count:Math.max(1,Math.round(+r.personas||1)),cost:+r.costo_hora_usd||5}));
  if(!R.length)R.push({id:"r0",name:"Responsable",count:1,cost:5});
  const ids=new Set(R.map(r=>r.id));
  const N=(j.nodos||[]).map(n=>({id:String(n.id),type:tmap[String(n.tipo||"").toLowerCase()]||"task",label:n.nombre||"Actividad",role:ids.has(String(n.rol))?String(n.rol):R[0].id,t:+n.minutos||5,cv:["baja","media","alta"].includes(n.variabilidad)?n.variabilidad:"media"}));
  const nid=new Set(N.map(n=>n.id));
  const E=(j.flechas||[]).filter(e=>nid.has(String(e.de))&&nid.has(String(e.a))).map(e=>[String(e.de),String(e.a),e.prob!=null?+e.prob:undefined,e.etiqueta||""]);
  if(!N.length)throw {code:"bad"};
  return mk(j.nombre||"Proceso",+j.llegadas_por_hora||10,+j.horas_por_dia||8,5,R,N,E);
}
async function aiReview(){
  aiState={busy:true,desc:aiState.desc};renderPane();

Modelo: ${JSON.stringify(compactModel())}`;
  try{const j=await sampleFn.json(prompt,{modelTier:"default"});aiState={busy:false,desc:aiState.desc,out:j.resumen||"",finds:j.hallazgos||[],props:j.propuestas||[]};}

  renderPane();
}

}
