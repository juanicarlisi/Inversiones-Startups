cortes:
  - "Abril de 2027: si no hay 1.000 usuarios activos por semana o vuelve menos de 10% a la semana, pasa a modo mantenimiento (sin desarrollo nuevo) y esas horas van a la fábrica."
  - "Suscripción: si a los 6 meses paga menos de 0,5% de los activos, se prueba otro precio o beneficio antes de seguir."
  - "Senda Reunión: si a los 3 meses menos de 20 grupos la usan dos veces, se simplifica a los 2 juegos que más se usan."

riesgos:
  - "Errores de cita o de doctrina → toda pregunta lleva cita y pasa por revisión humana."
  - "Derechos de bancos de preguntas ajenos → solo se importa lo de licencia abierta con atribución; el resto se usa como referencia y se reescribe."
  - "IA con sesgos teológicos (estudios de 2026) → responde solo con pasajes citados, declara su enfoque y deriva al pastor en temas disputados."
  - "Menores de edad → sin chat abierto, datos mínimos, fotos solo con permiso del líder."
  - "Competencia gratis (YouVersion) → no competimos en lectura sino en juego, reuniones y liga."
  - "Anonimato en Google Play (se ve tu nombre, y tu dirección si hay compras) → cuenta de empresa antes de activar la suscripción."
  - "Meta restringe los asistentes de IA dentro de WhatsApp → la IA vive en la app; por WhatsApp solo avisos y el canal."

pi:
  - "Marca «Senda» en el INPI (clases 9, 41 y 42; ≈ USD 80) antes del lanzamiento público; dominio .com y .com.ar."
  - "El banco de preguntas y los planes son propios: se publican de a poco, nunca enteros."
  - "No es patentable (software y juegos); la protección es la marca, la comunidad y la velocidad."

recordatorios:
  - "Elegir 1–2 revisores de contenido de tu comunidad (protestante)."
  - "Anotar 12 personas que puedan ser testers durante 14 días."
  - "Decidir si publicás con tu nombre (sin compras dentro) o esperás la cuenta de empresa."

