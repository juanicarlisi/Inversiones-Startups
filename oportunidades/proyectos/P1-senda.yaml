contenido:
  - "Textos: RVR1909 (dominio público), Biblia Libre para el Mundo (CC0) y La Biblia en Español Sencillo (CC BY) dentro de la app; RVR1960 por licencia de API.Bible cuando haya ingresos (desde ~USD 10/mes); para otras versiones, botón «abrir en tu Biblia» (YouVersion no permite su lector gratis en apps con publicidad o suscripción)."
  - "Preguntas: Claude las escribe siempre con cita; 1–2 revisores protestantes de tu comunidad las aprueban antes de publicarse; la ley permite citar fragmentos cortos con fines didácticos (Ley 11.723, art. 10)."
  - "Benchmark de todos los bancos de preguntas bíblicas disponibles (pedido del 28-09-2026): colecciones abiertas (por ejemplo, un set de 1.290 preguntas en Hugging Face, OpenTriviaQA con licencia CC BY-SA, Open Trivia Database) y las listas en español que circulan en PDF (de 38 a 1.800 preguntas). Se usan para relevar temas, categorías y dificultades y para alimentar el banco propio. Filtro pregunta por pregunta: 1) se eliminan duplicados; 2) se verifica contra el texto bíblico que el pasaje exista y la respuesta sea correcta; 3) se descarta lo doctrinalmente disputado o ajeno al foco protestante; 4) se asigna categoría, dificultad y cita; 5) revisión humana de todo lo sensible y muestreo del resto; 6) se registra la fuente y la licencia de cada pregunta. Solo se importa tal cual lo que tiene licencia abierta (con atribución); lo demás se reescribe con palabras propias y cita."
  - "Audio: voz sintética de calidad sobre textos libres; música de oración propia del sello de música (P9)."
  - "Imágenes: generadas con IA, con marca de agua discreta."

difusion:
  principal: "Senda Reunión y la Liga Senda: cada reunión de jóvenes y cada iglesia inscripta traen usuarios nuevos sin costo."
  apoyo:
    - "Cuenta temática sin cara desde octubre de 2026 (Instagram, TikTok, grupo de Facebook y canal de WhatsApp): versículos, clips de rondas del Impostor bíblico y del rosco, trivia del día."
    - "Tus grupos de la comunidad y de la facultad para los primeros mil usuarios y los 12 testers."
  tacticas:
    - "Lanzar antes del 1 de enero y abrir el año con el desafío de 21 días."
    - "Embajadores: líderes de jóvenes con premium gratis y ranking de iglesias."
    - "Imágenes para compartir y resultado diario tipo Wordle (cada uso es una invitación)."
    - "Invitar con premio para los dos (semanas de premium, vidas extra)."
    - "Nominación a destacados de Google Play en los primeros 120 días; ficha en español y portugués."
    - "Pinterest con imágenes de versículos; YouTube con el canal de piano para orar (P9) que recomienda la app."
    - "Notas de prensa de la marca a medios cristianos y a redes de líderes (por ejemplo, e625), con tu aprobación."
    - "Promoción cruzada con el juego de palabras bíblicas (P6)."

metodologia:
  - "Ciclos de dos semanas: Claude construye y publica una versión; vos la probás 30 minutos y decidís."
  - "Circuito de contenido: Claude escribe con cita → un revisor aprueba → se publica. Nada doctrinal sale sin revisión humana."
  - "Tablero automático cada lunes: usuarios, retención, grupos activos, ingresos y horas."
  - "Comité mensual de 20 minutos y reglas de corte escritas."
  - "Moderación: reportes, bloqueo, sin chat abierto entre desconocidos; datos mínimos de menores."

quien:
  claude:
    - "Programa la app, la web, el panel de contenidos y los juegos de sala"
    - "Releva todos los bancos de preguntas bíblicas disponibles, los filtra pregunta por pregunta y arma el banco propio con categorías"
    - "Escribe preguntas, devocionales y planes con cita; arma las imágenes y los clips"
    - "Prepara la ficha del Play Store en español y portugués y responde reseñas con plantillas"
    - "Mide todo y propone mejoras cada semana"
  vos:
    - "Elegís 1–2 revisores y aprobás lo doctrinal"
    - "Conseguís los 12 testers y compartís en tus grupos"
    - "Probás cada versión (30 min por semana) y presentás la app a 3–5 líderes de jóvenes"
    - "Aprobás publicaciones y respondés mensajes de la cuenta temática"

