una_frase: "La app para crecer en la Biblia jugando, solo o con tu iglesia: niveles tipo Duolingo, trivia, versículo del día, lectura con audio, juegos para las reuniones de jóvenes y una liga entre iglesias."
problema: "Sostener la lectura de la Biblia cuesta; las apps que enganchan (niveles, rachas) están en inglés y separadas en cinco apps distintas; los líderes de jóvenes arman cada reunión desde cero y el Kahoot gratis admite 10 jugadores; las iglesias chicas no tienen app propia."
para_quien:
  - "Jóvenes y adultos evangélicos de habla hispana: 17,4% de la población en Argentina (UBA 2026), 19% en Latinoamérica y ~21% de los hispanos de EE.UU."
  - "Líderes de jóvenes, maestros de escuela dominical y pastores: el canal que multiplica."
  - "Desde 2028, Brasil en portugués: 47,4 millones de evangélicos (Censo 2022)."
mision: "Que cualquier persona pueda conocer un poco más la Biblia cada día, con alegría y en comunidad."
vision: "Para 2030, la app de referencia en español y portugués para aprender la Biblia y animar a los grupos de jóvenes: decenas de miles de usuarios activos, miles de iglesias en la liga y un modelo que se paga solo sin molestar con publicidad."
objetivos:
  - {cuando: "dic-2026", que: "Publicada antes del 1 de enero (la semana de más uso de las apps bíblicas) con 1.500 usuarios en la ola de Año Nuevo y el Ayuno de Daniel."}
  - {cuando: "abr-2027", que: "1.000 usuarios activos por semana y al menos 10% que vuelve a la semana (hito de corte)."}
  - {cuando: "jul-2027", que: "50 grupos de jóvenes usando Senda Reunión cada semana; suscripción activa."}
  - {cuando: "dic-2027", que: "8.000 usuarios activos por mes, 30 iglesias en el plan iglesia y el costo de la app cubierto."}
  - {cuando: "dic-2028", que: "Versión en portugués publicada; 22.000 usuarios activos por mes."}
  - {cuando: "dic-2030", que: "60.000 usuarios activos por mes y 500 iglesias en la liga."}

