  - "Senda Reunión: el líder de jóvenes la usa cada semana y mete a 20–60 chicos a la app sin instalar nada (entran por QR desde el navegador)."
  - "Liga Senda entre iglesias: nadie lo tiene y cada iglesia invita a la siguiente."
  - "Del sermón a la semana en español (en inglés existe y cuesta USD 49 por mes)."
  - "Precio latinoamericano: menos de la mitad de un Spotify."

