experimentos:
  - id: JGX1
    nombre: "Convencé al de la ventanilla (IA con calle)"
    que_es: "Cada día, un empleado distinto (una IA con humor rioplatense) que nunca tiene el sello; hay que convencerlo hablando. Se comparte «lo logré en 4 mensajes». Comparte universo con Trámite Imposible y prueba el personaje del Truco (N9)."
    por_que: "Gandalf (Lakera) sumó 4 M de intentos con el mismo esquema; cumple las 6 condiciones de los virales. Así no: el patovica de boliche (no va con la marca). Mejor así: la ventanilla."
    cuando: "Cuando el fundador apruebe la función en la nube y la clave de API (regla 8); una semana de construcción"
    costo: "~USD 0,002 por partida (ESTIMACIÓN); dentro del crédito de API de Max si se confirma"
    corte: "Si en 4 semanas menos del 5% comparte su resultado o la partida cuesta más de USD 0,005, se archiva."
    donde: "Web propia y Discord; al portal solo cuando publique su política sobre juegos con IA."

diferencial:
  - "Temas que nadie trabaja con realismo (el hub aéreo, la última milla) y contenido propio (bíblico, humor rioplatense)."
  - "Probar en el portal cuesta casi cero y dice en semanas si el juego sirve."
  - "Un motor compartido: Hub Nocturno, su campaña de última milla y Hub Rush comparten código, arte y público."

benchmark:
  - {de: "Airline Manager 4 (Trophy Games) y los idle de aerolínea de CrazyGames", tomamos: "El género (gestión de aerolínea, de 1992–1998), con carga, hub y noche, que ellos no tienen."}
  - {de: "Pixel Flow y los puzzles de ordenar", tomamos: "La mecánica que más crece, con tema propio (Hub Rush)."}
  - {de: "Global Transport Tycoon Idle, Idle Courier Tycoon", tomamos: "El tycoon de transporte, con realismo de última milla (campaña de Hub Nocturno)."}
  - {de: "Level Devil (Poki)", tomamos: "Plataformas con trampas de rabia y risa; con la burocracia como tema (Trámite Imposible)."}
  - {de: "Word Wipe (Poki) y trivias bíblicas de las tiendas", tomamos: "Palabras Vivas."}
  - {de: "Gandalf (Lakera), Death by AI", tomamos: "La IA como rival o narrador, solo como experimento con regla de corte."}
  - {de: "Truco Blyts (20–35 M de descargas)", tomamos: "Candidato de reserva: Truco contra una IA con personalidad."}

difusion:
  principal: "El portal (CrazyGames, Poki): muestra lo nuevo a su público."
  apoyo:
    - "Clips cortos sin cara de las partidas (TikTok, Shorts), sobre todo de Trámite Imposible."
    - "Promoción cruzada con Senda (Palabras Vivas) y con Andén (Hub Nocturno y Hub Rush en cátedras de logística)."
  tacticas:
    - "Jams y concursos de los portales (premios y visibilidad)."
    - "En Poki, 100% de la publicidad si el jugador llega por nuestro enlace."

metodologia:
  - "Cada juego: prototipo jugable en 1–2 semanas → lanzamiento de prueba de 8 semanas → seguir, ajustar o archivar."
  - "Métrica que decide: cuántos vuelven al día siguiente."
  - "Cada juego con pruebas del modelo y un jugador automático que mide el balance antes de mostrarlo."

quien:
  claude:
    - "Diseño de la mecánica, programación, arte y sonido, kit del portal, lectura de métricas"
  vos:
    - "Jugás cada versión (20 minutos) y ponés el realismo logístico; creás la cuenta de desarrollador; decidís a las 8 semanas"

