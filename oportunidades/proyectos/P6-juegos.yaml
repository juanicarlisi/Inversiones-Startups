# P6 · Juegos web en portales (R1) → estudio "Carpincho Games". Definición de proyecto (28-09-2026; actualizada el 17-10-2026).
# Fuentes: conocimiento/2026-09-28-musica-alquileres-microtareas-fabrica.md (sección 4), 2026-09-26-replicables-y-espectro.md,
#          conocimiento/2026-10-17-max-aviacion-y-juegos-divertidos.md (aviación, apps divertidas y Max).
# 17-10-2026 (DEC-2026-10-17-2): con Claude Max la línea arranca nueve meses antes. Entra Hub Nocturno (aviación, semilla del
# fundador) y absorbe a Última Milla Tycoon como su segunda campaña (mismo motor de red); entra Trámite Imposible; Hub Rush pasa a
# jun-2027. Los juegos con IA quedan como experimento con regla de corte.
id: P6
orden: 6
catalogo: [R1, A2]
tipo: cartera
rol: "Tiros de juegos"
icono: "🎮"
color: "#4a3aa7"
nombre_trabajo: "Juegos web en portales"
nombre: "Carpincho Games"
lema: "Juegos cortos que enganchan, con un toque de logística y de acá."
nombres:
  - {n: "Carpincho Games", por_que: "El carpincho (capibara) es un fenómeno mundial en internet y es bien argentino: da simpatía en los portales globales y cuenta de dónde venimos.", estado: "Verificar"}
  - {n: "Mate Arcade", por_que: "Identidad argentina, suena a juegos para pasar el rato.", estado: "Verificar"}
  - {n: "Pampa Play", por_que: "Corto y sonoro.", estado: "Verificar"}

una_frase: "Juegos de navegador cortos que Claude programa en 1–3 semanas; el portal (CrazyGames, Poki) los muestra a millones, mide gratis si enganchan y reparte la publicidad. El que pega pasa a celular con el mismo código."
problema: "Hacer un juego de celular y conseguir jugadores cuesta caro; en los portales la demanda ya existe (CrazyGames: 50 M de jugadores por mes; Poki: 100 M) y el lanzamiento de prueba dice en semanas si el juego sirve."
para_quien:
  - "Jugadores de portales web de todo el mundo (en inglés y español)."
  - "Para el holding: aprender qué engancha, con tiros baratos y divertidos."
mision: "Hacer juegos simples y bien terminados que la gente quiera volver a jugar, con temas que conocemos (logística, Biblia, Argentina)."
vision: "Para 2030, 5–6 juegos publicados, 1–2 que dejan USD 500+ por mes y una versión de celular del mejor."
objetivos:
  - {cuando: "dic-2026", que: "Hub Nocturno en lanzamiento básico en CrazyGames (mide gratis si la gente vuelve)."}
  - {cuando: "mar-2027", que: "Trámite Imposible en prueba; Hub Nocturno decidido (lanzamiento completo o archivo)."}
  - {cuando: "jun-2027", que: "Hub Rush en prueba; campaña de última milla dentro de Hub Nocturno si retiene."}
  - {cuando: "may-2028", que: "Palabras Vivas (juego bíblico) en portales y dentro de Senda."}
  - {cuando: "dic-2028", que: "Al menos un juego en lanzamiento completo; decidir la versión de celular."}

alcance:
  incluye:
    - "Juegos HTML5 con el kit del portal, arte y sonido propios (dibujados por código o con IA y retocados)"
    - "Lanzamiento de prueba (mide retención gratis) antes de invertir más"
    - "Versión de celular solo del que retenga"
  no_incluye:
    - "Juegos grandes, multijugador complejo o 3D pesado (por eso el simulador de vuelo queda afuera)"
    - "Publicidad paga"
    - "Mecánicas de menos de 20 años de terceros (dibujar trayectorias, gerentes y reinicio de los clickers, red minimalista)"

