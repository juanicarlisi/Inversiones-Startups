    nombres:
      - {n: "Hub Nocturno / Night Hub", por_que: "Dice lo que lo hace distinto: el hub y la noche (balizas en 1929, el corte nocturno de la carga después).", estado: "Sin conflicto visible en la búsqueda del 17-10-2026; verificar INPI, EUIPO y USPTO"}
