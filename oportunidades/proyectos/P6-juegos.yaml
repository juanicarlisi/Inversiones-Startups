metricas:
  norte: "Porcentaje que vuelve al día siguiente en el portal"
  otras:
    - "Minutos por jugador; ingreso por cada mil partidas"

cortes:
  - "Cada juego tiene 8 semanas de prueba; si 3 juegos seguidos no pasan a lanzamiento completo, se deja la línea."
  - "Hub Nocturno: si en el lanzamiento básico vuelve al día siguiente menos del 20% o el tiempo de juego es menor a 6 minutos, se archiva y la campaña de última milla no se hace."

riesgos:
  - "Los juegos son hits: la mayoría no despega → presupuesto casi cero y corte temprano."
  - "Arte genérico o «hecho con IA» que los jugadores rechazan → estilo propio y consistente, dibujado por código donde se pueda."
  - "Patentes de mecánicas → solo mecánicas de más de 20 años o propias; búsqueda de patentes antes de construir y consulta legal antes de publicar."

pi:
  - "Marca del estudio y de los juegos que pasen a lanzamiento completo."
  - "Hub Nocturno: no se usan «Airline Tycoon», «Airport Tycoon» ni «Airline(s) Manager»; sin trayectorias dibujadas (patentes de Nintendo vigentes); revisar EA US8851978B1 y US9975045B2 antes de publicar la ganancia por ausencia."

recordatorios:
