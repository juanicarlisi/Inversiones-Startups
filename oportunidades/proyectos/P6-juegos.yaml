    por_que: "Los juegos de aerolínea funcionan en portales (36.000–47.000 «me gusta» en CrazyGames) y fuera (Airline Manager 4: más de 100.000 jugadores por día); ninguno en los portales tiene carga, hub ni conexiones. Es la semilla del fundador (17-10-2026) con su saber logístico como diferencial."
