# Plan mes a mes (oct-2026 → dic-2027) y por trimestre (2028 → 2030). Lo usa el informe 3 v3.
# {{esp:AAAA-MM}} = ingreso neto esperado del holding ese mes (simulación); {{p50:AAAA-MM}} = mediana. Todo es ESTIMACIÓN.
meses:
  - mes: "2026-10"
    foco: "Arrancar sin gastar"
    hacemos:
      - "Nombre de la suite (recomendado: Senda), 1–2 revisores y 12 testers anotados"
      - "Cuenta de Google Play (USD 25) y AdMob; cuenta temática de Senda en Instagram, TikTok, un grupo de Facebook y un canal de WhatsApp, con las primeras publicaciones"
      - "Claude empieza a construir Senda: releva todos los bancos de preguntas bíblicas disponibles, los filtra pregunta por pregunta y arma las 3.000 preguntas con cita y categorías"
      - "Abrir o confirmar la cuenta en una ALyC y cargar la carpeta de tu agente de inversiones"
      - "Habilitar en el entorno el acceso a play.google.com, chromewebstore.google.com y flippa.com"
    esperamos:
      - "Primera versión jugable de Senda en la web"
      - "Primeros 200 seguidores de la cuenta temática"
  - mes: "2026-11"
    foco: "Senda casi lista"
    hacemos:
      - "Construcción del lanzamiento: niveles, trivia, versículo del día con imágenes, lector con audio"
      - "Revisión de preguntas por tus revisores"
      - "Prueba cerrada con 12 testers durante 14 días (desde el 15)"
      - "Primer tramo de renta; Claude integra tu agente de inversiones"
    esperamos:
      - "Lista de mejoras de los testers y retención de la prueba"
  - mes: "2026-12"
    foco: "Lanzar antes del 1 de enero"
    hacemos:
      - "Publicación de Senda en Google Play y en la web; desafío de 21 días de enero listo"
      - "Compartir en tus grupos; nominación a destacados de Google Play"
      - "Andén: elegir los 5 cálculos (tu lista) y las fuentes"
      - "Decidir: ¿Claude Max desde enero? ¿empresa del holding (LLC o SAS)?"
    esperamos:
      - "Escenario normal: 1.000–1.500 usuarios en la ola de Año Nuevo"
      - "Ingreso casi cero (esperable: es mes de construcción)"
  - mes: "2027-01"
    foco: "La ola de Año Nuevo"
    hacemos:
      - "Desafío de 21 días (Ayuno de Daniel) con la comunidad"
      - "Medir retención y ajustar el camino de niveles"
      - "Andén: Claude programa las calculadoras 1 a 5; vos validás fórmulas"
      - "Pasar a Claude Max (si se decidió en diciembre)"
    esperamos:
      - "Retención al día 7 medida; primeras reseñas"
  - mes: "2027-02"
    foco: "Senda Reunión"
    hacemos:
      - "Senda Reunión v1: trivia en vivo en pantalla, Impostor bíblico, planificador con IA"
      - "Andén online: búsquedas, tutoriales sin cara"
      - "Constituir la empresa del holding con un contador"
    esperamos:
      - "Andén publicado; empresa en trámite"
  - mes: "2027-03"
    foco: "Arranca el año de las iglesias"
    hacemos:
      - "Presentar Senda Reunión a 3–5 líderes de jóvenes (con tu OK)"
      - "Suscripción de Senda y desafío de Semana Santa (Pascua: 28-03)"
      - "Marcas en el INPI (Senda y Andén)"
      - "Compra: criterios y embudo semanal en Flippa (Claude)"
      - "Remanso: identidad y primeros videos de Aguas de Reposo"
    esperamos:
      - "20 o más grupos probando Senda Reunión"
  - mes: "2027-04"
    foco: "Primer hito de corte"
    hacemos:
      - "Hito de Senda: ¿1.000 activos por semana y 10% que vuelve?"
      - "Liga Senda y agenda de eventos"
      - "Andén: «Contame tu operación» en construcción"
      - "Remanso publicado con directo 24/7"
    esperamos:
      - "Decisión escrita sobre Senda"
      - "Escenario normal: ~3.500 usuarios activos por mes en Senda"
  - mes: "2027-05"
    foco: "Cargar lo que ya tenés"
    hacemos:
      - "Cargar al repositorio tu agente de alquileres"
      - "Describir tu simulador de última milla en términos generales (sin código, datos ni nombres)"
      - "Elegir el producto 1 de la fábrica (recomendado: Todo Bien)"
      - "Compra: 3 análisis de práctica"
    esperamos:
      - "Primeros pagos de la suscripción de Senda"
  - mes: "2027-06"
    foco: "Andén Pro y la compra"
    hacemos:
      - "Andén: simulador conversacional + plan Pro"
      - "Decisión de compra en Flippa (hasta USD 2.500)"
      - "Todo Bien en construcción (español y portugués)"
      - "Presentarse a un desafío de innovación municipal (si hay convocatoria)"
    esperamos:
      - "Escenario normal: Senda ~5.000 usuarios por mes; Andén ~800"
  - mes: "2027-07"
    foco: "Mitad de año: compra y primer producto"
    hacemos:
      - "Compra y traspaso de la app"
      - "Lanzar Todo Bien"
      - "Senda: compañero IA, RVR1960 y Senda Púlpito en construcción"
    esperamos:
      - "Primer ingreso de la app comprada (~USD 100 por mes)"
  - mes: "2027-08"
    foco: "Cátedras y juegos"
    hacemos:
      - "Andén Aula en cátedras (segundo cuatrimestre)"
      - "Hub Rush y Rutea en construcción"
    esperamos:
      - "1–2 cátedras probando Andén"
  - mes: "2027-09"
    foco: "Segundo hito de corte"
    hacemos:
      - "Hito de Andén: ¿500 usuarios por mes o una cátedra?"
      - "Hub Rush en lanzamiento de prueba en CrazyGames"
      - "Posta: validación y cuenta temática «deptos antes que nadie»"
      - "Sobremesa: identidad y estilos"
    esperamos:
      - "Decisión escrita sobre Andén; retención de Hub Rush"
  - mes: "2027-10"
    foco: "Más tiros"
    hacemos:
      - "Lanzar Rutea"
      - "Canal de Sobremesa con directo 24/7"
      - "Posta en construcción"
      - "Decisión de 90 días de Todo Bien"
    esperamos:
      - "Tres productos de la fábrica y juegos con datos reales"
  - mes: "2027-11"
    foco: "Senda completa"
    hacemos:
      - "Senda: más juegos de sala, modo campamento, iPhone"
      - "Marcas en el INPI (segunda tanda)"
    esperamos:
      - "Senda lista para campamentos de verano"
  - mes: "2027-12"
    foco: "Cierre del año de construcción"
    hacemos:
      - "Lanzar Posta en 3 barrios para la temporada de febrero–marzo"
      - "«Tu año en la Palabra» en Senda"
      - "Comité anual: qué se acelera en 2028, qué se corta, ¿Max 20x o un moderador?"
    esperamos:
      - "Nueve líneas vivas, marcas y empresa a nombre del holding"
      - "Ingreso esperado del holding: {{esp:2027-12}} por mes (mediana {{p50:2027-12}}); {{p_cubre27}} de chances de que los proyectos ya cubran los costos fijos"

