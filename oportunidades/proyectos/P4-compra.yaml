una_frase: "A mitad de 2027, comprar en Flippa una app o juego Android con ingresos de AdMob verificados (USD 50–150 por mes) por USD 1.000–2.500, mejorarlo con IA y sumarlo a la red de promoción cruzada de la cartera."
problema: "Aprender a operar apps que facturan lleva años si se empieza de cero; comprar una chica con ingresos verificados acorta el camino y deja un activo."
para_quien:
  - "El holding: un activo que ya factura y una escuela práctica de publicidad, tiendas y retención."
mision: "Aprender con un activo real y sumar ingresos desde el día uno de la compra."
vision: "Para 2030, 2–3 activos comprados (el segundo, más grande, con caja propia) y la habilidad de comprar, mejorar y, si conviene, vender."
objetivos:
  - {cuando: "may-2027", que: "Criterios, embudo semanal y 3 análisis de práctica."}
  - {cuando: "jul-2027", que: "Compra hecha (si alguna pasa los criterios) y traspaso completo."}
  - {cuando: "dic-2027", que: "Ingreso mantenido ≥ 70% del comprado y mejoras de ficha y anuncios."}
  - {cuando: "jun-2028", que: "Decidir una segunda compra más grande (USD 5–20 mil) con caja del holding."}

alcance:
