# Inventario bíblico de Senda: personaje por personaje e historia por historia (prueba 10, 12-10-2026).
# Fuente editable a mano. La cobertura en la app la calcula herramientas/inventario_senda.py (no editar inventario_cobertura.md).
tipo: inventario_biblico
actualizado: '2026-10-17'
para_que: 'Que cada personaje y cada historia de la Biblia esté planificado en Senda: dónde está en la Biblia, qué enseña, qué se va a crear (lecciones,
  preguntas, juegos, «¿Sabías que…?») y qué hay que revisar con cuidado. Es investigación permanente: se completa en cada sesión y en cada evolutivo
  (pedido del fundador, prueba 10).'
como_se_usa:
- Antes de escribir una ruta o un juego, se miran aquí sus personajes e historias.
- 'Al terminar, se corre herramientas/inventario_senda.py: cuenta cuánto de cada uno ya está en la app (lecciones, Espadeo, Antes o después, trivia)
  y escribe inventario_cobertura.md.'
- 'Lo que se agrega a mano: personajes e historias que faltan (la Biblia nombra unas 3.000 personas: entran a medida que se escriben las rutas),
  ideas y puntos a revisar.'
- Todo contenido nuevo pasa por la verificación línea por línea contra el texto bíblico; lo interpretativo se marca; lo que divide a los cristianos,
  como posturas.
prioridades:
  alta: en las rutas de v1 o ya en la app
  media: v1 o v2
  baja: evolutivos
