# Proyección (escenario normal). Personas activas por mes del caso de negocio del holding; el resto, supuestos de este archivo.
proyeccion:
  anios: [2027, 2028, 2029, 2030]
  activos_mes: [8000, 22000, 40000, 60000]
  precio_promedio_vs_mensual: 0.88   # mezcla de planes mensuales y anuales (~35% anual con ~33% de descuento); las iglesias pagan el anual
  neto_tienda: 0.75          # lo que queda de cada dólar después de la comisión de la tienda (15%) e impuestos (ESTIMACIÓN)
  plus_pct: [0.015, 0.018, 0.020, 0.022]
  max_pct: [0.006, 0.008, 0.010, 0.012]
  familia_pct: [0.001, 0.0015, 0.0018, 0.002]
  pase_pct: [0.015, 0.018, 0.022, 0.025]      # compran el pase en cada temporada (2 por año) quienes no tienen Max
  lider_pct: [0.003, 0.003, 0.003, 0.003]
  iglesias: [30, 120, 300, 500]
  perlas_pagadores_pct: [0.005, 0.005, 0.006, 0.006]
  perlas_gasto_mes: 3.0
  anuncios_usd_por_activo_mes: [0.028, 0.030, 0.032, 0.034]   # videos + anuncio corto al final de partidas (eCPM de Latinoamérica, conservador)
  costo_servidores_por_activo: 0.009    # servidores + IA interna (sin asistente de IA para usuarios)
  licencias_biblias:                      # API.Bible Pro + 5 versiones con derechos (RVR1960, NVI, NTV, DHH, TLA). YouVersion Platform no aplica: exige app no comercial
    pro: 29
    por_version: [40, 90, 130, 170]
    versiones: 5
