# Economía y membresías de Senda (v2, 02-10-2026). Lo usa informes/construir_senda.py (capítulos 17 y 24).
# Todo es propuesta para validar con datos: los números se ajustan cada mes con lo que ganan y gastan los usuarios.
# Moneda: USD de referencia (precio en EE.UU.); cada tienda fija el equivalente local en Latinoamérica.

vidas:
  gratis: {maximo: 3, regenera_min: 60}   # decisión del fundador, 05-10-2026
  plus: {maximo: 15, regenera_min: 20}
  max: {maximo: ilimitadas, regenera_min: 0}
  cuestan_una:
    - "Un error en una lección de la Travesía"
    - "Empezar una partida individual o un duelo nuevo (Espadeo, Dibujalo exprés, Abecé, Antes o después)"
  nunca_cuestan:
    - "Leer o escuchar la Biblia, planes y Berea"
    - "Repasar"
    - "Jugar en salas con amigos y en Senda Reunión"
    - "El partido de la fecha de la Liga y los eventos en vivo (Viernes de Espadeo, Copas)"
    - "El Desafío del día"
  se_recuperan:
    - ["Con el tiempo", "1 cada 60 min (gratis) o cada 20 min (Plus)"]
    - ["Racha de 5 aciertos en una lección", "+1"]
    - ["Pidiéndoselas a amigos", "hasta 5 por día; regalar no te cuesta nada"]
    - ["Invitando a alguien que instala Senda", "+3"]
    - ["Video opcional", "+1 (máximo 5 por día)"]
    - ["Talentos", "1 vida = 40; recarga completa = 150"]
    - ["Perlas", "recarga completa = 15"]

comodines:
  lista:
    - {nombre: "Luz", hace: "Elimina dos respuestas incorrectas", talentos: 30, origen: "50:50 del Millonario; bomba de Preguntados"}
    - {nombre: "Tiempo", hace: "Suma 15 segundos", talentos: 20, origen: "Preguntados"}
    - {nombre: "Doble", hace: "Si fallás, podés responder otra vez", talentos: 40, origen: "Doble oportunidad (Preguntados), double dip (Millonario)"}
    - {nombre: "Cambio", hace: "Cambia la pregunta por otra de la misma categoría", talentos: 25, origen: "Saltar (Preguntados), cambiar la pregunta (Millonario)"}
    - {nombre: "Pista", hace: "Muestra la cita donde está la respuesta, y te invita a leerla", talentos: 25, origen: "Propio de Senda"}
    - {nombre: "Tribuna", hace: "Muestra cómo respondió esa pregunta la comunidad (o tus amigos)", talentos: 35, origen: "Preguntar al público (Millonario), con datos reales de Senda"}
  reglas:
    - "Un comodín por pregunta."
    - "En el partido de la fecha de la Liga y en las Copas, máximo 3 por partido para todos (pagues o no): nadie gana por pagar."
    - "En vivo (Viernes de Espadeo, Senda Reunión) hay dos especiales: x2 (doble puntaje en una pregunta) y Congelar (frena el reloj 5 s)."
  fuentes:
    - ["Jugando", "Cofres, misiones, Giro diario, ascensos e insignias"]
    - ["Talentos", "Precios de la tabla"]
    - ["Video opcional", "1 comodín al azar por video (cuenta dentro del tope diario de videos)"]
    - ["Invitar amigos", "+3 comodines por cada amigo que instala"]
    - ["Plus", "30 por mes"]
    - ["Max", "100 por mes"]
    - ["Pase Senda", "Paquetes en el carril premium"]

monedas:
  pasos: "Puntos de experiencia: todo lo que hacés suma (leer, aprender, jugar, orar por alguien, invitar). Suben tu nivel y el Pase Senda."
  talentos: "La moneda del juego: se gana con todo lo que hacés y se gasta en vidas, comodines, protectores y objetos de Tu Lani."
  perlas: "La moneda especial: rara jugando y también se compra. Sirve para objetos especiales, recargas y el Pase Senda. Nunca da ventaja en partidos oficiales."
  paquetes_perlas: [["120 Perlas", 0.99], ["650 Perlas", 4.99], ["1.400 Perlas", 9.99]]

ganar:   # [acción, pasos, talentos]
  - ["Lección de la Travesía (perfecta)", "15 (20)", "10 (15)"]
  - ["Repaso completo", "10", "10"]
  - ["Capítulo de la Biblia leído o escuchado (máx. 5 por día)", "10", "—"]
  - ["Primer momento con la Palabra del día (abre el Cofre de la Palabra)", "—", "20–40"]
  - ["Duelo de Espadeo ganado / perdido", "15 / 5", "20 / 5"]
  - ["Pieza de armadura ganada", "5", "5"]
  - ["Partida de otros juegos", "5–15", "5–15"]
  - ["Misión del día (3 por día)", "10", "15"]
  - ["Orar por un pedido de tu grupo", "5", "5"]
  - ["Invitar a alguien que instala", "50", "100"]
  - ["Pregunta propuesta y aprobada", "30", "50"]
  - ["Cofre semanal", "—", "80–150"]

gastar:   # [qué, talentos, perlas]
  - ["1 vida / recarga completa", "40 / 150", "— / 15"]
  - ["Comodín", "20–40", "5"]
  - ["Protector de racha", "100", "20"]
  - ["Objeto común de Tu Lani (gorra, lentes, buzo)", "300–800", "60–150"]
  - ["Atuendo completo de Tu Lani", "1.200–2.500", "250–450"]
  - ["Vehículo (bici, skate, moto, auto)", "3.000–6.000", "500–900"]
  - ["Legendario (carro de fuego, barca de Galilea)", "No se vende: logros y Pase Senda", "—"]
  - ["Pieza del escudo de tu club (Liga)", "200–600", "40–120"]
  - ["Festejo animado / tema de la app", "500–1.000", "100–200"]

