# Ideas para que Senda sea la app cristiana número uno (prueba 16, 17-10-2026).
# Pedido del fundador: traer todas las ideas posibles para incorporar o mejorar. Fuente única: alimenta el capítulo 41, el PDF del
# proyecto y la pestaña «Ideas» de la Consola (donde el fundador marca cada una). Etiquetas: HECHO (con fuente y fecha),
# ESTIMACIÓN, HIPÓTESIS, INFERENCIA. Toda idea dice quién vende por el fundador (canal), su costo y su regla de corte.
# Estado: hecho | en_curso | listo_para_hacer | necesita_cuentas | necesita_decision | despues.
actualizado: 2026-10-17
tesis: >-
  Ser número uno no es tener más descargas que YouVersion (más de 1.000 millones de instalaciones, sin fines de lucro y gratis):
  es ser la app donde una generación de habla hispana aprende la Biblia entera y la vive, con la calidad de una gran app de juegos
  y la confiabilidad de una buena iglesia. La visión se mide por lo que la gente sabe y vive. El lugar libre (inferencia de las
  búsquedas del 28-09 y del 17-10-2026): en español no hay una app que junte aprender en orden (tipo Duolingo), jugar con otros
  (tipo Preguntados), leer y la vida de la iglesia; en inglés ya hay intentos (Ascend, Manna, Bible Loop de Life.Church).
evidencia:
  - {dato: "YouVersion superó 1.000 millones de instalaciones (28-10-2025); en jun-2026 hizo un desafío de lectura junto al Mundial y suma video (The Chosen) dentro de la app.", tipo: HECHO, fuente: "youversion.com; faith.tools (2026)"}
  - {dato: "Life.Church tiene además Bible Loop, con desafíos y tablas de posiciones para creyentes jóvenes.", tipo: HECHO, fuente: "mwm.ai (ficha de la app, 2026)"}
  - {dato: "Hallow (católica): unos USD 40 M netos en 2025; el pico de descargas de Cuaresma bajó de 2 M (2024) a 1,5 M (2025) y 1,2 M (2026): los desafíos de temporada funcionan, pero se gastan si se repiten igual.", tipo: HECHO, fuente: "Appfigures, feb-2026"}
  - {dato: "En la encuesta State of the Bible 2025, el uso de la Biblia en EE.UU. subió de 38% a 41% y el «compromiso con la Escritura» de la generación Z, de 11% a 15% (muestra de 2.656 adultos).", tipo: HECHO, fuente: "American Bible Society, abr-2025"}
  - {dato: "Duolingo: las ligas subieron 17% el tiempo de estudio; con 7 días de racha la retención es 2,4 veces mayor.", tipo: HECHO, fuente: "bitácora 2026-09-28 (Duolingo, informes públicos)"}
  - {dato: "Brasil tiene 47,4 M de evangélicos (26,9%, censo 2022) y en Argentina hay más de 25.000 iglesias evangélicas.", tipo: HECHO, fuente: "IBGE, jun-2025; IGJ"}
  - {dato: "Bible Chat crece con contenido que lleva de Google a la app (SEO).", tipo: HECHO, fuente: "Appfigures, abr-2025"}
prioridad:
  # Las doce que más acercan a ser número uno, en orden de valor esperado por esfuerzo.
  - id: proyector
    titulo: "La noche de trivia: modo proyector para grupos"
    que: "El líder proyecta la partida en la pantalla del salón y los jóvenes entran desde el navegador con un QR, sin instalar nada (hasta 100 jugadores). Preguntas del Espadeo o del PDF de su estudio."
    porque: "Cada noche de trivia de un grupo de jóvenes es una ola de descargas: el líder vende por el fundador. Kahoot, el que usan hoy las iglesias, deja solo 10 jugadores en su plan gratis (bitácora 28-09-2026)."
    canal: "Líderes de jóvenes y el ministerio aliado"
    costo: "USD 0 con el plan gratis de Supabase (tiempo real); unas 2 semanas de desarrollo"
    corte: "Si 10 grupos lo usan en el primer mes y menos de 3 repiten, se rediseña antes de seguir"
    estado: necesita_cuentas
    voto: "si"  # Consola, 17-10-2026
    nota17: "Votada sí: espera las cuentas (Supabase)."
    area: distribucion
  - id: temporadas
    titulo: "Desafíos con fecha: 21 días de enero, Semana Santa y Adviento"
    que: "Un desafío por temporada, con su travesía, su música y su insignia; se hace solo o con tu iglesia. Cada año, uno distinto (para que no se gaste como la Cuaresma de Hallow)."
    porque: "Hallow llegó al número 2 del App Store con su desafío de Cuaresma; las iglesias evangélicas ya hacen 21 días de oración en enero."
    canal: "Las iglesias lo anuncian el domingo; se comparte por WhatsApp"
    costo: "USD 0; contenido escrito y verificado por Claude"
    corte: "Si el primero (enero de 2027) suma menos de 1.000 participantes, el siguiente se hace solo dentro de la app, sin campaña"
    estado: hecho
    voto: "si"  # Consola, 17-10-2026
    nota17: "Prueba 17: Adviento 2026 (27 días), «21 días con Jesús» (enero de 2027) y Semana Santa 2027, con foco por día e insignia; en Biblia y en Inicio."
    area: habito
  - id: compartir_dia
    titulo: "El desafío del día, para compartir sin arruinar la respuesta"
    que: "Al responder el desafío del día, un mensaje con tu resultado en un cuadrito de color y tu racha (como Wordle), sin la respuesta, para mandar por WhatsApp. Primera versión hecha en esta prueba (texto); después, una tarjeta con imagen y el enlace a la tienda."
    porque: "Wordle creció solo con resultados compartibles (4.800 millones de partidas en 2023). El desafío del día ya existe desde esta prueba."
    canal: "Los propios usuarios, por WhatsApp"
    costo: "USD 0; dos días de desarrollo"
    corte: "Si menos de 5% de los que responden comparte, se cambia el diseño de la tarjeta"
    estado: hecho
    area: distribucion
  - id: ligas
    titulo: "Ligas semanales por iglesia"
    que: "Cada iglesia es un equipo; la fecha es semanal y suma lo que cada miembro aprende y lee. Tablas por ciudad y por país, como el fútbol de fantasía."
    porque: "En Duolingo las ligas subieron 17% el tiempo de estudio; cada iglesia empuja a sus miembros a sumar."
    canal: "Pastores y líderes"
    costo: "USD 0 hasta miles de usuarios (Supabase gratis); Supabase Pro USD 25 por mes desde el lanzamiento, ya presupuestado"
    corte: "Si menos de 20% de los usuarios con cuenta se une a una iglesia, la liga pasa a ser entre amigos"
    estado: necesita_cuentas
    voto: "si"  # Consola, 17-10-2026
    nota17: "Votada sí: espera las cuentas (Supabase)."
    area: comunidad
  - id: duelos
    titulo: "Duelos por turnos con amigos"
    que: "Partidas de seis rondas que se juegan cuando cada uno puede, con 72 horas para responder; rival al azar o un amigo."
    porque: "Es el motor de Preguntados (500 millones de descargas); trae a los amigos que todavía no tienen la app."
    canal: "Las invitaciones de los usuarios"
    costo: "USD 0 (diseñados en docs/DUELOS.md); unas 2 semanas de desarrollo"
    corte: "Si menos de 10% de los activos juega un duelo por semana, se priorizan las ligas"
    estado: necesita_cuentas
    voto: "si"  # Consola, 17-10-2026
    nota17: "Votada sí: espera las cuentas (Supabase)."
    area: distribucion
  - id: biblia_entera
    titulo: "La Biblia entera en la Travesía: los 66 libros, uno por uno"
    que: "Que cada libro tenga su capítulo jugable (hoy lo tienen Rut y Jonás) y que cada nivel diga qué leer y dónde está cada respuesta. Ya están las guías de los 66 libros."
    porque: "Es la misión: que una generación conozca la Palabra como ninguna antes. Nadie en español lo tiene completo y verificado."
    canal: "Es el producto: retiene y se recomienda"
    costo: "USD 0; Claude escribe y verifica 4 a 6 libros por semana; los revisores doctrinales confirman después"
    corte: "Si la precisión media de un libro baja de 60% o lo abandonan más de la mitad, se reescribe antes de seguir"
    estado: en_curso
    voto: "si"  # Consola, 17-10-2026
    nota17: "Prueba 17: Habacuc jugable (Rut, Jonás y Habacuc ya están; faltan 63)."
    area: contenido
  - id: lideres
    titulo: "Senda para líderes"
    que: "Un panel para el líder de grupo: ve el avance del grupo, asigna la travesía de la semana, arma una trivia desde el PDF de su estudio y recibe las preguntas que el grupo no supo."
    porque: "Los líderes eligen qué usa el grupo; si Senda les ahorra trabajo, la adoptan iglesias enteras sin que el fundador venda."
    canal: "Líderes, pastores y el ministerio aliado"
    costo: "USD 0 con Supabase; unas 3 semanas"
    corte: "Si 5 líderes lo prueban y menos de 2 lo usan cada semana, se simplifica"
    estado: necesita_cuentas
    voto: "si"  # Consola, 17-10-2026
    nota17: "Votada sí: espera las cuentas (Supabase)."
    area: comunidad
  - id: voz
    titulo: "La Biblia narrada con voz humana de calidad"
    que: "Audio por capítulo con una voz neuronal de primer nivel (la que eligió el fundador), sin conexión, para escuchar en el colectivo o al dormir."
    porque: "Mucha gente escucha más de lo que lee; es lo primero que se nota frente a la voz del teléfono."
    canal: "Retención"
    costo: "Estimación: unos USD 100 a 300 por toda la Biblia con un servicio de voz neuronal, más almacenamiento en Cloudflare R2 (gratis hasta 10 GB); requiere tu aprobación"
    corte: "Si menos de 15% de los lectores usa el audio en el primer mes, se deja la voz del teléfono"
    estado: necesita_decision
    voto: "si"  # Consola, 17-10-2026
    nota17: "Prueba 17: la voz libre elegida (Piper es_MX-ald) hereda una base con licencia solo para investigación (lessac, Blizzard 2013); no se usa para audio distribuido. Recomendación y regla de corte en el capítulo 42 §6 (pendiente voz17)."
    area: biblia
  - id: confianza
    titulo: "El sello de confianza: revisado y con fuentes"
    que: "Cada lección y pregunta muestra quién la revisó, contra qué texto se verificó y sus fuentes; un botón para reportar errores que se responden en 72 horas."
    porque: "Los pastores protestantes desconfían de las apps con IA que citan mal (bitácora 28-09-2026). La confianza es lo que hace que una iglesia la recomiende."
    canal: "Pastores"
    costo: "USD 0; conseguir dos revisores doctrinales (pendiente tuyo)"
    corte: "Sin revisores humanos, el sello dice «verificado por el equipo contra el texto» y no «revisado por pastores»"
    estado: descartada_por_voto
    voto: "no"  # Consola, 17-10-2026
    nota17: "El fundador votó que no (17-10-2026): sale de los planes. La revisión doctrinal sigue igual, sin sello visible."
    area: confianza
  - id: seo
    titulo: "Las guías de los 66 libros y Quién es quién, también en la web"
    que: "Una página web pública por libro y por personaje, con el contenido verificado y un botón para seguir en la app."
    porque: "Bible Chat crece con búsquedas de Google; la gente busca «de qué trata Rut» o «quién fue Melquisedec». El contenido ya existe."
    canal: "Google, sin pagar anuncios"
    costo: "USD 0 (sitio estático en Cloudflare Pages); unos 3 días"
    corte: "Si a los 3 meses las páginas traen menos de 300 visitas por mes, se dejan pero no se amplían"
    estado: armado_falta_publicar
    voto: "si"  # Consola, 17-10-2026
    nota17: "Prueba 17: web/ armado (66 guías y Quién es quién, con sitemap); publicarlo espera la cuenta de Cloudflare y el dominio (pendiente web17)."
    area: distribucion
  - id: anio
    titulo: "Tu año en la Palabra (diciembre)"
    que: "Un resumen personal de fin de año: capítulos leídos, libros completos, versículos guardados, tu racha más larga y tu personaje favorito, en tarjetas para compartir."
    porque: "Los resúmenes anuales se comparten masivamente; llega justo después del lanzamiento."
    canal: "Los usuarios, en redes"
    costo: "USD 0; una semana"
    corte: "Se hace solo si hay al menos 500 usuarios activos en diciembre"
    estado: hecho
    voto: "si"  # Consola, 17-10-2026
    nota17: "Prueba 17: «Tu año en la Palabra» en la app (Ajustes; en Inicio en diciembre y la primera quincena de enero)."
    area: distribucion
  - id: portugues
    titulo: "Senda en portugués (Brasil)"
    que: "La misma app en portugués, con una Biblia libre en ese idioma, cuando la versión en español funcione."
    porque: "Brasil tiene 47,4 millones de evangélicos; el contenido es datos y se traduce sin rehacer la app."
    canal: "Iglesias brasileñas y la tienda"
    costo: "USD 0 en código; la Biblia libre en portugués está por confirmar (hipótesis)"
    corte: "Solo después de que en español la retención al día 30 pase de 10%"
    estado: despues
    voto: "si"  # Consola, 17-10-2026
    nota17: "Votada sí: después de que la versión en español funcione."
    area: internacional
catalogo:
  # El resto, agrupado. Cada una en una línea: qué es y por qué.
  - area: habito
    nombre: "Hábito"
    ideas:
      - {titulo: "Widget del versículo del día", que: "En la pantalla del teléfono, sin abrir la app; el más visto en apps de Biblia.", estado: listo_para_hacer}
      - {titulo: "Avisos de Lany sin culpa", que: "Recordatorios cálidos y variados, a la hora que elegiste; nunca culpa ni presión.", estado: hecho}
      - {titulo: "Memorizar versículos con repaso espaciado", que: "Los versículos guardados vuelven justo antes de olvidarse.", estado: listo_para_hacer}
      - {titulo: "Planes de lectura con amigos", que: "Leer el mismo plan con tu grupo y comentar cada día.", estado: necesita_cuentas}
      - {titulo: "Protector de racha que se gana aprendiendo", que: "Ya existe; sumar que se recarga completando una lección extra.", estado: listo_para_hacer}
  - area: contenido
    nombre: "Contenido que enseña"
    ideas:
      - {titulo: "Quién es quién completo", que: "Los cinco capítulos (hoy, Génesis a Deuteronomio).", estado: en_curso}
      - {titulo: "Mapas interactivos por historia", que: "El viaje de cada relato sobre el mapa, con las distancias reales.", estado: listo_para_hacer}
      - {titulo: "Palabras en hebreo y griego en el «+»", que: "Con datos libres de STEPBible (CC BY), ya diseñado.", estado: listo_para_hacer}
      - {titulo: "Preguntas con imagen", que: "Mapas, objetos del templo, la armadura: ver para aprender.", estado: listo_para_hacer}
      - {titulo: "Más historias de Vivir la historia", que: "Mar Rojo, Jericó, el Carmelo y el valle de Ela.", estado: listo_para_hacer}
      - {titulo: "Modo narrador de Crónicas de la senda", que: "La app lleva las escenas, los dados y las lámparas en la reunión.", estado: listo_para_hacer}
  - area: comunidad
    nombre: "Iglesias y comunidad"
    ideas:
      - {titulo: "Agenda compartida de la iglesia", que: "Cultos, reuniones y ensayos con aviso; ya existe la personal.", estado: necesita_cuentas}
      - {titulo: "Muro de oración privado del grupo", que: "Pedidos de oración solo para tu grupo, con moderación.", estado: necesita_cuentas}
      - {titulo: "Fábrica de preguntas", que: "Los usuarios proponen preguntas, otros las votan y el equipo verifica (como Preguntados).", estado: despues}
      - {titulo: "Kit imprimible de juegos de mesa y de rol", que: "La puerta y Crónicas de la senda, gratis para iglesias.", estado: hecho}
  - area: distribucion
    nombre: "Llegar a más gente sin vender"
    ideas:
      - {titulo: "Stickers de Lany para WhatsApp", que: "Lany con sus 16 expresiones, como paquete de stickers que lleva a la app.", estado: listo_para_hacer}
      - {titulo: "Versículo con imagen para estados", que: "Hoy se comparte el texto; sumar una imagen con el arte de Senda, en un toque.", estado: listo_para_hacer}
      - {titulo: "Videos cortos sin cara", que: "Curiosidades verificadas con Lany animado, para Reels y TikTok (lo publica el fundador o un operador).", estado: necesita_decision}
      - {titulo: "QR para el culto", que: "Un QR que abre el pasaje del sermón o la trivia de la noche.", estado: listo_para_hacer}
  - area: experiencia
    nombre: "Experiencia de primer nivel"
    ideas:
      - {titulo: "Lany pulida por un animador de Rive", que: "Decisión de noviembre (línea de USD 1.200).", estado: necesita_decision}
      - {titulo: "Accesibilidad completa", que: "Letra grande, lector de pantalla, colores para daltonismo y menos movimiento.", estado: en_curso}
      - {titulo: "Todo sin conexión", que: "La Biblia, las lecciones y el audio funcionan sin datos.", estado: en_curso}
