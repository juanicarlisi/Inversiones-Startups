  - area: confianza
    nombre: "Confianza"
    ideas:
      - {titulo: "Sin publicidad molesta", que: "Si hay anuncios, solo los que el usuario elige para recuperar vidas; nunca en medio de la lectura.", estado: necesita_decision}
