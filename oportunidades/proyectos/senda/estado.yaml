# Estado del proyecto Senda: la fuente de la pestaña «Proyecto» de la Consola de Senda (senda-app/scripts/consola.py).
# Lo actualiza Claude al cerrar cada sesión de trabajo. «avance» = % del alcance del MVP del 18-12-2026 en esa área (ESTIMACIÓN
# de Claude, criterio: funciona en la app de prueba y pasó por la vista previa; no cuenta lo que está solo en el proyecto).
# peso = cuánto pesa el área en el avance total del MVP.
actualizado: 2026-10-05
version_app: "0.3 · prueba (sprint 1b)"
fase: "F1 Fundaciones y F2 MVP «Primera luz»: sprint 1b"
lanzamiento: 2026-12-18
proximo_hito: {fecha: 2026-11-15, que: "Cuenta de Google Play para llegar a la prueba cerrada (12 testers × 14 días)"}

areas:
  - id: biblia
    nombre: Biblia
    peso: 16
    avance: 70
    hecho:
      - "Lector como Biblia de papel: la hoja se dobla siguiendo el dedo, papel, canto dorado, papel/sepia/noche"
      - "4 versiones libres (RV1909, NBV, PDT, BES) y enlace a la RVR1960 en Bible.com"
      - "Búsqueda en toda la Biblia, cintas, resaltadores que pintan, notas, varios versículos a la vez"
      - "Lectura en voz alta con la mejor voz del teléfono y selector de voz"
      - "Invitación a orar antes de leer"
    falta:
      - "Licencias de las versiones protestantes que más se leen (RVR1960, NTV, NVI, LBLA/NBLA, DHH, TLA)"
      - "Planes de lectura (3 para el MVP)"
      - "Voz neuronal grabada por capítulo (en lugar de la voz del teléfono)"
      - "Estudios bíblicos y el «+» (notas, referencias, mapas): v1"
    siguiente: "Planes de lectura y elegir la voz definitiva en la Sala de sonidos"
  - id: travesia
    nombre: Travesía
    peso: 18
    avance: 15
    hecho:
      - "Mapa de la sección 1 con niveles, globo para empezar, Lani que camina, cofre y jefe"
      - "Una lección completa (6 preguntas) con vidas, rachas de aciertos y celebración"
      - "Ruta, secciones, niveles y lecciones como datos editables (contenido/travesia.json)"
    falta:
      - "Motor de lecciones con 5 tipos de ejercicio (opción, verdadero/falso, completar, ordenar, imagen)"
      - "Secciones 0 a 2 de Fundamentos + «21 días» (130 lecciones)"
      - "Repaso espaciado (FSRS), cofres y misiones reales"
    siguiente: "Sprint 2 (26-oct a 8-nov): motor de lecciones y las primeras 40 lecciones"
  - id: espadeo
    nombre: Espadeo (Jugar)
    peso: 16
    avance: 25
    hecho:
      - "Ruleta con física, carta de categoría, Carga, Prueba de pieza, Armería y Luz"
      - "60 preguntas con cita verificada contra la RV1909"
      - "Lani reacciona, aciertos que suben de tono, anuncio simulado al terminar"
    falta:
      - "Banco de 4.000 preguntas revisadas"
      - "Duelos por turnos con amigos y con Lani, rival al azar, Cara a cara"
      - "5 comodines más, preguntas con imagen"
    siguiente: "Sprint 3 (9 a 22-nov): duelos y banco grande"
  - id: habito
    nombre: Inicio y hábito
    peso: 10
    avance: 60
    hecho:
      - "Racha con rayitos, Día libre, hitos, «¡Volviste!»"
      - "Versículo del día en sobre, misiones del día, semana Senda"
    falta:
      - "Recordatorio real (notificación) y protector de racha"
      - "Bienvenida con edad, objetivo y Rutas"
    siguiente: "Notificaciones locales y protector de racha"
  - id: comunidad
    nombre: Comunidad y Pulso
    peso: 8
    avance: 20
    hecho:
      - "Semana Senda, Pulso del día programable por fecha, invitar"
    falta:
      - "Cuentas, grupos y calendario completo"
      - "Pulso con votos reales y resultados"
      - "Giro diario y desafío del día"
    siguiente: "Cuentas (Supabase) en el sprint 2; Pulso real con ellas"
  - id: arte
    nombre: Lani, arte y sonido
    peso: 10
    avance: 40
    hecho:
      - "Lani con 11 poses, 63 íconos, armadura y mapa"
      - "Motor de sonido sin demoras y 40 sonidos (de reserva hasta elegir)"
      - "Animaciones del capítulo 19 en lector, Jugar, Travesía y momentos"
    falta:
      - "Elegir los sonidos definitivos (Sala de sonidos) y, si hace falta, diseñador de sonido"
      - "Lani final por un ilustrador y animada en Rive"
    siguiente: "Elegir sonidos y voz en la Consola"
  - id: backend
    nombre: Backend, datos y métricas
    peso: 10
    avance: 10
    hecho:
      - "Contenido fuera del código con validador automático"
      - "APK de prueba y Biblias libres por GitHub Actions (sin Expo)"
    falta:
      - "Supabase (cuentas, sincronización, Pulso real, propuestas, reportes)"
      - "Paquetes de contenido que llegan sin actualizar la app"
      - "PostHog (métricas) y Sentry (errores)"
    siguiente: "Sprint 2: Supabase y PostHog (cuentas gratis del fundador)"
  - id: consola
    nombre: Consola de Senda
    peso: 4
    avance: 25
    hecho:
      - "v0: proyecto, catálogo de contenido, propuestas, sonidos, licencias y métricas planificadas"
    falta:
      - "v1 con login, edición directa y métricas en vivo (cuando estén Supabase y PostHog)"
    siguiente: "v1 en el sprint 2"
  - id: legal
    nombre: Licencias y legal
    peso: 4
    avance: 25
    hecho:
      - "Privacidad, términos y créditos en borrador"
      - "Pedidos de licencia redactados para cada titular"
    falta:
      - "Enviar los pedidos y negociar"
      - "Marcas en el INPI"
    siguiente: "Enviar los pedidos desde el correo del proyecto"
  - id: tiendas
    nombre: Tiendas y lanzamiento
    peso: 4
    avance: 10
    hecho:
      - "APK de prueba instalable"
    falta:
      - "Cuenta de Google Play, prueba cerrada (12 testers × 14 días), fichas y video"
      - "Cuenta de Apple si iOS sale el 18-12"
    siguiente: "Cuenta de Google Play antes del 15-11"

# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - {id: probar, que: "Probar la vista previa nueva y el APK de prueba", por_que: "Saber si la hoja, los sonidos y los juegos ya se sienten bien", costo: 0, cuando: "Esta semana", tiempo: "30 min"}
  - {id: sonidos, que: "Elegir sonidos y voz en la Sala de sonidos", por_que: "Desde acá no puedo escuchar; los definitivos los elegís vos", costo: 0, cuando: "Esta semana", tiempo: "15 min"}
  - {id: correo, que: "Crear el correo del proyecto (por ejemplo, un Gmail «Senda App»)", por_que: "Enviar los pedidos de licencia sin usar tu correo personal", costo: 0, cuando: "Esta semana", tiempo: "5 min"}
  - {id: licencias, que: "Enviar los pedidos de licencia (pestaña Licencias)", por_que: "Sumar la RVR1960 y las versiones protestantes más leídas", costo: 0, cuando: "Octubre", tiempo: "30 min"}
  - {id: cuentas, que: "Crear las cuentas gratis de Supabase y PostHog con el correo del proyecto", por_que: "Cuentas, Pulso real, propuestas de usuarios y métricas (sprint 2)", costo: 0, cuando: "Antes del 26-10", tiempo: "15 min"}
  - {id: revisores, que: "Conseguir 2 revisores doctrinales y 12 testers con Android", por_que: "Revisar el contenido y cumplir la prueba cerrada de Google Play", costo: 0, cuando: "Mediados de noviembre", tiempo: "Mensajes"}
  - {id: play, que: "Abrir la cuenta de Google Play", por_que: "Sin ella no hay prueba cerrada ni lanzamiento el 18-12", costo: 25, cuando: "Antes del 15-11", tiempo: "20 min"}
  - {id: apple, que: "Decidir si iOS sale el 18-12 (cuenta de Apple)", por_que: "Publicar en iPhone", costo: 99, cuando: "Principios de diciembre", tiempo: "—"}

alertas:
  - "Sin cuentas no hay métricas: hasta el sprint 2, lo que se mide es lo que vos y los testers cuentan."
  - "Las versiones protestantes más usadas necesitan licencia: con 0 respuestas, el MVP sale con RV1909 + 3 libres y el enlace a la RVR1960."
