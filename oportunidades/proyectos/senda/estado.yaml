      - "iPhone en 2027 (recomendado; ahorra USD 99 este año)"
    siguiente: "Cuenta de Google Play antes del 15-11"

# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - id: probar4
    que: "Probar el APK prueba 4"
    por_que: "Confirmar que los sonidos ya no se cuelgan y ver la Biblia nueva y la trivia con dificultad"
    costo: 0
    cuando: "Esta semana"
    tiempo: "20 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-4 y tocá senda-prueba-4.apk."
      - "Instalalo encima del anterior (no hace falta desinstalar: tus ajustes y la voz elegida quedan)."
      - "Probá: pasar hojas en la Biblia (y salir de la app: no tiene que quedar ningún sonido), marcar versículos, Letra y papel → Dos columnas, un plan de lectura (pestaña Biblia) y varias partidas de Jugar."
      - "Contame qué sonido no te gusta (si hay alguno) y qué te parece la dificultad."
  - id: licencias
    que: "Enviar los pedidos de licencia (pestaña Licencias)"
    por_que: "Sumar la RVR1960 y las versiones protestantes más leídas"
    costo: 0
    cuando: "Octubre"
    tiempo: "15 min"
    pasos:
      - "En la computadora, entrá a Gmail con appsenda.ok@gmail.com."
      - "En esta Consola, pestaña Licencias: en cada correo tocá «Escribir en Gmail» (se abre listo) y «Enviar»."
      - "En los dos formularios (Biblica y Lockman), «Abrir el formulario» y completalo con los botones «Copiar»."
      - "Marcá cada uno como «Enviado». Cuando respondan, pegá la respuesta en la nota."
  - id: supabase
    que: "Crear la cuenta gratis de Supabase y dejarme el acceso"
    por_que: "Es la base de datos de Senda: cuentas, progreso en la nube, Pulso con votos reales y contenido que llega sin actualizar la app (sprint 2)"
    costo: 0
    cuando: "Antes del 26-10"
    tiempo: "10 min"
    pasos:
      - "Entrá a https://supabase.com y tocá «Start your project»."
      - "Registrate con correo: appsenda.ok@gmail.com y una contraseña nueva (guardala). Confirmá el correo que te llega."
      - "Creá la organización: nombre «Senda», tipo «Personal», plan «Free» (gratis, sin tarjeta)."
      - "«New project»: nombre «senda»; en «Database password» tocá «Generate a password» y guardala; región «South America (São Paulo)»; «Create new project» (tarda unos 2 minutos)."
      - "Abrí https://supabase.com/dashboard/account/tokens → «Generate new token», nombre «github-senda», y copiá el token (empieza con sbp_)."
      - "Abrí https://github.com/juanicarlisi/senda-app/settings/secrets/actions y con «New repository secret» creá tres secretos (Name → valor): SUPABASE_ACCESS_TOKEN → el token; SUPABASE_DB_PASSWORD → la contraseña de la base; SUPABASE_PROJECT_ID → en Supabase, Project Settings → General → «Project ID»."
      - "Avisame «listo»: armo las tablas y conecto la app desde GitHub, sin ver tus claves."
  - id: posthog
    que: "Crear la cuenta gratis de PostHog"
    por_que: "Las métricas: cuánta gente vuelve, qué preguntas cuestan, dónde abandonan (sprint 2)"
    costo: 0
    cuando: "Antes del 26-10"
    tiempo: "5 min"
    pasos:
      - "Entrá a https://posthog.com y tocá «Get started – free»."
      - "«Continue with Google» con appsenda.ok@gmail.com (o correo y contraseña)."
      - "Región: «US Cloud». Organización: «Senda». Proyecto: «Senda App». Si pregunta qué instalar, elegí «React Native» y salteá las instrucciones."
      - "No actives nada pago (el plan gratis no pide tarjeta)."
      - "En Settings → Project, copiá el «Project API key» (empieza con phc_) y guardalo como secreto en https://github.com/juanicarlisi/senda-app/settings/secrets/actions con el nombre POSTHOG_KEY."
      - "Avisame «listo»."
  - {id: revisores, que: "Conseguir 2 revisores doctrinales y 12 testers con Android", por_que: "Revisar el contenido y cumplir la prueba cerrada de Google Play", costo: 0, cuando: "Mediados de noviembre", tiempo: "Mensajes"}
  - {id: play, que: "Abrir la cuenta de Google Play (te guío ese día)", por_que: "Sin ella no hay prueba cerrada ni lanzamiento el 18-12", costo: 25, cuando: "Antes del 15-11", tiempo: "20 min"}
  - {id: apple, que: "iPhone: lanzar en 2027 (recomendado) o pagar Apple para diciembre", por_que: "Ahorra USD 99 este año; Android primero", costo: 0, cuando: "Principios de diciembre", tiempo: "—"}

alertas:
  - "Sin cuentas no hay métricas: hasta el sprint 2, lo que se mide es lo que vos y los testers cuentan."
  - "Las versiones protestantes más usadas necesitan licencia: con 0 respuestas, el MVP sale con RV1909 + 3 libres y el enlace a la RVR1960."
