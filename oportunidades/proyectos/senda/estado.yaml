    siguiente: "Cuenta de Google Play antes del 15-11"

# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - id: probar5
    que: "Probar el APK prueba 5"
    por_que: "Ver la Biblia sin cortes ni trabas, la firma sonora, el festejo de pieza y el calendario con avisos"
    costo: 0
    cuando: "Esta semana"
    tiempo: "25 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-5 y tocá senda-prueba-5.apk (se instala encima)."
      - "Biblia: entrá por el plan de Salmos y leé el día de corrido; pasá hojas rápido; probá con la letra grande del teléfono."
      - "Jugar: escuchá la ruleta y ganá una pieza (el festejo). ¿Los sonidos de los logros te suenan a «Senda»?"
      - "Comunidad → «+ Evento»: armá una reunión con aviso de 10 minutos y esperá que llegue. Ajustes → Recordatorio: activalo (pide permiso)."
      - "Contame qué cambiarías."
  - id: licencias2
    que: "Licencias: esperar las respuestas (los formularios, más adelante)"
    por_que: "Ya enviaste los dos correos importantes; Biblica y Lockman conviene pedirlos después del lanzamiento"
    costo: 0
    cuando: "Cuando respondan"
    tiempo: "—"
    pasos:
      - "Cuando llegue una respuesta a appsenda.ok@gmail.com, pegala en la nota de su tarjeta (pestaña Licencias) y avisame: preparo la contestación."
      - "Biblica (NVI): no licencia apps en desarrollo ni a personas; se pide con la empresa y la app publicada (los campos ya están listos en su tarjeta)."
      - "Lockman (LBLA): pide una dirección postal. Si querés hacerlo antes, decidí si usar una casilla de correo (tiene costo) o tu dirección."
  - id: token
    que: "Opcional: cambiar el token de Supabase por uno que venza en un año"
    por_que: "El que creaste no vence y tiene todos los permisos: funciona, pero conviene acotarlo"
    costo: 0
    cuando: "Cuando quieras (no es urgente)"
    tiempo: "5 min"
    pasos:
      - "Entrá a https://supabase.com/dashboard/account/tokens → «Generate new token», nombre «github-senda-2027»."
      - "En el vencimiento elegí una fecha a un año. Si aparece la opción de permisos (está en prueba y no todas las cuentas la tienen), dejá solo el proyecto «senda»."
      - "Copiá el token y en https://github.com/juanicarlisi/senda-app/settings/secrets/actions editá SUPABASE_ACCESS_TOKEN (Update) y pegalo."
      - "Volvé a la lista de tokens de Supabase y borrá el viejo («Revoke»)."
      - "Avisame y corro la prueba de conexión."
  - {id: revisores, que: "Conseguir 2 revisores doctrinales y 12 testers con Android", por_que: "Revisar el contenido y cumplir la prueba cerrada de Google Play", costo: 0, cuando: "Mediados de noviembre", tiempo: "Mensajes"}
  - {id: play, que: "Abrir la cuenta de Google Play (te guío ese día)", por_que: "Sin ella no hay prueba cerrada ni lanzamiento el 18-12", costo: 25, cuando: "Antes del 15-11", tiempo: "20 min"}
  - {id: apple, que: "iPhone: lanzar en 2027 (recomendado) o pagar Apple para diciembre", por_que: "Ahorra USD 99 este año; Android primero", costo: 0, cuando: "Principios de diciembre", tiempo: "—"}

alertas:
  - "Las versiones protestantes más usadas necesitan licencia: con 0 respuestas, el MVP sale con RV1909 + 3 libres y el enlace a la RVR1960."
