    falta:
      - "Banco de 4.000 preguntas revisadas"
      - "Duelos por turnos con amigos y con Lani, rival al azar, Cara a cara"
      - "5 comodines más, preguntas con imagen"
    siguiente: "Sprint 3 (9 a 22-nov): duelos y banco grande"
