  - "Licencias (19-10, capítulo 47 §2): la NTV se puede pagar ya por API.Bible (recomendado); la RVR1960 solo con la SAS (noviembre) por la Digital Bible Library y el permiso escrito de la ABS; la NVI no se vende para apps con ingresos. El MVP sale con RV1909 + 3 libres (+ 4 en portugués e inglés) y lo demás en un toque desde Bible.com."
