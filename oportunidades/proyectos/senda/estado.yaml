fase: "F2 MVP «Primera luz»: sprint 1 y adelantos del 2, 3 y 4 (prueba 40: Lany pasa a Rive nativo con la herramienta oficial (Rive CLI: la fuente es RML y el .riv lo compila el compilador oficial); brazos y piernas con huesos, mallas con skin que se doblan en codo y rodilla e IK de Rive con controles; agarra de verdad las seis piezas (bajan con luz, la mano los toma, siente el peso, se los pone) con restricciones de Rive; la presentación con brazos cruzados y la pose heroica con escudo y espada; el director de Lany (eventos con prioridad, enfriamiento y canales) en la bienvenida, Inicio y el festejo de pieza; 28 preguntas con láminas de Doré (dominio público) y el banco 39 (16 fáciles, difíciles y curiosidades): 2.290 en total; expo-image y zod; lotes de Claude listos para traducir y revisar la trivia. Prueba 39: los duelos llegan (permiso de avisos al entrar a lo social, el canal de Android que faltaba, «Te esperan» arriba de todo en Inicio y globito en Jugar), arrancan directo y muestran el alias del rival; fin de turno con los otros duelos y «jugar con alguien más»; la victoria con cuatro bailes nuevos de Lany en Rive (voltereta, saltitos, bailecito, lazo); la ruleta otra vez se agarra (Gesture Handler) y se puede salir de una partida; alias único, amistad mutua, invitaciones a grupos que se aceptan y títulos libres; Torneos para cualquiera (trivia de Senda, propia o del sermón; Nombres por letra validado con 1.421 nombres bíblicos; en vivo); «La buena noticia, de principio a fin» como primera lección de todos; Zacarías (los doce completos, 458 lecciones); banco 37 (17 preguntas de imagen y 15 edificantes, 2.246); planes de 3 meses sin anual; anuncios con medida; el texto del PDF en lugar del PDF; un agujero de seguridad cerrado (nadie se marca admin); 103 pasos de la prueba de la base. Prueba 38: todo lo social listo para el lanzamiento y probado de punta a punta contra una base igual a la de Supabase (69 pasos: cuentas, amigos, duelos, grupos, eventos, encuestas, copas, torneos, trivia del sermón, salas y avisos), la sala en vivo, la trivia del sermón desde el PDF del líder (revisar y publicar), regalar Max o Premium desde la cuenta del fundador, la prueba de la base en GitHub antes de tocar la real y el despliegue automático de las funciones; la línea de capacidad y costo (gratis hasta ~5.700 personas por mes; USD 25 a 40 por mes hasta 100 mil) en la Consola, la limpieza de cada noche y la sala más liviana; 56 curiosidades («¿Sabías que…?», 2.214 preguntas); Nahúm y Malaquías jugables (451 lecciones); «Para tu vida» fuera, los ejercicios difíciles de la RV1909 en la PDT o la NBV, carteles que miden su texto y 73 visuales que no correspondían, fuera. Prueba 37: la trivia de 788 a 2.150 preguntas activas (bancos 9 a 35, meta por nivel del lanzamiento cumplida) y el primer banco en portugués (345); grupos con roles, calendario y torneos; eventos de Senda y del grupo en el calendario de todos; encuesta del día en vivo; la tabla de la copa; Amós, Miqueas y Samuel jugables (439 lecciones); «The Big Story», «El gran relato» entero en inglés; Expo y Firebase conectados (avisos al teléfono listos del lado de la app); R8 con prueba de humo en un emulador; 33 textos de pantallas y las citas fijas de la semana a los tres idiomas. Prueba 36: «En la frente» acostado, con letra grande, 124 personajes con tres pistas fáciles y torneo con tabla y desempate; «¿Quién es?» con 71 personajes, tablero más variado y preguntas reescritas; el duelo con un rival al azar en lugar del duelo contra Lany; el álbum con estrellas (los más importantes, más difíciles) y la página de Jesús «el centro»; menos texto y nada que suene a IA (lo esencial primero en las lecciones largas; 30 frases hechas fuera); Lany con ropa y objeto según la lección; Oseas y «Josué y Jueces» jugables (418 lecciones); trivia: banco 8 (788), 136 enunciados «Según…» y 129 preguntas que se delataban por el largo, reescritos; el Espadeo recuerda lo que ya viste; planes Gratis, Premium y Max con precios propuestos y topes de la trivia del sermón (8 por mes con Max). Prueba 35: la música de la trivia que no se corta y baja mientras se responde, seis temas más; la ilustración de Lany del fundador en la entrada; el álbum de personajes (9 páginas, 48 figuritas, sobres con Talentos, figurita dorada con una pregunta, la página de Jesús); la cuenta anónima con apodo y código, Amigos, Duelos por turnos jugados en el Espadeo, el token push y la guía de bienvenida de Lany en las cinco pestañas. Prueba 34: la Biblia sin ruido arriba; auditoría de textos de toda la app (2.139 hallazgos → 0); ruleta protagonista y control de música con temas que rotan; entrada rediseñada; «Camino a Navidad»; el esquema completo de «Juntos» para el lanzamiento. Prueba 33: «empezar por el principio y terminar por el final» en las 405 lecciones (regla del validador: ningún nombre preguntado antes de presentarse, nada fuera de orden, cada personaje con su ficha; 160 lecciones corregidas), la Travesía en el orden del fundador (13 áreas, sin estantes), Personajes desde Adán («De Adán a Noé» y «Los patriarcas» rehecha), la ruleta que se agarra, el tachado de a una en «¿Quién es?» con sus preguntas revisadas, la rueda de la hora sin trabas, el descanso a los 45 minutos, las copas en Inicio con su campana y el puntaje por acierto y velocidad, fichas de juego y la entrada con Lany de brazos cruzados, el nivel, la Almeida y la King James como referencia de los huecos en portugués e inglés, el peso medido (89,1 MB) y la carga al abrir reducida (72 módulos propios en lugar de 158), la línea de tiempo en la Consola con la Pascua 2027 y los sonidos elegidos el 22-10; prueba 32: la primera ruta en portugués, «A grande história» (47 lecciones, 9 capítulos, 65 niveles y 6 líneas de tiempo con citas textuales de la Bíblia Livre), el motor de contenido traducido (un archivo por ruta e idioma, español de respaldo, citas que se escriben solas en el idioma, validador contra la Biblia del idioma), la prueba de arranque dentro del repositorio y antes de cada APK, y tres misiones más de «Vivir la historia» (José, Elías en el Carmelo, el ciego de Juan 9: 13 misiones hasta el 11-01-2027, cinco láminas nuevas); prueba 31: la app no se cierra en silencio (guardia: si algo falla al cargar, al dibujar o en segundo plano, muestra el detalle para copiar, «Reintentar» y «Borrar lo guardado»; traducciones y tipos de evento guardados que no revientan; «Último fallo registrado» en Ajustes), las 21 cartas jugables (2 Corintios, Gálatas, Efesios, Filipenses, Colosenses y 1 y 2 Tesalonicenses: 25 lecciones; «Las cartas» con 15 secciones y 93 lecciones; la Travesía en 377); prueba 30: Romanos y 1 Corintios jugables (352 lecciones), la interfaz entera en portugués e inglés (1.312 claves; las fechas, el saludo y la voz que lee según el idioma), Gedeón, Naamán y Pedro y Cornelio en «Vivir la historia» (10 misiones, seis láminas nuevas), 350 de 352 lecciones con visual y seis diagramas nuevos; prueba 29: la regla de los libros bien dicha (se usan para entender; nunca se replica ni se copia), el ejemplar de la 1960 explicado (nada depende de él), «Misiones de hoy» sin claves crudas, Hebreos y 2 Pedro jugables (331 lecciones), la historia de la Iglesia en una línea (26 momentos con fuente) y 188 lecciones con visual en la portada, los siete juegos y los carteles de Lany en portugués e inglés (579 claves); prueba 28: el desmayo y el patatús de Lany rehechos de cero (mano a la sien, mareo, rodillas que ceden, brazos que llegan tarde y quedan flojos), el festejo de pieza en una sola pantalla, la trivia sin paréntesis de la RV1909 (28 preguntas; el pasaje se abre en la versión libre que trae la palabra de hoy, 19 versículos forzados), Rode, Gayo, Gabaón, Malta y la reina de Sabá con la grafía de hoy, Santiago y 1 Pedro jugables (319 lecciones), Ajustes y la lección por dentro en portugués e inglés (175 cadenas); prueba 27: la espada bien agarrada y Lany con la armadura entera al ganar todo, la bienvenida sin el paso de la Biblia y sin avance automático, 1 y 2 Timoteo jugables (307 lecciones), banco 7 de trivia (728), el templo de Salomón y la estatua de Daniel como diagramas, la línea de los imperios, 144 lecciones con visual, la línea de tiempo unificada, más interfaz en portugués e inglés; prueba 26: el tachado automático en «¿Quién es?», Lany con vida en reposo, banco 6 de trivia (686), Tito jugable (295 lecciones), la Biblia de tu iglesia en la bienvenida, portugués e inglés en Inicio y Jugar; prueba 25: Lany cae de verdad (desmayo y patatús con anticipación, tambaleo, caída, impacto, y respira en el piso) y la versión que mejor se lee en cada versículo (1.223 versículos en la PDT, la NBV o la BES, con chips); prueba 24: palabras de hoy, nombres de hoy, versículos clave; prueba 23: blindaje legal (música de Kevin MacLeod en lugar de Mixkit, Lany v4, yunque en la ruleta, «Quién fue quién», créditos completos, docs/LEGAL.md) y versiones sin confusión (fila de versión en cada pasaje y «Las versiones, en una pantalla»); material de la ficha de Play); sprint 2 desde el 26-10"
