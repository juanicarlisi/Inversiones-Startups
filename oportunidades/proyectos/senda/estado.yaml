# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - id: probar12
    que: "Probar el APK prueba 12"
    por_que: "El «+» en el margen de cada versículo, Lany guía en la Travesía (lección y camino) y la travesía «Los 66 libros» con «Sobre este libro» en el «+»"
    costo: 0
    cuando: "Esta semana"
    tiempo: "30 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-12 y tocá senda-prueba-12.apk (se instala encima)."
      - "Biblia: leé de corrido y tocá el «+» del margen de un versículo. Arriba de la hoja, tocá «Sobre …» para ver quién escribió el libro y un versículo para recordar."
      - "Travesía: mirá a Lany en el camino (tocala y tocá un nivel). Hacé una lección: escuchá la pregunta con el parlante del globo, acertá varias seguidas y errá una a propósito."
      - "Travesía → «La Travesía completa» → De memoria → «Los 66 libros»: hacé la primera lección."
      - "Contame qué cambiarías, sobre todo de Lany."
  - id: rvr1960
    que: "Enviar el pedido de la RVR1960 a la Sociedad Bíblica Argentina"
    por_que: "Es la vía más corta hacia la RVR1960 completa en Senda: su propia política considera comercial solo lo que se vende, y Senda es gratis"
    costo: 0
    cuando: "Esta semana"
    tiempo: "5 min"
    pasos:
      - "Abrí la pestaña Licencias de la Consola, tarjeta «Sociedad Bíblica Argentina»: el correo está listo para Gmail (desde appsenda.ok@gmail.com)."
      - "Si para el 19-10 ABS no respondió, mandá también el recordatorio (tarjeta «American Bible Society — recordatorio»)."
      - "Cuando respondan, pegá la respuesta en la nota de la tarjeta y avisame."
  - id: lani_final
    que: "Decidir la Lany final: 3D o 2D"
    por_que: "Define si la línea de USD 1.200 del animador de Rive pasa a un artista 3D (capítulo 16, §3b)"
    costo: 0
    cuando: "Noviembre"
    tiempo: "—"
  - id: licencias2
    que: "Licencias: esperar las respuestas (los formularios, más adelante)"
    por_que: "Ya enviaste los dos correos importantes; Biblica y Lockman conviene pedirlos después del lanzamiento"
    costo: 0
    cuando: "Cuando respondan"
    tiempo: "—"
    pasos:
      - "Cuando llegue una respuesta a appsenda.ok@gmail.com, pegala en la nota de su tarjeta (pestaña Licencias) y avisame: preparo la contestación."
      - "Biblica (NVI): no licencia apps en desarrollo ni a personas; se pide con la empresa y la app publicada (los campos ya están listos en su tarjeta)."
      - "Lockman (LBLA): pide una dirección postal. Si querés hacerlo antes, decidí si usar una casilla de correo (tiene costo) o tu dirección."
  - id: token
    que: "Opcional: cambiar el token de Supabase por uno que venza en un año"
    por_que: "El que creaste no vence y tiene todos los permisos: funciona, pero conviene acotarlo"
    costo: 0
    cuando: "Cuando quieras (no es urgente)"
    tiempo: "5 min"
