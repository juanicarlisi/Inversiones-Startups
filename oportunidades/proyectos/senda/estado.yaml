  - id: espadeo
    nombre: Espadeo (Jugar)
    peso: 16
    avance: 95
    hecho:
      - "La trivia en los tres idiomas y revisada entera (prueba 40, con los créditos de la API): 2.136 preguntas en portugués y 2.119 en inglés, traducidas por lotes de Claude y filtradas por el validador (la clave se lee en las dos Biblias del idioma); una segunda lectura de las 2.282 en español contra la RV1909 marcó 117 y 81 se corrigieron a mano (incorrectas que también eran verdad, enunciados ambiguos, palabras de la RV1909); ~USD 48 de los USD 200"
      - "El stock que pediste (prueba 37, «siento que se va a quedar corto»): de 788 a 2.150 preguntas activas en 27 bancos (9 a 35), cada una sobre un versículo que ningún banco usaba y revisada contra la RV1909; la meta se cuenta por nivel (los que más juegan agotan los extremos): 580 fáciles, 523 medias, 412 difíciles, 542 muy difíciles y 93 de oro, por encima de la meta del lanzamiento (2.000); 4.000 para Pascua; el taller común de bancos controla cita, largo, versículo repetido y que la clave esté en el versículo; entre «» va solo la Biblia (490 citas revisadas); docs/SUSCRIPCIONES.md §4"
      - "La trivia en portugués (prueba 37): primer banco de 345 preguntas (56 a 58 por pieza) con la Bíblia Livre; una pieza se juega en portugués recién con 40 traducidas o más (nunca se mezclan idiomas en una pieza); copas y torneos usan los mismos ids para todos; el validador revisa largo de la correcta, citas, «» textuales y que la palabra clave esté en la Bíblia Livre y en la Almeida; los comodines (Luz, Tiempo, Doble…) ya no salen en español"
      - "La trivia más pareja y más lindas las preguntas (prueba 36, «están re deficientes»): banco 8 (60 nuevas, 788 en total); 136 enunciados «Según Libro N:N…» reescritos como se dicen en voz alta; 129 preguntas donde la correcta se delataba por el largo, rehechas (la correcta dice lo esencial con las palabras del texto; las incorrectas, del mismo largo, creíbles y nunca verdad a medias); 20 enunciados sin la cita adentro"
      - "El Espadeo recuerda lo que ya viste (prueba 36): antes recordaba solo las últimas 18 y se olvidaba al cerrar; ahora salen primero las que nunca viste de tu nivel, después las nuevas de un nivel vecino y, al final, las vistas hace más tiempo (simulación: con 1.500 preguntas, quien juega 30 por día no repite en un mes)"
      - "El duelo con un rival al azar en lugar del duelo contra Lany (prueba 36, pedido del fundador): se juega el primer turno enseguida mientras la base busca rival"
      - "«En la frente» (prueba 36): acostado (la pantalla horizontal, como va en la frente), letra grande, 124 personajes con tres pistas fáciles y verificadas, y torneo con nombres, rondas, tiempo, tabla y desempate de 30 segundos al final"
      - "«¿Quién es?» (prueba 36): 71 personajes (30 nuevos, de Adán a Silas, cada «sí» con su versículo), tablero que deja para el final a los que salieron en las dos últimas partidas y no repite el secreto, las 43 preguntas cortas y como se dicen en voz alta, y el final con el personaje y su versículo (el repaso, plegado)"
      - "La música que no se corta (prueba 35, pedido del fundador): el motor de sonido apagaba la voz más vieja cuando se llenaban las 36 voces, y la más vieja era el tema de fondo (los clics de la ruleta lo sacaban); ahora el fondo nunca es víctima; mientras se lee y responde la música baja al 45 % (nunca se apaga si la persona no la apaga); seis temas más del estilo de «Funky Chunk»: Funkorama, Cut and Dry, Funk Game Loop, Fretless, Rollin at 5 y Hidden Agenda (Kevin MacLeod, CC BY 4.0, con crédito); el Espadeo rota diez temas"
      - "Duelos con personas por turnos (prueba 35; docs/DUELOS.md): pantalla Duelos (desafiar a un amigo, rival al azar, crear un código para compartir, entrar con código; «Te toca» primero, en curso, terminados, horas que quedan, piezas de los dos); el turno se juega en el Espadeo de siempre con las piezas de ambos (sin pregunta de oro: en el duelo todo fallo pasa el turno) y va entero a la base en un pedido idempotente que corrige contra preguntas_clave (720, migración generada); sin señal queda en el teléfono y se manda después; empezar un duelo usa una vida, jugar el turno no; botón «Duelos con amigos» en el inicio del Espadeo"
      - "El álbum de personajes (prueba 35; aprobado el 24-10, docs/ECONOMIA.md §3): 9 páginas (Los primeros, Los patriarcas, El Éxodo y la tierra, Jueces y Rut, Reyes y profetas de Israel, Profetas y exilio, Jesús, Los Evangelios, Hechos y las cartas) y 48 figuritas con retrato; el primer sobre de cada página es gratis y los demás cuestan 40 Talentos (nunca se venden); nunca sale una repetida (el azar solo decide el orden); al conseguir un personaje se abre su ficha completa con sus citas (las 24 fichas de la Travesía; para los demás, lo que la Biblia dice de ellos desde «¿Quién es?»); la figurita queda dorada respondiendo bien una pregunta sobre el personaje (la correcta nunca se delata por el largo; la respuesta se muestra con su cita, se acierte o no); Jesús no es una figurita: la página central con Juan 5:39; entradas desde Jugar y Ajustes; la hoja inferior ya no puede ser más alta que la pantalla"
