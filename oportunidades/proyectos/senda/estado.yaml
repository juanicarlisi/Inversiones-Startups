# Estado del proyecto Senda: la fuente de la pestaña «Proyecto» de la Consola de Senda (senda-app/scripts/consola.py).
# Lo actualiza Claude al cerrar cada sesión de trabajo. «avance» = % del alcance del MVP del 18-12-2026 en esa área (ESTIMACIÓN
# de Claude, criterio: funciona en la app de prueba y pasó por la vista previa; no cuenta lo que está solo en el proyecto).
# peso = cuánto pesa el área en el avance total del MVP.
actualizado: 2026-10-06
version_app: "0.5 · prueba 5"
fase: "F2 MVP «Primera luz»: sprint 1 y adelantos del 2 y del 4 (prueba 5); sprint 2 desde el 26-10"
lanzamiento: 2026-12-18
proximo_hito: {fecha: 2026-11-15, que: "Cuenta de Google Play para llegar a la prueba cerrada (12 testers × 14 días)"}

areas:
  - id: biblia
    nombre: Biblia
    peso: 16
    avance: 86
    hecho:
      - "Sin trabas ni cortes (prueba 5): las hojas vecinas quedan precargadas, respeta la letra del sistema dentro de la grilla y «Terminé» entra debajo de un capítulo corto"
      - "Planes de lectura de corrido: «Terminé · sigue Salmos 2», pasa solo al siguiente y muestra «día 1 · 2 de 8»"
      - "Lector como Biblia impresa: renglones parejos, justificado con guiones, capitular, versalitas, una o dos columnas, hojas llenas hasta abajo (versículos partidos entre hojas), titulillo, texto del dorso que se transparenta"
      - "Papel biblia (fibra finísima, luz del libro, lomo y canto de hojas por leer) y la hoja que se dobla siguiendo el dedo"
      - "Planes de lectura (5): Salmos 30, Proverbios 31, Evangelios 40, Nuevo Testamento 90 y la Biblia en un año"
      - "4 versiones libres (RV1909, NBV, PDT, BES) y enlace a la RVR1960 en Bible.com"
      - "Búsqueda en toda la Biblia, cintas, resaltadores que pintan, notas, varios versículos a la vez"
      - "Lectura en voz alta con la mejor voz del teléfono y selector de voz"
      - "Invitación a orar antes de leer"
    falta:
      - "Licencias de las versiones protestantes que más se leen (RVR1960, NTV, NVI, LBLA/NBLA, DHH, TLA)"
      - "Voz neuronal grabada por capítulo (en lugar de la voz del teléfono)"
      - "Estudios bíblicos y el «+» (notas, referencias, mapas): v1"
    siguiente: "Probar la prueba 5 en el teléfono (Salmos desde el plan, letra grande, pasar hojas rápido)"
  - id: travesia
    nombre: Travesía
    peso: 18
    avance: 15
    hecho:
