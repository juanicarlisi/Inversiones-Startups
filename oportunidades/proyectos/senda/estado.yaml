pendientes:
  - id: probar20
    que: "Probar el APK prueba 20"
    por_que: "Los textos corregidos y el glosario, la historia de la lección nueva, las reacciones de Lany al errar, «¿Quién es?» contra alguien, «Vivir la historia» en grupo, «Nombres por letra», la fiesta de la pieza, el evento en tres pasos y el widget del versículo"
    costo: 0
    cuando: "Cuando puedas"
    tiempo: "45 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-20 y tocá senda-prueba-20.apk (se instala encima)."
      - "Borrá los datos de la app (o desinstalá antes) para ver la bienvenida: elegí una opción y tocá Siguiente (ya no salta dos pasos); marcá y desmarcá áreas."
      - "Travesía → El evangelio → «Dios se da a conocer»: mirá la historia nueva (pasos, citas en color, negritas) y tocá una palabra resaltada o una ficha de «Palabras»."
      - "Fallá una pregunta a propósito dos o tres veces: Lany se desmaya, se tapa la cara o se marea."
      - "Jugar → «¿Quién es?» → «Contra alguien», con otra persona. Jugar → «Vivir la historia» → «En grupo» (3 jugadores). Jugar → «Nombres por letra»."
      - "Jugar → Espadeo hasta ganar una pieza: la fiesta nueva. Inicio → calendario → «+»: el evento en tres pasos."
      - "Mantené apretada la pantalla de inicio del teléfono → Widgets → Senda → «Versículo del día»."
      - "Contame qué te gustó y qué cambiarías (si podés, con captura)."
