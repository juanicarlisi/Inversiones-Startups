# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - id: probar9
    que: "Probar el APK prueba 9"
    por_que: "La Biblia directa y más rápida, las cinco rutas nuevas con «¿Sabías que…?» y «Para tu vida», y lo de la prueba 8 (Lani 3D, bienvenida, duelo)"
    costo: 0
    cuando: "Esta semana"
    tiempo: "40 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-9 y tocá senda-prueba-9.apk (se instala encima)."
      - "Biblia: abrila desde Inicio (ya no aparece nada antes). Tocá el borde derecho varias veces seguidas: ¿pasan todas las hojas? Marcá un versículo y resaltalo: ¿responde al instante?"
      - "Travesía → tocá la ruta de arriba → «La Travesía completa»: está el área nueva «El plan de Dios». Elegí «El Mesías prometido» y hacé la primera lección."
      - "Al responder, mirá el «¿Sabías que…?»; al terminar, «Para tu vida». ¿Te dejan algo? ¿Hay algo para corregir?"
      - "Probá también «Lo esencial de la fe» (Lo que creemos) y «Leer con contexto» (Cómo leer la Biblia)."
      - "Lo de la prueba 8 sigue: Lani en 3D en la fiesta, la bienvenida (Ajustes → Ver la bienvenida otra vez) y el duelo contra Lani."
      - "Contame qué cambiarías y mandame el material que tengas para sumar."
  - id: lani_final
    que: "Decidir la Lani final: 3D o 2D"
    por_que: "Define si la línea de USD 1.200 del animador de Rive pasa a un artista 3D (capítulo 16, §3b)"
    costo: 0
    cuando: "Noviembre"
    tiempo: "—"
  - id: licencias2
    que: "Licencias: esperar las respuestas (los formularios, más adelante)"
    por_que: "Ya enviaste los dos correos importantes; Biblica y Lockman conviene pedirlos después del lanzamiento"
    costo: 0
    cuando: "Cuando respondan"
    tiempo: "—"
    pasos:
      - "Cuando llegue una respuesta a appsenda.ok@gmail.com, pegala en la nota de su tarjeta (pestaña Licencias) y avisame: preparo la contestación."
      - "Biblica (NVI): no licencia apps en desarrollo ni a personas; se pide con la empresa y la app publicada (los campos ya están listos en su tarjeta)."
      - "Lockman (LBLA): pide una dirección postal. Si querés hacerlo antes, decidí si usar una casilla de correo (tiene costo) o tu dirección."
  - id: token
    que: "Opcional: cambiar el token de Supabase por uno que venza en un año"
    por_que: "El que creaste no vence y tiene todos los permisos: funciona, pero conviene acotarlo"
    costo: 0
    cuando: "Cuando quieras (no es urgente)"
    tiempo: "5 min"
    pasos:
      - "Entrá a https://supabase.com/dashboard/account/tokens → «Generate new token», nombre «github-senda-2027»."
      - "En el vencimiento elegí una fecha a un año. Si aparece la opción de permisos (está en prueba y no todas las cuentas la tienen), dejá solo el proyecto «senda»."
      - "Copiá el token y en https://github.com/juanicarlisi/senda-app/settings/secrets/actions editá SUPABASE_ACCESS_TOKEN (Update) y pegalo."
      - "Volvé a la lista de tokens de Supabase y borrá el viejo («Revoke»)."
      - "Avisame y corro la prueba de conexión."
  - {id: revisores, que: "Conseguir 2 revisores doctrinales y 12 testers con Android", por_que: "Hay 31 lecciones y 157 preguntas esperando revisión doctrinal para publicarse; y la prueba cerrada de Google Play pide 12 testers", costo: 0, cuando: "Revisores antes del 26-10; testers a mediados de noviembre", tiempo: "Mensajes"}
