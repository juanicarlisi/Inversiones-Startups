# Lo que necesita del fundador (la Consola permite marcarlo como hecho).
pendientes:
  - id: probar15
    que: "Probar el APK prueba 15"
    por_que: "Lany adulto y vestido según el área, la armadura que se pone, 71 preguntas nuevas con su «¿Sabías que…?», la Biblia con la ortografía de hoy, «El evangelio» con la doctrina del estudio, «Ubicar en el mapa» y la música de inicio"
    costo: 0
    cuando: "Esta semana"
    tiempo: "40 min"
    pasos:
      - "En el teléfono, abrí https://github.com/juanicarlisi/senda-app/releases/tag/prueba-15 y tocá senda-prueba-15.apk (se instala encima)."
      - "Al abrir, escuchá la música nueva («Salón»)."
      - "Travesía: mirá a Lany en el camino; cambiá a otra área (por ejemplo, Pablo o Historia) y fijate que cambia la ropa. Abrí una lección con lecturas: Lany está leyendo."
      - "Jugar → duelo contra Lany: cuando ganes una pieza, mirá a Tu Lany ponérsela. En el turno de Lany, ella se pone las suyas. Después de cada respuesta, leé el «¿Sabías que…?» cuando aparezca."
      - "Biblia → Génesis 1: «En el principio creó Dios…», con los nombres y acentos de hoy."
      - "Travesía → El evangelio: mirá la lección nueva «Espíritu, alma y cuerpo» y las demás con la doctrina del estudio."
      - "Inicio → «+» (nuevo evento): en «Dónde» escribí una dirección o el nombre de un lugar y tocá «Ubicar en el mapa»; elegí el lugar de la lista."
      - "Contame qué cambiarías de Lany (ropa, posturas, tamaño) y de lo demás."
  - id: licencias_decidir
    que: "Decidir el camino de las licencias y la figura legal"
    por_que: "Recomendación: lanzar con las versiones libres y la RVR1960, NVI y NTV en un toque; la RVR1960 completa se pide por la Digital Bible Library cuando Senda tenga una figura legal. Como Senda tiene ingresos, el titular conviene que sea una SAS de Senda (rápida y barata); el ministerio puede ser el aliado, con su propia figura si la quiere (capítulo 39 §4)"
    costo: 0
    cuando: "Esta semana"
    tiempo: "15 min"
    pasos:
      - "Leé el capítulo 39 §4 del proyecto (o el resumen de mi mensaje)."
      - "Decime si vamos con la SAS cuando se cumpla la regla de corte o preferís otro camino (por ejemplo, Senda sin ingresos, como ministerio)."
  - id: apibible
    que: "Mandar el seguimiento a API.Bible (en el mismo hilo del 16-10)"
    por_que: "Saber quién puede pedir la RVR1960 por la Digital Bible Library (¿una SAS nueva? ¿antes de lanzar?), cuánto cuesta por tramo, si los ejercicios de completar cuentan como «alterar el texto» y si se puede escuchar con la voz del teléfono"
    costo: 0
    cuando: "Esta semana"
    tiempo: "5 min"
    pasos:
      - "Abrí la pestaña Licencias de la Consola, tarjeta «API.Bible / Digital Bible Library — seguimiento por la RVR1960»: el texto está listo (en inglés)."
      - "Mejor respondé en el mismo hilo del correo de DJ Chuang del 16-10, así tienen el contexto."
      - "Cuando respondan, pegá la respuesta en la nota de la tarjeta y avisame."
  - id: rvr1960
    que: "Enviar el pedido de la RVR1960 a la Sociedad Bíblica Argentina"
    por_que: "Su política cuenta como comercial lo que se vende; el borrador cuenta con transparencia que habrá anuncios y una suscripción opcional, así que deciden ellos"
    costo: 0
    cuando: "Esta semana"
    tiempo: "5 min"
    pasos:
      - "Abrí la pestaña Licencias de la Consola, tarjeta «Sociedad Bíblica Argentina»: el correo está listo para Gmail (desde appsenda.ok@gmail.com)."
      - "Si para el 19-10 ABS no respondió, mandá también el recordatorio (tarjeta «American Bible Society — recordatorio»)."
      - "Cuando respondan, pegá la respuesta en la nota de la tarjeta y avisame."
  - id: libros3
    que: "Mirar cómo clasifiqué los libros de LIBROS-REFERENCIA3"
    por_que: "Los separé solo por el nombre de cada archivo, sin abrir ninguno: 470 de autores protestantes reconocidos (se pueden usar para entender), 52 protestantes con reservas (no los uso hasta que confirmes) y el resto no se abre (no protestantes, dudosos, sin autor o autor que no pude verificar). Si un archivo tiene mal el autor, lo corrijo"
    costo: 0
    cuando: "Cuando puedas"
    tiempo: "10 min"
    pasos:
      - "Abrí senda-app/docs/LIBROS_REFERENCIA3.md (repositorio privado)."
      - "Decime qué hago con los 52 «con reservas» y si algún autor quedó mal."
  - id: musica15
    que: "Elegir la música de inicio (o dejar «Salón»)"
    por_que: "La nueva es composición propia; en la Consola están una variante y tres temas de Kevin MacLeod (licencia CC BY 4.0: si elegís uno, va con su atribución en Créditos)"
    costo: 0
    cuando: "Cuando quieras"
    tiempo: "5 min"
    pasos:
      - "Consola → sala de sonidos → «Bienvenida»: escuchá las opciones y marcá la que más te guste."
