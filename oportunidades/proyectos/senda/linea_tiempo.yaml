# Línea de tiempo de Senda (prueba 33, pedido del fundador: «en la consola, en alguna parte, una línea de tiempo para ver cómo
# venimos y próximos»). La lee la Consola (senda-app/scripts/consola.py, pestaña «Proyecto»). Se actualiza al cerrar cada sesión,
# igual que estado.yaml: lo hecho suma la prueba nueva (fecha = la del APK publicado en GitHub Releases) y lo que viene se corre si
# cambia. Una línea por prueba, con lo más importante en palabras llanas.

hecho:
  - {fecha: 2026-09-28, que: "Nace el proyecto", detalle: "La suite cristiana con foco protestante: Senda, la Biblia que se juega."}
  - {fecha: 2026-10-05, que: "Arranca el desarrollo · pruebas 1 a 4", detalle: "El repositorio de la app, el primer APK, temas, Ajustes, el lector tipo Biblia de papel, sonidos propios, la voz que lee y la Consola."}
  - {fecha: 2026-10-06, que: "Pruebas 5 a 7", detalle: "Calendario con avisos, la ruleta y el festejo de pieza, la Travesía con su mapa de rutas y la base para millones de personas."}
  - {fecha: 2026-10-11, que: "Pruebas 8 y 9", detalle: "Lany en 3D para la fiesta, el diagrama de toda la app y la regla «todo enseña y edifica»."}
  - {fecha: 2026-10-12, que: "Pruebas 10 y 11", detalle: "La misión nueva, el camino tipo Duolingo, la bienvenida, la trivia de la iglesia y las travesías con línea clara."}
  - {fecha: 2026-10-13, que: "Prueba 12", detalle: "Lany (antes Lani) como guía de la Travesía, el «+» en cada versículo y «Los 66 libros»."}
  - {fecha: 2026-10-16, que: "Pruebas 13 a 15", detalle: "Lany con volumen y sin habla, «El evangelio» con el ministerio aliado, la ortografía de hoy y Lany adulta con su armadura."}
  - {fecha: 2026-10-17, que: "Pruebas 16 a 18", detalle: "Lany v3, el logo «la puerta abierta», una guía por libro, nada que se preste a confusión, las ideas votadas y cómo cobrar."}
  - {fecha: 2026-10-18, que: "Prueba 19", detalle: "Color más vivo, «¿Quién es?» con pregunta libre, «Vivir la historia» y la música con licencia para apps."}
  - {fecha: 2026-10-19, que: "Pruebas 20 a 25", detalle: "Textos claros con glosario, juegos con otros, la misión de la semana, licencias, mapas y diagramas, blindaje legal, versiones sin confusión y Lany que cae con gracia."}
  - {fecha: 2026-10-20, que: "Pruebas 26 a 30", detalle: "El tachado de «¿Quién es?», la armadura completa, las cartas jugables, la regla de los libros y la interfaz entera en portugués e inglés."}
  - {fecha: 2026-10-21, que: "Pruebas 31 y 32", detalle: "La app que no se cierra en silencio, las 21 cartas, «A grande história» en portugués y la prueba de arranque antes de cada APK."}
  - {fecha: 2026-10-30, que: "Prueba 39", detalle: "Los duelos llegan y se ven en Inicio («Te esperan»), arrancan directo y muestran el nombre del rival; Lany festeja la victoria con cuatro bailes nuevos; la ruleta otra vez se agarra; Torneos para cualquiera (trivia, Nombres por letra validado con 1.421 nombres bíblicos, en vivo); alias único e invitaciones que se aceptan; «La buena noticia» como primera lección; Zacarías; 32 preguntas nuevas, 17 con imagen."}
  - {fecha: 2026-10-30, que: "Prueba 40", detalle: "Lany en Rive nativo con la herramienta oficial (Rive CLI): huesos, mallas que se doblan en codo y rodilla, IK; agarra de verdad la espada, el escudo y el casco; presentación con brazos cruzados y pose heroica; el director de Lany; 28 preguntas con láminas de Doré (2.274); lotes de Claude listos (falta la clave)."}
  - {fecha: 2026-10-25, que: "Prueba 38", detalle: "Todo lo social listo para el lanzamiento y probado contra la base (sala en vivo, trivia del sermón desde el PDF, regalar Max), cuánta gente aguanta la app y cuánto cuesta crecer, 56 curiosidades en la trivia, Nahúm y Malaquías, y las lecciones sin «Para tu vida», con textos y visuales revisados."}
  - {fecha: 2026-10-25, que: "Prueba 37", detalle: "La trivia de 788 a 2.150 preguntas (y el primer banco en portugués), grupos con roles y calendario, eventos y encuesta para todos, la tabla de la copa y los torneos, Amós, Miqueas y Samuel, «The Big Story» en inglés y los avisos al teléfono conectados (Expo y Firebase)."}
  - {fecha: 2026-10-24, que: "Prueba 36", detalle: "«En la frente» acostado y con torneo, «¿Quién es?» con 71 personajes, el duelo al azar en lugar de Lany, lecciones con lo esencial primero, Lany vestida según la lección, Oseas y «Josué y Jueces», la trivia con 129 preguntas rehechas y que recuerda lo que ya viste, y la propuesta de planes y precios (Gratis, Premium, Max)."}
  - {fecha: 2026-10-24, que: "Prueba 35", detalle: "La música de la trivia que ya no se corta (y seis temas más), tu ilustración de Lany en la entrada, el álbum de personajes (48 figuritas, sobres con Talentos, figurita dorada, la página de Jesús), la cuenta anónima con apodo y código, Amigos, Duelos por turnos jugados en el Espadeo y la guía de bienvenida de Lany."}
  - {fecha: 2026-10-24, que: "Prueba 34", detalle: "La Biblia sin ruido arriba, los textos que se pisaban corregidos en toda la app, la ruleta protagonista con el control de música, la entrada nueva, «Camino a Navidad» y el esquema completo de «Juntos» (todas las conexiones del lanzamiento, listas en la base)."}
  - {fecha: 2026-10-23, que: "Prueba 33", detalle: "La Travesía en tu orden, Personajes desde Adán, «empezar por el principio» en todas las rutas, copas con puntaje por velocidad, descanso a los 45 minutos, la entrada con Lany, el nivel y esta línea de tiempo."}

viene:
  - {fecha: 2026-11-07, que: "Prender lo social", detalle: "Cuatro pasos tuyos (cuentas anónimas sin captcha, la clave de Claude, marcarte administrador y regalar Max a los líderes piloto): todo lo social ya está probado contra una base igual a la de Supabase.", tuyo: true}
  - {fecha: 2026-11-07, que: "Prueba 41: los lotes y Lany completo", detalle: "Con la clave cargada, la traducción de la trivia al portugués y al inglés y la segunda revisión por lotes; coraza, cinturón y botas con agarre de verdad y la secuencia «armarse» entera; el repertorio nuevo de Lany sobre el rig; más trivia; lo que traigas del APK 40."}
  - {fecha: 2026-11-15, que: "Usar los créditos de Anthropic", detalle: "USD 200 que vencen el 22-11: revisión por lotes, traducciones y sermones reales (con tu OK, DEC-2026-10-30-2).", tuyo: true}
  - {fecha: 2026-11-14, que: "Prueba 41: las compras de Google Play", detalle: "Senda Premium y Senda Max por Google Play, verificadas en el servidor, con los planes y precios que decidas (capítulo 62 §8); guardar la cuenta con correo o Google y el progreso en la nube."}
  - {fecha: 2026-11-15, que: "Cuenta de Google Play", detalle: "La abrís vos (USD 25); con ella arranca la prueba cerrada: 12 personas durante 14 días.", tuyo: true}
  - {fecha: 2026-11-16, que: "Pruebas con personas", detalle: "La prueba cerrada en Play y el entorno de prueba para líderes; se corrige lo que aparezca."}
  - {fecha: 2027-02-15, que: "El monotributo", detalle: "Solo monotributo, sin SAS por ahora (DEC-2026-10-25-2): antes del primer cobro de AdMob (ESTIMACIÓN: febrero o marzo), con la caja en dólares y la factura E; la SAS, más adelante.", tuyo: true}
  - {fecha: 2026-11-29, que: "Camino a Navidad", detalle: "El desafío con fecha: las promesas sobre el Mesías y su cumplimiento, del 29 de noviembre a Navidad (hasta la prueba 33 se llamaba «Adviento»; se renombró el 24-10 para que no suene a adventista ni a católico)."}
  - {fecha: 2026-12-18, que: "Senda en las tiendas: el lanzamiento", detalle: "Google Play primero. Lo que sale ese día: la Biblia (RV1909 con escritura de hoy, PDT, BES, NBV; portugués e inglés), la Travesía (13 áreas, 458 lecciones con mapas, líneas de tiempo y diagramas), los siete juegos, torneos de cualquiera, las copas con tabla de todos, el calendario con los eventos de Senda y de tu grupo, el álbum de personajes, cuentas con apodo y código, amigos, duelos (amigo, azar, código) con push, grupos e iglesias con torneos, la encuesta del día, Senda Premium (sin anuncios) y Senda Max (salas en vivo y trivia del sermón; se cobran cuando esté la figura legal), la guía de bienvenida con Lany, «Camino a Navidad» en marcha y la Copa de Navidad al día siguiente."}
  - {fecha: 2026-12-19, que: "Copa de Navidad", detalle: "La primera copa de Senda: quince preguntas, las mismas para todos ese día; gana quien acierta más y, entre iguales, el más rápido."}
  - {fecha: 2027-01-08, que: "Primer Viernes de Espadeo", detalle: "La trivia semanal en vivo."}
  - {fecha: 2027-01-11, que: "Después del lanzamiento", detalle: "Lo de «Juntos» ya salió el 18-12; la traducción del contenido al portugués arranca ruta por ruta y se mide lo que la gente usa."}
  - {fecha: 2027-01-15, que: "Empezar el recorrido por Tierra Santa", detalle: "Se arma durante enero y febrero para tenerlo listo el 14 de marzo, una semana antes de Ramos."}
  - {fecha: 2027-03-21, que: "Pascua: recorrido por Tierra Santa", detalle: "El gran hito del año: la Semana Santa día por día, de Ramos a la Resurrección, con un mapa animado que recorre los lugares (Betania, Jerusalén, el templo, Getsemaní, el Gólgota, la tumba vacía, Emaús). Jesús no se dibuja: se ven los lugares y el texto.", destacado: true}
  - {fecha: 2027-04-03, que: "Copa de Pascua", detalle: "La copa de la Semana Santa."}
  - {fecha: 2027-04-12, que: "Arranca la Liga Apertura", detalle: "v2 «Liga»: ligas por iglesia y por país."}
  - {fecha: 2027-04-30, que: "Regla de corte", detalle: "Se mira si Senda crece como se esperaba y se decide cuánto más se invierte."}
  - {fecha: 2027-05-22, que: "Copa de Pentecostés", detalle: "La copa de la venida del Espíritu Santo."}
  - {fecha: 2027-12-15, que: "Tu año en Senda", detalle: "El resumen del año de cada persona, para compartir."}
