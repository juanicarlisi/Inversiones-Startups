# Línea de tiempo de Senda (prueba 33, pedido del fundador: «en la consola, en alguna parte, una línea de tiempo para ver cómo
# venimos y próximos»). La lee la Consola (senda-app/scripts/consola.py, pestaña «Proyecto»). Se actualiza al cerrar cada sesión,
# igual que estado.yaml: lo hecho suma la prueba nueva (fecha = la del APK publicado en GitHub Releases) y lo que viene se corre si
# cambia. Una línea por prueba, con lo más importante en palabras llanas.

hecho:
  - {fecha: 2026-09-28, que: "Nace el proyecto", detalle: "La suite cristiana con foco protestante: Senda, la Biblia que se juega."}
  - {fecha: 2026-10-05, que: "Arranca el desarrollo · pruebas 1 a 4", detalle: "El repositorio de la app, el primer APK, temas, Ajustes, el lector tipo Biblia de papel, sonidos propios, la voz que lee y la Consola."}
  - {fecha: 2026-10-06, que: "Pruebas 5 a 7", detalle: "Calendario con avisos, la ruleta y el festejo de pieza, la Travesía con su mapa de rutas y la base para millones de personas."}
  - {fecha: 2026-10-11, que: "Pruebas 8 y 9", detalle: "Lany en 3D para la fiesta, el diagrama de toda la app y la regla «todo enseña y edifica»."}
  - {fecha: 2026-10-12, que: "Pruebas 10 y 11", detalle: "La misión nueva, el camino tipo Duolingo, la bienvenida, la trivia de la iglesia y las travesías con línea clara."}
  - {fecha: 2026-10-13, que: "Prueba 12", detalle: "Lany (antes Lani) como guía de la Travesía, el «+» en cada versículo y «Los 66 libros»."}
  - {fecha: 2026-10-16, que: "Pruebas 13 a 15", detalle: "Lany con volumen y sin habla, «El evangelio» con el ministerio aliado, la ortografía de hoy y Lany adulta con su armadura."}
  - {fecha: 2026-10-17, que: "Pruebas 16 a 18", detalle: "Lany v3, el logo «la puerta abierta», una guía por libro, nada que se preste a confusión, las ideas votadas y cómo cobrar."}
  - {fecha: 2026-10-18, que: "Prueba 19", detalle: "Color más vivo, «¿Quién es?» con pregunta libre, «Vivir la historia» y la música con licencia para apps."}
  - {fecha: 2026-10-19, que: "Pruebas 20 a 25", detalle: "Textos claros con glosario, juegos con otros, la misión de la semana, licencias, mapas y diagramas, blindaje legal, versiones sin confusión y Lany que cae con gracia."}
  - {fecha: 2026-10-20, que: "Pruebas 26 a 30", detalle: "El tachado de «¿Quién es?», la armadura completa, las cartas jugables, la regla de los libros y la interfaz entera en portugués e inglés."}
  - {fecha: 2026-10-21, que: "Pruebas 31 y 32", detalle: "La app que no se cierra en silencio, las 21 cartas, «A grande história» en portugués y la prueba de arranque antes de cada APK."}
  - {fecha: 2026-10-23, que: "Prueba 33", detalle: "La Travesía en tu orden, Personajes desde Adán, «empezar por el principio» en todas las rutas, copas con puntaje por velocidad, descanso a los 45 minutos, la entrada con Lany, el nivel y esta línea de tiempo."}

viene:
