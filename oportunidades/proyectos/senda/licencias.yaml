# Licencias de Biblias protestantes para Senda: quién tiene los derechos, por dónde se pide y en qué está cada pedido.
# Fuente de la pestaña «Licencias» de la Consola (con botones que abren cada correo ya escrito en Gmail, desde el correo del
# proyecto appsenda.ok@gmail.com). Los textos están en borradores/. Nada se envía sin el OK del fundador (regla 8): el fundador
# los envía. Contactos verificados con buscador el 05-10-2026 (las páginas de los titulares están bloqueadas en el entorno de
# Claude; los correos de ABS y Tyndale aparecen en sus propias páginas de permisos según los resultados).
correo_proyecto: "appsenda.ok@gmail.com"
titulares:
  - id: sbu
    orden: 1
    titular: "American Bible Society (por las Sociedades Bíblicas Unidas)"
    versiones: ["RVR1960", "RVR1995", "RVC", "DHH", "TLA"]
    tipo: correo
    para: "licensing@americanbible.org"
    camino: "Pedido de licencia de ministerio o precio; alternativa inmediata: API.Bible (plan Pro USD 29 por mes + USD 10 por versión)"
    contacto: "licensing@americanbible.org · Copyrights Administrator, United Bible Societies, 1989 NW 88th Court, Miami, FL 33172"
    enlace: "https://bibles.com/pages/american-bible-society-rights-and-permissions"
    borrador: "2026-10-rvr1960-abs.md"
    idioma: "inglés"
    enviado: "2026-10-05"
    nota: "El más importante: la RVR1960 es la que lee la mayoría. Es marca registrada de SBU: solo con licencia."
  - id: tyndale
    orden: 2
    titular: "Tyndale House Publishers (Tyndale Español)"
    versiones: ["NTV"]
    tipo: correo
    para: "permissions@tyndale.com"
    camino: "Pedido de permiso por correo (también tienen formulario en tyndale.com/permissions/form)"
    contacto: "permissions@tyndale.com · +1 630 668 8300, interno 5023"
    enlace: "https://www.tyndale.com/permissions"
    borrador: "2026-10-ntv-tyndale.md"
    idioma: "inglés"
    enviado: "2026-10-05"
    nota: "Más de 500 versículos o uso comercial requiere permiso escrito."
  - id: biblica
    orden: 3
    titular: "Biblica, Inc."
    versiones: ["NVI"]
    tipo: formulario
    camino: "Formulario «Permission Request Form» de Biblica"
    contacto: "Formulario en biblica.com"
    enlace: "https://www.biblica.com/permission-request-form/"
    borrador: "2026-10-nvi-biblica.md"
    idioma: "inglés"
    nota: "Biblica ya nos deja usar la Nueva Biblia Viva (licencia abierta); el texto lo menciona."
    # Hallazgo del 06-10-2026 (búsqueda; biblica.com bloqueada en el entorno): Biblica no suele licenciar productos en desarrollo
    # y el texto completo solo se licencia a una persona jurídica registrada, con documentación.
    cuando: "Todavía no. Biblica no da licencias a apps que están en desarrollo y el texto completo solo se lo licencia a una empresa registrada (con papeles). Conviene mandarlo después del lanzamiento y cuando Senda tenga su empresa (o pedir la NVI por API.Bible, que es pago). Abajo quedan los datos listos para ese momento."
    campos:
      - ["Name", "Senda Team", "Cuando exista la empresa: el nombre del representante legal."]
      - ["Email Address", "appsenda.ok@gmail.com", ""]
      - ["Are you applying on behalf of a legal entity or as an individual?", "Legal entity", "Biblica solo licencia el texto completo a empresas: hasta que exista, no conviene mandarlo."]
      - ["Bible translation", "Nueva Versión Internacional (NVI), Spanish, 2022 edition", ""]
      - ["Format", "Digital – mobile app (Android and iOS)", ""]
      - ["Specific passages", "Full text, shown chapter by chapter inside the app's Bible reader", ""]
      - ["Percentage of product containing Bible text", "Bible reader: 100% of the NVI text; the app also includes quizzes and lessons written by us", ""]
      - ["Publisher name", "Senda", ""]
      - ["Publication date", "December 18, 2026 (public launch on Google Play)", "Si ya salió, poner la fecha real."]
      - ["Retail price", "Free download. Bible reading is always free and ad-free; optional subscription (Senda Max) for extra game features", ""]
      - ["Development cost", "Self-funded small team; under USD 5,000", "Estimación mía: lo revisás vos."]
      - ["Statement of faith", "We affirm the Apostles' Creed and the authority of Scripture as the inspired Word of God (evangelical, Protestant)", "Lo revisás vos antes de mandarlo."]
      - ["Product functions/features", "Paper-like Bible reader with highlights, notes and bookmarks; reading plans; audio (device text-to-speech); short Bible lessons; a Bible trivia game; a church and group calendar", ""]
      - ["What makes it unique or innovative", "Built for young Latin American Christians: a habit loop (daily light streak), Bible learning through play, and a reader that feels like a printed Bible", ""]
      - ["Do end users need to log in?", "No. Optional accounts only to sync progress", ""]
      - ["Ad space", "No ads while reading the Bible, ever. A short ad after some game rounds on the free plan", ""]
      - ["Subscription model", "Optional (Senda Max): no ads in games and extra game features. The Bible text is never behind a paywall", ""]
      - ["Other Bible translations", "Reina-Valera 1909 (public domain), Biblica Open Nueva Biblia Viva (CC BY-SA), Biblia en Español Sencillo, Palabra de Dios para Todos; RVR1960 requested from ABS", ""]
      - ["Distribution status", "In closed testing; public launch planned for December 2026 in Latin America", ""]
  - id: lockman
    orden: 4
    titular: "The Lockman Foundation"
    versiones: ["LBLA", "NBLA"]
    tipo: formulario
    camino: "Formulario «Permission to Quote Request Form» de lockman.org"
    contacto: "Formulario en lockman.org · PO Box 2279, La Habra, CA 90631 · +1 714 879 3055"
    enlace: "https://www.lockman.org/?p=3"
    borrador: "2026-10-lbla-lockman.md"
    idioma: "inglés"
    nota: ""
    # Hallazgo del 06-10-2026 (búsqueda; lockman.org bloqueada en el entorno): para dar el permiso piden una dirección postal.
    cuando: "Pide una dirección postal (es obligatoria para dar el permiso), y eso choca con mantenerte anónimo. Opciones: una casilla de correo (Correo Argentino la alquila; cuesta, así que lo decidís vos), tu dirección, o dejarlo para después del lanzamiento, cuando Senda tenga empresa. Mi recomendación: esperar; la LBLA no es urgente (ya tenemos RV1909 y tres versiones libres, y la RVR1960 está pedida)."
    campos:
      - ["Your Name (required)", "Senda Team", "Si lo mandás a título personal, tu nombre."]
      - ["If for a company, the company's name", "Senda", ""]
      - ["Type of company", "Sole proprietor (company in formation)", "Cuando exista la empresa, su tipo."]
      - ["Street Address / City / State / Country / ZIP", "(la casilla de correo o la dirección que elijas)", "Obligatoria para el permiso."]
      - ["Your Email (required)", "appsenda.ok@gmail.com", ""]
      - ["Website / Telephone", "(vacío por ahora)", ""]
      - ["Title of project", "Senda – Bible reading and Bible learning app", ""]
      - ["Which Bible translation(s) do you wish to quote?", "La Biblia de las Américas (LBLA) and Nueva Biblia de las Américas (NBLA)", ""]
      - ["Which format(s) will be produced?", "Mobile device (Android and iOS app)", ""]
      - ["Who are the general recipients of your project?", "Public: young Christians (13+) in Latin America, churches and youth groups", ""]
      - ["Percentage of verses quoted", "Full text inside the app's Bible reader (we are requesting an electronic license)", ""]
      - ["Is this for your personal use only? Will this work be distributed for free?", "Not personal. Free download; Bible reading always free and ad-free; optional subscription for game features", ""]
      - ["Will it be published? Who will be the publisher?", "Yes, on Google Play and the App Store; publisher: Senda", ""]
      - ["Special request or additional information", "(pegar el texto del pedido con el botón «Copiar el texto de la descripción»)", ""]
