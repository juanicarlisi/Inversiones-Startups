# El mapa de toda la app en una hoja (MECE). Pedido del fundador del 11-10-2026: «que al primer vistazo, eso que en la app parece
# infinito, se pueda ver y entender cómo encaja cada cosa y dónde». Lo usan el PDF del proyecto (hoja A3 del capítulo 6) y la Consola.
#
# Tres niveles que no se pisan y lo cubren todo:
#   A · Lo que usa la persona: las cinco pestañas y el perfil. Cada función vive en un solo lugar.
#   B · Lo que la hace andar por debajo: sistemas que comparten todas las pestañas.
#   C · Lo que la sostiene: operación, negocio, legal y lanzamiento.
# Cada ítem es [texto, estado]. Estados: hecho = ya funciona en la app de prueba; mvp = lanzamiento del 18-12-2026;
# v1 = «Juntos», marzo de 2027; v2 = «Liga» y «Copa», junio a diciembre de 2027; luego = 2028 o evolutivo.
# Al cerrar cada sesión, Claude pasa a «hecho» lo que ya funciona (igual que estado.yaml).
actualizado: 2026-10-19  # prueba 25 (Lany cae de verdad: desmayo y patatús fluidos con estado «desmayada»; la versión que mejor se lee en cada versículo fuera del lector, con chips). Prueba 24 (glosario de la Biblia con palabras de hoy, nombres propios de hoy, versículos clave con otra versión, ejercicios y validador). Prueba 23 (blindaje legal: música de MacLeod, Lany v4, yunque, «Quién fue quién», créditos y docs/LEGAL.md; versiones sin confusión; material de la ficha de Play). Prueba 22 (sistema visual: mapas, líneas de tiempo, diagramas y láminas en travesías, trivia y juegos; Tierras y tiempos con dos rutas; Quién es quién 4 y 5; trivia de 644; idioma en Ajustes con Biblias en portugués e inglés; firma y AAB para Play, perfiles de EAS; plan de licencias pagando). Prueba 21 (Vivir la historia como misión de la semana; Cómo se juega en los siete juegos; evento en cuatro pasos con calendario del mes y rueda de hora; misión de la semana en Inicio; Quién es quién 3; trivia de 602; tableros por tema). Prueba 20 (glosario y textos claros; historia de la lección; Lany con reacciones graciosas; ¿Quién es? contra alguien; Vivir la historia en grupo; Nombres por letra; fiesta; evento en tres pasos; widget). Prueba 19 (color v2; Lany con volumen; «¿Quién es?» v2 con retratos; «Vivir la historia» v2 con encrucijadas, láminas y espejo; música de inicio y de fondo; trivia de 560; Joel, Sofonías, Filemón, 2-3 Juan y Judas; difusión y cobros)
estados:
  hecho: {nombre: "Ya funciona en la app de prueba", color: "#1baf7a"}
  mvp: {nombre: "Lanzamiento · 18-12-2026", color: "#eda100"}
  v1: {nombre: "v1 «Juntos» · mar-2027", color: "#2a78d6"}
  v2: {nombre: "v2 y v3 · jun a dic-2027", color: "#7a4fd0"}
  luego: {nombre: "2028 o evolutivo", color: "#a9a7a0"}

