# Roadmap de Senda (30-09-2026). Lo usa informes/construir_senda.py para el gantt y las tablas del capítulo 26.
# Fechas AAAA-MM-DD. quien: claude | vos | juntos | externo. carril: producto, contenido, arte, difusion, tiendas, negocio.
# Metodología: MVP publicado en diciembre de 2026 y versiones nuevas cada dos semanas con la app ya en las tiendas.

fases:
  - id: F0
    nombre: "Proyecto y validación"
    desde: 2026-09-30
    hasta: 2026-10-25
    objetivo: "Confirmar con jóvenes, líderes y pastores que el problema existe y que el MVP lo resuelve, sin frenar la construcción."
    entregables:
      - "Proyecto escrito (este documento) y aprobado por vos"
      - "10 entrevistas a jóvenes, 5 a líderes y 2 a pastores; encuesta con 50+ respuestas"
      - "Prueba de nombres y de mascota en tus grupos e Instagram"
      - "Prototipo navegable probado con 5 jóvenes"
    salida: "Decisión «seguir» (o ajustar el MVP) el 25-10-2026"
    hipotesis: "Los jóvenes quieren aprender la Biblia jugando y los líderes necesitan una herramienta para la reunión."
  - id: F1
    nombre: "Fundaciones"
    desde: 2026-10-01
    hasta: 2026-10-31
    objetivo: "Tener todo listo para construir y difundir en paralelo."
    entregables:
      - "Cuentas: Google Play, dominios, usuarios en redes, GitHub, Expo, Supabase, PostHog, Sentry"
      - "Sistema de diseño en código; ilustrador elegido; guía de Lani"
      - "Revisores y 12 testers anotados"
      - "Cuenta de Instagram y canal de WhatsApp con las primeras publicaciones"
    salida: "Primera versión interna instalable en tu teléfono"
    hipotesis: ""
  - id: F2
    nombre: "MVP «Primera luz»: construcción"
    desde: 2026-10-12
    hasta: 2026-12-06
    objetivo: "Construir lo mínimo que ya sirve de verdad: Biblia, Camino, Espadeo y Lámpara."
    entregables:
      - "Biblia (3 versiones, audio del teléfono, versículo del día, notas, planes, Lámpara)"
      - "Camino: secciones 0 y 1 + unidad «21 días» (90 lecciones)"
      - "Espadeo: duelo por turnos con amigos y con Lani, desafío del día, ¡Desenvainá! (2 pruebas), 3.000 preguntas"
      - "Perfil, amigos por código, avisos, Maná del día, Lani ilustrada y sonidos"
    salida: "Versión candidata aprobada por vos y por los revisores"
    hipotesis: "H1: con Camino + Espadeo + Lámpara, los jóvenes vuelven a la Palabra al menos 3 días por semana."
  - id: F3
    nombre: "Pruebas"
    desde: 2026-11-16
    hasta: 2026-12-11
    objetivo: "Probar con personas reales y cumplir los requisitos de las tiendas."
    entregables:
      - "Prueba cerrada en Google Play: 12 testers durante 14 días (23-11 al 07-12)"
      - "TestFlight en iOS con 5+ testers"
      - "Correcciones y pulido; fichas de tienda en español"
    salida: "Acceso a producción aprobado por Google y app aprobada por Apple"
    hipotesis: ""
  - id: F4
    nombre: "Lanzamiento"
    desde: 2026-12-14
    hasta: 2027-01-31
    objetivo: "Publicar antes de Navidad y aprovechar la ola de Año Nuevo."
    entregables:
      - "Publicación gradual en Android e iOS (18-12-2026)"
      - "Sorteo de lanzamiento en Instagram"
      - "Desafío de 21 días (1 al 21 de enero)"
      - "Versiones de mejora cada dos semanas según los datos"
    salida: "1.000 descargas en diciembre; 500 participantes en el desafío"
    hipotesis: ""
  - id: F5
    nombre: "v1 «Reunión»"
    desde: 2027-01-11
    hasta: 2027-04-30
    objetivo: "Sumar a los líderes y a los grupos; activar la monetización."
    entregables:
      - "Senda Reunión (trivia en vivo, Impostor, planificador con IA) y grupos"
      - "Ligas semanales, Palabra del día, videos opcionales"
      - "Lani animada en Rive; voces neuronales de la Biblia"
      - "«+» v1 (referencias, diccionario, notas en Evangelios); secciones 2 y 3 del Camino; ruta de los 66 libros"
      - "Empresa del holding, transferencia de la app y suscripciones (Plus y Líder)"
      - "Desafío de Semana Santa (22 al 28-03-2027)"
    salida: "Regla de corte del 30-04-2027: 1.000 personas por semana con 3+ días y 10% que vuelve"
    hipotesis: "H2: los líderes usan Senda Reunión cada semana y eso trae instalaciones."
  - id: F6
    nombre: "v2 «Liga»"
    desde: 2027-05-01
    hasta: 2027-08-31
    objetivo: "Que las iglesias compitan y la comunidad produzca contenido."
    entregables:
      - "Liga Senda (temporada 1) y Copa Senda de invierno (julio)"
      - "Dibujalo, Tutti Frutti, Línea de tiempo, Guardá la Palabra"
      - "Proponé tu pregunta; Berea (beta); agenda de eventos; widgets"
      - "Programa de embajadores; Carta a líderes"
    salida: "50 grupos por semana en Senda Reunión; 60 iglesias en la liga"
    hipotesis: "H3: la liga entre iglesias sube la retención."
  - id: F7
    nombre: "v3 «Iglesia»"
    desde: 2027-09-01
    hasta: 2027-12-31
    objetivo: "Que las iglesias paguen y que la app cubra sus costos."
    entregables:
      - "Senda Iglesia con Senda Púlpito; eventos destacados"
      - "El Rosco, ¿Quién soy?, Preparados, modo campamento"
      - "RVR1960 con licencia; comentarios en los libros prioritarios"
      - "Temporada 2 de la liga; Tu año en la Palabra"
    salida: "50.000 descargas; 8.000 activos por mes; 30 iglesias en el plan; costos cubiertos"
    hipotesis: "H4: las iglesias pagan por Senda Iglesia."
  - id: F8
    nombre: "2028 · Nuevos idiomas y web"
    desde: 2028-01-01
    hasta: 2028-12-31
    objetivo: "Llevar Senda a Brasil y al mundo anglófono, y a la web."
    entregables:
      - "Versión web (entrar a salas sin instalar)"
      - "Portugués (Brasil) en junio; inglés en el segundo semestre"
      - "Modo familia; Biblioteca; mediación de anuncios"
    salida: "250.000 descargas; 22.000 activos por mes"
    hipotesis: "H5: el modelo funciona igual en portugués."
  - id: F9
    nombre: "2029 · Escala"
    desde: 2029-01-01
    hasta: 2029-12-31
    objetivo: "Ligas nacionales, alianzas y más idiomas."
    entregables:
      - "Ligas nacionales e internacionales; alianzas con ministerios y sociedades bíblicas"
      - "Francés y otros idiomas según datos; Practicá tu respuesta (Preparados)"
    salida: "500.000 descargas"
    hipotesis: ""
  - id: F10
    nombre: "2030 · El millón"
    desde: 2030-01-01
    hasta: 2030-12-31
    objetivo: "Llegar al millón de descargas y a 500 iglesias en la liga."
    entregables:
      - "Prode del Mundial 2030; plan institucional; Copa internacional"
    salida: "1.000.000 de descargas"
    hipotesis: ""

