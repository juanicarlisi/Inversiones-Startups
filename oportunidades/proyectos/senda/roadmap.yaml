# Roadmap de Senda v2 (02-10-2026). Lo usa informes/construir_senda.py para el gantt y las tablas del capítulo 29.
# Fechas AAAA-MM-DD. quien: claude | vos | juntos | externo. carril: producto, contenido, arte, difusion, tiendas, negocio.
# Cambios de la v2: lo principal de la Travesía y de la comunidad queda listo a fines de junio de 2027 (antes: 2028);
# el calendario entra en el MVP; la Liga Senda arranca en abril de 2027 por persona (Apertura y Clausura).

fases:
  - id: F0
    nombre: "Validación y dirección visual"
    desde: 2026-10-02
    hasta: 2026-10-25
    objetivo: "Confirmar el problema, elegir nombres y dirección visual con jóvenes reales, sin frenar la construcción."
    entregables:
      - "10 entrevistas a jóvenes, 5 a líderes y 2 a pastores; encuesta con 50+ respuestas"
      - "Prueba de nombres (Travesía, juegos) y de Lani v2 con el «infantilómetro» (30 jóvenes)"
      - "Prueba de las 3 paletas en 3 pantallas (30 jóvenes) y elección"
      - "Prototipo navegable probado con 5 jóvenes"
    salida: "Decisión «seguir» el 25-10-2026 con nombres, paleta y Lani elegidos"
    hipotesis: "Los jóvenes quieren aprender la Biblia jugando si se ve y se siente como sus juegos, no como algo infantil."
  - id: F1
    nombre: "Fundaciones"
    desde: 2026-10-01
    hasta: 2026-10-31
    objetivo: "Tener todo listo para construir y difundir en paralelo."
    entregables:
      - "Cuentas: Google Play, Apple, dominios, redes, GitHub, Expo, Supabase, PostHog, Sentry"
      - "Pedido de licencias: YouVersion Platform y API.Bible (RVR1960 primero)"
      - "Diseñador de interfaz, ilustrador y sonido elegidos (tras la decisión del 25-10)"
      - "Revisores y 12 testers anotados; Instagram, TikTok y canal de WhatsApp con las primeras publicaciones"
    salida: "Primera versión interna instalable en tu teléfono"
    hipotesis: ""
  - id: F2
    nombre: "MVP «Primera luz»"
    desde: 2026-10-12
    hasta: 2026-12-06
    objetivo: "Lo mínimo que ya engancha y edifica: Biblia, Travesía, Espadeo nuevo, calendario y Tu Lani."
    entregables:
      - "Biblia: Reina-Valera por defecto (RV1909; RVR1960 si llega la licencia), 2 versiones libres, audio del teléfono, planes, racha"
      - "Travesía: Ruta Fundamentos, secciones 0 a 2 + unidad «21 días» (130 lecciones)"
      - "Espadeo: 6 categorías nuevas, Armería, Carga, 6 comodines, vidas, rival al azar, amigos o Lani, preguntas con imagen; 4.000 preguntas"
      - "Calendario Senda y Mi calendario; Giro diario; misiones, cofres e insignias; Tu Lani (3 atuendos); compartir logros; Pulso del día"
    salida: "Versión candidata aprobada por vos, los revisores y la prueba de la grilla (se ve al nivel de las apps de referencia)"
    hipotesis: "H1: con Travesía + Espadeo + racha, los jóvenes vuelven a la Palabra al menos 3 días por semana."
  - id: F3
    nombre: "Pruebas"
    desde: 2026-11-16
    hasta: 2026-12-11
    objetivo: "Probar con personas reales y cumplir los requisitos de las tiendas."
    entregables:
      - "Prueba cerrada en Google Play: 12 testers durante 14 días (23-11 al 07-12)"
      - "TestFlight en iOS con 5+ testers"
      - "Correcciones, pulido de animaciones y sonidos; fichas de tienda y video"
    salida: "Acceso a producción aprobado por Google y app aprobada por Apple"
    hipotesis: ""
  - id: F4
    nombre: "Lanzamiento"
    desde: 2026-12-14
    hasta: 2027-01-31
    objetivo: "Publicar antes de Navidad y aprovechar la ola de Año Nuevo."
    entregables:
      - "Publicación gradual en Android e iOS (18-12-2026)"
      - "Sorteo de lanzamiento y desafío de 21 días (1 al 21 de enero), en el calendario"
      - "Primer Viernes de Espadeo (08-01-2027) como ventana de 2 horas"
      - "Versiones de mejora cada dos semanas según los datos"
    salida: "1.000 descargas en diciembre; 500 participantes en el desafío"
    hipotesis: ""
  - id: F5
    nombre: "v1 «Juntos»"
    desde: 2027-01-11
    hasta: 2027-03-21
    objetivo: "Sumar a los grupos y a los líderes; activar la monetización."
    entregables:
      - "Grupos y calendario del grupo (actividades semanales, confirmaciones, invitaciones para compartir)"
      - "Senda Reunión: armador del líder, quiz propio o del banco, Oveja Perdida y Dibujalo en sala, registro de reuniones"
      - "Racha compartida, misiones en dupla, pedir y regalar vidas, Escuadra 2v2"
      - "Suscripciones (Plus, Max, Familia), Pase Senda y videos; Lani en Rive"
      - "Travesía: secciones 3 a 6 + Ruta Héroes; NTV, NVI, DHH y TLA; «+» v1; unidad de Semana Santa"
    salida: "Grupos usando Senda Reunión cada semana; primeras suscripciones"
    hipotesis: "H2: los líderes arman sus reuniones con Senda y eso trae instalaciones."
  - id: F6
    nombre: "v2 «Liga»"
    desde: 2027-03-22
    hasta: 2027-06-30
    objetivo: "Competencia por persona, la ruta completa y las herramientas de líderes e iglesias."
    entregables:
      - "Liga Senda Apertura por persona (desde el 12-04): 11 fechas, divisiones, ascensos, descensos y playoffs (final el 10-07)"
      - "Travesía: Fundamentos completa (secciones 7 a 12), Repaso del día y Rutas Mapas y 66 Libros"
      - "Senda Líder y Senda Iglesia con Púlpito (Desafío del domingo); reportes de reuniones"
      - "Pulso: encuestas del grupo; Primero la Palabra y Ayuno de redes; Estados"
      - "Abecé, Tutti Frutti online, De memoria, Antes o después; Viernes de Espadeo en vivo"
    salida: "Regla de corte del 30-04 cumplida; Fundamentos completa el 30-06"
    hipotesis: "H3: la liga por persona y las herramientas del líder suben la retención."
  - id: F7
    nombre: "v3 «Copa»"
    desde: 2027-07-01
    hasta: 2027-12-31
    objetivo: "Que la comunidad se quede, que las iglesias paguen y que la app cubra sus costos."
    entregables:
      - "Copa Senda de invierno (julio), Clausura (agosto a noviembre) y Supercopa (diciembre)"
      - "Rutas Preparados, Jesús, Parábolas y milagros, Profecías, Sabiduría y Vida real; nivel «Profundo» de Fundamentos"
      - "Calendario de la iglesia completo (turnos, asistencia con QR), modo campamento"
      - "Dibujalo exprés, ¿Quién soy?, ¡Prohibido!; entrar a salas desde el navegador"
      - "Informe Pulso 2027; Tu año en Senda"
    salida: "50.000 descargas; 8.000 activos por mes; 30 iglesias pagando; costos cubiertos"
    hipotesis: "H4: las iglesias pagan por Senda Iglesia."
  - id: F8
    nombre: "2028 · Nuevos idiomas y web"
    desde: 2028-01-01
    hasta: 2028-12-31
    objetivo: "Llevar Senda a Brasil y al mundo anglófono, y a la web."
    entregables:
      - "Portugués (Brasil) en marzo; inglés en el segundo semestre; web completa"
      - "Copa Continental Senda; modo familia; Biblioteca; mediación de anuncios"
    salida: "250.000 descargas; 22.000 activos por mes"
    hipotesis: "H5: el modelo funciona igual en portugués."
  - id: F9
    nombre: "2029 · Escala"
    desde: 2029-01-01
    hasta: 2029-12-31
    objetivo: "Ligas en más países, alianzas y más idiomas."
    entregables:
      - "Ligas nacionales en 6+ países; Mundial Senda (países como equipos)"
      - "Alianzas con ministerios y sociedades bíblicas; francés y otros idiomas según datos"
    salida: "500.000 descargas"
    hipotesis: ""
  - id: F10
    nombre: "2030 · El millón"
    desde: 2030-01-01
    hasta: 2030-12-31
    objetivo: "Llegar al millón de descargas y a 500 iglesias con plan."
    entregables:
      - "Plan institucional (redes de iglesias, seminarios, colegios)"
      - "Copa Continental y Mundial Senda en vivo"
    salida: "1.000.000 de descargas"
    hipotesis: ""

