una_frase: "Música de ambiente hecha con IA y elegida a mano, por estilo y por momento del día: bossa nova para el almuerzo, flamenco para la bodega, tango lounge para el bar, lounge para el hotel. El canal de YouTube es la vidriera; las listas con licencia para locales, el negocio."
problema: "Bares, restaurantes, hoteles y comercios necesitan música que acompañe y no aburra; los servicios con licencia cuestan USD 27–80 por local por mes; y en Argentina los locales abiertos al público siguen pagando SADAIC/AADI-CAPIF por música de repertorio."
para_quien:
  - "Gente que busca música de fondo en YouTube (para trabajar, cocinar, cenar), en todo el mundo: la música instrumental no tiene idioma."
  - "Locales gastronómicos, hoteles, bodegas y comercios de Argentina y la región."
mision: "Darle a cada lugar la música que le queda, sin complicaciones ni sorpresas."
vision: "Para 2030, una biblioteca de música de ambiente con identidad propia, canales con cientos de miles de vistas por mes y cientos de locales suscriptos."
objetivos:
  - {cuando: "oct-2027", que: "Canal publicado con 8 videos largos y un directo 24/7."}
  - {cuando: "mar-2028", que: "Programa de socios de YouTube (1.000 suscriptores y 4.000 horas)."}
  - {cuando: "jun-2028", que: "Consulta legal hecha y prueba B2B con 20 locales."}
  - {cuando: "dic-2029", que: "60 locales suscriptos y 400 mil vistas por mes."}

