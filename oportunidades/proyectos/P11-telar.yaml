metricas:
  norte: "Semanas con plan vivo: usuarios que abren su plan al menos 3 días en la semana"
  otras:
    - "Retención a la semana 4 y a la semana 12 de quien creó un plan"
    - "Usuarios activos por mes, pagos (Pro y vitalicio) y conversión de activos a pago"
    - "Entradas por búsqueda a plantillas y planes públicos; clones de plantillas"
    - "Replanificaciones aceptadas sobre propuestas (mide si el motor acierta)"

cortes:
  - "Marzo de 2027 (control de retención): con al menos 150 personas que crearon un plan, si menos del 15% vuelve en la semana 4, se frena el Pro y la sincronización; queda lo gratis como herramienta propia."
  - "Diciembre de 2027 (corte duro): si no hay 2.000 usuarios activos por mes y 30 pagos, modo mantenimiento (gratis, sin funciones nuevas) y las horas pasan a la fábrica."
  - "Pro: si a los 6 meses de cobrar la conversión de activos a pago es menor al 1%, se revisa precio y límites antes de seguir invirtiendo."
  - "Si Notion, Todoist o TickTick lanzan capacidad en horas y replanificación en una vista de cronograma personal, se reevalúa en 30 días: la defensa pasa a ser precio, datos propios y plantillas."

riesgos:
  - "Mercado saturado y con incumbentes que copian funciones (Notion crece con agentes de IA; Motion ya replanifica) → foco en una persona sola o una pareja, precio bajo, sin cuenta y plantillas indexables; corte duro y probabilidad escrita en 20%."
  - "Pérdida de datos en iPhone: según fuentes secundarias, Safari borra el almacenamiento de sitios sin uso en 7 días salvo que estén instalados en la pantalla de inicio → pedir instalar, copia automática a archivo, Pro con sincronización y envoltorio nativo en 2027."
  - "Un replanificador que se equivoca rompe la confianza → vista previa de cada cambio, motivo de cada movimiento, deshacer y pruebas del motor antes de ofrecerlo."
  - "Costo de IA y abusos → la IA solo traduce a cambios aprobables, cupo mensual y opción de usar la propia clave."
  - "Cobros y empresa: hay que armar la empresa del holding antes de cobrar (hito de feb-2027); disponibilidad de pagos a Argentina por verificar con cada plataforma."
  - "Competir por la atención de las 10 horas semanales del holding → arranque con 1,5–2 h y corte duro."
  - "Soporte a miles de usuarios gratis → preguntas frecuentes, ayuda dentro de la app y borradores de respuesta; requiere tu autorización permanente para respuestas de plantilla (regla 8)."
  - "Sesgo del fundador (él es el primer usuario) → entrevistas a 8–12 personas de 4 perfiles antes de construir el Pro."

pi:
  - "Marca elegida en el INPI (clases 9, 42 y 41) a nombre de la empresa del holding; vigilar la EUIPO y la USPTO."
  - "Motor de planificación, plantillas y contenido propios: secreto comercial y derechos de autor; no patentar (hay antecedentes de planificación automática y de Gantt)."
  - "Aspecto y nombres de funciones propios: nada del diseño de Notion, Linear, Sunsama o Todoist."

recordatorios:
  - "Antes de fin de diciembre: elegir el nombre (Telar recomendado; Trazo de respaldo) y aprobar el gasto del dominio y de la marca."
  - "Cargá tu plan real solo en tu copia privada del navegador o archivo local; nunca en este repositorio (es público)."
  - "Entrevistas asincrónicas: aprobar el texto de la convocatoria y dónde se publica (regla 8)."
  - "Febrero de 2027: la empresa del holding tiene que estar antes de activar cobros; confirmar con la plataforma de pagos que paga a la cuenta elegida."

caso:
  lanzamiento: "2027-04"
  costos_desde: "2026-11"
  inversion: 120
  p_exito: 0.20
  exito_es: "2.000 usuarios activos por mes y 30 pagos (suscripciones o vitalicios) en diciembre de 2027"
  si_no: {ingreso: 0, corte: "2027-12"}
  malo: 0.3
  bueno: 3.0
  fechas:        ["2027-04", "2027-09", "2027-12", "2028-12", "2029-12", "2030-12", "2031-09"]
  drivers:
    mau:         [600,  1300, 2200, 6500, 13000, 22000, 26000]
    pro:         [0,    14,   38,   160,  390,   700,   860]
    precio_pro:  [0,    3.0,  3.1,  3.3,  3.5,   3.7,   3.8]
    vit:         [0,    5,    6,    5,    4,     3,     3]
  lineas:
    Suscripción Pro: "pro*precio_pro"
    Vitalicios: "vit*60"
  costo: "12 + 0.004*mau + 0.6*pro"
  unidades:
    mau: "Usuarios activos por mes"
    pro: "Suscriptores Pro"
    vit: "Vitalicios vendidos por mes"
  supuestos:
    - "Tres escenarios y su probabilidad: (1) no despega, 80%: menos de 2.000 activos o 30 pagos en dic-2027, se cierra en modo mantenimiento y se pierden unos USD 130–250 y ~100 horas (con el uso propio como consuelo); (2) nicho sostenible, 16%: de USD 0,7k a USD 2,3k netos por mes en dic-2030 (curva normal: 22.000 activos, 700 pagos, ≈ USD 2.250 netos por mes); (3) éxito grande, 4%: ≈ 3 veces la curva normal, 2.000 o más pagos y ≈ USD 6–7k netos por mes."
    - "p_exito 0,20 = escenarios (2) y (3). Contexto de las probabilidades: según RevenueCat (2026) solo el 4,6% de las apps nuevas llega a USD 10.000 de ingreso mensual en dos años (todas las categorías); la barra de éxito de este proyecto es mucho más baja (≈ USD 400 por mes)."
    - "Embudo normal en régimen (2030), todo HIPÓTESIS a medir: 40.000 visitas por mes × 9% que se activa × 6 meses de vida media ≈ 22.000 activos; 3,2% de los activos paga (la mediana de descarga a pago es 2,0% en apps freemium según RevenueCat 2026)."
    - "Precio de lista: Pro USD 48 al año (USD 4 por mes) en EE.UU. y Europa, ≈ USD 30 en Latinoamérica; vitalicio «Fundadores» USD 79 (tope 400 unidades, no se agota: el modelo supone ≈ 220). Neto por suscriptor USD 3,0 en 2027 que sube a USD 3,8 en 2031 por más audiencia en inglés y ajustes de precio, descontadas las comisiones (≈ 5% + USD 0,50 por cobro en un procesador intermediario, dato de proveedores, o 15% en las tiendas)."
    - "Costo: USD 12 por mes fijos (dominio, correo, relay de sincronización, herramientas), USD 0,004 por usuario activo (base local: casi nada) y USD 0,6 por suscriptor Pro (IA y sincronización). Estimación: una acción de IA cuesta USD 0,01–0,03; verificar con el precio vigente de la API."
    - "Multiplicadores del éxito: ×0,3 (malo) y ×3 (bueno) de la curva normal, para la simulación del holding."
    - "No incluye: plantillas de pago, plan Pareja, plan Equipos ni la venta del activo; si salen, son plata de más."
