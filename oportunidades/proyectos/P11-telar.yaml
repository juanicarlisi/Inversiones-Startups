diferencial:
  - "Capacidad real en horas para una persona: cada semana dice «te cabe / no te cabe». Los Gantt lo hacen para equipos y los planificadores de día no miran más allá de la semana."
  - "Replanificar con un toque y con vista previa de cambios (el motor es una regla determinista, no una IA que inventa fechas)."
  - "«¿Y si digo que sí?»: ves qué se corre antes de comprometerte con algo nuevo."
  - "Cronograma de vida que se entiende de un vistazo, con zoom por significado (año, trimestre, semana)."
  - "Sin cuenta, sin servidor para empezar, tu plan es un archivo tuyo: respuesta a las apps que cierran o suben el precio."
  - "Precio de lista personal (USD 48 al año, menos en Latinoamérica) contra USD 204–408 de los planificadores."
  - "Honestidad: Notion, ClickUp y GanttPRO ya hacen «plan desde una frase» y Motion ya replanifica por día; el diferencial está en juntar capacidad, replanificación, sin cuenta y precio para una persona."

benchmark:
  - {de: "Sunsama", tomamos: "El ritual de planificación que la gente ama; nosotros lo llevamos a la semana y al mes, y con app móvil que sí funciona (su mayor queja)."}
  - {de: "Motion y Reclaim", tomamos: "Reacomodar solo cuando algo cambia; nosotros con vista previa, motivo de cada movimiento y sin cobrar USD 19–49 por mes."}
  - {de: "Things", tomamos: "Diseño sereno, velocidad y pago único; nosotros con datos abiertos y multiplataforma."}
  - {de: "Tiimo y Structured", tomamos: "Línea visual amable (Tiimo fue App del Año de Apple en 2025); nosotros a escala de semanas y proyectos."}
  - {de: "GanttPRO, Instagantt y TeamGantt", tomamos: "IA que arma un Gantt desde un texto; nosotros para una persona, con horas reales y ajustes por conversación."}
  - {de: "Todoist", tomamos: "Captura en lenguaje natural; nosotros en español rioplatense («el finde», «pasado mañana»)."}
  - {de: "Linear", tomamos: "El teclado como camino principal y la velocidad como principio (dirección, nunca copia del aspecto)."}
  - {de: "Excel y Google Sheets", tomamos: "Es la alternativa real y gratis: importar la planilla en un paso."}

contenido:
  - "20 plantillas vivas (tesis, mudanza, casamiento, lanzamiento de un producto, rendir un final, año de freelancer) que se arman hacia atrás desde tu fecha."
  - "Páginas públicas de planes y guías («cómo planificar 3 proyectos a la vez») indexables para las búsquedas."
  - "Videos cortos sin cara: grabación de pantalla + voz sintética."

difusion:
  principal: "Plantillas y planes públicos indexables («cronograma de tesis», «plan de mudanza», «Gantt gratis para uso personal») con botón «Abrir en Telar»; cada plantilla es una puerta de entrada por búsqueda y por las respuestas de IA."
  apoyo:
    - "Importar la planilla de Excel o de Google Sheets en un paso: se gana en la comparación de «mejor que mi planilla»."
    - "Páginas «alternativa a» (Sunsama, Motion, Notion para proyectos) y directorios (AlternativeTo, Product Hunt) con cuenta anónima."
    - "Comunidades de productividad, freelancers, estudiantes y posgrado en Reddit, Telegram y WhatsApp, con la regla 90/10 (publicar requiere tu OK)."
  tacticas:
    - "Cronograma exportable como imagen para WhatsApp e Instagram, con marca discreta."
    - "«Tu año en Telar» en diciembre: resumen compartible hecho en el dispositivo (sin enviar datos)."
    - "Cuentas temáticas sin cara (consejos de planificación y semanas rotas) con capturas de la app."
    - "Conexión con la IA del usuario (MCP) y app dentro de ChatGPT como vidriera extra."
    - "Enero concentra el interés por planificar el año (inferencia, a medir en Search Console): por eso la beta sale en enero de 2027."

metodologia:
  - "Cortes verticales: cada corte termina con algo que se puede usar y medir, no con piezas sueltas."
  - "Uso propio primero: el fundador planifica con Telar sus proyectos reales en su copia privada (nunca en el repositorio)."
  - "8 a 12 entrevistas asincrónicas sobre comportamiento pasado antes de construir el Pro (guion en investigacion.md)."
  - "El motor de planificación es código puro con pruebas (determinista); la IA solo traduce lenguaje a cambios que el usuario aprueba."
  - "Herramientas especializadas primero (regla 10): antes de construir sincronización, base local, envoltorio móvil o cobros, verificar en fuente oficial y elegir una."

quien:
  claude:
    - "Reconstruye Plan Maestro como app propia y programa todos los cortes"
    - "Escribe las plantillas, las páginas públicas y los guiones de los videos"
    - "Prepara el soporte (preguntas frecuentes y borradores de respuesta) y las pruebas del motor de planificación"
  vos:
    - "Elegís el nombre y aprobás gastos (dominio, marca) y publicaciones (regla 8)"
    - "Usás Telar con tus proyectos reales, en una copia privada, y decidís qué te falta"
    - "Hacés o aprobás 8–12 entrevistas asincrónicas y autorizás las respuestas de soporte"

