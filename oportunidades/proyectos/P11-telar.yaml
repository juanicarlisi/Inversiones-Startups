# P11 · Plan Maestro (artefacto de organización) → producto "Telar". Definición de proyecto (15-11-2026).
# Fuentes: oportunidades/proyectos/telar/investigacion.md (mercado, precios, bottom-up, nombre, guion de entrevistas)
#          oportunidades/proyectos/telar/producto.md (principios, 10 funciones diferenciales, roadmap por cortes)
# Base: apps/plan-maestro/index.html (cronograma + tablero, áreas → proyectos → tareas). Repositorio público: ningún dato personal ni tareas reales.
# Probabilidad honesta: mercado saturado; p_exito 0,20. Corte duro en diciembre de 2027.
id: P11
orden: 11
catalogo: []
rol: "Apuesta chica + herramienta propia"
icono: "🧶"
color: "#6d5bd0"
nombre_trabajo: "Plan Maestro"
nombre: "Telar"
lema: "Tu año de un vistazo. Y si se rompe la semana, un toque."
nombres:
  - {n: "Telar", por_que: "La urdimbre es el tiempo y la trama son tus proyectos: cada proyecto es un hilo y el plan es el tejido. Corto, cálido, de acá y legible en inglés y portugués. «Tejé tu año».", estado: "Sin app de planificación con ese nombre en la búsqueda del 15-11-2026. Ojo: telar.io es una plataforma de reclutamiento en español (otra categoría, misma palabra); la marca TELAR de EE.UU. (registro de 1992) figura cancelada desde 2013. Verificar INPI (clases 9 y 42), dominio (telar.app no se pudo comprobar) y EUIPO"}
  - {n: "Trazo", por_que: "Cada barra del cronograma es un trazo: «Trazá tu plan». Corto y fácil de decir en inglés.", estado: "Sin software con ese nombre en la búsqueda. trazo.app existe sin contenido y trazo.com está en venta o estacionado: verificar y negociar"}
  - {n: "Rumbo", por_que: "Dirección: «Poné rumbo a tu año». Muy claro en español.", estado: "rumbo.app está a la venta; pero Rumbo es una marca grande de viajes en España (dato de conocimiento general, sin verificar en esta sesión): riesgo de confusión"}
  - {n: "Hito", por_que: "La fecha clave de tu plan. Cortísimo.", estado: "Descriptivo (significa «milestone»): marca débil y difícil de defender; hito.app no respondió (503)"}
  - {n: "Pauta", por_que: "Regla y compás: «Tu pauta de la semana».", estado: "En Latinoamérica «pauta» es sobre todo publicidad; pauta.app no resolvió: no se pudo verificar"}
  - {n: "Cauce", por_que: "El río por donde corre tu tiempo.", estado: "Descartado: cauce.app ya es una app de presupuesto personal (categoría vecina). También descartados Trama (trama.app es un editor de historias y hay una startup cordobesa de IA con ese nombre) y Tramo (tramo.app es una plataforma de planeación municipal en Colombia)"}
submarcas:
  - "Telar Libre (gratis, sin cuenta)"
  - "Telar Pro (sincronización, IA ampliada, compartir)"
  - "Telar Pareja (dos personas, un plan)"
  - "Telar Plantillas (galería pública de planes)"

una_frase: "El cronograma de vida para una persona o una pareja: ves de un vistazo todos tus proyectos (trabajo, estudio, casa, lo que sea) contra las horas que de verdad tenés, y cuando la semana se rompe, un toque te propone el nuevo plan. Sin cuenta, en cualquier pantalla y con tus datos en tu dispositivo."
problema: "Quien lleva varios proyectos a la vez vive entre planillas, Notion, Trello y el calendario: las listas (Todoist, TickTick, Things) no muestran el tiempo, los planificadores de día (Sunsama, Motion, Akiflow) cuestan USD 17–34 por mes y no ven más allá de la semana, y los Gantt (GanttPRO, TeamGantt, OmniPlan) están hechos para jefes de proyecto con equipo. Nadie le dice a una persona sola «esto no te cabe» ni rehace el plan cuando todo se corre."
para_quien:
  - "Personas con 3 a 10 proyectos en paralelo con fechas: freelancers y consultores, fundadores solos, creadores, quienes estudian y trabajan (tesis, posgrado)."
  - "Parejas y familias que organizan algo grande juntas (mudanza, casamiento, reforma, viaje, bebé)."
  - "Quienes huyeron de Notion o ClickUp por complejidad, o de una app que cerró o subió el precio (Height cerró en 2025, Clockwise en 2026)."
mision: "Que cualquiera pueda ver si lo que se comprometió a hacer cabe en su tiempo real, y rehacer el plan en un toque cuando la vida lo rompe."
vision: "Para 2030, la herramienta de cabecera en español para planificar varios proyectos de vida: 22.000 usuarios activos por mes, 700 pagos y una galería de miles de planes públicos que abren la puerta por las búsquedas."
objetivos:
  - {cuando: "dic-2026", que: "Plan Maestro fuera del artefacto: app instalable, datos locales, sin servicios externos; nombre elegido y verificado."}
  - {cuando: "ene-2027", que: "Beta pública gratis «Planificá tu 2027» con capacidad en horas, 20 plantillas y entrada rápida."}
  - {cuando: "abr-2027", que: "Pro y vitalicio «Fundadores» a la venta (con la empresa del holding ya armada)."}
  - {cuando: "dic-2027", que: "Hito de corte: 2.000 usuarios activos por mes y 30 pagos. Android e iPhone en las tiendas."}
  - {cuando: "dic-2028", que: "6.500 activos por mes, 160 pagos, inglés y portugués, conexión con la IA del usuario."}
  - {cuando: "dic-2030", que: "22.000 activos por mes y 700 pagos."}

