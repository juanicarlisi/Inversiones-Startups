# P10 · Finanzas de la casa → nombre de trabajo "Nido" (marca recomendada: "Alero"). Definición de proyecto (15-11-2026).
# Base: apps/economia-familiar/ (versión 32, la usa la familia del fundador). Sin datos ni importes de la familia en este repositorio.
# Fuentes: oportunidades/proyectos/nido/investigacion.md (bitácora con fuentes) y nido/producto.md (experiencia, funciones, roadmap).
id: P10
orden: 10
catalogo: []
rol: "Línea de app propia (suscripción)"
icono: "🪺"
color: "#b7791f"
nombre_trabajo: "Economía Familiar"
nombre: "Nido"
lema: "La plata de tu casa, en orden y entre los dos."
nombres:
  - {n: "Alero", por_que: "«Bajo el mismo alero»: la casa que cubre a la familia. Corto, rioplatense y distinto. «¿Lo cargaste en Alero?».", estado: "Recomendado. Búsqueda web del 15-11-2026: solo una app de compras en El Salvador y «Altero» (deudas, México); sin finanzas en Argentina. Verificar INPI (clases 9, 36, 42) y dominio"}
  - {n: "Nido", por_que: "El nombre que eligió el fundador: cálido, corto, la casa que se construye de a poco.", estado: "Conflictos (15-11-2026): app indie «Nido: Personal Finance» con cuotas y tickets (Product Hunt, 2026), «Mi Nido» (finanzas compartidas, LatAm, 2023), Nidoro (parejas) y la marca NIDO de Nestlé (clases 5 y 29, muy conocida). Queda como nombre de trabajo"}
  - {n: "Ombú", por_que: "El árbol que da sombra a todos en la pampa: identidad argentina fuerte.", estado: "Sin apps de finanzas en la búsqueda; la tilde complica fuera de la región. Verificar INPI"}
  - {n: "Nidito", por_que: "Diminutivo cariñoso que conserva la idea del fundador.", estado: "Sin apps en la búsqueda; arrastra el ruido de «Nido» y de Nestlé. Verificar INPI"}
  - {n: "Tándem", por_que: "Dos que pedalean juntos: economía de pareja.", estado: "Palabra muy usada en marcas: verificar"}
  - {n: "Hornero", por_que: "El pájaro que construye su casa de a poco.", estado: "Descartado: existe Hornero (proptech de alquileres, AR/UY, clase 36) y Hornero Game Studio"}
submarcas:
  - "Nido gratis (para siempre)"
  - "Nido Plus familiar (una suscripción para toda la casa)"
  - "Nido Mayordomía (módulo opcional de diezmo y ofrendas, puente con Senda)"
  - "Plantillas Nido (planillas y guías gratis y pagas)"

una_frase: "La plata de tu casa, en orden y entre los dos: cargás un gasto en tres segundos, la app entiende cuotas, tarjetas con cierre, dólares y fondos, lee el resumen de la tarjeta y el ticket, y una vez por mes cierran el mes juntos en cinco minutos. Sin claves del banco y con cifrado de punta a punta: nadie más que tu familia ve tus números."
problema: "Una familia argentina usa 2–4 bancos y billeteras y 2–3 tarjetas con cuotas; cada banco muestra solo su parte (Naranja X y Supervielle lanzaron cuentas familiares en 2026, pero hay que mover la plata a ellos), no hay finanzas abiertas operativas, y las apps globales no entienden cuotas, cierres ni inflación. La alternativa real es una planilla que se abandona o no hacer nada."
para_quien:
  - "Parejas y familias de 25–50 años, bancarizadas, con tarjetas en cuotas y algún ahorro en billeteras, fondos o dólares."
  - "La persona de la casa que hoy «lleva las cuentas» en una planilla o en notas (decide y paga)."
  - "Familias cristianas que diezman u ofrendan (módulo opcional, puente con Senda)."
  - "Desde 2028: Uruguay, Chile, México (meses sin intereses) y España."
mision: "Que cualquier familia sepa, sin pelearse y sin perder una noche por mes, cuánto gasta, cuánto debe en cuotas, cuánto le sobra y cuánto lleva juntado para lo que quiere."
vision: "Para 2030, la app de la plata de la casa en español con la mejor experiencia de su categoría: 25 mil hogares activos por mes, 1.250 hogares pagos y cero publicidad."
objetivos:
  - {cuando: "dic-2026", que: "Corte 0: código separado de la familia, onboarding genérico, datos en el teléfono, web instalable; la familia del fundador migra sin perder nada."}
  - {cuando: "feb-2027", que: "Beta cerrada con 30–50 hogares de la lista de espera: pareja sincronizada con cifrado de punta a punta y tickets con IA."}
  - {cuando: "mar-2027", que: "Lanzamiento web en Argentina con «Leé tu resumen» y pesos de hoy."}
  - {cuando: "jul-2027", que: "Android en Google Play con widget, compartir y aviso del banco; Nido Plus con cobro."}
  - {cuando: "sep-2027", que: "Hito de corte: 1.500 hogares activos por mes con 25% cargando a los 60 días, o 40 hogares pagos."}
  - {cuando: "dic-2027", que: "iPhone; 2.500 hogares activos y 100 pagos."}
  - {cuando: "dic-2028", que: "Uruguay, Chile, México y España; 8.000 hogares activos y 380 pagos."}
  - {cuando: "dic-2030", que: "25.000 hogares activos por mes y 1.250 pagos."}

alcance:
  incluye:
    - "Gastos e ingresos con carga de 3 segundos, voz y widget; entiende el habla rioplatense («15 lucas», «la verdu»)"
    - "Tarjetas con cierre y vencimiento, cuotas proyectadas y «cuánto tengo comprometido» por mes"
    - "Lectura del resumen PDF de la tarjeta y de comprobantes compartidos desde Mercado Pago o el banco, con conciliación sin duplicados"
    - "Foto del ticket con renglones y rubros; lectura del QR de factura de ARCA"
    - "Aviso del banco → gasto en Android (con permiso explícito, en el teléfono, sin IA)"
    - "Plan mensual, presupuestos por rubro y bolsas; cierre de mes en pareja con asistente"
    - "Fondos (billeteras, FCI, plazo fijo, dólares) con aporte por % de lo que sobra y rendimiento real contra inflación"
    - "Metas de compra con comparador cuotas o contado con descuento"
    - "Vista en pesos nominales, en pesos de hoy (IPC) y en dólares"
    - "Lo mío, lo tuyo, lo nuestro: dos personas, reparto y saldo entre ellas"
    - "Módulo opcional de diezmo y ofrendas"
    - "Plantillas y guías gratis y pagas para búsquedas"
  no_incluye:
    - "Pedir claves bancarias o conectar bancos por raspado de pantalla"
    - "Mover dinero, dar préstamos o tarjetas"
    - "Recomendar fondos, bonos, acciones o préstamos (asesoramiento regulado por la CNV)"
    - "Publicidad, venta o uso de datos para terceros"
    - "Contabilidad de empresas o monotributo (otra app, si algún día)"

versiones:
  - v: "Corte 0 · nov–dic 2026 (base existente: versión 32)"
    funciones:
      - "Separar el código de la familia: sin nombres ni bancos por defecto; onboarding genérico"
      - "Datos locales en el teléfono (funciona sin señal) y web instalable"
      - "Exportar e importar para que la familia migre"
  - v: "Corte 1 · beta, ene–feb 2027"
    funciones:
      - "Cuentas y sincronización de pareja con cifrado de punta a punta"
      - "Tickets con IA con tope por usuario; landing con lista de espera; 3 plantillas gratis"
  - v: "Corte 2 · lanzamiento web Argentina, mar 2027"
    funciones:
      - "«Leé tu resumen» v1: Visa y Mastercard de los 6 bancos más grandes, Naranja y Mercado Pago"
      - "Pesos de hoy y dólares; cuotas a la vista"
  - v: "Corte 3 · Android, may–jul 2027"
    funciones:
      - "Google Play con widget, compartir, aviso del banco y voz"
      - "Nido Plus familiar con cobro (requiere la empresa del holding)"
  - v: "Corte 4 · iPhone, oct–dic 2027"
    funciones:
      - "App Store con widget, compartir y Atajos"
  - v: "v5 · 2028"
    funciones:
      - "Uruguay, Chile, México (meses sin intereses) y España; comparador cuotas/contado por país"
  - v: "v6 · 2029–2030"
    funciones:
      - "Finanzas abiertas si el BCRA las habilita (opcional, sin romper la promesa de privacidad); asistente de cierre con IA; informe anual de la familia"

diferencial:
  - "Hecha para cómo se vive la plata acá: cuotas, cierre de tarjeta, inflación, dólares y fondos de billetera, de fábrica."
  - "La foto completa de la casa sin mover la plata ni dar claves: resumen PDF, comprobantes compartidos, ticket y aviso del banco en lugar del open banking que no existe."
  - "Pareja de verdad: lo mío, lo tuyo, lo nuestro y un cierre de mes que se hace juntos en cinco minutos."
  - "Privacidad verificable: cifrado de punta a punta; ni nosotros vemos los números. Un banco o una app que vive de vender préstamos no puede prometerlo."
  - "Diseño y tono como Copilot (la referencia mundial), en rioplatense y a precio latinoamericano."
  - "Honestidad: cada pieza existe suelta en algún lado (Copilot el diseño, Money Manager la carga, Bluecoins el aviso del banco, Naranja X la cuenta compartida); nadie las junta para la familia latinoamericana."

benchmark:
  - {de: "Copilot Money", tomamos: "La vara de diseño y velocidad (4,8 estrellas, USD 95 por año solo por experiencia)."}
  - {de: "YNAB", tomamos: "Cada peso con un destino (reparto de lo que sobra a fondos) y una suscripción que cubre a toda la casa."}
  - {de: "Monarch Money", tomamos: "La pareja incluida sin costo extra y la lección de Mint: cobrar suscripción, no vender productos financieros."}
  - {de: "EveryDollar (Ramsey)", tomamos: "La comunidad cristiana como canal; nosotros lo hacemos con Senda y un módulo opcional de mayordomía."}
  - {de: "Money Manager y Monefy", tomamos: "La carga manual rapidísima que sostiene a millones sin conectar bancos."}
  - {de: "Mobills y Organizze (Brasil)", tomamos: "La prueba de que en Latinoamérica se paga una suscripción de finanzas personales."}
  - {de: "Splitwise", tomamos: "Lo que no hay que hacer: achicar lo gratis de golpe."}
  - {de: "Naranja X Cuenta Compartida y Supervielle SuperFamilia", tomamos: "La demanda local de organizar la plata en familia; nosotros sin mover la plata y con todos los bancos."}

contenido:
  - "Lectores de resúmenes por emisor y reglas de clasificación que mejoran con cada resumen (solo plantillas, nunca datos de usuarios)."
  - "Series públicas: IPC del INDEC, cotizaciones del BCRA y expectativas del REM, con fuente y fecha."
  - "Plantillas y guías con números de ejemplo, nunca reales."

difusion:
  principal: "Búsquedas en Google y en respuestas de IA con calculadoras y guías que la gente ya busca («¿cuotas o contado?», «cuánto tengo comprometido en cuotas», «planilla de gastos familiares 2027», «cómo dividir gastos en pareja»), cada una con «hacelo automático en Nido»."
  apoyo:
    - "Plantillas gratis y pagas en la web propia, Gumroad y Etsy."
    - "Cuenta temática sin cara (TikTok, Instagram, YouTube cortos): «el cierre de mes de una familia argentina» con números de ejemplo."
  tacticas:
    - "Invitación a la pareja dentro del producto: cada hogar trae un segundo usuario."
    - "Tarjeta del cierre de mes para guardar o compartir (porcentajes, nunca montos)."
    - "Promoción cruzada con Senda (módulo de mayordomía) y el resto de la cartera."
    - "Comunidades de finanzas personales (Reddit, Facebook, Telegram) con la regla 90/10."
    - "Precio fundador congelado para los primeros 500 hogares."

metodologia:
  - "La familia del fundador usa cada versión primero (prueba real diaria, sin horas extra)."
  - "Cortes verticales: cada corte sale entero y usable; versión nueva cada dos semanas."
  - "Beta con 30–50 hogares y 12 entrevistas sobre comportamiento pasado (guion en nido/investigacion.md §8)."
  - "Tablero semanal de activación y retención; comité mensual del holding."

quien:
  claude:
    - "Programa todo: capa de datos local, sincronización cifrada, IA de tickets y resúmenes, apps nativas, cobro"
    - "Escribe guías, plantillas, landing y la cuenta temática; mide y propone"
    - "Prepara textos legales y formularios de tiendas para revisar con abogado"
  vos:
    - "Elegís el nombre y aprobás la marca"
    - "Decidís precio, promesa de privacidad y si va el módulo de mayordomía"
    - "Aprobás cada publicación en tiendas y la apertura de la lista de espera (regla 8)"
    - "Tu familia usa cada versión y avisa lo que molesta"

