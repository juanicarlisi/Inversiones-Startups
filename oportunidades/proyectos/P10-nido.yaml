metricas:
  norte: "Hogares que cierran el mes en la app"
  otras:
    - "Hogares activos por mes y % que sigue cargando a los 60 días"
    - "% de hogares con dos personas"
    - "Hogares pagos y costo de IA por hogar pago"

cortes:
  - "Septiembre de 2027: si no hay 1.500 hogares activos por mes con 25% cargando a los 60 días, ni 40 hogares pagos, se congela: queda como app gratis en modo mantenimiento (la familia la sigue usando) y las horas pasan al backlog."
  - "Nido Plus: si a los 6 meses del cobro hay menos de 1,5% de hogares activos pagando, se revisa precio y valor antes de ir a iPhone y a la región."
  - "Costo: si la IA supera USD 0,30 por hogar pago por mes, se baja de modelo o se ponen topes."

riesgos:
  - "Que la gente no cargue (la causa número uno de abandono) → carga de 3 segundos, resumen PDF que completa huecos, aviso del banco y cierre que perdona."
  - "Mercado Pago o un banco grande lanza «las finanzas de tu casa con todas tus cuentas» cuando haya finanzas abiertas → privacidad verificable, pareja, diseño y velocidad local."
  - "Lectura de resúmenes que se rompe cuando un banco cambia el formato → IA como respaldo de las plantillas y aviso al usuario."
  - "Política de Google Play sobre leer notificaciones → función opcional; si la tienda no la aprueba, queda compartir y resumen."
  - "Datos sensibles (religión, salud) y Ley 25.326 → cifrado de punta a punta, diezmo opcional, abogado antes de lanzar."
  - "Pérdida de la clave de cifrado → código de recuperación de la familia y respaldo cifrado; explicarlo sin miedo."
  - "Baja disposición a pagar en Argentina → plan gratis generoso, precio en pesos, plantillas como ingreso extra, región en 2028."
  - "Horas: marzo–mayo de 2027 el holding queda en ~10 horas por semana → Nido pide solo 0,5 h en ese tramo; el comité decide si se corre otra línea."

pi:
  - "Marca (Alero u otra) en el INPI en clases 9, 36 y 42, a nombre de la empresa del holding, antes del lanzamiento público."
  - "Código, lectores de resúmenes y diseño: secreto comercial y derecho de autor; no patentar."

recordatorios:
  - "Elegir el nombre (Alero recomendado) y pedir la búsqueda en el INPI."
  - "Antes del corte 1: exportar los datos de la familia desde el Artifact (lo hace el fundador; nada se sube al repositorio)."
  - "Juntar, con permiso, 2 resúmenes de tarjeta de ejemplo por banco (tachados) para probar los lectores."

