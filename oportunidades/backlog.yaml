# Backlog del holding (28-09-2026): todas las ideas que no son proyectos principales, adaptadas a una versión viable.
# Pedido del fundador: tomar las ideas secundarias (págs. 26–34 del informe v2) y dejarlas como solución viable en backlog,
# con todo lo aprendido (difusión a costo cero y sin cara, fusión con proyectos vivos, lo que Claude puede hacer hoy).
# Campos: id (del catálogo) · nombre · destino (proyecto con el que se funde, "propio", "canal", "pausa", "trampa")
#         viable (la versión que sí puede funcionar) · desde (primera ventana razonable) · activa (qué la dispara)
#         prioridad (1 = la mejor para trabajar después) · secundario (true = entra en el escenario "principales + secundarios")
# Los números (inversión, horas, chances, ingreso si funciona) salen de oportunidades/catalogo.yaml.

