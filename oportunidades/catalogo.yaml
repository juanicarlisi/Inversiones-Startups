# Catálogo completo de alternativas (2026-09-26). Lo procesa herramientas/catalogo.py → oportunidades/CATALOGO.md e informe 3.
#
# Cada alternativa tiene números para simular corto, mediano y largo plazo:
#   inversion        USD al inicio [mín, más probable, máx]
#   costo_mensual    USD/mes mientras está activa
#   horas_arranque   h/semana los primeros 3 meses · horas_regimen: h/semana después
#   meses_primer_ingreso  cuándo entra el primer dólar
#   p_exito          chances de que "funcione" (definición en cada una)
#   si_sale          ingreso mensual (USD) a los meses 6, 12 y 36 si funciona [malo, normal, bueno]
#   si_no            ingreso mensual típico si no funciona, hasta el mes de corte
#   mes_corte        si no funciona, se cierra en ese mes (dejan de correr costos)
#   valor_residual   (activos comprados) fracción de la inversión que conservás al mes 36 [si funciona, si no]
# Puntajes manuales (1–5): ia (cuánto lo hace la IA), sin_venta (no requiere venta cara a cara), encaje (divertido + tus redes +
# anonimato + tu conocimiento). El resto de los puntajes se calcula con los números (ver herramientas/catalogo.py).
# origen: lista = surgió de los ejemplos del fundador (reformulado, sin citar); nueva = propuesta del sistema.
# ruta: roadmap de las primeras 26 semanas [fase, semana desde, semana hasta, quién (claude|vos|ambos), qué se hace].
#       Si el veredicto es "no" (así no), la ruta es la de la mejor versión. Las fichas con detalle usan "gantt".
# revive: condición que haría volver a mirar una alternativa sin versión viable hoy.
# veredicto "plan" (28-09-2026): está en el plan 2026–2030 como proyecto principal o producto de un proyecto principal;
#   su definición completa vive en oportunidades/proyectos/ (campo proyecto) y sus números se sincronizan con herramientas/holding.py.
# Todo número es ESTIMACIÓN o HIPÓTESIS salvo que "evidencia" cite un HECHO (detalle en conocimiento/2026-09-26-investigacion-*.md).

