# Parámetros globales de las herramientas. Cambiarlos es una decisión: registrarla en cartera/decisiones.md.

# Valor de una hora del fundador (USD) para calcular el "recurso" de cada oportunidad.
tarifa_sombra_usd_hora: 10

# Horizonte de evaluación (meses) y aproximación del flujo acumulado con rampa lineal (= horizonte / 2).
horizonte_meses: 36

# Pesos del scorecard (deben sumar 100). Ver doctrina/01-marco-de-evaluacion.md
pesos:
  dolor_y_pago: 15
  economia_unitaria: 15
  distribucion: 15
  defensibilidad: 10
  ajuste_fundador: 10
  palanca_ia: 10
  ventana: 5
  opcionalidad: 5
  sinergias: 5
  velocidad_aprendizaje: 5
  robustez: 5

# Umbrales de lectura
umbral_puntaje_validar: 55
umbral_puntaje_prioridad: 70
umbral_ivr_minimo: 1.0

# Tesorería (vara mínima)
tasa_tesoreria_anual: 0.07

# Días sin revisión a partir de los cuales una ficha se marca como vencida
dias_vencimiento: 90

# Estados válidos y orden de presentación en el tablero
estados: [escalar, construir, validar, explorar, inversion, radar, pausa, descartada]

roles_validos: [motor-de-caja, plataforma, canal, datos, activo-de-renta, opcion, cobertura]
