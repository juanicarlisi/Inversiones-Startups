id: OP-14
nombre: "Una app de suscripción en una tienda B2B (Shopify App Store / Chrome Web Store) que ya probó demanda como herramienta"
unidad_salida: "USD/mes (mes 18)"
iteraciones: 20000
semilla: 42
exito: 0.20
valor_fracaso: -40
supuestos:
  suscriptores: {min: 15, modo: 60, max: 250, desc: "HIPÓTESIS: suscriptores pagos al mes 18 si la app encuentra demanda"}
  precio: {min: 6, modo: 12, max: 30, desc: "HECHO→ESTIMACIÓN: mediana del plan más barato de apps pagas en Shopify USD 9,99/mes (2026)"}
  comision: {min: 0.0, modo: 0.05, max: 0.15, desc: "HECHO: Shopify 0% hasta USD 1 M de por vida; ExtensionPay 5%; merchant of record 5% + 0,50"}
  costos: {min: 20, modo: 60, max: 150, desc: "ESTIMACIÓN: hosting, APIs (incluida IA) y soporte asistido por IA"}
calculos:
  ingresos: suscriptores * precio * (1 - comision)
  margen: ingresos - costos
salida: margen
mostrar: [ingresos]
umbrales:
  - {nombre: "Cubre sus costos", valor: 0}
  - {nombre: "USD 400/mes", valor: 400}
  - {nombre: "USD 1.000/mes", valor: 1000}
lectura: >
  Un acierto rinde mucho más por herramienta que la fábrica, pero pide producto, reseñas y soporte. Por eso no se arranca de cero:
  se "gradúa" una herramienta de OP-12 que ya mostró usuarios recurrentes. Chrome: la mitad de las extensiones monetizadas gana
  menos de USD 100/mes y ~5% más de USD 10.000.
