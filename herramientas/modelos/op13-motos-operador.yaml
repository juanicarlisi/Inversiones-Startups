id: OP-13
nombre: "Financiar la herramienta de trabajo de repartidores: motos alquiladas a través de un operador (por moto)"
unidad_salida: "% anual sobre lo invertido"
iteraciones: 20000
semilla: 42
supuestos:
  precio_moto: {min: 2300, modo: 2500, max: 2900, desc: "HECHO→ESTIMACIÓN: Honda Wave 110S $3,43–4,02 M (sep-2026) ≈ USD 2.220–2.600 + patentamiento"}
  alquiler_bruto: {min: 250, modo: 330, max: 400, desc: "HECHO→ESTIMACIÓN: $120–125 mil por semana con seguro, patente y mantenimiento ≈ USD 330/mes a $1.545 (sep-2026); baja si el peso se deprecia"}
  ocupacion: {min: 0.70, modo: 0.88, max: 0.95, desc: "HIPÓTESIS: semanas cobradas sobre semanas totales (hay lista de espera; la mora y el recambio de repartidores la bajan)"}
  parte_inversor: {min: 0.30, modo: 0.40, max: 0.50, desc: "HIPÓTESIS: lo que el operador paga al dueño después de seguro, patente, mantenimiento, cobranza y su margen"}
  vida_util_meses: {min: 24, modo: 30, max: 42, desc: "HIPÓTESIS: vida útil en reparto intensivo"}
  valor_residual: {min: 0.15, modo: 0.30, max: 0.45, desc: "HIPÓTESIS: valor de reventa al final, como fracción del precio"}
  perdida: {tipo: bernoulli, p: 0.12, desc: "HIPÓTESIS: pérdida grave en la vida útil (robo sin cobertura plena, fraude del operador, juicio por accidente)"}
calculos:
  ingreso_mensual: alquiler_bruto * ocupacion * parte_inversor
  total: ingreso_mensual * vida_util_meses * (1 - 0.5 * perdida) + precio_moto * valor_residual * (1 - perdida) - precio_moto
  retorno_anual_pct: total / precio_moto / (vida_util_meses / 12) * 100
salida: retorno_anual_pct
mostrar: [ingreso_mensual]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
  - {nombre: "Supera la tesorería (~7%)", valor: 7}
  - {nombre: "Supera 20% anual", valor: 20}
lectura: >
  Rendimiento alto porque el repartidor no tiene crédito y paga caro el acceso a la moto: es el precio del riesgo (robo, mora,
  accidentes, operador). Solo tiene sentido con un operador verificable, contrato escrito, seguro de responsabilidad civil con
  límites altos y la moto con rastreo. La variante socialmente más sana (alquiler con opción de compra) baja un poco el retorno y
  alinea incentivos con el repartidor.
