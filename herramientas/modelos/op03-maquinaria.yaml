id: OP-03
nombre: "Puente de maquinaria usada Europa → pymes argentinas (modelo de intermediación)"
unidad_salida: "USD/mes (promedio anual)"
iteraciones: 20000
semilla: 42
exito: 0.4   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  operaciones_anio: {min: 0.5, modo: 3, max: 8, desc: "HIPÓTESIS: operaciones cerradas por año en régimen (año 2)"}
  valor_operacion: {min: 20000, modo: 60000, max: 180000, desc: "ESTIMACIÓN: valor FOB promedio de máquina/línea (USD)"}
  comision_pct: {min: 0.05, modo: 0.08, max: 0.12, desc: "HIPÓTESIS: comisión de éxito sobre FOB"}
  fee_servicios: {min: 500, modo: 1500, max: 3000, desc: "HIPÓTESIS: honorario fijo por gestión (búsqueda, proyecto Decreto 483/2026, coordinación logística)"}
  costo_directo_op: {min: 300, modo: 800, max: 2500, desc: "ESTIMACIÓN: costo propio por operación (traducciones, llamadas, eventual viaje; la inspección la paga el cliente)"}
  prob_problema: {min: 0.02, modo: 0.08, max: 0.20, desc: "HIPÓTESIS: probabilidad de que una operación salga mal (máquina no funciona, demora grave)"}
  costo_problema: {min: 1000, modo: 5000, max: 15000, desc: "HIPÓTESIS: costo esperado de un problema (devolver comisión, reclamo)"}
  marketing_anual: {min: 600, modo: 1500, max: 4000, desc: "ESTIMACIÓN: pauta a industriales + contenido + eventos"}
calculos:
  ingreso_por_op: valor_operacion * comision_pct + fee_servicios
  costo_por_op: costo_directo_op + prob_problema * costo_problema
  margen_anual: operaciones_anio * (ingreso_por_op - costo_por_op) - marketing_anual
  margen_mensual: margen_anual / 12
salida: margen_mensual
mostrar: [ingreso_por_op, margen_anual]
umbrales:
  - {nombre: "Cubre el aporte mensual (USD 400)", valor: 400}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  Negocio de pocas operaciones grandes: la cantidad de operaciones por año y el valor promedio explican casi todo.
  Con 3–4 operaciones medianas por año ya es un motor de caja con capital casi nulo. El riesgo real no está en el modelo
  sino en la reputación: una máquina que no funciona puede cerrar el canal. Por eso inspección independiente obligatoria.
