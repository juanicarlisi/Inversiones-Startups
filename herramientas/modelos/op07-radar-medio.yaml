id: OP-07
nombre: "Motor de inteligencia + medio vertical (comex / pymes / proveedores RIGI) — régimen al mes 24"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.5   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  suscriptores_pagos: {min: 10, modo: 80, max: 400, desc: "HIPÓTESIS: suscriptores pagos del tier premium"}
  precio: {min: 5, modo: 10, max: 20, desc: "HIPÓTESIS: precio mensual del tier premium (USD)"}
  sponsors: {min: 0, modo: 0.5, max: 3, desc: "HIPÓTESIS: sponsors por mes (despachantes, forwarders, ALyC, software)"}
  tarifa_sponsor: {min: 100, modo: 250, max: 600, desc: "HIPÓTESIS: USD por mes por sponsor"}
  valor_leads: {min: 0, modo: 200, max: 1000, desc: "INFERENCIA: valor mensual de los leads que el medio deriva a otras unidades (OP-02, OP-03, OP-04)"}
  herramientas: {min: 30, modo: 60, max: 150, desc: "ESTIMACIÓN: plataforma de envíos, dominio, API"}
  pauta: {min: 0, modo: 100, max: 300, desc: "ESTIMACIÓN: promoción"}
calculos:
  ingresos_directos: suscriptores_pagos * precio + sponsors * tarifa_sponsor
  valor_total: ingresos_directos + valor_leads - herramientas - pauta
salida: valor_total
mostrar: [ingresos_directos]
umbrales:
  - {nombre: "Genera valor (> USD 100/mes)", valor: 100}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
lectura: >
  Como negocio aislado es modesto y lento. Su valor real es de infraestructura: audiencia propia, flujo de oportunidades y
  leads para las unidades operativas, y el radar interno que igual hay que mantener. Casi todo el trabajo lo hace la IA.
