id: OP-12
nombre: "Fábrica de herramientas para desarrolladores y agentes de IA (Apify Store + MCP + x402), construida por Claude"
unidad_salida: "USD/mes (mes 12)"
iteraciones: 20000
semilla: 42
supuestos:
  herramientas: {min: 15, modo: 35, max: 70, desc: "HIPÓTESIS: herramientas publicadas y mantenidas al mes 12 (Claude construye ~1 por semana; el fundador revisa)"}
  frac_con_ingresos: {min: 0.10, modo: 0.25, max: 0.40, desc: "HIPÓTESIS: fracción que genera algún ingreso (fuera del top-900 de Apify la mayoría no cobra)"}
  ingreso_tipico: {min: 2, modo: 8, max: 25, desc: "HECHO→ESTIMACIÓN: ingreso neto mensual de una herramienta que cobra algo; mediana USD 14 entre las 829 de terceros del top-900 (2026)"}
  hit: {tipo: bernoulli, p: 0.20, desc: "HIPÓTESIS: al menos una herramienta 'pega' (usuarios recurrentes o un cliente grande)"}
  ingreso_hit: {min: 150, modo: 400, max: 1500, desc: "HECHO→ESTIMACIÓN: la primera herramienta de ParseForge paga ~USD 1.000/mes; los mejores independientes > USD 10.000"}
  costo_fijo: {min: 30, modo: 50, max: 80, desc: "ESTIMACIÓN: parte atribuible de Claude Max 5x (compartido con todo el sistema) + proxies y dominios"}
calculos:
  ingresos_cola: herramientas * frac_con_ingresos * ingreso_tipico
  ingresos: ingresos_cola + hit * ingreso_hit
  margen: ingresos - costo_fijo
salida: margen
mostrar: [ingresos_cola, ingresos]
umbrales:
  - {nombre: "Cubre su costo", valor: 0}
  - {nombre: "USD 100/mes netos", valor: 100}
  - {nombre: "USD 400/mes netos (iguala el aporte)", valor: 400}
lectura: >
  Distribución de ley de potencias: la mediana es modesta y la media la tiran pocos aciertos. La variable que más mueve el
  resultado es si aparece una herramienta que pega; por eso la estrategia es muchos intentos baratos con regla de corte, no una
  apuesta grande. El valor extra (no modelado) es aprender a operar herramientas que después se pueden comprar (OP-08) y quedar
  posicionado en la economía de agentes que pagan por uso (x402).
