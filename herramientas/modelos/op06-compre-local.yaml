id: OP-06
nombre: "Puente de compre local minero (San Juan) para proveedores de afuera — régimen al mes 24"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.2   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  clientes_retainer: {min: 0, modo: 2, max: 6, desc: "HIPÓTESIS: proveedores extranjeros o de otras provincias con abono mensual"}
  fee_retainer: {min: 800, modo: 1500, max: 3000, desc: "HIPÓTESIS: abono mensual por inteligencia + representación + búsqueda de socio local"}
  contratos_anio: {min: 0, modo: 2, max: 6, desc: "HIPÓTESIS: contratos cerrados por año para clientes"}
  valor_contrato: {min: 100000, modo: 400000, max: 2000000, desc: "HIPÓTESIS: valor del primer año de cada contrato (USD)"}
  success_fee: {min: 0.015, modo: 0.03, max: 0.05, desc: "HIPÓTESIS: comisión de éxito sobre el primer año"}
  socio_pct: {min: 0.3, modo: 0.4, max: 0.5, desc: "HIPÓTESIS: participación del socio local en San Juan"}
  viajes: {min: 150, modo: 350, max: 700, desc: "ESTIMACIÓN: viajes CABA–San Juan prorrateados por mes"}
  fijos: {min: 50, modo: 100, max: 200, desc: "ESTIMACIÓN"}
calculos:
  ingresos: clientes_retainer * fee_retainer + contratos_anio * valor_contrato * success_fee / 12
  neto: ingresos * (1 - socio_pct) - viajes - fijos
salida: neto
mostrar: [ingresos]
umbrales:
  - {nombre: "Genera caja (> USD 100/mes)", valor: 100}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  Economía atractiva si se consiguen 2 clientes con abono y algún contrato; pero la probabilidad de lograrlo desde CABA sin
  red minera es baja. La variable clave no está en el modelo: encontrar un socio sanjuanino con reputación.
