id: OP-01
nombre: "Administración de consorcios aumentada por IA (CABA) — régimen al mes 30"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.55   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  edificios: {min: 6, modo: 25, max: 70, desc: "HIPÓTESIS: edificios administrados al mes 30 (orgánico ~1/mes desde el mes 6 + eventual compra de cartera)"}
  honorario: {min: 50, modo: 80, max: 130, desc: "HECHO→ESTIMACIÓN: honorario CAPHAI jun-2026 $50–400k/mes según tamaño; mix medio ≈ $120k ≈ USD 80"}
  extra_pct: {min: 0.05, modo: 0.15, max: 0.30, desc: "ESTIMACIÓN: ingresos extra (liquidación de sueldos del encargado, certificados, gestiones) como % del honorario"}
  costo_ia: {min: 4, modo: 7, max: 15, desc: "ESTIMACIÓN: API + WhatsApp + software + hosting por edificio y mes"}
  horas_por_edificio: {min: 1.5, modo: 3, max: 5, desc: "HIPÓTESIS: horas humanas por edificio/mes con IA (asambleas, emergencias, supervisión). Tradicional ≈ 8–12"}
  costo_hora: {min: 4, modo: 6, max: 9, desc: "ESTIMACIÓN: costo de una hora de asistente operativo (USD)"}
  frac_adquiridos: {min: 0, modo: 0.2, max: 0.5, desc: "HIPÓTESIS: fracción de edificios que vino de comprar carteras"}
  earnout_pct: {min: 0.2, modo: 0.3, max: 0.4, desc: "HIPÓTESIS: % del honorario que se paga al vendedor durante el earn-out"}
  fijos: {min: 80, modo: 150, max: 300, desc: "ESTIMACIÓN: fijos (contador, renovación RPA, seguros, cuenta bancaria, dominio)"}
  nuevos_mes: {min: 0.5, modo: 1.5, max: 4, desc: "HIPÓTESIS: edificios nuevos por mes en régimen"}
  cac: {min: 100, modo: 300, max: 900, desc: "HIPÓTESIS: costo de adquirir un edificio (pauta + auditorías gratuitas + horas)"}
calculos:
  ingresos: edificios * honorario * (1 + extra_pct)
  costo_servir: edificios * (costo_ia + horas_por_edificio * costo_hora)
  costo_earnout: edificios * frac_adquiridos * honorario * earnout_pct
  margen_operativo: ingresos - costo_servir - costo_earnout - fijos
  inversion_crecimiento: nuevos_mes * cac
  caja_neta: margen_operativo - inversion_crecimiento
  margen_pct: margen_operativo / max(ingresos, 1)
salida: margen_operativo
mostrar: [ingresos, costo_servir, caja_neta, margen_pct]
umbrales:
  - {nombre: "Cubre el aporte mensual (USD 400)", valor: 400}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  El resultado lo decide casi todo la cantidad de edificios (distribución) y el honorario; la IA baja el costo de servir
  de ~USD 50–70 por edificio (modelo tradicional, 8–12 h/mes) a ~USD 25, lo que lleva el margen operativo a 55–65%.
  Primera validación: ¿cuántos edificios consigue un imán de "auditoría gratuita de expensas" por cada USD 100 de pauta?
  Segunda: precio real de las carteras en venta (meses de honorario) y su retención tras el traspaso.
