id: OP-05
nombre: "Marca matera premium exportable (Amazon EE.UU. vía FBA, envío a granel) — régimen al mes 18"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.35   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
valor_fracaso: -150   # si fracasa: pérdida mensual hasta liquidar
supuestos:
  unidades_mes: {min: 60, modo: 350, max: 1500, desc: "HIPÓTESIS: kits vendidos por mes en régimen"}
  precio: {min: 35, modo: 52, max: 75, desc: "ESTIMACIÓN: precio de venta de un kit premium (calabaza/cuero + bombilla de alpaca + accesorios); Amazon muestra kits USD 25–60"}
  cogs: {min: 10, modo: 17, max: 26, desc: "ESTIMACIÓN: costo del kit artesanal en Argentina + packaging (USD)"}
  flete_arancel: {min: 2.5, modo: 4.5, max: 8, desc: "ESTIMACIÓN: flete a granel a depósito FBA + arancel EE.UU. (efectivo promedio AR ~5,7%)"}
  fba: {min: 6, modo: 8, max: 10, desc: "ESTIMACIÓN: tarifa de fulfillment de Amazon por unidad"}
  comision: {tipo: fijo, valor: 0.15, desc: "HECHO (orden de magnitud): comisión de referencia de Amazon ~15%"}
  tacos: {min: 0.08, modo: 0.18, max: 0.30, desc: "HIPÓTESIS CRÍTICA: publicidad como % de ventas totales"}
  devoluciones: {min: 0.02, modo: 0.05, max: 0.10, desc: "ESTIMACIÓN: devoluciones y roturas como % de ventas"}
  fijos: {min: 100, modo: 250, max: 500, desc: "ESTIMACIÓN: software, almacenamiento, fotos, cuenta vendedor"}
calculos:
  costo_unitario: cogs + flete_arancel + fba + precio * (comision + tacos + devoluciones)
  contrib_unidad: precio - costo_unitario
  margen: unidades_mes * contrib_unidad - fijos
  capital_trabajo: unidades_mes * 3 * (cogs + flete_arancel)
  margen_pct: contrib_unidad / precio
salida: margen
mostrar: [contrib_unidad, margen_pct, capital_trabajo]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  La exportación de accesorios de mate por Amazon solo funciona en el segmento premium, con precio ≥ USD 50 y publicidad
  ≤ 15% de las ventas. En el segmento medio (USD 30–40) la contribución por unidad es cercana a cero por costos de
  fulfillment y publicidad. Además inmoviliza capital de trabajo (3 meses de inventario). Validar precio y TACoS con una
  tanda chica (100–200 kits) antes de producir en serie.
