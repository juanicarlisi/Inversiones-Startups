id: OP-08b
nombre: "Compra de un micro-negocio digital que ya vende solo (USD 3–12 k), operado con IA, a 3 años"
unidad_salida: "% anual sobre el precio (3 años, incluye valor final)"
iteraciones: 20000
semilla: 42
supuestos:
  precio: {min: 3000, modo: 6000, max: 12000, desc: "HIPÓTESIS: precio pagado; se junta con ~12 meses de aporte"}
  multiplo: {min: 1.4, modo: 2.0, max: 3.2, desc: "HECHO→ESTIMACIÓN: Flippa, mediana 1,68x el beneficio anual en operaciones de USD 10–100 k; SaaS en Acquire 3,9x (2025)"}
  variacion_1a: {min: -0.50, modo: -0.15, max: 0.20, desc: "HIPÓTESIS: cambio del beneficio en el primer año (se va el dueño, competencia con IA, cambios de la plataforma)"}
  tendencia: {min: -0.30, modo: -0.05, max: 0.20, desc: "HIPÓTESIS: variación anual del beneficio desde el segundo año"}
  mejora_ia: {min: 0.0, modo: 0.10, max: 0.40, desc: "HIPÓTESIS: mejora por operar con IA (soporte, arreglos, precios, funciones nuevas)"}
  colapso: {tipo: bernoulli, p: 0.20, desc: "HIPÓTESIS: fraude no detectado o pérdida del canal (más probable en operaciones chicas)"}
  mes_colapso: {min: 1, modo: 6, max: 24, desc: "HIPÓTESIS: mes en que colapsa, si colapsa"}
  costo_operacion: {min: 15, modo: 40, max: 100, desc: "ESTIMACIÓN: hosting, herramientas y cuota de IA atribuible (USD/mes)"}
  factor_salida: {min: 0.6, modo: 0.85, max: 1.0, desc: "HIPÓTESIS: múltiplo de reventa al año 3 relativo al de compra"}
calculos:
  beneficio_mensual: precio / multiplo / 12
  flujo_vivo: beneficio_mensual * (1 + variacion_1a) * (1 + mejora_ia) - costo_operacion
  flujo_mes12: flujo_vivo * (1 - colapso)
  caja_36: (1 - colapso) * flujo_vivo * 12 * (1 + (1 + tendencia) + (1 + tendencia) ** 2) + colapso * flujo_vivo * mes_colapso
  valor_final: (1 - colapso) * max(flujo_vivo * (1 + tendencia) ** 2, 0) * 12 * multiplo * factor_salida
  retorno_anual_pct: ((caja_36 + valor_final) / precio - 1) / 3 * 100
salida: retorno_anual_pct
mostrar: [beneficio_mensual, flujo_mes12]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
  - {nombre: "Supera la tesorería (~7% anual)", valor: 7}
  - {nombre: "Supera 20% anual", valor: 20}
lectura: >
  Es la forma más directa de "comprar ingresos que ya se venden solos", pero el precio bajo de los activos chicos es el precio de
  su riesgo (dependencia del dueño, caída de la demanda, fraude). Comprando "al promedio" el rendimiento esperado se parece al de
  la tesorería con mucho más riesgo; lo que lo vuelve atractivo es comprar mejor que el promedio (menos probabilidad de colapso)
  y operar mejor (tendencia y mejora). Las dos variables que más mueven el resultado son la tendencia del negocio y el múltiplo
  pagado: la due diligence vale más que la negociación.
