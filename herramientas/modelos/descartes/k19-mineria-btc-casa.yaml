id: K19
nombre: "Minería de bitcoin en casa (CABA) con un equipo de ~200 TH/s"
unidad_salida: "USD/mes por equipo"
iteraciones: 20000
semilla: 42
supuestos:
  hashprice: {min: 25, modo: 38, max: 55, desc: "HECHO→ESTIMACIÓN: USD 39,6 por PH/s por día el 07-09-2026 (jul-2026 ~29)"}
  th: {tipo: fijo, valor: 200, desc: "Equipo tipo Antminer S21 (200 TH/s)"}
  eficiencia: {min: 15, modo: 17.5, max: 21, desc: "HECHO: J/TH de la generación S21"}
  tarifa: {min: 0.11, modo: 0.14, max: 0.18, desc: "HECHO→ESTIMACIÓN: CABA residencial sin subsidio ~$158–207/kWh + impuestos ≈ USD 0,11–0,18"}
  precio_equipo: {min: 900, modo: 1230, max: 1800, desc: "HECHO→ESTIMACIÓN: S21 200 TH nuevo USD 907–1.230 (sep-2026) + importación"}
  vida_util: {min: 18, modo: 24, max: 36, desc: "HIPÓTESIS: meses hasta que el equipo deja de ser competitivo (halving esperado en 2028)"}
calculos:
  ingreso: hashprice * th / 1000 * 30
  kwh_mes: eficiencia * th * 24 * 30 / 1000
  electricidad: kwh_mes * tarifa
  amortizacion: precio_equipo / vida_util
  margen: ingreso - electricidad - amortizacion
salida: margen
mostrar: [ingreso, electricidad, kwh_mes]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
lectura: >
  Pierde plata antes de pagar el equipo: con la electricidad residencial de CABA el costo de energía supera al ingreso. Además
  consume ~2.500 kWh/mes (la categoría de consumo más cara), hace ruido y calor, y en 2028 el halving corta el ingreso a la mitad.
