id: K20
nombre: "Alquilar una GPU de gama alta (tipo RTX 5090) desde casa en un marketplace de cómputo"
unidad_salida: "USD/mes por equipo"
iteraciones: 20000
semilla: 42
supuestos:
  precio_hora: {min: 0.20, modo: 0.30, max: 0.45, desc: "HECHO: RTX 5090 en Vast.ai desde ~USD 0,27–0,31/h (spot desde 0,09) en 2026"}
  utilizacion: {min: 0.25, modo: 0.50, max: 0.80, desc: "HIPÓTESIS: fracción del tiempo alquilada (depende de confiabilidad y conexión)"}
  comision: {tipo: fijo, valor: 0.15, desc: "HECHO→ESTIMACIÓN: comisión de la plataforma al anfitrión ~15%"}
  consumo_kw: {min: 0.45, modo: 0.60, max: 0.75, desc: "ESTIMACIÓN: placa + resto del equipo bajo carga"}
  tarifa: {min: 0.11, modo: 0.14, max: 0.18, desc: "HECHO→ESTIMACIÓN: CABA residencial sin subsidio + impuestos"}
  precio_equipo: {min: 4000, modo: 5000, max: 6500, desc: "HECHO→ESTIMACIÓN: placa USD 3.500–5.000 en sep-2026 (escasez de GDDR7) + resto del equipo + importación formal (supera el tope courier de USD 3.000)"}
  vida_util: {min: 24, modo: 36, max: 48, desc: "HIPÓTESIS: meses de vida comercial"}
  valor_residual: {min: 0.20, modo: 0.35, max: 0.50, desc: "HIPÓTESIS: reventa al final"}
calculos:
  ingreso: precio_hora * 720 * utilizacion * (1 - comision)
  electricidad: (consumo_kw * utilizacion + 0.08) * 720 * tarifa
  amortizacion: precio_equipo * (1 - valor_residual) / vida_util
  margen: ingreso - electricidad - amortizacion
salida: margen
mostrar: [ingreso, electricidad, amortizacion]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
  - {nombre: "Rinde más que la tesorería con el mismo capital (~USD 30/mes)", valor: 30}
lectura: >
  Se compite contra centros de datos con energía más barata y conexiones más confiables; la placa se deprecia y los precios de
  alquiler bajan a medida que entra oferta. El caso típico pierde plata o empata; el caso bueno no compensa el riesgo frente a
  la tesorería.
