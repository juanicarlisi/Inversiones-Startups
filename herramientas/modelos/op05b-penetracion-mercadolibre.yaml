id: OP-05b
nombre: "Idea original del fundador: 6 meses de precio de penetración en Mercado Libre (mates, termos, bombillas)"
unidad_salida: "USD (valor neto de la campaña a 24 meses)"
iteraciones: 20000
semilla: 42
supuestos:
  meses_campania: {tipo: fijo, valor: 6, desc: "Propuesta del fundador"}
  unidades_mes: {min: 100, modo: 400, max: 1200, desc: "HIPÓTESIS: unidades vendidas por mes con precio regalado"}
  subsidio_unidad: {min: 3, modo: 6, max: 10, desc: "ESTIMACIÓN: descuento vs precio normal + margen negativo por unidad (USD)"}
  clientes_por_unidad: {tipo: fijo, valor: 0.9, desc: "ESTIMACIÓN: algunos compran más de una unidad"}
  recompra_anual: {min: 0.05, modo: 0.25, max: 0.6, desc: "HIPÓTESIS: compras por cliente y año a precio normal (bienes durables: un termo dura años)"}
  margen_normal: {min: 2, modo: 4.5, max: 8, desc: "ESTIMACIÓN: margen por unidad a precio normal tras comisión ML (~13–17%), envío, IVA/IIBB"}
  organicas_extra_mes: {min: 0, modo: 120, max: 600, desc: "HIPÓTESIS CRÍTICA: ventas orgánicas extra por mes gracias al ranking/reseñas ganados"}
  duracion_efecto: {min: 3, modo: 12, max: 24, desc: "HIPÓTESIS: meses que dura el efecto ranking frente a competidores que también bajan precio"}
calculos:
  costo_campania: meses_campania * unidades_mes * subsidio_unidad
  clientes: meses_campania * unidades_mes * clientes_por_unidad
  valor_recompra: clientes * recompra_anual * 2 * margen_normal
  valor_ranking: organicas_extra_mes * margen_normal * duracion_efecto
  valor_neto: valor_recompra + valor_ranking - costo_campania
  roi: valor_neto / max(costo_campania, 1)
salida: valor_neto
mostrar: [costo_campania, valor_recompra, valor_ranking, roi]
umbrales:
  - {nombre: "Recupera lo invertido", valor: 0}
  - {nombre: "Duplica lo invertido (aprox.)", valor: 10000}
lectura: >
  Tal como fue planteada, la campaña cuesta del orden de USD 5.000–30.000 (equivale a 1–6 años del aporte mensual) y su
  valor depende casi por completo de un supuesto: que el ranking ganado en Mercado Libre genere ventas orgánicas extra
  durante muchos meses. La recompra aporta poco porque mates, termos y bombillas son bienes durables. Conclusión: no hacer
  6 meses de precio regalado; sí medir la elasticidad del ranking con una prueba de 4–6 semanas, 2–3 productos y un tope
  de USD 500–1.000.
