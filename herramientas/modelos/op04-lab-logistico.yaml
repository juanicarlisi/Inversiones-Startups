id: OP-04
nombre: "Laboratorio de decisiones logísticas (simulación como servicio) — régimen al mes 18"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.45   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  proyectos_trimestre: {min: 0.3, modo: 1, max: 3, desc: "HIPÓTESIS: estudios vendidos por trimestre"}
  ticket: {min: 1000, modo: 3000, max: 8000, desc: "HIPÓTESIS: precio por estudio (dimensionamiento de flota, depósito, muelles, multimodal)"}
  costo_directo: {min: 50, modo: 200, max: 800, desc: "ESTIMACIÓN: datos, relevamiento, traslados por estudio"}
  clientes_recurrentes: {min: 0, modo: 1, max: 4, desc: "HIPÓTESIS: clientes que pagan mantenimiento del modelo/gemelo digital"}
  fee_recurrente: {min: 150, modo: 400, max: 1000, desc: "HIPÓTESIS: fee mensual por modelo mantenido"}
  herramientas: {min: 100, modo: 150, max: 220, desc: "ESTIMACIÓN: Claude Max 5x/20x + cómputo"}
  marketing: {min: 50, modo: 150, max: 400, desc: "ESTIMACIÓN: contenido técnico + LinkedIn + eventos"}
  horas_por_proyecto: {min: 15, modo: 35, max: 80, desc: "ESTIMACIÓN: horas del fundador por estudio (la IA construye el modelo)"}
calculos:
  ingresos: proyectos_trimestre / 3 * ticket + clientes_recurrentes * fee_recurrente
  costos: proyectos_trimestre / 3 * costo_directo + herramientas + marketing
  margen: ingresos - costos
  horas_mes: proyectos_trimestre / 3 * horas_por_proyecto
  usd_por_hora: margen / max(horas_mes, 1)
salida: margen
mostrar: [ingresos, horas_mes, usd_por_hora]
umbrales:
  - {nombre: "Cubre herramientas + aporte (USD 400)", valor: 400}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  El valor está en vender decisiones caras (flota, depósito, multimodal) y reutilizar los modelos. El precio y la
  frecuencia de proyectos dominan. Es la forma de monetizar el conocimiento logístico del fundador desde el mes 1 y
  de financiar, con clientes reales, la eventual versión producto (SaaS vertical).
