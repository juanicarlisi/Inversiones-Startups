# Plantilla de modelo de escenarios. Copiar como opXX-nombre.yaml.
# Cada supuesto: rango mínimo / más probable (modo) / máximo con distribución triangular (por defecto),
# o {tipo: fijo, valor: X}, {tipo: uniforme, min, max}, {tipo: bernoulli, p}.
# Etiquetar en 'desc' si es HECHO, ESTIMACIÓN o HIPÓTESIS y cómo se valida.
id: OP-XX
nombre: "Descripción corta del modelo"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
supuestos:
  clientes: {min: 5, modo: 20, max: 60, desc: "HIPÓTESIS: clientes activos al mes 24"}
  precio: {min: 20, modo: 40, max: 80, desc: "HIPÓTESIS: precio mensual por cliente (USD)"}
  costo_variable: {min: 5, modo: 10, max: 20, desc: "ESTIMACIÓN: costo de servir por cliente (USD/mes)"}
  fijos: {min: 50, modo: 100, max: 200, desc: "ESTIMACIÓN: costos fijos mensuales"}
calculos:
  ingresos: clientes * precio
  margen: ingresos - clientes * costo_variable - fijos
salida: margen
mostrar: [ingresos]
umbrales:
  - {nombre: "Cubre el aporte mensual (USD 400)", valor: 400}
lectura: >
  Qué significa el resultado y qué hay que validar primero.
