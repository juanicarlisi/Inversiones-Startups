id: OP-02
nombre: "Oficina virtual con IA para transportistas pyme — régimen al mes 24"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
exito: 0.35   # probabilidad de lograr tracción (juicio inicial; se actualiza con experimentos)
supuestos:
  clientes: {min: 3, modo: 25, max: 80, desc: "HIPÓTESIS: empresas de transporte (1–20 camiones) activas al mes 24"}
  camiones: {min: 2, modo: 4, max: 10, desc: "HIPÓTESIS: camiones promedio por cliente (programas oficiales apuntan a ≤5)"}
  precio_camion: {min: 12, modo: 25, max: 45, desc: "HIPÓTESIS CRÍTICA: USD por camión/mes (un administrativo part-time cuesta USD 400–800/mes)"}
  costo_ia_camion: {min: 2, modo: 4, max: 8, desc: "ESTIMACIÓN: API + WhatsApp + integraciones por camión/mes"}
  horas_cliente: {min: 1, modo: 2.5, max: 5, desc: "HIPÓTESIS: horas humanas por cliente/mes (excepciones, carga inicial, llamadas)"}
  costo_hora: {min: 4, modo: 6, max: 9, desc: "ESTIMACIÓN: hora de asistente operativo"}
  fijos: {min: 50, modo: 120, max: 250, desc: "ESTIMACIÓN: fijos (software, contador, dominio)"}
  churn: {min: 0.02, modo: 0.04, max: 0.08, desc: "HIPÓTESIS: bajas mensuales"}
  cac: {min: 60, modo: 180, max: 500, desc: "HIPÓTESIS: costo de adquirir un cliente (pauta en grupos/Meta + demo + horas)"}
  nuevos_mes: {min: 1, modo: 3, max: 7, desc: "HIPÓTESIS: clientes nuevos por mes en régimen"}
calculos:
  ingresos: clientes * camiones * precio_camion
  costo_servir: clientes * (camiones * costo_ia_camion + horas_cliente * costo_hora)
  margen_operativo: ingresos - costo_servir - fijos
  contrib_cliente: camiones * (precio_camion - costo_ia_camion) - horas_cliente * costo_hora
  ltv: contrib_cliente / churn
  ltv_cac: ltv / cac
  caja_neta: margen_operativo - nuevos_mes * cac
salida: margen_operativo
mostrar: [ingresos, contrib_cliente, ltv, ltv_cac, caja_neta]
umbrales:
  - {nombre: "Cubre el aporte mensual (USD 400)", valor: 400}
  - {nombre: "Motor de caja (USD 1.000/mes)", valor: 1000}
  - {nombre: "Unidad relevante (USD 3.000/mes)", valor: 3000}
lectura: >
  La variable dominante es el precio por camión, seguida de la cantidad de clientes. La economía unitaria es buena si el
  transportista paga ≥ USD 20 por camión; por debajo de USD 15 la unidad no justifica el esfuerzo comercial. Validar primero
  disposición a pagar con un servicio "concierge" (humano + IA) a 5 transportistas durante 30 días.
