id: OP-08
nombre: "Micro-adquisición de un negocio digital en USD operado con IA (una operación)"
unidad_salida: "USD/mes"
iteraciones: 20000
semilla: 42
supuestos:
  precio_compra: {min: 8000, modo: 20000, max: 45000, desc: "HIPÓTESIS: precio pagado (USD)"}
  multiplo: {min: 2.0, modo: 2.8, max: 3.8, desc: "HECHO→ESTIMACIÓN: múltiplo de SDE anual en negocios chicos con dependencia del dueño (2–4x)"}
  variacion_ingresos: {min: -0.40, modo: -0.10, max: 0.15, desc: "HIPÓTESIS: variación del flujo tras la compra (pérdida de conocimiento del dueño, IA que erosiona el nicho)"}
  mejora_ia: {min: 0.0, modo: 0.15, max: 0.50, desc: "HIPÓTESIS: mejora por operar con IA (soporte, contenido, código, precios)"}
  colapso: {tipo: bernoulli, p: 0.12, desc: "HIPÓTESIS: probabilidad de colapso (fraude, cambio de plataforma, pérdida de canal)"}
  costo_operacion: {min: 50, modo: 120, max: 300, desc: "ESTIMACIÓN: herramientas + freelancers + parte del plan de IA"}
calculos:
  sde_mensual: precio_compra / multiplo / 12
  flujo: sde_mensual * (1 + variacion_ingresos) * (1 + mejora_ia) * (1 - colapso) - costo_operacion
  retorno_anual: flujo * 12 / precio_compra
salida: flujo
mostrar: [sde_mensual, retorno_anual]
umbrales:
  - {nombre: "No pierde plata", valor: 0}
  - {nombre: "USD 400/mes (duplica el aporte)", valor: 400}
lectura: >
  Rinde 20–40% anual en USD en el caso base, con cola de pérdida por colapso. La calidad de la due diligence (verificación de
  ingresos en el procesador de pagos, dependencia de un canal, tendencia) pesa más que el precio. Buena cobertura contra
  riesgo Argentina: ingresos en USD de clientes globales.
