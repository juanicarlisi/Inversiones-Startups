# Proyección de la cartera a 5 años (Monte Carlo). La corre: python3 herramientas/cartera.py proyectar
# Todos los números son HIPÓTESIS de juicio coherentes con las fichas OP-XX; se recalibran con cada experimento.
meses: 60
iteraciones: 5000
semilla: 7
aporte_mensual: 400            # aporte del fundador
tasa_tesoreria_anual: 0.07     # rendimiento de la caja no asignada (ON hard dollar)
gasto_herramientas_mensual: 120 # plan de IA + herramientas del sistema
reinversion_pct: 0.9           # % del flujo de las unidades que vuelve a la cartera (el resto, libre para el fundador)
max_unidades_escaladas: 2      # capacidad del fundador: el comité escala solo las 2 mejores unidades que consumen horas
prob_fundador_sin_tiempo: 0.15 # riesgo común: el fundador no logra dedicar las horas mínimas (todas las unidades fallan)
factor_ejecucion: {min: 0.4, modo: 0.8, max: 1.1}  # multiplicador común sobre los flujos (calidad de ejecución)

unidades:
  - id: OP-01
    nombre: Consorcios con IA
    inicio_mes: 1
    meses_validacion: 6
    costo_validacion_mensual: 120
    prob_exito: 0.55
    rampa_meses: 24
    flujo_regimen: {min: 700, modo: 1500, max: 3800}
    multiplo_valor_meses: 12
  - id: OP-02
    nombre: Oficina IA transportistas
    inicio_mes: 1
    meses_validacion: 4
    costo_validacion_mensual: 80
    prob_exito: 0.35
    rampa_meses: 20
    flujo_regimen: {min: 800, modo: 1500, max: 4500}
    multiplo_valor_meses: 12
  - id: OP-04
    nombre: Laboratorio logístico
    inicio_mes: 1
    meses_validacion: 3
    costo_validacion_mensual: 60
    prob_exito: 0.45
    rampa_meses: 12
    flujo_regimen: {min: 800, modo: 1500, max: 3800}
    multiplo_valor_meses: 6
  - id: OP-07
    nombre: Medio vertical
    inicio_mes: 1
    meses_validacion: 3
    costo_validacion_mensual: 40
    prob_exito: 0.5
    rampa_meses: 18
    flujo_regimen: {min: 200, modo: 600, max: 2000}
    multiplo_valor_meses: 6
    consume_capacidad: false
  - id: OP-03
    nombre: Maquinaria usada (oportunista)
    inicio_mes: 3
    meses_validacion: 6
    costo_validacion_mensual: 40
    prob_exito: 0.4
    rampa_meses: 12
    flujo_regimen: {min: 500, modo: 1500, max: 4000}
    multiplo_valor_meses: 6
    fin_mes: 30                # ventana: posible reversión del decreto tras 2027

reinversiones:                 # se ejecutan si hay caja suficiente (y la unidad requerida funcionó)
  - id: CARTERA-CONSORCIOS-1
    nombre: Compra de cartera de 15 edificios (pago contado parcial)
    requiere: OP-01
    desde_mes: 18
    costo: 12000
    prob_exito: 0.8
    flujo: {min: 400, modo: 800, max: 1300}
    multiplo_valor_meses: 12
  - id: OP-08
    nombre: Micro-adquisición digital en USD
    desde_mes: 24
    costo: 20000
    prob_exito: 0.85
    flujo: {min: 200, modo: 500, max: 1000}
    multiplo_valor_meses: 24
  - id: OP-11
    nombre: Solar en edificios administrados (PPA)
    requiere: OP-01
    desde_mes: 30
    costo: 15000
    prob_exito: 0.8
    flujo: {min: 150, modo: 250, max: 400}
    multiplo_valor_meses: 60
  - id: CARTERA-CONSORCIOS-2
    nombre: Segunda cartera de edificios
    requiere: OP-01
    desde_mes: 36
    costo: 18000
    prob_exito: 0.8
    flujo: {min: 600, modo: 1100, max: 1800}
    multiplo_valor_meses: 12
  - id: OP-10
    nombre: Inmueble en nodo Golfo San Matías
    desde_mes: 40
    costo: 40000
    prob_exito: 0.75
    flujo: {min: 200, modo: 350, max: 700}
    multiplo_valor_meses: 150
