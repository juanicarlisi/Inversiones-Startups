# Ranking de opciones de ingreso "sin salir a vender" (informe 2026-09-ingresos-sin-vender).
# Puntajes 0–5 por criterio; el puntaje total es el promedio ponderado × 20 (0–100).
# Filtro previo (gate): el valor esperado debe superar al de la tesorería con el mismo recurso; si no, va a "trampas".
fecha: 2026-09-26
criterios:
  sin_venta: {peso: 20, nombre: "Quién vende", guia: "5 = no hace falta vender o la demanda llega sola; 0 = hay que salir a buscar clientes"}
  pasividad: {peso: 20, nombre: "Horas en régimen", guia: "5 = < 1 h/semana; 3 = 2–4 h; 1 = > 8 h"}
  valor_por_dolar: {peso: 20, nombre: "Valor esperado por dólar", guia: "Contra la tesorería (2 = igual a la tesorería)"}
  downside: {peso: 15, nombre: "Pérdida máxima tolerable", guia: "5 = se pierde poco y acotado; 1 = se puede perder todo el capital con probabilidad relevante"}
  evidencia: {peso: 10, nombre: "Calidad de la evidencia", guia: "5 = datos de mercado sólidos; 1 = supuestos sin verificar"}
  encaje: {peso: 10, nombre: "Encaje con el fundador", guia: "IA al máximo, logística, CABA, USD 400/mes"}
  velocidad: {peso: 5, nombre: "Tiempo al primer ingreso", guia: "5 = mes 1; 1 = > 12 meses"}
opciones:
  - id: OP-12
    nombre: "Fábrica de herramientas para agentes y desarrolladores"
    quien_vende: "El marketplace (Apify) y los agentes que pagan por uso (MCP, x402)"
    cuando: "Ya (oct-2026)"
    capital: "USD 50/mes atribuibles"
    horas: "2 h/sem"
    numeros: "Mes 12: P10 / P50 / P90 = −6 / +70 / +683 USD/mes netos; 17% > USD 400"
    puntajes: {sin_venta: 5, pasividad: 3, valor_por_dolar: 5, downside: 5, evidencia: 3, encaje: 5, velocidad: 3}
  - id: OP-09
    nombre: "Motor de renta en USD (tesorería)"
    quien_vende: "Nadie: el mercado paga intereses"
    cuando: "Ya (primer aporte)"
    capital: "Todo lo que no tenga mejor destino"
    horas: "< 1 h/sem"
    numeros: "~6,5% anual: USD 24/mes de renta al mes 12; USD 150/mes al mes 60"
    puntajes: {sin_venta: 5, pasividad: 5, valor_por_dolar: 2, downside: 4, evidencia: 5, encaje: 3, velocidad: 5}
  - id: OP-08
    nombre: "Comprar un micro-negocio digital que ya vende solo"
    quien_vende: "El canal que el negocio ya tiene (tienda de apps, marketplace, buscador)"
    cuando: "Embudo ya; compra entre el mes 6 y el 12"
    capital: "USD 3.000–8.000 la primera"
    horas: "3–4 h/sem"
    numeros: "3 años: media 13% anual; P10 / P50 / P90 = −24% / 14% / 43%; 61% supera a la tesorería"
    puntajes: {sin_venta: 5, pasividad: 3, valor_por_dolar: 4, downside: 2, evidencia: 4, encaje: 5, velocidad: 2}
  - id: OP-13
    nombre: "Motos para repartidores a través de un operador"
    quien_vende: "La demanda hace fila; el operador cobra y mantiene"
    cuando: "Tras encontrar un operador verificable (mes 8+)"
    capital: "USD 2.500 por moto"
    horas: "~1 h/sem"
    numeros: "Retorno anual P10 / P50 / P90 = −6% / 23% / 37% (supuesto clave sin verificar)"
    puntajes: {sin_venta: 5, pasividad: 4, valor_por_dolar: 4, downside: 2, evidencia: 2, encaje: 4, velocidad: 3}
  - id: OP-14
    nombre: "App de suscripción en una tienda B2B (graduada)"
    quien_vende: "La tienda (Shopify, Chrome, Google Workspace) + reseñas"
    cuando: "Solo si una herramienta de la fábrica pega"
    capital: "USD 200–1.000"
    horas: "3 h/sem"
    numeros: "20% de tracción; si funciona P50 ≈ USD 1.340/mes al mes 18; mediana incondicional: se cierra"
    puntajes: {sin_venta: 4, pasividad: 2, valor_por_dolar: 4, downside: 4, evidencia: 3, encaje: 4, velocidad: 1}
