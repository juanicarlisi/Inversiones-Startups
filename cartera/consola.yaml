# Fuente de la Consola del Holding (herramientas/consola_holding.py la convierte en la página).
# La actualiza Claude al cerrar cada sesión de trabajo de cualquier proyecto. El repositorio es público: nada personal.
# etapas del pipeline (iguales para todos): idea → definido → construyendo → probando → publicado → creciendo
# estado: verde (en marcha) · ambar (atención) · rojo (trabado) · gris (programado o en pausa)
# Lo que te toca a vos, de todos los proyectos, por prioridad (1 = primero). Lo de Senda en detalle está en su consola.
# Una línea por novedad, la más nueva primero.
actualizado: 2026-11-15
