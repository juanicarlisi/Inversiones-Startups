# Fuente de la Consola del Holding (herramientas/consola_holding.py la convierte en la página).
# La actualiza Claude al cerrar cada sesión de trabajo de cualquier proyecto. El repositorio es público: nada personal.
# Versión 2 (17-11-2026): panorama del holding, un selector para trabajar proyecto por proyecto, camino por etapas, plataformas
# (web, Google Play, iPhone), seguimiento de los próximos, horas y casos leídos de las fichas (oportunidades/proyectos/P*.yaml).
# etapas del pipeline (iguales para todos): idea → definido → construyendo → probando → publicado → creciendo
# estado: verde (en marcha) · ambar (atención) · rojo (trabado) · gris (programado o en pausa) · azul (propuesto, espera tu decisión)
# camino[].estado: hecho · en_curso · proximo · despues ;  plataformas[].estado: hecho · en_curso · proximo · despues · no_va
# prioridad: 1 = lo más importante del holding. foco: true = se está trabajando ahora.
# Lo que te toca a vos, de todos los proyectos, por prioridad (1 = primero). Lo de Senda en detalle está en su consola.
actualizado: '2026-11-17'
holding: Palanca
lema: Con poco, muchísimo.
en_una_frase: 'Senda llega a su lanzamiento del 18 de diciembre. Andén tiene motor verificado y suma «Tu planta», el gemelo desde fotos y planos. Hub Nocturno tiene la etapa 1 para probar: decidir sabiendo
  qué cuesta y qué deja, y tu oficina. Entran Nido y Telar.'
tope_horas: 10
etapas:
- idea
- definido
- construyendo
- probando
- publicado
- creciendo
grupos:
- id: apps
  nombre: Apps y productos
  que: Software propio que se publica en la web y en las tiendas.
- id: juegos
  nombre: Juegos
  que: Juegos web y de Steam que enseñan.
- id: contenido
  nombre: Música y contenido
  que: Canales y sellos hechos con IA y elegidos a mano.
- id: capital
  nombre: Capital e inversiones
  que: 'Donde la plata trabaja: renta, compras y ladrillo.'
- id: herramientas
  nombre: Herramientas tuyas
  que: Lo que usás vos para trabajar; no se vende (todavía).
