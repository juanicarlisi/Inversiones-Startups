# Plan "ingresos sin salir a vender" — supuestos de la simulación a 60 meses (herramientas/plan_sin_venta.py).
# Cada rango es triangular [mín, más probable, máx]. Etiquetas de evidencia en los comentarios y en los modelos citados.
meses: 60
simulaciones: 10000
semilla: 7
aporte_mensual: 400          # USD/mes (perfil del fundador)
colchon_usd: 1000            # liquidez mínima que nunca se usa para comprar activos

tesoreria:
  tasa_anual: [0.055, 0.065, 0.075]   # HECHO→ESTIMACIÓN: mezcla de ON hard dollar (~7–8%), letras de EE.UU. (~4%) y liquidez
  shock:                               # HIPÓTESIS: evento Argentina 2027 (controles, reestructuración) sobre la parte local
    prob: 0.15
    mes: [10, 20]
    perdida: [0.05, 0.12, 0.25]        # fracción de la tesorería total

fabrica:                               # OP-12, modelo herramientas/modelos/op12-fabrica-herramientas.yaml (ingresos al mes 12)
  modelo: herramientas/modelos/op12-fabrica-herramientas.yaml
  mes_inicio_ingresos: 3               # antes solo hay costo
  tendencia_anual: [-0.40, 0.0, 0.50]  # HIPÓTESIS: variación anual de ingresos desde el mes 12
  corte: {mes: 9, minimo_usd: 40}      # regla de muerte: si al mes 9 no factura USD 40/mes, se cierra

adquisiciones:                         # OP-08b, modelo herramientas/modelos/op08b-microadquisicion-chica.yaml
  mes_minimo: 6                        # antes hay que armar el embudo de búsqueda y aprender a evaluar
  maximo: 3
  meses_entre_compras: 12
  precio_minimo: 3000
  topes: [8000, 20000, 40000]          # tamaño máximo de la 1ª, 2ª y 3ª compra
  costo_transaccion: 0.05              # escrow, abogado, transferencia
  multiplo: [1.4, 2.0, 3.2]
  variacion_1a: [-0.50, -0.15, 0.20]
  mejora_ia: [0.0, 0.10, 0.40]
  tendencia_anual: [-0.30, -0.05, 0.20]
  prob_colapso_1a: 0.20
  prob_colapso_anual_despues: 0.08
  costo_operacion: [15, 40, 100]

motos:                                 # OP-13 (variante con satélite), modelo herramientas/modelos/op13-motos-operador.yaml
  mes_minimo: 8
  maximo: 2
  precio: [2300, 2500, 2900]
  ingreso_inversor_mensual: [75, 115, 150]   # alquiler bruto × ocupación × parte del inversor (P10–P90 del modelo ≈ 89–133)
  vida_util: [24, 30, 42]
  valor_residual: [0.15, 0.30, 0.45]
  prob_perdida_vida: 0.12
