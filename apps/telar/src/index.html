<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Nada de terceros en tiempo de ejecución: todo sale de este mismo sitio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Telar</title>
<meta name="description" content="Tu año y tus proyectos en un cronograma. Funciona sin internet y tus datos quedan en tu dispositivo.">
<meta name="theme-color" content="#f3f2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111019" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/telar.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preload" href="fuentes/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/bricolage-grotesque-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
<script src="tema.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="iconos/telar.svg" alt="" width="30" height="30">
    <div class="brand-t">
      <h1>Telar</h1>
      <div class="stats" id="stats" aria-live="polite"></div>
    </div>
  </div>
  <span class="save" id="save" data-s="load" role="status"><i aria-hidden="true"></i><span id="saveTxt">Cargando…</span></span>
  <button class="btn icono" id="undo" disabled title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="btn icono solo-ancho" id="redo" disabled title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer"><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="btn primary solo-ancho" id="addTask"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva tarea</button>
  <div class="menu">
    <button class="btn icono" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Más opciones" title="Más opciones"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><i class="punto" id="menuPunto" hidden></i></button>
    <div class="pop" id="pop" hidden role="menu"></div>
  </div>
</header>

<div class="bar2" id="bar2">
  <div class="seg" id="segView" role="group" aria-label="Vista">
    <button data-v="gantt">Cronograma</button><button data-v="board">Tablero</button>
  </div>
  <button class="btn icono solo-angosto" id="btnBuscar" aria-label="Buscar y filtrar" aria-expanded="false" title="Buscar y filtrar"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <div class="filtros" id="filtros">
    <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="field" id="q" type="search" placeholder="Buscar tarea…" aria-label="Buscar tarea" autocomplete="off" enterkeyhint="search"></div>
    <select class="field" id="fst" aria-label="Filtrar por estado">
      <option value="all">Todas</option><option value="todo">Pendientes</option><option value="doing">En curso</option><option value="done">Hechas</option><option value="late">Se corrieron</option>
    </select>
  </div>
  <button class="btn" id="foco" aria-pressed="false" title="Mostrar solo las que están en foco (estrella)"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span class="t">Foco</span></button>
  <span class="sp"></span>
  <div class="grp" id="grpGroup" hidden><span class="lbl">Columnas</span>
    <div class="seg" id="segGroup" role="group" aria-label="Columnas por">
      <button data-v="estado">Estado</button><button data-v="area">Área</button><button data-v="proyecto">Proyecto</button>
    </div></div>
  <div class="grp" id="grpArea" hidden><select class="field" id="bArea" aria-label="Ver el tablero de un área"></select></div>
  <div class="grp" id="grpPer" hidden>
    <div class="seg" id="segPer" role="group" aria-label="Período">
      <button data-v="todo">Todo</button><button data-v="dia">Día</button><button data-v="sem">Semana</button><button data-v="mes">Mes</button>
    </div><input class="field" type="date" id="bDay" aria-label="Día de referencia" title="Día de referencia (de fábrica, hoy)" hidden><span class="hint" id="perNote"></span></div>
  <div class="grp" id="grpLevel"><span class="lbl">Ver</span>
    <div class="seg" id="segLevel" role="group" aria-label="Nivel de detalle">
      <button data-v="areas">Áreas</button><button data-v="proyectos"><span class="largo">Proyectos</span><span class="corto">Proy.</span></button><button data-v="tareas">Tareas</button>
    </div></div>
  <div class="grp" id="grpZoom"><span class="lbl">Escala</span>
    <div class="seg" id="segZoom" role="group" aria-label="Escala de tiempo">
      <button data-v="pan"><span class="largo">Panorama</span><span class="corto">Año</span></button><button data-v="mes"><span class="largo">Meses</span><span class="corto">Mes</span></button><button data-v="sem"><span class="largo">Semanas</span><span class="corto">Sem.</span></button><button data-v="dia"><span class="largo">Días</span><span class="corto">Día</span></button>
    </div></div>
  <button class="btn" id="today" title="Ir a hoy"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="t">Hoy</span></button>
</div>

<div class="aviso" id="aviso" hidden></div>

<main class="main">
  <div class="gantt" id="gantt" tabindex="-1" aria-label="Cronograma"><div class="canvas" id="canvas"></div></div>
  <div class="board" id="board" hidden aria-label="Tablero"></div>
  <aside class="panel" id="panel" hidden aria-label="Detalle"></aside>
</main>

<div class="pildora" id="pildora" hidden role="region" aria-label="Tarea elegida"></div>
<button class="fab solo-angosto" id="fab" aria-label="Nueva tarea"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<input type="file" id="file" accept="application/json,.json" hidden>
<noscript><p class="noscript">Telar necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
