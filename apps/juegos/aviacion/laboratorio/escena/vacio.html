<!doctype html><meta charset="utf-8"><body style="margin:0"><canvas id="c"></canvas>
<script type="module">
import { Application, Sprite, Texture } from '../dist/pixi-vacio.js';
const res = {};
for (const aa of [false, true]) {
  const c = document.createElement('canvas'); c.id = 'c' + aa; document.body.appendChild(c);
  const app = new Application(); await app.init({ canvas: c, width: 1366, height: 768, antialias: aa, autoStart: false, sharedTicker: false, background: '#a6cfe6' }); app.ticker.stop();
  const s = new Sprite(Texture.WHITE); s.width = 1366; s.height = 768; s.tint = 0x1565c0; s.alpha = 0.5; app.stage.addChild(s);
  const gl = app.renderer.gl, px = new Uint8Array(4); const ms = [];
  for (let i = 0; i < 12; i++) { const a = performance.now(); app.renderer.render(app.stage); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ms.push(performance.now() - a); await new Promise((r) => setTimeout(r, 0)); }
  res['aa=' + aa] = ms.slice(4).map((x) => Math.round(x)).join(',');
  app.destroy(true);
}
window.__r = res;
</script>
