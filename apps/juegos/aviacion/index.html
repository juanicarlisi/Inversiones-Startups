<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub Nocturno</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="barra">
    <strong id="titulo">Hub Nocturno</strong>
    <div class="cifras">
      <span id="caja" class="caja">$ 0</span>
      <span id="dia" class="dia"></span>
      <span id="reloj" class="reloj"></span>
    </div>
    <div class="controles">
      <div class="segmentos velocidad" role="group">
        <button class="seg" data-vel="0" aria-pressed="false">⏸</button>
        <button class="seg" data-vel="1" aria-pressed="true">▶</button>
        <button class="seg" data-vel="3" aria-pressed="false">⏩</button>
      </div>
      <button id="b-menu" class="icono">☰</button>
    </div>
    <div id="menu" class="menu" hidden></div>
  </header>
  <main id="juego">
    <canvas id="mapa"></canvas>
    <section id="mision" class="mision" aria-live="polite"></section>
    <div class="zoom">
      <button id="b-mas" class="icono">+</button>
      <button id="b-menos" class="icono">−</button>
      <button id="b-centrar" class="icono">◎</button>
    </div>
    <aside id="panel"><div id="panel-cuerpo"></div></aside>
    <div id="avisos" aria-live="polite"></div>
  </main>
  <div id="ventana" class="ventana" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
