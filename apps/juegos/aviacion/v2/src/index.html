<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1222">
  <title>Hub Nocturno</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2314203a%22%20stroke%3D%22%23f2b84b%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M44%2015a12%2012%200%201%200%206%2018%2010%2010%200%200%201-6-18z%22%20fill%3D%22%23f6e6bf%22%2F%3E%3C%2Fsvg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1222; overflow: hidden; }
    #carga { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #1a2747, #0b1222 70%); transition: opacity .6s; font-family: system-ui, sans-serif; color: #f6e6bf; }
    #carga.fuera { opacity: 0; pointer-events: none; }
    #carga svg { width: 92px; height: 92px; filter: drop-shadow(0 0 18px rgba(242, 184, 75, .35)); animation: latido 1.6s ease-in-out infinite; }
    #carga i { display: block; width: 180px; height: 6px; border-radius: 3px; background: #1f2c4b; overflow: hidden; }
    #carga b { display: block; height: 100%; width: 8%; background: #f2b84b; transition: width .3s; }
    @keyframes latido { 50% { transform: scale(1.05); } }
  </style>
  <link rel="stylesheet" href="juego.css">
</head>
<body>
  <div id="carga" role="progressbar" aria-label="Hub Nocturno">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#14203a" stroke="#f2b84b" stroke-width="2"/>
      <path d="M44 15a12 12 0 1 0 6 18 10 10 0 0 1-6-18z" fill="#f6e6bf"/>
      <path d="M14 44l22-9 4-7 3 1-2 7 9 6-2 2-10-3-8 5z" fill="#f2b84b"/></svg>
    <i><b id="carga-avance"></b></i>
  </div>
  <canvas id="mundo"></canvas>
  <div id="etiquetas"></div>
  <div id="ui"></div>
  <script type="module" src="juego.js"></script>
</body>
</html>
