<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ronda nocturna</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/ronda.css">
</head>
<body class="ronda">
  <header class="r-cab">
    <div class="r-titulo"><strong id="r-titulo">Ronda nocturna</strong><span id="r-sub" class="tenue"></span></div>
    <div class="r-reloj" id="r-reloj">22:00</div>
    <div id="r-medalla" class="r-medalla" aria-live="polite"></div>
  </header>
  <main class="r-main">
    <section class="r-cinta" aria-labelledby="r-cinta-t">
      <div class="r-fila-t"><h2 id="r-cinta-t"></h2><span id="r-centro" class="tenue"></span></div>
      <div id="r-chips" class="r-chips"></div>
    </section>
    <section class="r-aviones" aria-labelledby="r-aviones-t">
      <div class="r-fila-t"><h2 id="r-aviones-t"></h2></div>
      <p id="r-leyenda" class="r-leyenda"></p>
      <div class="r-avion r-regla" aria-hidden="true"><span class="r-escala"><span>22:00</span><span>01:00</span><span>04:00</span><span>07:00</span></span></div>
      <div id="r-lista"></div>
    </section>
  </main>
  <footer class="r-pie">
    <button id="r-sugerido" class="boton"></button>
    <button id="r-volar" class="boton principal"></button>
    <button id="r-otra" class="boton"></button>
  </footer>
  <div id="r-guia" class="r-guia" hidden></div>
  <script type="module" src="js/ronda-escena.js"></script>
</body>
</html>
