  <style>
    /* Pantalla de carga en línea: se ve antes de que llegue la hoja de estilo y el código. */
    html, body { margin: 0; height: 100%; background: #0b1222; }
    .carga { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: grid; place-items: center; align-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #1a2747, #0b1222 70%); transition: opacity .35s; }
    .carga.fuera { opacity: 0; pointer-events: none; }
    .carga svg { width: 96px; height: 96px; filter: drop-shadow(0 0 18px rgba(242, 184, 75, .35)); }
    .carga-barra { width: 180px; height: 6px; border-radius: 3px; background: #1f2c4b; overflow: hidden; }
    .carga-barra span { display: block; height: 100%; width: 10%; background: #f2b84b; transition: width .25s; }
    @media (prefers-reduced-motion: no-preference) { .carga svg { animation: hn-latido 1.6s ease-in-out infinite; } }
    @keyframes hn-latido { 50% { transform: scale(1.04); } }
  </style>
  <link rel="stylesheet" href="css/estilo.css">
  <!-- Generado por herramientas/destinos.mjs desde index.html: no editar a mano. -->

<body>
  <div id="carga" class="carga" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10" aria-label="Hub Nocturno">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#14203a" stroke="#f2b84b" stroke-width="2"/>
      <path d="M44 15a12 12 0 1 0 6 18 10 10 0 0 1-6-18z" fill="#f6e6bf" opacity=".9"/>
      <g stroke="#f2b84b" stroke-width="2.4" stroke-linecap="round"><path d="M32 40l-14 8M32 40l15 7M32 40l-4 14M32 40l-17-4M32 40l6 13"/></g>
      <circle cx="32" cy="40" r="5" fill="#fff3d0" stroke="#f2b84b" stroke-width="2"/></svg>
    <div class="carga-barra"><span id="carga-avance"></span></div>
  </div>

  <div id="app" class="app" hidden>
    <header id="barra" class="barra">
      <span id="b-logo" class="b-logo" aria-hidden="true"></span>
      <div class="b-cifras">
        <span id="caja" class="caja">$ 0</span>
        <span id="ritmo" class="ritmo"></span>
      </div>
      <div id="reloj" class="reloj"><span id="reloj-ico"></span><span id="reloj-fecha" class="reloj-fecha"></span><span id="reloj-hora"></span></div>
      <div class="b-ctrl">
        <button id="b-rutas" class="ib" data-accion="verRutas" hidden></button>
        <div class="segmentos velocidad" role="group" id="velocidades">
          <button class="seg ib" data-accion="vel" data-v="0" data-k="vel-0"></button>
          <button class="seg ib" data-accion="vel" data-v="1" data-k="vel-1"></button>
          <button class="seg ib" data-accion="vel" data-v="3" data-k="vel-3"></button>
          <button class="seg ib" data-accion="vel" data-v="6" data-k="vel-6"></button>
        </div>
        <div class="vel-compacta">
          <button id="b-pausa" class="ib" data-accion="pausar" data-k="pausar"></button>
          <button id="b-ritmo" class="ib" data-accion="acelerar" data-k="acelerar"><span id="b-ritmo-txt">×1</span></button>
        </div>
        <button id="b-menu" class="ib" data-accion="menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>
    <main id="juego" class="juego">
      <canvas id="mapa"></canvas>
      <div id="arriba" class="arriba">
        <section id="objetivos" class="objetivos" aria-live="polite"></section>
        <div id="chips" class="chips"></div>
      </div>
      <div id="zoom" class="zoom">
        <button id="b-mas" class="ib" data-accion="zoom" data-v="1"></button>
        <button id="b-menos" class="ib" data-accion="zoom" data-v="-1"></button>
        <button id="b-centrar" class="ib" data-accion="centrar"></button>
        <button id="b-rutas2" class="ib solo-vertical" data-accion="verRutas" hidden></button>
      </div>
      <aside id="panel" class="panel" aria-label="">
        <div class="panel-cab">
          <button id="b-hoja" class="asa" data-accion="hoja" aria-label=""><span></span></button>
        </div>
        <div id="panel-cuerpo" class="panel-cuerpo"></div>
      </aside>
      <div id="avisos" class="avisos" aria-live="polite"></div>
      <div id="marca" class="marca" hidden aria-hidden="true"><span class="marca-mano"></span><span class="marca-txt"></span></div>
      <div id="selector" class="selector" hidden role="listbox"></div>
      <div id="sin-guardar" class="sin-guardar" hidden></div>
    </main>
    <div id="menu" class="menu" hidden role="menu"></div>
    <div id="ronda" class="ronda-capa" hidden></div>
    <div id="ventana" class="ventana" hidden></div>
    <div id="depurar" class="depurar" hidden></div>
  </div>
  <script type="module" src="js/main.js"></script>
