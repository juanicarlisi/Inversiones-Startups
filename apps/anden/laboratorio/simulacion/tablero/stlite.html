<!doctype html><html lang="es"><meta charset="utf-8"><title>stlite</title>
<link rel="stylesheet" href="/nm/@stlite/browser/build/stlite.css">
<body><div id="root"></div>
<script type="module">
import { mount } from '/nm/@stlite/browser/build/stlite.js';
const d = await (await fetch('/resultados/estadistico-C1-estocastico-f3lite.json')).text();
const app = `
import json
import pandas as pd
import streamlit as st
st.set_page_config(page_title="Andén · oráculo", layout="wide")
st.title("Andén · oráculo SimPy contra el motor")
d = json.load(open("datos.json"))
lado = st.radio("Comparar contra", ["motorF2", "motorF3"], horizontal=True, index=1)
df = pd.DataFrame(d[lado]).T.reset_index(names="KPI")
st.dataframe(df[["KPI", "simpy", "motor", "relPct", "z", "ok"]], hide_index=True)
st.bar_chart(df.set_index("KPI")["z"])
st.write("LISTO-STLITE")
`;
window.__t0 = performance.now();
mount({ requirements: ['pandas'], entrypoint: 'app.py', files: { 'app.py': app, 'datos.json': d } }, document.getElementById('root'));
const obs = new MutationObserver(() => { if (document.body.innerText.includes('LISTO-STLITE') && !window.__resultado) window.__resultado = { msHastaListo: Math.round(performance.now() - window.__t0) }; });
obs.observe(document.body, { subtree: true, childList: true, characterData: true });
</script></body></html>
