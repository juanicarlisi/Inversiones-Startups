[package]
name = "vrp-wasm-prueba"
version = "0.0.1"
edition = "2021"
publish = false
description = "Laboratorio Anden: vrp-cli 1.25.0 (crates.io, Apache-2.0) compilado a WebAssembly. No es producto."

[lib]
crate-type = ["cdylib"]

[dependencies]
vrp-cli = "=1.25.0"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
