<!doctype html><meta charset="utf-8"><title>Laboratorio ruteo: vrp-cli (Rust) en el navegador</title>
<body style="font:14px system-ui;margin:24px"><h3>vrp-cli 1.25.0 en WebAssembly</h3><pre id="o">cargando...</pre>
<script type="module">
const q = new URLSearchParams(location.search); const n = +q.get("n") || 200, seg = +q.get("t") || 10, suf = q.get("suf") || "";
const w = new Worker("./worker.js", { type: "module" }); const o = document.getElementById("o");
w.onmessage = (e) => { window.__resultado = e.data; o.textContent = JSON.stringify({ ...e.data, rutas: undefined }, null, 1); window.__listo = true; };
w.onerror = (e) => { window.__resultado = { ok: false, error: String(e.message) }; window.__listo = true; };
w.postMessage({ n, seg, suf });
</script>
