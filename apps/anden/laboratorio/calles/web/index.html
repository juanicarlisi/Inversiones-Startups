<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Laboratorio · Calles y flota</title>
<link rel="stylesheet" href="dist/maplibre-gl.css">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0a0f16;font:13px/1.35 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color:#d7e0ea}
  #mapa{position:fixed;inset:0}
  .hud{position:fixed;left:16px;top:16px;z-index:5;padding:12px 14px;border-radius:10px;background:rgba(10,15,22,.72);backdrop-filter:blur(8px);border:1px solid rgba(160,190,220,.14);min-width:190px;pointer-events:none}
  .hud h1{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7fa6c9;font-weight:600}
  .hud .reloj{font:600 26px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:#eaf2fa}
  .hud dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:8px 0 0}
  .hud dt{color:#7d8da0}.hud dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
</style></head>
<body><div id="mapa"></div>
<div class="hud"><h1>Flota en vivo · simulada</h1><div class="reloj" id="reloj">--:--:--</div>
<dl><dt>Vehículos</dt><dd id="nveh">-</dd><dt>En ruta</dt><dd id="vivos">-</dd><dt>Puntos de recorrido</dt><dd id="npts">-</dd><dt>Cuadros/s</dt><dd id="fps">-</dd></dl></div>
<script src="dist/app.js"></script></body></html>
