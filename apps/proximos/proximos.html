<title>Próximos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: columnas de categorías en grilla (una sola columna en el teléfono).
   Lo que estás haciendo respira en ámbar: relleno que late suave + aro, todo sincronizado con el reloj. */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f4f5f8; --fg:#14171c; --muted:#5b6471; --line:#d8dce3;
  --accent:#1b2430; --accent-fg:#ffffff;
  --doing:#2563eb; --doing-rgb:37,99,235; --doing-ink:#1d4ed8; --doing-fill:rgba(37,99,235,.10); --doing-line:rgba(37,99,235,.50); --doing-on:#ffffff;
  --danger:#c0362c;
  --shadow:0 1px 2px rgba(20,23,28,.05),0 8px 24px rgba(20,23,28,.05);
  --pop-shadow:0 12px 32px rgba(20,23,28,.18);
  --toast-bg:#1d2128; --toast-fg:#f2f4f7; --toast-act:#ffffff;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#181b21; --surface-2:#20242c; --fg:#e8eaee; --muted:#97a1ae; --line:#2b313b;
    --accent:#e8eaee; --accent-fg:#101216;
    --doing:#60a5fa; --doing-rgb:96,165,250; --doing-ink:#93c5fd; --doing-fill:rgba(96,165,250,.14); --doing-line:rgba(96,165,250,.55); --doing-on:#0b1b3a;
    --danger:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --pop-shadow:0 12px 32px rgba(0,0,0,.55);
    --toast-bg:#e8eaee; --toast-fg:#14171c; --toast-act:#14171c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#181b21; --surface-2:#20242c; --fg:#e8eaee; --muted:#97a1ae; --line:#2b313b;
  --accent:#e8eaee; --accent-fg:#101216;
  --doing:#60a5fa; --doing-rgb:96,165,250; --doing-ink:#93c5fd; --doing-fill:rgba(96,165,250,.14); --doing-line:rgba(96,165,250,.55); --doing-on:#0b1b3a;
  --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --pop-shadow:0 12px 32px rgba(0,0,0,.55);
  --toast-bg:#e8eaee; --toast-fg:#14171c; --toast-act:#14171c;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);
  padding-block:20px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,.text:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:20px}
h1{font:700 30px/1.1 var(--f-head);letter-spacing:-.02em;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.sub::first-letter{text-transform:uppercase}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn,.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.chip{border:1px solid var(--doing-line);background:var(--doing-fill);color:var(--doing-ink)}
.chip[aria-pressed="true"]{background:var(--doing);color:var(--doing-on);border-color:var(--doing)}
.chip[aria-pressed="true"] .live{background:var(--doing-on)}
.live{flex:none;width:9px;height:9px;border-radius:50%;background:var(--doing);animation:dot 2.6s ease-in-out infinite;animation-delay:var(--pd,0ms)}
@keyframes dot{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.15);opacity:1}}

.banner{margin:0 0 16px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:13px}
.note{color:var(--muted);margin:8px 2px}

/* Grilla */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:16px;align-items:start}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px 12px;box-shadow:var(--shadow);min-width:0}
.cat.menu-open{position:relative;z-index:6}
.cat-h{display:flex;align-items:center;gap:4px;padding:2px 0 4px 6px}
.cat-toggle{flex:1;display:flex;align-items:center;gap:8px;min-width:0;min-height:40px;text-align:left}
.cat-toggle h2,.rename-input{font:600 16px/1.25 var(--f-head);margin:0;overflow-wrap:anywhere}
.chev{flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.chev svg{width:14px;height:14px}
.count{flex:none;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.rename{flex:1;min-width:0}
.rename-input{width:100%;height:40px;padding:0 10px;border:1px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--fg)}

/* Pendientes */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{position:relative;isolation:isolate;display:flex;align-items:flex-start;gap:2px;padding:2px 2px 2px 0;border-radius:12px;border:1px solid transparent}
.item:hover{background:var(--surface-2)}
.item.menu-open{z-index:6}
.item.doing{border-color:var(--doing-line);background:transparent;animation:aro 2.6s ease-in-out infinite;animation-delay:var(--pd,0ms)}
.item.doing::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--doing);opacity:.12;z-index:-1;animation:latido 2.6s ease-in-out infinite;animation-delay:var(--pd,0ms)}
@keyframes latido{0%,100%{opacity:.08}50%{opacity:.26}}
@keyframes aro{0%,100%{box-shadow:0 0 0 0 rgba(var(--doing-rgb),0)}50%{box-shadow:0 0 0 4px rgba(var(--doing-rgb),.18)}}
.body{flex:1;min-width:0;padding-top:7px;padding-bottom:6px}
.text{overflow-wrap:anywhere;cursor:text;border-radius:6px}
.meta{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--doing-ink);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.links a{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.links a::before{content:"↗ "}
.links a:hover{color:var(--fg)}
.item.is-done .text{text-decoration:line-through;color:var(--muted)}
.edit-input{display:block;width:100%;min-height:36px;margin:-5px 0;padding:6px 8px;resize:none;overflow:hidden;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--accent);border-radius:8px}

.check{flex:none;width:40px;height:36px;display:grid;place-items:center}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s,color .12s}
.ring svg{width:12px;height:12px}
.check:hover .ring{border-color:var(--accent);color:var(--accent)}
.check.is-on .ring{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.icon{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--fg)}
.icon.play.on{background:var(--doing);color:var(--doing-on)}
.icon svg{width:18px;height:18px}
@media (pointer:coarse){.icon{width:40px;height:40px}.check{height:40px}.body{padding-top:9px}}

.empty-cat{margin:4px 10px 6px;color:var(--muted);font-size:14px}
.add{display:flex;align-items:center;gap:6px;margin:8px 4px 0;padding:0 4px 0 12px;min-height:42px;border:1px dashed var(--line);border-radius:12px}
.add:focus-within{border-style:solid;border-color:var(--accent);background:var(--surface)}
.add input{flex:1;min-width:0;height:40px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;outline:none}
.add input::placeholder{color:var(--muted)}
.add button{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--accent)}
.add button:hover{background:var(--surface-2)}
.add svg{width:18px;height:18px}

.done-toggle{display:flex;align-items:center;gap:6px;margin:10px 10px 0;font-size:13px;color:var(--muted)}
.done-toggle .chev svg{width:12px;height:12px}
.done-list{margin-top:4px}

/* Menús */
.menu-wrap{position:relative;flex:none}
.pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;width:max-content;min-width:220px;max-width:min(300px,calc(100vw - 32px));padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop-shadow)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border-radius:8px;text-align:left}
.pop button:hover{background:var(--surface-2)}
.pop .danger{color:var(--danger)}
.pop-msg{margin:6px 10px 8px;font-size:14px}
.pop-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pop-row button{justify-content:center;border:1px solid var(--line)}
.pop-title{margin:4px 12px 2px;font-size:12px;color:var(--muted)}

/* Nueva categoría y vacío */
.newcat-card{background:transparent;border:1px dashed var(--line);border-radius:16px;padding:12px;box-shadow:none}
.newcat-btn{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:600}
.newcat-btn:hover{color:var(--accent)}
.newcat-btn svg{width:16px;height:16px}
.newcat-form{display:flex;flex-direction:column;gap:10px}
.newcat-form input{height:42px;padding:0 12px;border:1px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.newcat-row{display:flex;gap:8px}
.primary{height:40px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.ghost{height:40px;padding:0 14px;border-radius:10px;color:var(--muted)}
.empty{max-width:520px;margin:32px auto 0;display:flex;flex-direction:column;gap:14px}
.empty h2{font:700 22px/1.2 var(--f-head);margin:0}
.empty p{margin:0;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.sugg button:hover{border-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:12px;background:var(--toast-bg);color:var(--toast-fg);font-size:14px;box-shadow:var(--pop-shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow-wrap:anywhere}
#toast button{color:var(--toast-act);font-weight:600;padding:6px 4px}

@media (prefers-reduced-motion:reduce){
  .item.doing,.item.doing::before,.live{animation:none}
  .item.doing::before{opacity:.2}
  .chev{transition:none}
}
</style>

<div class="wrap"><div id="app" aria-live="off"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var app = document.getElementById('app');
var toastEl = document.getElementById('toast');
var LS_CACHE = 'proximos.cache.v1', LS_UI = 'proximos.ui.v1';

var S = {
  cats:new Map(), items:new Map(),
  sync:'loading',            // loading | ok | slow | local
  syncMsg:'',
  filterDoing:false,
  editing:null, editDraft:'',
  renaming:null, renameDraft:'',
  menu:null,                 // {kind:'item'|'cat', id, sub:null|'move'|'confirm'}
  addingCat:false, newCatDraft:'',
  showDone:{}, collapsed:{}, drafts:{}, uiInit:false
};
var db = null;
var pendingFocus = null;
var rendering = false;
var toastTimer = null, toastUndo = null;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function saveCache(){lsSet(LS_CACHE,{cats:Array.from(S.cats.values()),items:Array.from(S.items.values())});}
function saveUI(){lsSet(LS_UI,{collapsed:S.collapsed,init:S.uiInit});}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

var ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- Escritura (una a la vez por documento) ---------- */
var queues = new Map();
function enqueue(path, fn){
  var prev = queues.get(path) || Promise.resolve();
  var next = prev.then(fn).catch(function(e){
    console.error(e);
    toast('No se pudo guardar. Probá de nuevo.');
  });
  queues.set(path,next);
  return next;
}
function write(kind,id,patch,opts){
  var map = kind==='cat' ? S.cats : S.items;
  var next = Object.assign({}, map.get(id)||{}, patch, {id:id});
  map.set(id,next);
  if(db){
    var body = Object.assign({}, next); delete body.id;
    var path = (kind==='cat'?'cats/':'items/')+id;
    enqueue(path,function(){return db.doc(path).set(body);});
  }
  saveCache();
  if(opts && opts.defer) setTimeout(render,250); else render();
}
function drop(kind,id){
  var map = kind==='cat' ? S.cats : S.items;
  map.delete(id);
  if(db){
    var path = (kind==='cat'?'cats/':'items/')+id;
    enqueue(path,function(){return db.doc(path).delete();});
  }
  saveCache();
}

/* ---------- Acciones de datos ---------- */
function addItem(catId,text){
  var t = text.trim(); if(!t) return;
  var now = Date.now();
  write('item',uid(),{text:t,cat:catId,status:'todo',order:now,created:now,startedAt:null,doneAt:null});
}
function addCat(name){
  var n = name.trim(); if(!n) return;
  write('cat',uid(),{name:n,order:Date.now()});
}
function commitEdit(id,val){
  if(S.editing!==id) return;
  S.editing = null;
  var it = S.items.get(id), v = val.trim();
  if(!it || !v || v===it.text){ setTimeout(render,250); return; }
  write('item',id,{text:v},{defer:true});
}
function commitRename(id,val){
  if(S.renaming!==id) return;
  S.renaming = null;
  var c = S.cats.get(id), v = val.trim();
  if(!c || !v || v===c.name){ setTimeout(render,250); return; }
  write('cat',id,{name:v},{defer:true});
}

var actions = {
  filter:function(){S.filterDoing=!S.filterDoing;render();},
  'toggle-all':function(){
    var cats=sortedCats();
    var anyOpen=cats.some(function(c){return !S.collapsed[c.id];});
    cats.forEach(function(c){S.collapsed[c.id]=anyOpen;});
    saveUI();render();
  },
  newcat:function(){S.addingCat=true;S.newCatDraft='';pendingFocus='newcat';render();},
  cancelnewcat:function(){S.addingCat=false;render();},
  seedcat:function(id,cat,t){addCat(t.dataset.name);},
  'toggle-cat':function(id,cat){S.collapsed[cat]=!S.collapsed[cat];saveUI();render();},
  'toggle-done-list':function(id,cat){S.showDone[cat]=!S.showDone[cat];render();},
  done:function(id){
    var it=S.items.get(id); if(!it) return;
    var prev={status:it.status,startedAt:it.startedAt||null,doneAt:null};
    write('item',id,{status:'done',doneAt:Date.now(),startedAt:null});
    toast('Hecho: '+trunc(it.text,40),function(){write('item',id,prev);});
  },
  undone:function(id){write('item',id,{status:'todo',doneAt:null});},
  'toggle-doing':function(id){
    var it=S.items.get(id); if(!it) return;
    if(it.status==='doing') write('item',id,{status:'todo',startedAt:null});
    else write('item',id,{status:'doing',startedAt:Date.now(),doneAt:null});
  },
  edit:function(id){
    var it=S.items.get(id); if(!it) return;
    S.editing=id;S.editDraft=it.text;pendingFocus='edit-'+id;render();
  },
  'item-menu':function(id){
    S.menu=(S.menu&&S.menu.kind==='item'&&S.menu.id===id)?null:{kind:'item',id:id,sub:null};render();
  },
  'item-move':function(){if(S.menu){S.menu.sub='move';}render();},
  'item-moveto':function(id,cat){write('item',id,{cat:cat,order:Date.now()});},
  'item-top':function(id){
    var it=S.items.get(id); if(!it) return;
    var min=Infinity;
    S.items.forEach(function(x){if(x.cat===it.cat&&x.status==='todo'&&(x.order||0)<min)min=x.order||0;});
    write('item',id,{order:(min===Infinity?Date.now():min)-1});
  },
  'item-del':function(id){
    var it=S.items.get(id); if(!it) return;
    var copy=Object.assign({},it);
    drop('item',id);render();
    toast('Eliminado: '+trunc(it.text,40),function(){write('item',id,copy);});
  },
  'cat-menu':function(id,cat){
    S.menu=(S.menu&&S.menu.kind==='cat'&&S.menu.id===cat)?null:{kind:'cat',id:cat,sub:null};render();
  },
  'cat-rename':function(id,cat){
    var c=S.cats.get(cat); if(!c) return;
    S.renaming=cat;S.renameDraft=c.name;pendingFocus='rename-'+cat;render();
  },
  'cat-left':function(id,cat){moveCat(cat,-1);},
  'cat-right':function(id,cat){moveCat(cat,1);},
  'cat-clear-done':function(id,cat){
    var gone=[];
    S.items.forEach(function(x){if(x.cat===cat&&x.status==='done')gone.push(x);});
    gone.forEach(function(x){drop('item',x.id);});
    render();
    if(gone.length) toast(gone.length===1?'Se vació 1 hecho':'Se vaciaron '+gone.length+' hechos',function(){
      gone.forEach(function(x){write('item',x.id,x);});
    });
  },
  'cat-confirm':function(){if(S.menu){S.menu.sub='confirm';}render();},
  'cat-del':function(id,cat){
    var ids=[];
    S.items.forEach(function(x){if(x.cat===cat)ids.push(x.id);});
    ids.forEach(function(i){drop('item',i);});
    drop('cat',cat);
    render();
  },
  cancel:function(){S.menu=null;render();}
};
function moveCat(catId,dir){
  var cats=sortedCats(), i=cats.findIndex(function(c){return c.id===catId;}), j=i+dir;
  if(i<0||j<0||j>=cats.length) return;
  var a=cats[i], b=cats[j];
  var oa=a.order||0, ob=b.order||0;
  if(oa===ob){oa=Date.now();ob=oa+(dir>0?1:-1);}
  write('cat',a.id,{order:ob});
  write('cat',b.id,{order:oa});
}

/* ---------- Vista ---------- */
function sortedCats(){return Array.from(S.cats.values()).sort(function(a,b){return (a.order||0)-(b.order||0);});}
function sinceText(ts){
  if(!ts) return 'En curso';
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return 'En curso · recién';
  if(m<60) return 'En curso · '+m+' min';
  var h=Math.floor(m/60);
  if(h<24) return 'En curso · '+h+' h'+(m%60?' '+(m%60)+' min':'');
  return 'En curso · '+Math.floor(h/24)+' d';
}

function itemHTML(it,cats,isFirstTodo){
  var doing=it.status==='doing', done=it.status==='done';
  var menuOpen=S.menu&&S.menu.kind==='item'&&S.menu.id===it.id;
  var textHTML = S.editing===it.id
    ? '<textarea id="edit-'+it.id+'" class="edit-input" data-id="'+it.id+'" rows="1" maxlength="500" aria-label="Editar pendiente">'+esc(S.editDraft)+'</textarea>'
    : '<div class="text" data-act="edit" data-id="'+it.id+'" tabindex="0" role="button" aria-label="Editar: '+esc(it.text)+'">'+esc(it.text)+'</div>';
  var meta = doing ? '<span class="meta" data-since="'+(it.startedAt||'')+'">'+esc(sinceText(it.startedAt))+'</span>' : '';
  var linksHTML = '';
  if(it.links && it.links.length){
    linksHTML = '<span class="links">'+it.links.map(function(l){
      if(!l || !/^https?:\/\//i.test(l.u||'')) return '';
      return '<a href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.t||'enlace')+'</a>';
    }).join('')+'</span>';
  }
  var h = '<li class="item'+(doing?' doing':'')+(done?' is-done':'')+(menuOpen?' menu-open':'')+'" data-item="'+it.id+'">';
  h += '<button class="check'+(done?' is-on':'')+'" data-act="'+(done?'undone':'done')+'" data-id="'+it.id+'" aria-label="'+(done?'Volver a pendiente':'Marcar como hecho')+': '+esc(it.text)+'" title="'+(done?'Volver a pendiente':'Hecho')+'"><span class="ring">'+ICON.check+'</span></button>';
  h += '<div class="body">'+textHTML+meta+linksHTML+'</div>';
  if(!done){
    h += '<button class="icon play'+(doing?' on':'')+'" data-act="toggle-doing" data-id="'+it.id+'" aria-pressed="'+doing+'" aria-label="'+(doing?'Dejar de trabajar en':'Empezar a trabajar en')+': '+esc(it.text)+'" title="'+(doing?'Pausar':'Estoy en esto')+'">'+(doing?ICON.pause:ICON.play)+'</button>';
  }
  h += '<div class="menu-wrap"><button class="icon" data-act="item-menu" data-id="'+it.id+'" aria-haspopup="menu" aria-expanded="'+!!menuOpen+'" aria-label="Más opciones" title="Más opciones">'+ICON.more+'</button>';
  if(menuOpen) h += itemPop(it,cats,isFirstTodo,done);
  h += '</div></li>';
  return h;
}
function itemPop(it,cats,isFirstTodo,done){
  var h='<div class="pop" role="menu">';
  if(S.menu.sub==='move'){
    h+='<p class="pop-title">Mover a</p>';
    cats.filter(function(c){return c.id!==it.cat;}).forEach(function(c){
      h+='<button data-act="item-moveto" data-id="'+it.id+'" data-cat="'+c.id+'">'+esc(c.name)+'</button>';
    });
  } else {
    if(!done && it.status==='todo' && !isFirstTodo) h+='<button data-act="item-top" data-id="'+it.id+'">Mandar al principio</button>';
    if(cats.length>1) h+='<button data-act="item-move" data-id="'+it.id+'">Mover a otra categoría…</button>';
    h+='<button class="danger" data-act="item-del" data-id="'+it.id+'">Eliminar</button>';
  }
  return h+'</div>';
}

function catHTML(c,idx,cats){
  var all=Array.from(S.items.values()).filter(function(i){return i.cat===c.id;});
  var doing=all.filter(function(i){return i.status==='doing';}).sort(function(a,b){return (a.startedAt||0)-(b.startedAt||0);});
  var todo=all.filter(function(i){return i.status==='todo';}).sort(function(a,b){return (a.order||0)-(b.order||0);});
  var done=all.filter(function(i){return i.status==='done';}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  if(S.filterDoing && !doing.length) return '';
  var collapsed=!!S.collapsed[c.id] && !S.filterDoing, open=!collapsed;
  var menuOpen=S.menu&&S.menu.kind==='cat'&&S.menu.id===c.id;
  var count=S.filterDoing?doing.length:doing.length+todo.length;

  var h='<section class="cat'+(menuOpen?' menu-open':'')+'" data-catid="'+c.id+'"><header class="cat-h">';
  if(S.renaming===c.id){
    h+='<form class="rename" data-form="rename" data-cat="'+c.id+'"><input id="rename-'+c.id+'" class="rename-input" data-cat="'+c.id+'" value="'+esc(S.renameDraft)+'" maxlength="60" aria-label="Nombre de la categoría"></form>';
  } else {
    h+='<button class="cat-toggle" data-act="toggle-cat" data-cat="'+c.id+'" aria-expanded="'+open+'"><span class="chev'+(open?' open':'')+'">'+ICON.chev+'</span><h2>'+esc(c.name)+'</h2><span class="count">'+count+'</span>'+(collapsed&&doing.length?'<span class="live" title="Hay algo en curso"></span>':'')+'</button>';
  }
  h+='<div class="menu-wrap"><button class="icon" data-act="cat-menu" data-cat="'+c.id+'" aria-haspopup="menu" aria-expanded="'+!!menuOpen+'" aria-label="Opciones de '+esc(c.name)+'" title="Opciones">'+ICON.more+'</button>';
  if(menuOpen) h+=catPop(c,idx,cats,all.length,done.length);
  h+='</div></header>';

  if(open){
    var live=doing.concat(S.filterDoing?[]:todo);
    if(live.length){
      h+='<ul class="list">';
      live.forEach(function(it){h+=itemHTML(it,cats,todo[0]===it);});
      h+='</ul>';
    } else if(!S.filterDoing){
      h+='<p class="empty-cat">Nada pendiente acá.</p>';
    }
    if(!S.filterDoing){
      h+='<form class="add" data-form="add" data-cat="'+c.id+'"><input id="add-'+c.id+'" data-cat="'+c.id+'" type="text" placeholder="Agregar pendiente…" maxlength="500" autocomplete="off" enterkeyhint="done" aria-label="Agregar pendiente a '+esc(c.name)+'" value="'+esc(S.drafts[c.id]||'')+'"><button type="submit" aria-label="Agregar" title="Agregar">'+ICON.plus+'</button></form>';
      if(done.length){
        var showD=!!S.showDone[c.id];
        h+='<button class="done-toggle" data-act="toggle-done-list" data-cat="'+c.id+'" aria-expanded="'+showD+'"><span class="chev'+(showD?' open':'')+'">'+ICON.chev+'</span>Hechos ('+done.length+')</button>';
        if(showD){
          h+='<ul class="list done-list">';
          done.forEach(function(it){h+=itemHTML(it,cats,false);});
          h+='</ul>';
        }
      }
    }
  }
  return h+'</section>';
}
function catPop(c,idx,cats,total,doneN){
  var h='<div class="pop" role="menu">';
  if(S.menu.sub==='confirm'){
    h+='<p class="pop-msg">'+(total?'¿Eliminar “'+esc(c.name)+'” con todo lo que tiene adentro ('+total+')?':'¿Eliminar “'+esc(c.name)+'”?')+'</p>';
    h+='<div class="pop-row"><button data-act="cancel">Cancelar</button><button class="danger" data-act="cat-del" data-cat="'+c.id+'">Eliminar</button></div>';
  } else {
    h+='<button data-act="cat-rename" data-cat="'+c.id+'">Renombrar</button>';
    if(idx>0) h+='<button data-act="cat-left" data-cat="'+c.id+'">Mover antes</button>';
    if(idx<cats.length-1) h+='<button data-act="cat-right" data-cat="'+c.id+'">Mover después</button>';
    if(doneN) h+='<button data-act="cat-clear-done" data-cat="'+c.id+'">Vaciar hechos ('+doneN+')</button>';
    h+='<button class="danger" data-act="cat-confirm" data-cat="'+c.id+'">Eliminar categoría…</button>';
  }
  return h+'</div>';
}

function newCatForm(){
  return '<form class="newcat-form" data-form="newcat"><input id="newcat" type="text" placeholder="Nombre de la categoría" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="Nombre de la categoría" value="'+esc(S.newCatDraft)+'"><div class="newcat-row"><button class="primary" type="submit">Crear</button>'+(S.cats.size?'<button class="ghost" type="button" data-act="cancelnewcat">Cancelar</button>':'')+'</div></form>';
}

function view(){
  var cats=sortedCats();
  var doingN=0,todoN=0;
  S.items.forEach(function(i){if(i.status==='doing')doingN++;else if(i.status==='todo')todoN++;});
  if(!doingN) S.filterDoing=false;
  var pend=doingN+todoN;
  var dateStr=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

  var h='<header class="top"><div><h1>Próximos</h1><p class="sub">'+esc(dateStr)+' · '+pend+' '+(pend===1?'pendiente':'pendientes')+'</p></div><div class="top-actions">';
  if(doingN) h+='<button class="chip" data-act="filter" aria-pressed="'+S.filterDoing+'" title="Ver solo lo que está en curso"><span class="live"></span>'+doingN+' en curso</button>';
  if(cats.length>4){
    var anyOpen=cats.some(function(c){return !S.collapsed[c.id];});
    h+='<button class="btn" data-act="toggle-all">'+(anyOpen?'Plegar todo':'Abrir todo')+'</button>';
  }
  if(cats.length) h+='<button class="btn" data-act="newcat">'+ICON.plus+'<span>Categoría</span></button>';
  h+='</div></header>';

  if(S.sync==='slow') h+='<p class="banner">No pude conectar con la base todavía. Lo que ves puede estar desactualizado.</p>';
  if(S.sync==='local') h+='<p class="banner">Esta vista no tiene base conectada: lo que cargues queda solo en este navegador.</p>';

  if(!cats.length){
    if(S.sync==='loading'){
      h+='<p class="note">Cargando tus pendientes…</p>';
    } else {
      h+='<section class="empty"><h2>Empecemos por las categorías</h2><p>Cada categoría es una lista de próximos. Elegí una o escribí la tuya.</p><div class="sugg">';
      ['Trabajo','Personal','Plata','Casa','Salud'].forEach(function(n){h+='<button data-act="seedcat" data-name="'+n+'">'+n+'</button>';});
      h+='</div>'+newCatForm()+'</section>';
    }
  } else {
    h+='<div class="board">';
    var shown=0;
    cats.forEach(function(c,i){var x=catHTML(c,i,cats);if(x){h+=x;shown++;}});
    if(S.filterDoing){
      if(!shown) h+='<p class="note">No hay nada en curso.</p>';
    } else if(S.addingCat){
      h+='<section class="cat newcat-card">'+newCatForm()+'</section>';
    } else {
      h+='<section class="cat newcat-card"><button class="newcat-btn" data-act="newcat">'+ICON.plus+'Nueva categoría</button></section>';
    }
    h+='</div>';
  }
  return h;
}

function render(){
  if(rendering) return;
  rendering=true;
  var ae=document.activeElement, keep=null;
  if(ae && ae.id && app.contains(ae)) keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  app.style.setProperty('--pd',-(Date.now()%2600)+'ms');
  app.innerHTML=view();
  var tgt=pendingFocus?{id:pendingFocus,all:true}:keep;
  pendingFocus=null;
  if(tgt){
    var el=document.getElementById(tgt.id);
    if(el){
      try{ el.focus({preventScroll:!tgt.all}); if(tgt.all&&el.select) el.select(); else if(tgt.s!=null) el.setSelectionRange(tgt.s,tgt.e); }catch(_){}
    }
  }
  var ta=app.querySelector('.edit-input'); if(ta) autosize(ta);
  rendering=false;
}
function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}

/* ---------- Avisos ---------- */
function toast(msg,undo){
  toastUndo=undo||null;
  toastEl.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-toast="undo">Deshacer</button>':'');
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('on');toastUndo=null;},6000);
}
toastEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-toast="undo"]');
  if(b&&toastUndo){var f=toastUndo;toastUndo=null;toastEl.classList.remove('on');f();}
});

/* ---------- Eventos ---------- */
var KEEP_MENU={'item-menu':1,'cat-menu':1,'item-move':1,'cat-confirm':1};
app.addEventListener('click',function(e){
  e.__inApp=true;
  var t=e.target.closest('[data-act]');
  if(!t){ if(S.menu&&!e.target.closest('.pop')){S.menu=null;render();} return; }
  var act=t.dataset.act;
  if(!KEEP_MENU[act]) S.menu=null;
  var fn=actions[act];
  if(fn) fn(t.dataset.id,t.dataset.cat,t);
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.closest('form'); if(!f) return;
  var kind=f.dataset.form, input=f.querySelector('input');
  if(kind==='add'){
    var catId=f.dataset.cat;
    S.drafts[catId]='';
    pendingFocus='add-'+catId;
    addItem(catId,input.value);
  } else if(kind==='newcat'){
    S.addingCat=false;S.newCatDraft='';
    addCat(input.value);
  } else if(kind==='rename'){
    commitRename(f.dataset.cat,input.value);render();
  }
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches('.add input')) S.drafts[t.dataset.cat]=t.value;
  else if(t.id==='newcat') S.newCatDraft=t.value;
  else if(t.matches('.rename-input')) S.renameDraft=t.value;
  else if(t.matches('.edit-input')){S.editDraft=t.value;autosize(t);}
});
app.addEventListener('keydown',function(e){
  var t=e.target;
  if(t.matches('.edit-input')){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();commitEdit(t.dataset.id,t.value);render();}
    else if(e.key==='Escape'){S.editing=null;render();}
  } else if(t.matches('.rename-input')){
    if(e.key==='Escape'){S.renaming=null;render();}
  } else if(t.id==='newcat'){
    if(e.key==='Escape'&&S.cats.size){S.addingCat=false;render();}
  } else if(t.matches('.text')&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault();actions.edit(t.dataset.id);
  }
});
app.addEventListener('focusout',function(e){
  if(rendering) return;
  var t=e.target;
  if(t.matches&&t.matches('.edit-input')) commitEdit(t.dataset.id,t.value);
  else if(t.matches&&t.matches('.rename-input')) commitRename(t.dataset.cat,t.value);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.menu){S.menu=null;render();}
});
document.addEventListener('click',function(e){
  if(S.menu&&!e.__inApp){S.menu=null;render();}
});

/* El texto "En curso · 25 min" se refresca solo, sin tocar la base */
function tick(){
  var els=app.querySelectorAll('[data-since]');
  for(var i=0;i<els.length;i++){els[i].textContent=sinceText(Number(els[i].dataset.since)||0);}
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});

/* ---------- Conexión con la base ---------- */
function subscribe(){
  var gotC=false,gotI=false;
  var timer=setTimeout(function(){if(S.sync==='loading'){S.sync='slow';render();}},10000);
  function check(){if(gotC&&gotI){clearTimeout(timer);S.sync='ok';}}
  function onErr(){clearTimeout(timer);S.sync='slow';render();}
  db.collection('cats').onSnapshot(function(snap){
    S.cats=new Map(snap.docs.map(function(d){return [d.id,Object.assign({},d.data(),{id:d.id})];}));
    if(!snap.metadata.fromCache) gotC=true;
    if(!snap.metadata.fromCache && !S.uiInit && S.cats.size>6){
      sortedCats().forEach(function(c,i){S.collapsed[c.id]=i>0;});
      S.uiInit=true; saveUI();
    }
    check();saveCache();render();
  },onErr);
  db.collection('items').onSnapshot(function(snap){
    S.items=new Map(snap.docs.map(function(d){return [d.id,Object.assign({},d.data(),{id:d.id})];}));
    if(!snap.metadata.fromCache) gotI=true;
    check();saveCache();render();
  },onErr);
}

function boot(){
  var c=lsGet(LS_CACHE);
  if(c){
    S.cats=new Map((c.cats||[]).map(function(x){return [x.id,x];}));
    S.items=new Map((c.items||[]).map(function(x){return [x.id,x];}));
  }
  var u=lsGet(LS_UI); if(u&&u.collapsed) S.collapsed=u.collapsed;
  S.uiInit=!!(u&&u.init);
  render();
  var p;
  try{ p=(window.claude&&window.claude.use)?window.claude.use('db'):Promise.resolve(null); }catch(e){ p=Promise.resolve(null); }
  Promise.resolve(p).then(function(d){
    db=d||null;
    if(db) subscribe(); else {S.sync='local';render();}
  }).catch(function(){S.sync='local';render();});
}
boot();
})();
</script>
