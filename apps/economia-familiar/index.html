<title>Economía Familiar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: app de una columna (máx. 720px) con barra inferior fija y botón central "+"; en escritorio las tarjetas se acomodan en dos columnas. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface2:#EBEFF6; --ink:#0F1623; --ink2:#47536A; --muted:#8190A6;
  --line:#E0E5EE; --accent:#3558E8; --accent-ink:#FFFFFF; --accent-soft:#E7ECFE;
  --pos:#0F8A5F; --pos-soft:#DDF4EA; --neg:#D8402A; --neg-soft:#FCE5E0; --warn:#A8690B; --warn-soft:#FBEED3;
  --shadow:0 1px 2px rgba(15,22,35,.05),0 6px 20px rgba(15,22,35,.06);
  --font-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E16; --surface:#131A27; --surface2:#1B2433; --ink:#EDF1F8; --ink2:#A9B4C7; --muted:#6F7D94;
    --line:#243044; --accent:#7F97FF; --accent-ink:#0A0E16; --accent-soft:#1E2A58;
    --pos:#3CC795; --pos-soft:#12372B; --neg:#FF7B64; --neg-soft:#40201A; --warn:#E5AB3C; --warn-soft:#3B2D10;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E16; --surface:#131A27; --surface2:#1B2433; --ink:#EDF1F8; --ink2:#A9B4C7; --muted:#6F7D94;
  --line:#243044; --accent:#7F97FF; --accent-ink:#0A0E16; --accent-soft:#1E2A58;
  --pos:#3CC795; --pos-soft:#12372B; --neg:#FF7B64; --neg-soft:#40201A; --warn:#E5AB3C; --warn-soft:#3B2D10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.disp{font-family:var(--font-display);letter-spacing:-.02em}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:720px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){#app{max-width:1000px}}

/* Encabezado */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.mes{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.mes .lbl{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.02em;padding:6px 8px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active,.mes .lbl:active{background:var(--surface2)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{display:flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.who button{padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.who button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sync{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:4px 0 8px}

/* Contenido */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid .span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h2,.sec-h{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .more,.link{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--accent)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{height:10px}

/* Resumen del mes */
.hero .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,5.4vw,26px);letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.hero .cap{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface2)}
.stack i{display:block;height:100%;min-width:0}
.leg{display:grid;gap:8px;margin-top:12px}
.leg .li{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .li b{margin-left:auto;font-weight:800}
.leg .li small{color:var(--muted);font-weight:700;width:38px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--ink2)}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:block;width:100%}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}

/* Checklist */
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%}
.chk:first-of-type{border-top:0}
.chk .cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk .cb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk.done .cb{background:var(--pos);border-color:var(--pos);color:#fff}
.chk.done .nm{color:var(--ink2)}
.chk .nm{font-weight:700}
.chk .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.chk .amt{font-weight:800;text-align:right;white-space:nowrap}
.group-h{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.group-h:first-child{margin-top:0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--surface2);color:var(--ink);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pos{background:var(--pos);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}

/* Listas */
.mv{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%}
.mv:first-child{border-top:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface2)}
.ico.sm{width:30px;height:30px;font-size:15px;border-radius:10px}
.mv .t{font-weight:700} .mv .s{font-size:12.5px;color:var(--muted);font-weight:600}
.mv .a{font-weight:800;white-space:nowrap;text-align:right}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:16px 4px 6px}
.empty{text-align:center;padding:28px 12px;color:var(--ink2)}
.empty .big{font-size:38px;margin-bottom:6px}
.empty b{display:block;font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:4px}

/* Barras */
.bar-row{display:grid;gap:5px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.bar-row:first-child{border-top:0}
.bar-row .hd{display:flex;align-items:center;gap:10px}
.bar-row .hd .n{font-weight:700;flex:1;min-width:0}
.bar-row .hd .v{font-weight:800;white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bar-row.sub{padding-left:36px}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex:none}
.open>.hd .chev,.bar-row.open .chev{transform:rotate(90deg)}
.sub-wrap{display:none;margin-top:4px} .open .sub-wrap{display:block}

/* Segmentado, chips */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 12px;border-radius:11px;font-weight:800;font-size:13.5px;color:var(--ink2);white-space:nowrap;text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--ink);border:2px solid transparent;min-height:38px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.cat.on{background:var(--surface);}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip .e{font-size:16px}

/* Campos */
.field{display:grid;gap:6px}
.field>label,.lab{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:13px;padding:12px 14px;min-height:46px;outline:none;font-weight:600}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.inp::placeholder{color:var(--muted);font-weight:500}
.amount-wrap{display:flex;align-items:baseline;gap:6px;background:var(--surface2);border-radius:18px;padding:12px 16px}
.amount-wrap:focus-within{outline:2px solid var(--accent)}
.amount-wrap .cur{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--muted)}
.amount-wrap input{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--font-display);font-size:38px;font-weight:800;letter-spacing:-.03em;padding:0;width:100%}
.hint{font-size:12.5px;color:var(--muted);font-weight:600}
.note{font-size:13px;border-radius:12px;padding:10px 12px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)} .note.neg{background:var(--neg-soft)} .note.pos{background:var(--pos-soft)}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;box-shadow:0 -6px 24px rgba(15,22,35,.06)}
.nav .it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:12px;position:relative}
.nav .it svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .it.on{color:var(--accent)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--neg);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.fab{width:62px;height:62px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 22px rgba(53,88,232,.45)}
.fab svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round}
.fab:active{transform:scale(.96)}

/* Hojas (sheets) */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:90vh}}
.sheet .sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;flex:none}
.sheet .sh-h h3{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.sheet .sh-b{overflow-y:auto;padding:8px 18px 18px;display:grid;gap:16px;align-content:start;-webkit-overflow-scrolling:touch}
.sheet .sh-f{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .sh-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Rubros en el compositor */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--surface2);border:2px solid transparent;font-size:12px;font-weight:700;text-align:center;line-height:1.15;min-height:68px}
.cat-b .e{font-size:22px}
.cat-b.on{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) 108px auto;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px}
.line .inp{min-height:40px;padding:8px 10px}
.line .catbtn{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:19px;display:grid;place-items:center}
.line .x{width:32px;height:32px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.scan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scan button,.scan label{cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;font-size:14px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:800}
.scan button small,.scan label small{font-weight:600;font-size:11.5px;line-height:1.25;color:var(--ink2)}
.scan label{flex-direction:column;align-items:flex-start;gap:4px;padding:12px;font-size:14px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:800}
.scan svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:700 10.5px var(--font-body)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.readout{min-height:22px;font-weight:800;font-size:14px;margin-bottom:6px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.donut-c{font-family:var(--font-display);font-weight:800;fill:var(--ink)!important;font-size:15px!important}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:60;font-weight:700;display:flex;gap:14px;align-items:center;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .15s}
.toast button{color:var(--accent);font-weight:800;filter:brightness(1.3)}
.toast.err{background:var(--neg);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.kpi .d{font-size:12px;font-weight:700;margin-top:2px}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;font-weight:700;white-space:nowrap}
.tbl td:first-child{white-space:normal;font-weight:700}
.scrollx{overflow-x:auto}
.bar-seg{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden}
.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.55) 3px 5px)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tg{width:46px;height:28px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:.15s}
.tg.on{background:var(--accent)} .tg.on::after{left:21px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.set-row:first-child{border-top:0}
.help{font-size:13.5px;color:var(--ink2);line-height:1.5}
.help b{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mes .lbl{display:flex;flex-direction:column;line-height:1.05;padding:4px 8px}.mes .lbl small{font:700 11px var(--font-body);color:var(--muted);letter-spacing:.04em;margin-top:2px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}

  return `<div class="readout num" id="ro-${id}">${esc(o.def || ' ')}</div><svg class="chart" data-ro="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Gráfico de líneas')}">${g}</svg>`;
}

/* ============ Piezas de pantalla ============ */
function mainCat(m) {
  if (m.tipo === 'ingreso') return { e: ingCatOf(m.cat).e, n: ingCatOf(m.cat).n, c: ingCatOf(m.cat).c };
  if (m.tipo === 'aporte' || m.tipo === 'retiro' || m.tipo === 'rendimiento') { const d = destOf(m.fondo); return { e: d ? d.e : '🏦', n: d ? d.n : 'Fondo', c: d ? d.c : '#6250d6' }; }
  const its = (m.items || []).slice().sort((a, b) => b.monto - a.monto); const c = catOf(its[0] ? its[0].cat : m.cat);
  return { e: c.e, n: c.n, c: c.c, multi: new Set(its.map(i => i.cat)).size > 1 };
}
function mvTitle(m) {
  if (m.com) return m.com;
  if (m.tipo === 'aporte') return 'Aporte a ' + (destOf(m.fondo) || { n: 'fondo' }).n;
  if (m.tipo === 'retiro') return 'Retiro de ' + (destOf(m.fondo) || { n: 'fondo' }).n;
  if (m.tipo === 'rendimiento') return 'Rendimiento de ' + (destOf(m.fondo) || { n: 'fondo' }).n;
  const its = m.items || []; if (its.length === 1) return its[0].n || catOf(its[0].cat).n; if (m.tipo === 'ingreso') return ingCatOf(m.cat).n;
  return its.length ? (its[0].n || 'Compra') + ' y ' + (its.length - 1) + ' más' : 'Movimiento';
}
function mvRow(m, opts = {}) {
  const c = mainCat(m); const its = (m.items || []).length;
  const sign = m.tipo === 'ingreso' || m.tipo === 'retiro' || m.tipo === 'rendimiento' ? '+' : '';
  const cls = m.tipo === 'ingreso' || m.tipo === 'rendimiento' ? 'pos' : m.tipo === 'aporte' ? 'acc' : '';
  const bits = [];
  if (m.tipo === 'gasto') { if (its > 1) bits.push(its + ' ítems'); else bits.push(c.n); bits.push(medioOf(m.medio).n); }
  else if (m.tipo === 'ingreso') bits.push(c.n); else bits.push('Fondo');
  if (m.cuota && m.cuota.n > 1) bits.push(`cuota ${m.cuota.i}/${m.cuota.n}`);
  if (m.pagoFondo) bits.push('con ' + (destOf(m.pagoFondo) || { n: 'fondo' }).n);
  bits.push(m.por || '');
  const imp = m.mes !== m.fecha.slice(0, 7) && !opts.noimp ? `<span class="pill acc" style="margin-left:6px">se paga en ${ymShort(m.mes)}</span>` : '';
  return `<button class="mv" data-act="mov-open" data-id="${m.id}"><span class="ico" style="background:${c.c}22">${c.e}</span>
  <span class="grow"><div class="t ell">${esc(mvTitle(m))}${imp}</div><div class="s ell">${esc(bits.filter(Boolean).join(' · '))}</div></span>
  <span class="a num ${cls === 'pos' ? 'pos' : cls === 'acc' ? '' : ''}" style="${cls === 'acc' ? 'color:var(--accent)' : ''}">${sign}${money(m.total)}</span></button>`;
}
function delta(a, b, invert) { // variación porcentual vs mes anterior
  if (!b) return '';
  const p = Math.round((a - b) / b * 100); if (p === 0) return '<span class="pill">igual que el mes anterior</span>';
  const bad = invert ? p < 0 : p > 0;
  return `<span class="pill ${bad ? 'neg' : 'pos'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}% vs ${ymShort(addM(S.mes, -1)).toLowerCase()}</span>`;
}
function emptyState(emoji, t, s, btn) { return `<div class="empty"><div class="big">${emoji}</div><b>${t}</b>${s}${btn ? `<div class="sp"></div>${btn}` : ''}</div>`; }

/* ============ INICIO ============ */
function vInicio() {
  const ym = S.mes, R = esperado(ym), now = ymNow();
  const cur = ym === now, fut = ym > now;
  const hayAlgo = S.movs.length || S.plan.items.length;
  if (!hayAlgo) return `<div class="card">${emptyState('👋', 'Empecemos', 'Cargá tu primer gasto con el botón <b style="display:inline">+</b>. Podés sacarle foto al ticket y se arma solo.', `<button class="btn primary" data-act="nuevo">Cargar un gasto</button>`)}</div>`;
  // Mes actual y futuros: se muestra el mes entero (lo confirmado + lo que falta del plan). Meses pasados: lo real.
  const esp = ym >= now;
  const ingV = esp ? R.ingEsp : R.ing, consV = esp ? R.consEsp : R.cons, aporV = esp ? R.aporEsp : R.apor;
  const resV = ingV - consV, sinV = resV - aporV + R.ret;
  const tot = Math.max(ingV, consV + Math.max(0, aporV), 1);
  const wCons = consV / tot * 100, wApor = Math.max(0, aporV) / tot * 100, wSin = Math.max(0, 100 - wCons - wApor);
  const falta = Math.max(0, R.consEsp - R.cons);
  const ac = acumulado(ym);
  let h = '<div class="grid two">';
  h += `<div class="card hero span2"><div class="trio">
    <div><div class="eyebrow">${esp ? 'Entra' : 'Entró'}</div><div class="big num pos"><span data-cnt="ing" data-v="${ingV}" data-fmt="c">${compact(ingV)}</span></div><div class="cap">${esp ? (R.ingP > 0 ? 'cobrado ' + compact(R.ing) : 'todo cobrado') : 'cobrado'}</div></div>
    <div><div class="eyebrow">${esp ? 'Sale' : 'Salió'}</div><div class="big num"><span data-cnt="cons" data-v="${consV}" data-fmt="c">${compact(consV)}</span></div><div class="cap">${esp ? (falta > 500 ? 'pagado ' + compact(R.cons) : 'todo pagado') : 'gastado'}</div></div>
    <div><div class="eyebrow">${esp ? 'Sobra' : 'Resultado'}</div><div class="big num ${resV < 0 ? 'neg' : 'pos'}"><span data-cnt="res" data-v="${resV}" data-fmt="c">${compact(resV)}</span></div><div class="cap">${esp ? 'entra − sale, del mes entero' : 'ahorro del mes'}</div></div></div>
    <div class="stack" role="img" aria-label="Qué se hace con lo que entra"><i style="width:${wCons}%;background:var(--ink2)"></i><i style="width:${wApor}%;background:var(--accent)"></i><i style="width:${wSin}%;background:var(--pos)"></i></div>
    <div class="leg">
      <div class="li"><span class="dot" style="background:var(--ink2)"></span>Consumo (gastos)<small>${pct(consV, ingV)}%</small><b class="num">${money(consV)}</b></div>
      <div class="li"><span class="dot" style="background:var(--accent)"></span>Aportado a fondos<small>${pct(aporV, ingV)}%</small><b class="num">${money(aporV)}</b></div>
      <div class="li"><span class="dot" style="background:var(--pos)"></span>Queda disponible<small>${pct(Math.max(0, sinV), ingV)}%</small><b class="num ${sinV < 0 ? 'neg' : ''}">${money(sinV)}</b></div>
    </div>
    ${esp ? '<div class="hint" style="margin-top:10px">Incluye lo que todavía no confirmaste. A medida que confirmás cobros y pagos, se ajusta con los montos reales.</div>' : ''}
    ${resV < 0 && ingV > 0 ? '<div class="note neg" style="margin-top:12px">Este mes sale más de lo que entra. Mirá en Análisis qué rubro pesa más.</div>' : ''}
    <div style="margin-top:10px"><button class="link" data-act="explicar">¿Cómo se cuenta cada cosa?</button></div></div>`;
  h += `<div class="tiles span2"><button class="tile" data-act="go" data-v="fondos"><div class="eyebrow">Sobra acumulada</div><div class="v num ${ac.libre < 0 ? 'neg' : ''}"><span data-cnt="libre" data-v="${ac.libre}" data-fmt="m">${money(ac.libre)}</span></div><div class="hint">al cierre de ${ymName(ym).toLowerCase()}, sin destino todavía</div></button>
    <button class="tile" data-act="go" data-v="fondos"><div class="eyebrow">Patrimonio</div><div class="v num"><span data-cnt="patr" data-v="${ac.total}" data-fmt="m">${money(ac.total)}</span></div><div class="hint">sobra + fondos, con rendimiento estimado</div></button></div>`;
  const sc = primerMesSinCerrar();
  if (sc) h += `<div class="card span2" style="border:2px solid var(--accent)"><h2>Terminó ${ymName(sc).toLowerCase()}</h2><div class="help">Actualizá los montos reales, contá cuánto vale hoy cada fondo y cerrá el mes. Queda guardado el histórico para ver cuánto rindió.</div><div class="sp"></div><button class="btn primary block" data-act="cerrar" data-ym="${sc}">Cerrar ${ymName(sc).toLowerCase()}</button></div>`;
  // checklist
  const rows = checklist(ym);
  if (rows.length) {
    const grupos = [['ingreso', 'Cobros'], ['gasto', 'Pagos del mes'], ['aporte', 'Aportes a fondos']];
    const pend = rows.filter(r => !r.real && r.plan > 0), pendTodos = rows.filter(r => !r.real && (r.plan > 0 || r.it.recordar));
    h += `<div class="card"><h2>Para este mes ${pendTodos.length ? `<span class="pill warn">${pendTodos.length} pendiente${pendTodos.length > 1 ? 's' : ''}</span>` : '<span class="pill pos">Todo al día</span>'}</h2>`;
    { const hechos = rows.filter(r => r.real).length; h += `<div class="prog"><div class="bar"><i style="width:${pct(hechos, rows.length)}%;background:var(--pos)"></i></div><div class="hint">${hechos} de ${rows.length} hechos${hechos === rows.length ? ' · todo al día' : ''}</div></div>`; }
    for (const [tipo, lab] of grupos) {
      const rs = rows.filter(r => r.it.tipo === tipo); if (!rs.length) continue;
      h += `<div class="group-h">${lab}</div>`;
      for (const r of rs) {
        const done = !!r.real; const e = r.it.tipo === 'aporte' ? r.it.e : (r.it.tipo === 'ingreso' ? ingCatOf(r.it.cat).e : catOf(r.it.cat).e);
        h += `<button class="chk ${done ? 'done' : ''}${S.ui.just === r.it.id ? ' pop' : ''}" data-act="plan-open" data-id="${esc(r.it.id)}"><span class="cb">${IC.check}</span><span class="grow"><div class="nm ell">${e} ${esc(r.it.n)}</div><div class="sub">${done ? 'registrado' + (Math.round(r.real.total) !== Math.round(r.plan) ? ' · previsto ' + money(r.plan) : '') : (r.recordatorio ? 'recordatorio · cargá el monto cuando llegue' : r.it.pct ? '10% de los ingresos' : fut ? 'previsto' : 'tocá para confirmar')}</div></span><span class="amt num ${done ? 'pos' : ''}">${r.recordatorio ? '<span class="muted" style="font-weight:700">sin monto</span>' : money(done ? r.real.total : r.plan)}</span></button>`;
      }
    }
    if (pend.length > 1) h += `<div class="sp"></div><button class="btn block" data-act="plan-todo">Confirmar todo lo pendiente (${pend.length})</button>`;
    h += '</div>';
  }
  if (ym <= now && ym >= cfg().inicio && sc !== ym) h += `<div class="span2"><button class="btn block ghost" data-act="cerrar" data-ym="${ym}">${S.cierres[ym] ? '✓ ' + ymName(ym) + ' cerrado · volver a ajustar' : 'Cerrar ' + ymName(ym).toLowerCase() + ' ahora'}</button></div>`;
  // tarjetas
  const tj = tarjetasMes(ym), tj2 = tarjetasMes(addM(ym, 1));
  if (tj.some(x => x.total) || tj2.some(x => x.total)) {
    h += '<div class="card"><h2>Tarjetas</h2>';
    for (let i = 0; i < tj.length; i++) {
      const a = tj[i], b = tj2[i]; if (!a.total && !b.total) continue;
      if (a.total) h += `<div class="mv"><span class="ico">💳</span><span class="grow"><div class="t">${esc(a.t.n)}</div><div class="s">Se paga en ${ymName(ym).toLowerCase()}${a.previo ? ' · incluye ' + money(a.previo) + ' de saldo anterior' + (a.pagado ? ' (ya pagado)' : '') : ''}</div></span><span class="a num">${money(a.total)}</span></div>`;
      if (b.total) h += `<div class="mv"><span class="ico">💳</span><span class="grow"><div class="t">${esc(a.t.n)}</div><div class="s">Ya acumulado para ${ymName(addM(ym, 1)).toLowerCase()}</div></span><span class="a num ink2">${money(b.total)}</span></div>`;
    }
    h += '</div>';
  }
  h += cardBolsas(ym);
  // rubros
  const pr = porRubro(R.L).slice(0, 6), totR = sum(porRubro(R.L), r => r.total);
  if (pr.length) {
    h += `<div class="card"><h2>En qué se va <button class="more" data-act="go" data-v="analisis">Ver análisis</button></h2>`;
    pr.forEach(r => { const c = catOf(r.cat); h += `<div class="bar-row"><div class="hd"><span class="ico sm" style="background:${c.c}22">${c.e}</span><span class="n ell">${esc(c.n)}</span><span class="v num">${money(r.total)}</span></div><div class="bar"><i style="width:${r.total / pr[0].total * 100}%;background:${c.c}"></i></div></div>`; });
    h += '</div>';
  }
  // últimos
  const ult = R.L.filter(m => m.src !== 'plan' && !m.omitido).sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || ''))).slice(0, 6);
  if (ult.length) h += `<div class="card"><h2>Últimos movimientos <button class="more" data-act="go" data-v="movs">Ver todos</button></h2>${ult.map(m => mvRow(m)).join('')}</div>`;
  return h + '</div>';
}

/* ============ MOVIMIENTOS ============ */
function vMovs() {
  const U = S.ui; const R = resumenMes(S.mes, 'pago');
  let L = R.L.filter(m => !m.omitido);
  if (U.movFiltro === 'gasto') L = L.filter(m => m.tipo === 'gasto'); else if (U.movFiltro === 'ingreso') L = L.filter(m => m.tipo === 'ingreso'); else if (U.movFiltro === 'fondo') L = L.filter(m => ['aporte', 'retiro', 'rendimiento'].includes(m.tipo));
  const q = norm(U.q);
  let h = `<div class="search" style="margin-bottom:10px">${IC.search}<input class="inp" id="q-movs" placeholder="Buscar comercio, ítem, nota…" value="${esc(U.q)}" autocomplete="off"></div>
  <div class="seg" style="margin-bottom:10px">${[['todo', 'Todo'], ['gasto', 'Gastos'], ['ingreso', 'Ingresos'], ['fondo', 'Fondos']].map(([k, l]) => `<button class="${U.movFiltro === k ? 'on' : ''}" data-act="mfiltro" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="seg" style="margin-bottom:6px"><button class="${U.movVista === 'compras' ? 'on' : ''}" data-act="mvista" data-k="compras">Por compra</button><button class="${U.movVista === 'items' ? 'on' : ''}" data-act="mvista" data-k="items">Línea por línea</button></div>
  <div class="hint" style="margin:6px 4px 0">Mostrando lo que se paga en ${ymName(S.mes).toLowerCase()}.</div>`;
  if (U.movVista === 'compras') {
    if (q) L = L.filter(m => norm([m.com, m.nota, mvTitle(m), ...(m.items || []).map(i => i.n)].join(' ')).includes(q));
    L.sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || '')));
    if (!L.length) return h + `<div class="card" style="margin-top:12px">${emptyState('🧾', 'Nada por acá', 'Todavía no hay movimientos con ese filtro.', `<button class="btn primary" data-act="nuevo">Cargar uno</button>`)}</div>`;
    const dias = new Map(); L.forEach(m => { if (!dias.has(m.fecha)) dias.set(m.fecha, []); dias.get(m.fecha).push(m); });
    for (const [f, ms] of dias) {
      const tot = sum(ms.filter(esConsumo), m => m.total);
      h += `<div class="day-h"><span>${fechaCorta(f)}</span><span class="num">${tot ? money(tot) : ''}</span></div><div class="card" style="padding:4px 14px">${ms.map(m => mvRow(m)).join('')}</div>`;
    }
  } else {
    let lines = []; for (const m of L) if (m.tipo === 'gasto') for (const it of m.items || []) lines.push({ ...it, m });
    if (q) lines = lines.filter(l => norm([l.n, l.d, l.m.com, catOf(l.cat).n].join(' ')).includes(q));
    lines.sort((a, b) => b.m.fecha.localeCompare(a.m.fecha) || b.monto - a.monto);
    if (!lines.length) return h + `<div class="card" style="margin-top:12px">${emptyState('🔎', 'Sin líneas', 'Acá aparece cada ítem de cada compra.', '')}</div>`;
    h += `<div class="day-h"><span>${lines.length} líneas</span><span class="num">${money(sum(lines, l => l.monto))}</span></div><div class="card" style="padding:4px 14px">` + lines.map(l => {
      const c = catOf(l.cat);
      return `<button class="mv" data-act="mov-open" data-id="${l.m.id}"><span class="ico sm" style="background:${c.c}22">${c.e}</span><span class="grow"><div class="t ell">${esc(l.n || c.n)}${l.cant > 1 ? ` <span class="muted">×${l.cant}</span>` : ''}</div><div class="s ell">${fechaCorta(l.m.fecha)} · ${esc(l.m.com || c.n)}</div></span><span class="a num">${money(l.monto)}</span></button>`;
    }).join('') + '</div>';
  }
  return h;
}

/* ============ ANÁLISIS ============ */

  if (S.base === 'pago') {

    <div class="kpi"><div class="eyebrow">Gastado hasta hoy</div><div class="v num">${compact(E.cons)}</div><div class="d muted">${falta > 500 ? 'faltan ' + compact(falta) + ' por pagar' : 'todo pagado'}</div></div>

    <div class="kpi"><div class="eyebrow">Resultado esperado</div><div class="v num ${resEsp < 0 ? 'neg' : 'pos'}">${compact(resEsp)}</div><div class="d muted">hoy: ${compact(E.res)}</div></div>${kRub}</div>`;

/* --- Sugerencias con el catálogo estándar --- */
function sugerir(q) {
  const nq = norm(q); if (!nq) return [];
  const usados = new Set(KNOWN ? [...KNOWN.values()].map(x => itemKey(x.n)) : []);
  const cats = new Set(cfg().cats.map(c => c.id));
  const sc = (nn, al) => {
    if (nn === nq) return 100;
    if (nn.startsWith(nq)) return 90 - Math.min(nn.length - nq.length, 30) / 3;
    if (nn.split(' ').some(w => w.startsWith(nq))) return 70;
    let best = 0;
    for (const a of al) { if (a === nq) best = Math.max(best, 85); else if (a.startsWith(nq)) best = Math.max(best, 65); else if (a.split(' ').some(w => w.startsWith(nq))) best = Math.max(best, 45); }
    if (best) return best;
    return nq.length >= 4 && nn.includes(nq) ? 30 : 0;
  };
  const out = [];
  for (const e of catIndex().list) { let s = sc(e.nn, e.al); if (!s) continue; if (usados.has(e.k)) s += 6; if (e.propio) s += 3; out.push({ n: e.n, cat: cats.has(e.cat) ? e.cat : 'otros', s }); }
  if (KNOWN) for (const x of KNOWN.values()) { if (canonEntry(x.n)) continue; const s = sc(norm(x.n), []); if (s) out.push({ n: x.n, cat: x.cat, s: s + 8 }); }
  out.sort((a, b) => b.s - a.s || a.n.localeCompare(b.n));
  const seen = new Set(), res = [];
  for (const o of out) { const k = norm(o.n); if (seen.has(k)) continue; seen.add(k); res.push(o); if (res.length >= 7) break; }
  res.top = res.length ? res[0].s : 0;
  return res;
}

  const L = sugerir(q), ex = canonEntry(q), i = el.dataset.i;

async function exportCSV() {
  const rows = [['fecha', 'mes_de_pago', 'tipo', 'comercio', 'item', 'rubro', 'monto', 'medio', 'cargo', 'cuota']];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  S.movs.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => {
    const cu = m.cuota ? `${m.cuota.i}/${m.cuota.n}` : '';
    if (m.tipo === 'gasto') (m.items || []).forEach(i => rows.push([m.fecha, m.mes, 'gasto', m.com || '', i.n, catOf(i.cat).n, i.monto, medioOf(m.medio).n + (m.pagoFondo ? ' (fondo)' : ''), m.por || '', cu]));
    else rows.push([m.fecha, m.mes, m.tipo, m.com || (destOf(m.fondo) || {}).n || '', m.tipo === 'ingreso' ? ingCatOf(m.cat).n : '', '', m.total, '', m.por || '', '']);
  });
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\n');
  if (S.cap.downloads) { try { await S.cap.downloads.save({ filename: `economia-familiar-${hoy()}.csv`, data: csv }); } catch (e) { if (e && e.code !== 'declined') toast('No se pudo exportar.', null, true); } }
  else toast('Exportar no está disponible en esta vista.', null, true);
}

document.addEventListener('mousedown', e => { if (e.target.closest('.sug')) e.preventDefault(); });
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.sug) setTimeout(() => { if (document.activeElement !== e.target) sugClose(); }, 250); });
document.addEventListener('click', e => {
  if (e.target.closest('label[for="file-ticket"]') && CP) setTimeout(() => { const h = $('#foto-hint'); if (h && CP && !CP.foto && CP.scan.state !== 'loading') h.hidden = false; }, 7000);
  const tip = e.target.closest('[data-tip]');
  if (tip) { const svg = tip.closest('svg'); const ro = $('#ro-' + (svg && svg.dataset.ro)); if (ro) ro.textContent = tip.dataset.tip; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const d = sheetOf(el) || SHEETS[SHEETS.length - 1];
  fn(el, e, d);
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset && el.dataset.sug) setTimeout(() => sugShow(el), 0);
  if (el.id === 'q-movs') { S.ui.q = el.value; renderKeep(el); return; }
  if (el.id === 'q-items') { S.ui.itemQ = el.value; renderKeep(el); return; }
  const f = el.dataset && el.dataset.f; if (!f) return;
  if (f === 'rep-pct') {
    aplicarReparto(el.dataset.id, +el.value); el.value = destOf(el.dataset.id).pct;
    cfg().destinos.forEach(x => { const a = document.getElementById('rp-pct-' + x.id); if (a) a.textContent = String(+x.pct || 0).replace('.', ',') + '%'; const b = document.getElementById('rp-amt-' + x.id); if (b) b.textContent = money(aportePlan(x, S.mes)); const sl = document.querySelector('[data-f="rep-pct"][data-id="' + x.id + '"]'); if (sl && sl !== el) sl.value = x.pct; });
    return;
  }
  const d = sheetOf(el);
  if (d && d.id === 'cp') { cpInput(f, el.value, el); return; }
  if (d && d.id === 'cierre' && W) {
    if (f === 'w-row') { const r = W.rows[+el.dataset.i]; r.monto = el.value; r.touched = true; }
    else if (f === 'w-ap') { const a = W.ap[el.dataset.id]; a.monto = el.value; a.touched = true; }
    else if (f === 'w-val') { const v = W.val[el.dataset.id]; v.v = el.value; v.touched = true; }
    wUpdate(); return;
  }
  if (!d) return;
  if (f === 'fe-n') d.d.n = el.value; else if (f === 'fe-e') d.d.e = el.value || '💰'; else if (f === 'fe-a') d.d.aporte = parseMonto(el.value); else if (f === 'fe-d') { if (el.value) d.d.desde = el.value; else delete d.d.desde; } else if (f === 'fe-pct') d.d.pct = parseMonto(String(el.value).replace(',', '.')); else if (f === 'fe-s') d.d.saldo0 = parseMonto(el.value); else if (f === 'fe-p') d.d.plazo = parseInt(el.value) || 0; else if (f === 'fe-m') d.d.meta = parseMonto(el.value);
  else if (f === 'bo-n') d.b.n = el.value; else if (f === 'bo-m') d.b.monto = parseMonto(el.value); else if (f === 'bo-d') d.b.desde = el.value;
  else if (f === 'ce-n') d.x.n = el.value; else if (f === 'ce-e') d.x.e = el.value || '🏷️'; else if (f === 'ce-p') d.x.pres = parseMonto(el.value); else if (f === 'ce-pd') { if (el.value) d.x.presDesde = el.value; else delete d.x.presDesde; }
  else if (f === 'me-n') d.x.n = el.value; else if (f === 'me-m') d.x.monto = parseMonto(el.value);
  else if (f === 'pe-n') d.it.n = el.value; else if (f === 'pe-b') d.it.base = parseMonto(el.value); else if (f === 'pe-pct') d.it.pct = parseMonto(el.value) || 0; else if (f === 'pe-d') d.it.desde = el.value; else if (f === 'pe-h') d.it.hasta = el.value;
  else if (f === 'pe-ov') { if (el.value.trim() === '') delete d.it.ov[el.dataset.m]; else d.it.ov[el.dataset.m] = parseMonto(el.value); }
});
document.addEventListener('change', async e => {
  const el = e.target, f = el.dataset && el.dataset.f; const d = sheetOf(el);
  if (el.id === 'file-ticket') { if (CP && el.files && el.files.length) { const fs = [...el.files]; el.value = ''; adjuntarFoto(fs); } return; }
  if (f === 'ln' && CP && KNOWN) { const l = CP.lines[+el.dataset.i], k = KNOWN.get(keyOf(itemName(el.value))); if (k) { l.cat = S.apr[keyOf(el.value)] || k.cat; l.auto = false; if (!l.monto) l.monto = r2(k.last); cpRefresh(); } return; }
  if (el.id === 'pl-fecha' && d && d.id === 'plan') { d.keep(); paintSheet(d); return; }
  if (f === 'rep-pct') { await guardar(saveCfg); render(); return; }
  if (f === 'rep-monto') { destOf(el.dataset.id).aporte = parseMonto(el.value); await guardar(saveCfg); render(); return; }
  if (el.id === 'it-cat') { const k = el.dataset.key; await guardar(() => Store.merge('cfg', 'aprendido', { [k]: el.value }), 'Listo: la próxima vez va a ese rubro'); return; }
  if (d && d.id === 'fondo' && f && f.startsWith('fp-')) { d.set(f.slice(3), el.value); paintSheet(d); return; }
  if (d && d.id === 'pe-select') return;
  if (f === 'pe-c' && d) { d.it.cat = el.value; return; }
  if (f === 'fecha' && d && d.id === 'cp') { cpInput('fecha', el.value, el); if (esTarjeta(CP.medio)) cpRefresh(); return; }
  if (!f || !f.startsWith('st-')) return;
  const c = cfg();
  if (f === 'st-user') c.usuarios[+el.dataset.i] = el.value.trim() || c.usuarios[+el.dataset.i];
  else if (f === 'st-tc') c.tc = parseMonto(el.value) || c.tc; else if (f === 'st-rend') c.rendMensual = Math.max(0, Math.min(30, parseMonto(String(el.value).replace(',', '.')) || 0));
  else if (f === 'st-caja') c.caja = parseMonto(el.value); else if (f === 'st-ini') c.inicio = el.value || c.inicio;
  else if (f === 'st-cierre') c.tarjetas[+el.dataset.i].cierre = Math.min(31, parseInt(el.value) || 0);
  if (await guardar(saveCfg)) { if (S.user && !c.usuarios.includes(S.user)) S.user = c.usuarios[0]; render(); }
});
document.addEventListener('paste', e => {
  const z = e.target.closest && e.target.closest('#paste-zone'); if (!z) return;

(function () {
  let y0 = null;
  document.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && !SHEETS.length && e.touches.length === 1) ? e.touches[0].clientY : null; }, { passive: true });

/* ============ Render y arranque ============ */
const VIEWS = { inicio: vInicio, movs: vMovs, analisis: vAnalisis, fondos: vFondos, ajustes: vAjustes };
function render() {
  if (!S.ready) return;
  const y = window.scrollY;
  try { $('#app').innerHTML = header() + (VIEWS[S.vista] || vInicio)(); }
  catch (err) { console.error(err); $('#app').innerHTML = `<div class="card">${emptyState('⚠️', 'Algo salió mal al mostrar esta pantalla', esc(String(err.message || err)), '<button class="btn" data-act="go" data-v="inicio">Volver al inicio</button>')}</div>`; }
  paintNav(); window.scrollTo(0, y); animNums();
}
function renderKeep(el) {
  const id = el.id, pos = el.selectionStart; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
}
function onData() {
  if (!S.ready) { if (S.loaded.mov && S.loaded.cfg) { S.ready = true; const b = $('#boot'); if (b) b.remove(); route(); render(); autoMes(); } return; }
  render();
}
function autoMes() { if (S.mes < cfg().inicio && S.mes === ymNow()) S.mes = ymNow(); }
function route() { const h = (location.hash || '').replace('#', ''); if (VIEWS[h]) S.vista = h; }
window.addEventListener('hashchange', () => { route(); render(); });
setTimeout(() => { if (S.ready) render(); }, 3300);
Store.init().catch(e => { console.error(e); $('#boot').innerHTML = '<div class="card">No se pudo iniciar la app. Recargá la página.</div>'; });
