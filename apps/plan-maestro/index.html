<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan Maestro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de herramientas arriba, Gantt (árbol fijo a la izquierda + línea de tiempo) y panel de edición a la derecha */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#f7f8fb; --ink:#171b26; --muted:#667085; --line:#dfe3ea; --line2:#eceff4;
  --accent:#2f4bde; --accent-ink:#ffffff; --danger:#d92d20; --ok:#168a5b; --today:#e5484d;
  --shadow:0 8px 28px rgba(20,25,40,.14);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lw:380px; --rowh:38px; --headh:54px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117; --surface:#181b24; --surface2:#1d212c; --ink:#e9ecf3; --muted:#9aa2b4; --line:#2b3040; --line2:#232837;
  --accent:#7d92ff; --accent-ink:#0f1117; --danger:#ff6b61; --ok:#3ccf91; --today:#ff6369;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1117; --surface:#181b24; --surface2:#1d212c; --ink:#e9ecf3; --muted:#9aa2b4; --line:#2b3040; --line2:#232837;
  --accent:#7d92ff; --accent-ink:#0f1117; --danger:#ff6b61; --ok:#3ccf91; --today:#ff6369;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.35 var(--f-body);display:flex;flex-direction:column;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Barra superior ── */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font:700 20px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.stats{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stats .late{color:var(--danger)}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save[data-s="pending"] i,.save[data-s="saving"] i{background:#e5a100}
.save[data-s="error"] i,.save[data-s="ro"] i{background:var(--danger)}
.save[data-s="local"] i{background:var(--muted)}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink);background:var(--surface2)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.grp{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:9px;font-weight:500;font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.field{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:0;width:100%}
.search{position:relative;flex:1 1 150px;max-width:220px}
.search input{padding-left:30px}
.search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
select.field{width:auto}
.sp{flex:1}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;z-index:40}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.pop button:hover{background:var(--surface2)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}

/* ── Zona principal ── */
.main{flex:1;min-height:0;display:flex;gap:10px}
.gantt{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative;overscroll-behavior:contain}
.canvas{position:relative;min-height:100%}
.head{position:sticky;top:0;z-index:6;display:flex;height:var(--headh);background:var(--surface);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 12px 8px;color:var(--muted);font-size:12px;gap:6px}
.corner b{color:var(--ink);font-weight:600}
.th{position:relative;flex:none;height:100%}
.th .m{position:absolute;top:0;height:28px;border-left:1px solid var(--line);padding:6px 8px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden}
.th .w{position:absolute;top:28px;height:26px;font-size:11px;color:var(--muted);padding:5px 0 0 4px;white-space:nowrap;border-left:1px solid var(--line2);font-variant-numeric:tabular-nums}
.th .w.we{background:color-mix(in srgb,var(--muted) 9%,transparent)}
.th .td{position:absolute;top:28px;height:26px;padding:5px 5px 0;font-size:11px;font-weight:700;color:#fff;background:var(--today);border-radius:6px;transform:translateX(-50%);white-space:nowrap;z-index:2}
.grid{position:absolute;left:var(--lw);top:var(--headh);bottom:0;z-index:1;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.grid i.m{border-left-color:var(--line)}
.grid i.t{border-left:2px solid var(--today);opacity:.8;z-index:2}
.row{display:flex;height:var(--rowh);border-bottom:1px solid var(--line2);position:relative}
.lc{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 8px 0 6px;overflow:hidden;cursor:pointer}
.tc{position:relative;flex:none;height:100%}
.row.area{--bgc:color-mix(in srgb,var(--c) 13%,var(--surface))}
.row.proj{--bgc:color-mix(in srgb,var(--c) 5%,var(--surface))}
.row.area .lc,.row.area .tc{background:var(--bgc)}
.row.proj .lc,.row.proj .tc{background:var(--bgc)}
.row.area{border-top:1px solid var(--line)}
.row.sel .lc{box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.row.sel .tc{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.row.dragging{opacity:.4}
.row.dz-before{box-shadow:inset 0 3px 0 var(--accent)}
.row.dz-after{box-shadow:inset 0 -3px 0 var(--accent)}
.row.dz-into .lc{outline:2px dashed var(--accent);outline-offset:-3px}
.d1 .lc{padding-left:22px}.d2 .lc{padding-left:38px}
.grip{flex:none;width:16px;height:24px;color:var(--muted);opacity:.55;cursor:grab;display:grid;place-items:center;border-radius:5px}
.grip:hover{opacity:1;background:var(--surface2)}
.chev{flex:none;width:22px;height:22px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:6px;padding:0}
.chev:hover{background:var(--surface2);color:var(--ink)}
.chev .ic{transition:transform .15s}
.chev[aria-expanded="true"] .ic{transform:rotate(90deg)}
.nm{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.15;font-size:13px}
.area .nm{font:700 14px/1.15 var(--f-display);letter-spacing:-.005em}
.proj .nm{font-weight:600}
.dept{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.sbtn{flex:none;width:20px;height:20px;border-radius:50%;border:1.8px solid var(--c);background:transparent;padding:0;display:grid;place-items:center;color:#fff}
.sbtn.doing{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.sbtn.done{background:var(--c)}
.sbtn .ic{width:12px;height:12px;stroke-width:3;display:none}
.sbtn.done .ic{display:block}
.row.is-done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.star{flex:none;color:#e5a100;width:16px;height:16px;fill:#e5a100;stroke:#e5a100}
.late-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.acts{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:2}
.acts button{border:0;background:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);padding:0}
.acts button:hover{background:var(--surface2);color:var(--ink)}
.row:hover .acts,.row.sel .acts{display:flex}
@media (hover:none){.row:hover:not(.sel) .acts{display:none}}

/* Barras */
.bar{position:absolute;top:8px;height:calc(var(--rowh) - 16px);border-radius:7px;background:color-mix(in srgb,var(--c) 26%,var(--surface));border:1.5px solid var(--c);cursor:grab;z-index:2;touch-action:none;min-width:6px}
.bar:hover{filter:brightness(1.06)}
.bar.doing{background:var(--c)}
.bar.done{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,transparent);opacity:.75}
.bar.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--c);font-weight:700}
.bar.late{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 28%,transparent)}
.bar.habito{top:12px;height:calc(var(--rowh) - 24px);border-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 32%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 10%,var(--surface)) 6px 12px)}
.bar.hito{width:18px!important;min-width:18px;height:18px;top:calc(var(--rowh)/2 - 9px);transform:rotate(45deg);border-radius:4px;background:var(--c);margin-left:-9px}
.bar.hito.done{background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.bar.hito.done::after{display:none}
.bar.sel,.bar.drag{outline:2px solid var(--accent);outline-offset:2px}
.h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.h.l{left:-3px}.h.r{right:-3px}
.sum{position:absolute;border-radius:5px;background:color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden;z-index:2;pointer-events:auto}
.sum i{display:block;height:100%;background:var(--c);border-radius:5px 0 0 5px}
.row.area .sum{top:13px;height:12px}
.row.proj .sum{top:15px;height:8px}
.empty{position:absolute;inset:var(--headh) 0 0 0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;z-index:8;background:var(--surface)}
.empty h2{font:700 18px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty .sbx{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;box-shadow:var(--shadow)}

/* ── Panel de edición ── */
.panel{flex:none;width:344px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel[hidden]{display:none}
.ph{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line2)}
.crumb{font-size:12px;color:var(--muted);flex:1;min-width:0}
.crumb b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.pb{overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:14px}
.pb label.l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:5px}
.pb .name{font:700 17px/1.2 var(--f-display);padding:8px 10px}
.pb textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb .seg{display:flex}.pb .seg button{flex:1}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--surface2);max-width:100%}
.chip a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.chip a:hover{text-decoration:underline}
.chip button{border:0;background:none;color:var(--muted);width:20px;height:20px;border-radius:50%;padding:0;display:grid;place-items:center}
.chip button:hover{background:var(--line)}
.dur{font-size:12px;color:var(--muted);margin-top:5px}
.dur.late{color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:80;font-size:13px;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.5);display:grid;place-items:center;z-index:90;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font:700 17px var(--f-display)}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .sbx{display:flex;gap:8px;justify-content:flex-end}

/* ── Tablero ── */
.board{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;align-items:stretch;padding-bottom:2px;overscroll-behavior-x:contain}
.col{flex:none;width:292px;display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--line);border-radius:12px;min-height:0}
.col.dz-col{outline:2px dashed var(--accent);outline-offset:-3px}
.colh{padding:10px 12px 9px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px 12px 0 0;background:var(--surface)}
.colh .tt{flex:1;min-width:0}
.colh b{display:block;font:700 14px/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colh .cnt{flex:none}
.colh .plus{flex:none;border:0;background:none;width:26px;height:26px;border-radius:7px;color:var(--muted);display:grid;place-items:center;padding:0}
.colh .plus:hover{background:var(--surface2);color:var(--ink)}
.colb{flex:1;min-height:56px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(20,25,40,.06)}
.card:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));border-left-color:var(--c)}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.dragging{opacity:.4}
.card.dz-before{box-shadow:0 -3px 0 var(--accent)}
.card.dz-after{box-shadow:0 3px 0 var(--accent)}
.card .cr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{display:flex;align-items:flex-start;gap:7px}
.card .cn{flex:1;min-width:0;font-weight:500;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.card.is-done .cn{color:var(--muted);text-decoration:line-through}
.card .cm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.card .when{font-variant-numeric:tabular-nums}
.card .when.late{color:var(--danger);font-weight:600}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 7px;background:var(--surface2)}
.colb .none{color:var(--muted);font-size:12px;text-align:center;padding:14px 6px;border:1px dashed var(--line);border-radius:9px}
.addc{margin:0 8px 8px;border:0;background:none;color:var(--muted);text-align:left;padding:7px 8px;border-radius:8px;display:flex;gap:6px;align-items:center}
.addc:hover{background:var(--surface);color:var(--ink)}

@media (max-width:760px){
  .col{width:min(84vw,310px)}
  :root{--lw:172px;--rowh:42px}
  .grip{display:none}
  .nm{font-size:12px}
  .area .nm{font-size:13px}
  .lc{padding-right:4px}
  .d1 .lc{padding-left:14px}.d2 .lc{padding-left:24px}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:74%;border-radius:16px 16px 0 0;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
  .acts{right:2px}
  .corner span.long{display:none}
  .lbl,#undo span,.btn .t{display:none}
  body{padding-block:6px;gap:6px}
  .bar2{gap:6px}
  .stats{font-size:11.5px;gap:8px}
  .brand h1{font-size:17px}
  .btn{padding:6px 9px}
  .search{max-width:none;flex:1 1 100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top">
  <div class="brand">
    <h1>Plan Maestro</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>
  <span class="save" id="save" data-s="saved"><i></i><span id="saveTxt">Cargando…</span></span>
</div>

<div class="bar2">
  <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="field" id="q" type="search" placeholder="Buscar tarea…" aria-label="Buscar tarea" autocomplete="off"></div>
  <select class="field" id="fst" aria-label="Filtrar por estado">
    <option value="all">Todas</option><option value="todo">Pendientes</option><option value="doing">En curso</option><option value="done">Hechas</option><option value="late">Vencidas</option>
  </select>
  <button class="btn" id="foco" aria-pressed="false" title="Mostrar solo las marcadas con estrella"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span class="t">Foco</span></button>
  <span class="sp"></span>
  <div class="grp"><span class="lbl">Vista</span>
    <div class="seg" id="segView" role="group" aria-label="Tipo de vista">
      <button data-v="gantt">Cronograma</button><button data-v="board">Tablero</button>
    </div></div>
  <div class="grp" id="grpGroup" hidden><span class="lbl">Columnas</span>
    <div class="seg" id="segGroup" role="group" aria-label="Agrupar columnas por">
      <button data-v="estado">Estado</button><button data-v="area">Área</button><button data-v="proyecto">Proyecto</button>
    </div></div>
  <div class="grp" id="grpArea" hidden><span class="lbl">Área</span><select class="field" id="bArea" aria-label="Ver el tablero de un área"></select></div>
  <div class="grp" id="grpPer" hidden><span class="lbl">Período</span>
    <div class="seg" id="segPer" role="group" aria-label="Qué parte del cronograma mostrar">
      <button data-v="todo">Todo</button><button data-v="dia">Día</button><button data-v="sem">Semana</button><button data-v="mes">Mes</button>
    </div><input class="field" type="date" id="bDay" aria-label="Día de referencia" title="Día de referencia (por defecto, hoy)" style="width:auto" hidden><span class="hint" id="perNote"></span></div>
  <div class="grp" id="grpLevel"><span class="lbl">Ver</span>
    <div class="seg" id="segLevel" role="group" aria-label="Nivel de detalle">
      <button data-v="areas">Áreas</button><button data-v="proyectos">Proyectos</button><button data-v="tareas">Tareas</button>
    </div></div>
  <div class="grp" id="grpZoom"><span class="lbl">Escala</span>
    <div class="seg" id="segZoom" role="group" aria-label="Escala de tiempo">
      <button data-v="pan">Panorama</button><button data-v="mes">Meses</button><button data-v="sem">Semanas</button><button data-v="dia">Días</button>
    </div></div>
  <button class="btn" id="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="t">Hoy</span></button>
  <button class="btn" id="undo" disabled title="Deshacer (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="t">Deshacer</span></button>
  <button class="btn primary" id="addTask"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva tarea</button>
  <div class="menu"><button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Más opciones"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    <div class="pop" id="pop" hidden>
      <button data-m="area">Nueva área</button><hr>
      <button data-m="json">Descargar copia de seguridad (JSON)</button>
      <button data-m="csv">Descargar para Excel (CSV)</button>
      <button data-m="import">Restaurar desde copia…</button>
    </div></div>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>

<div class="main">
  <div class="gantt" id="gantt" tabindex="-1"><div class="canvas" id="canvas"></div></div>
  <div class="board" id="board" hidden></div>
  <aside class="panel" id="panel" hidden aria-label="Detalle"></aside>
</div>

<script>
(function(){
"use strict";
/* ───────── utilidades ───────── */
const $=s=>document.querySelector(s);
const DAY=864e5;
const dn=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/DAY};
const isoOf=n=>new Date(n*DAY).toISOString().slice(0,10);
const now=new Date(); const TODAY=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/DAY;
const fD=new Intl.DateTimeFormat("es-AR",{day:"numeric",month:"short",timeZone:"UTC"});
const dstr=n=>fD.format(new Date(n*DAY)).replace(".","");
const fM=new Intl.DateTimeFormat("es-AR",{month:"long",year:"numeric",timeZone:"UTC"});
const fMs=new Intl.DateTimeFormat("es-AR",{month:"short",timeZone:"UTC"});
const fWd=new Intl.DateTimeFormat("es-AR",{weekday:"narrow",timeZone:"UTC"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ic={
 chev:'<svg class="ic" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
 grip:'<svg class="ic" viewBox="0 0 24 24" style="width:14px"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg>',
 up:'<svg class="ic" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',
 down:'<svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
 plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 check:'<svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
 star:'<svg class="ic star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
 x:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 top:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 4h14M12 20V9M6 14l6-6 6 6"/></svg>',
};

/* ───────── estado ───────── */
let S={areas:[],projects:[],tasks:[]};
let idx=new Map();
const reindex=()=>{idx=new Map();S.areas.forEach(o=>idx.set(o.id,{k:"area",o}));S.projects.forEach(o=>idx.set(o.id,{k:"proj",o}));S.tasks.forEach(o=>idx.set(o.id,{k:"task",o}))};
const LSK="plan-maestro-ui-v1", LSD="plan-maestro-data-v1";
const UI={view:"gantt",group:"estado",barea:"",per:"todo",bday:"",zoom:"mes",level:"proyectos",exp:new Set(),sel:null,q:"",fst:"all",foco:false};
try{const u=JSON.parse(localStorage.getItem(LSK)||"null");if(u){UI.zoom=u.zoom||UI.zoom;UI.view=u.view||UI.view;UI.group=u.group||UI.group;UI.barea=u.barea||"";UI.per=u.per||"todo";UI.bday=u.bday||"";UI.level=u.level||UI.level;if(Array.isArray(u.exp))UI.exp=new Set(u.exp)}}catch(e){}
let uiInit=UI.exp.size>0;
const saveUI=()=>{try{localStorage.setItem(LSK,JSON.stringify({view:UI.view,group:UI.group,barea:UI.barea,per:UI.per,bday:UI.bday,zoom:UI.zoom,level:UI.level,exp:[...UI.exp]}))}catch(e){}};
const ZOOM={pan:2.4,mes:6,sem:16,dia:34};
let RO=false;

/* ───────── historial (deshacer) ───────── */
const hist=[];let lastKey=null,lastT=0;
function mutate(fn,key){
  if(RO){toast("Este plan está en solo lectura");return false}
  const t=Date.now();
  if(key==null||key!==lastKey||t-lastT>1500){hist.push(JSON.stringify(S));if(hist.length>40)hist.shift()}
  lastKey=key;lastT=t;
  try{fn();reindex();changed()}catch(e){console.error(e);toast("Error: "+(e&&e.message||e));return false}
  return true;
}
function undo(){
  if(!hist.length||RO)return;
  S=JSON.parse(hist.pop());reindex();lastKey=null;
  if(UI.sel&&!idx.has(UI.sel))UI.sel=null;
  changed(true);toast("Cambio deshecho");
}
function changed(panel){render();updateStats();$("#undo").disabled=!hist.length;if(panel)renderPanel();scheduleSave()}

/* ───────── persistencia (db + copia local) ───────── */
let db=null,ref=null,myRev=0,dirty=false,saving=false,saveTimer=null,loaded=false,loadTimer=null,failN=0;
const CID=Math.random().toString(36).slice(2,10);
const SMAP={pending:"Cambios sin guardar…",saving:"Guardando…",saved:"Guardado",local:"Solo en este navegador",error:"No se pudo guardar",ro:"Solo lectura",load:"Cargando…",offline:"Sin conexión, mostrando copia local",denied:"Sin permiso para guardar: solo en este navegador"};
function setStatus(s){const el=$("#save");el.dataset.s=(s==="load"||s==="offline")?"pending":(s==="denied"?"error":s);$("#saveTxt").textContent=SMAP[s]}
function mirror(){try{localStorage.setItem(LSD,JSON.stringify(S))}catch(e){}}
function scheduleSave(){
  dirty=true;mirror();
  if(!ref){setStatus("local");return}
  if(failN>=9){setStatus("denied");return}
  setStatus("pending");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!ref||!dirty)return;
  if(saving){return}
  saving=true;dirty=false;setStatus("saving");
  const payload=JSON.parse(JSON.stringify({areas:S.areas,projects:S.projects,tasks:S.tasks,rev:++myRev,by:CID,savedAt:Date.now()}));
  try{
    await ref.set(payload);failN=0;
    setStatus(dirty?"pending":"saved");
  }catch(e){
    dirty=true;failN++;
    if(e&&(e.code==="invalid_argument"||e.code==="revoked")){dirty=false;failN=9;setStatus("denied");toast("No se pudo guardar en tu cuenta ("+e.code+"). Tus cambios quedan en este navegador.")}
    else{setStatus("error");if(failN<4){clearTimeout(saveTimer);saveTimer=setTimeout(flush,6000*failN)}}
  }finally{
    saving=false;
    if(dirty&&failN===0){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300)}
  }
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty){clearTimeout(saveTimer);flush()}});

function adopt(d,remote){
  S=JSON.parse(JSON.stringify({areas:d.areas||[],projects:d.projects||[],tasks:d.tasks||[]}));
  reindex();
  if(!uiInit){setLevel(UI.level,true);uiInit=true}
  if(UI.sel&&!idx.has(UI.sel))UI.sel=null;
  render();updateStats();renderPanel();mirror();
  if(remote)toast("Plan actualizado desde otro dispositivo");
}
async function initData(){
  setStatus("load");
  let local=null;try{local=JSON.parse(localStorage.getItem(LSD)||"null")}catch(e){}
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  try{
    const user=window.claude&&window.claude.use?await window.claude.use("user"):null;
  }catch(e){}
  if(!db){
    if(local&&local.tasks){adopt(local,false)}else{render();updateStats()}
    setStatus(RO?"ro":"local");loaded=true;return;
  }
  ref=db.doc("plan/main");
  loadTimer=setTimeout(()=>{
    if(!loaded){
      if(local&&local.tasks&&!S.tasks.length){adopt(local,false)}
      setStatus("offline");
    }
  },10000);
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(snap.exists){
      const d=snap.data();
      if((d.rev||0)<=myRev&&loaded)return;
      if(dirty||saving)return;
      clearTimeout(loadTimer);
      const wasLoaded=loaded;
      myRev=Math.max(myRev,d.rev||0);
      adopt(d,wasLoaded&&d.by!==CID);
      loaded=true;setStatus(RO?"ro":"saved");
    }else if(!(snap.metadata&&snap.metadata.fromCache)){
      clearTimeout(loadTimer);loaded=true;
      if(local&&local.tasks&&local.tasks.length&&!RO){adopt(local,false);scheduleSave()}
      else{render();updateStats()}
      setStatus(RO?"ro":"saved");
    }
  },err=>{
    clearTimeout(loadTimer);
    if(local&&local.tasks&&!S.tasks.length)adopt(local,false);
    setStatus("error");
  });
}

/* ───────── cálculos ───────── */
const areaOf=p=>S.areas.find(a=>a.id===p.a)||{color:"#667085",n:"?"};
const projOf=t=>S.projects.find(p=>p.id===t.p);
const colorOfTask=t=>{const p=projOf(t);return p?areaOf(p).color:"#667085"};
const isLate=t=>t.ty!=="habito"&&t.st!=="done"&&dn(t.e)<TODAY;
function matches(t){
  if(UI.foco&&!t.star)return false;
  if(UI.fst==="late"){if(!isLate(t))return false}else if(UI.fst!=="all"&&t.st!==UI.fst)return false;
  if(UI.q){const q=UI.q.toLowerCase();if(!(t.n.toLowerCase().includes(q)||(t.note||"").toLowerCase().includes(q)))return false}
  return true;
}
const filtering=()=>!!(UI.q||UI.foco||UI.fst!=="all");
function range(){
  let mn=TODAY-21,mx=TODAY+120;
  for(const t of S.tasks){mn=Math.min(mn,dn(t.s));mx=Math.max(mx,dn(t.e))}
  const a=new Date(mn*DAY);const s=Date.UTC(a.getUTCFullYear(),a.getUTCMonth(),1)/DAY;
  const b=new Date((mx+14)*DAY);const e=Date.UTC(b.getUTCFullYear(),b.getUTCMonth()+1,0)/DAY;
  return{s,e};
}
function buildRows(){
  const f=filtering(),rows=[];
  for(const a of S.areas){
    const ps=S.projects.filter(p=>p.a===a.id).map(p=>{const all=S.tasks.filter(t=>t.p===p.id);return{p,all,shown:f?all.filter(matches):all}});
    const vis=f?ps.filter(x=>x.shown.length):ps;
    if(f&&!vis.length)continue;
    const aAll=ps.flatMap(x=>x.all);
    const aOpen=f||UI.exp.has(a.id);
    rows.push({k:"area",o:a,all:aAll,open:aOpen,d:0});
    if(!aOpen)continue;
    for(const x of vis){
      const pOpen=f||UI.exp.has(x.p.id);
      rows.push({k:"proj",o:x.p,all:x.all,open:pOpen,d:1,c:a.color});
      if(pOpen)for(const t of x.shown)rows.push({k:"task",o:t,d:2,c:a.color});
    }
  }
  return rows;
}

/* ───────── render del Gantt ───────── */
const gantt=$("#gantt"),canvas=$("#canvas");
let R={s:0,e:0},PPD=6,lastStart=null;
function headHTML(tlW){
  let m="",w="";
  const D=(n)=>new Date(n*DAY);
  // meses
  let cur=R.s;
  while(cur<=R.e){
    const d=D(cur);const next=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)/DAY;
    const x=(cur-R.s)*PPD,wd=(Math.min(next,R.e+1)-cur)*PPD;
    let lab;
    if(wd>=120){lab=fM.format(d);lab=lab[0].toUpperCase()+lab.slice(1)}
    else{lab=fMs.format(d).replace(".","");lab=lab[0].toUpperCase()+lab.slice(1);if(d.getUTCMonth()===0||cur===R.s)lab+=" "+String(d.getUTCFullYear()).slice(2)}
    m+=`<div class="m" style="left:${x}px;width:${wd}px">${esc(lab)}</div>`;
    cur=next;
  }
  if(UI.zoom==="dia"){
    for(let n=R.s;n<=R.e;n++){const wd=D(n).getUTCDay();w+=`<div class="w${wd===0||wd===6?" we":""}" style="left:${(n-R.s)*PPD}px;width:${PPD}px;padding-left:0;text-align:center">${D(n).getUTCDate()}<br></div>`}
  }else if(UI.zoom!=="pan"){
    for(let n=R.s;n<=R.e;n++){if(D(n).getUTCDay()===1)w+=`<div class="w" style="left:${(n-R.s)*PPD}px;width:${7*PPD}px">${D(n).getUTCDate()}</div>`}
  }
  const tx=(TODAY-R.s)*PPD+PPD/2;
  const td=(TODAY>=R.s&&TODAY<=R.e)?`<div class="td" style="left:${tx}px">Hoy</div>`:"";
  return `<div class="th" style="width:${tlW}px">${m}${w}${td}</div>`;
}
function gridHTML(tlW){
  let g="";const D=n=>new Date(n*DAY);
  for(let n=R.s;n<=R.e;n++){
    const d=D(n);
    if(d.getUTCDate()===1)g+=`<i class="m" style="left:${(n-R.s)*PPD}px"></i>`;
    else if(UI.zoom==="dia")g+=`<i style="left:${(n-R.s)*PPD}px"></i>`;
    else if(UI.zoom!=="pan"&&d.getUTCDay()===1)g+=`<i style="left:${(n-R.s)*PPD}px"></i>`;
  }
  if(TODAY>=R.s&&TODAY<=R.e)g+=`<i class="t" style="left:${(TODAY-R.s)*PPD+PPD/2}px"></i>`;
  return `<div class="grid" style="width:${tlW}px">${g}</div>`;
}
function tipTxt(t){
  const s=dn(t.s),e=dn(t.e);
  if(t.ty==="hito")return `${t.n} · ${dstr(s)}`;
  return `${t.n} · ${dstr(s)} → ${dstr(e)} (${e-s+1} d)`;
}
function barHTML(t,c){
  const s=dn(t.s),e=dn(t.e),x=(s-R.s)*PPD,w=Math.max((e-s+1)*PPD,6);
  const cls=["bar",t.ty==="hito"?"hito":"",t.ty==="habito"?"habito":"",t.st,isLate(t)?"late":"",UI.sel===t.id?"sel":""].filter(Boolean).join(" ");
  const left=t.ty==="hito"?x+PPD/2:x;
  const handles=t.ty==="hito"?"":`<span class="h l" data-h="l"></span><span class="h r" data-h="r"></span>`;
  return `<div class="${cls}" data-id="${t.id}" style="left:${left}px;width:${w}px;--c:${c}" title="${esc(tipTxt(t))}">${handles}</div>`;
}
function rowHTML(r,tlW){
  const o=r.o,c=r.c||o.color;
  if(r.k==="task"){
    const late=isLate(o);
    const sb=o.ty==="hito"?"":"";
    return `<div class="row task d2${o.st==="done"?" is-done":""}${UI.sel===o.id?" sel":""}" data-id="${o.id}" data-k="task" style="--c:${c}">
      <div class="lc"><span class="grip" draggable="true" title="Arrastrar para cambiar la prioridad">${ic.grip}</span>
        <button class="sbtn ${o.st}" data-act="tick" aria-label="Marcar como hecha" title="Marcar como hecha">${ic.check}</button>
        <span class="nm" title="${esc(o.n)}">${esc(o.n)}</span>${late?'<span class="late-dot" title="Vencida"></span>':""}${o.star?ic.star:""}
        <span class="acts">${actBtns()}</span></div>
      <div class="tc" style="width:${tlW}px">${barHTML(o,c)}</div></div>`;
  }
  const done=r.all.filter(t=>t.st==="done").length,tot=r.all.length;
  let sum="";
  if(tot){
    const mn=Math.min(...r.all.map(t=>dn(t.s))),mx=Math.max(...r.all.map(t=>dn(t.e)));
    sum=`<div class="sum" data-g="${o.id}" style="left:${(mn-R.s)*PPD}px;width:${Math.max((mx-mn+1)*PPD,6)}px;--c:${c}" title="${esc(o.n)} · ${dstr(mn)} → ${dstr(mx)} · ${done}/${tot} hechas"><i style="width:${done/tot*100}%"></i></div>`;
  }
  const dept=r.k==="proj"&&o.dept?`<span class="dept">${esc(o.dept)}</span>`:"";
  return `<div class="row ${r.k} d${r.d}${UI.sel===o.id?" sel":""}" data-id="${o.id}" data-k="${r.k}" style="--c:${c}">
    <div class="lc"><span class="grip" draggable="true" title="Arrastrar para reordenar">${ic.grip}</span>
      <button class="chev" data-act="tog" aria-expanded="${r.open}" aria-label="${r.open?"Contraer":"Expandir"}">${ic.chev}</button>
      <span class="nm" title="${esc(o.n)}">${esc(o.n)}${dept}</span><span class="cnt" title="Hechas / total">${done}/${tot}</span>
      <span class="acts"><button data-act="add" title="${r.k==="area"?"Agregar proyecto":"Agregar tarea"}" aria-label="Agregar">${ic.plus}</button>${actBtns()}</span></div>
    <div class="tc" style="width:${tlW}px">${sum}</div></div>`;
}
function actBtns(){return `<button data-act="up" title="Subir (más prioridad)" aria-label="Subir">${ic.up}</button><button data-act="down" title="Bajar" aria-label="Bajar">${ic.down}</button>`}
function render(){if(UI.view==="board")renderBoard();else renderGantt();syncControls()}
function renderGantt(){
  PPD=ZOOM[UI.zoom];R=range();
  const tlW=(R.e-R.s+1)*PPD;
  if(lastStart!==null&&lastStart!==R.s)gantt.scrollLeft+=(lastStart-R.s)*PPD;
  lastStart=R.s;
  const rows=buildRows();
  const sy=gantt.scrollTop;
  let h=`<div class="head"><div class="corner"><b>Prioridad</b><span class="long">de arriba a abajo</span></div>${headHTML(tlW)}</div>`;
  h+=gridHTML(tlW);
  h+=rows.map(r=>rowHTML(r,tlW)).join("");
  if(!S.areas.length){
    h+=`<div class="empty"><div><h2>Todavía no hay nada en el plan</h2><div>Si recién se publicó, esperá unos segundos. También podés empezar de cero o restaurar una copia.</div><div class="sbx"><button class="btn primary" data-m2="area">Crear la primera área</button><button class="btn" data-m2="import">Restaurar desde copia…</button></div></div></div>`;
  }else if(!rows.length){
    h+=`<div class="empty"><div><h2>Nada coincide con los filtros</h2><div>Probá con otra búsqueda o mostrá todas las tareas.</div><div class="sbx"><button class="btn" data-m2="clear">Quitar filtros</button></div></div></div>`;
  }
  canvas.style.width=`calc(var(--lw) + ${tlW}px)`;
  canvas.innerHTML=h;
  gantt.scrollTop=sy;
  syncControls();
}
function syncControls(){
  document.querySelectorAll("#segLevel button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.level)));
  document.querySelectorAll("#segView button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.view)));
  document.querySelectorAll("#segGroup button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.group)));
  const bd=UI.view==="board";
  $("#gantt").hidden=bd;$("#board").hidden=!bd;$("#grpLevel").hidden=bd;$("#grpZoom").hidden=bd;$("#today").hidden=bd;$("#grpGroup").hidden=!bd;$("#grpArea").hidden=!bd;$("#grpPer").hidden=!bd;
  document.querySelectorAll("#segPer button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.per)));
  $("#bDay").hidden=UI.per==="todo";$("#bDay").value=isoOf(refDay());
  document.querySelectorAll("#segZoom button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.zoom)));
  $("#foco").setAttribute("aria-pressed",String(UI.foco));

/* ───────── arrastrar para reordenar (filas) ───────── */
let drag=null;
canvas.addEventListener("dragstart",e=>{
  const g=e.target.closest&&e.target.closest(".grip");
  if(!g||RO){e.preventDefault();return}
  const row=g.closest(".row");drag={id:row.dataset.id,k:row.dataset.k};
  e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag.id);e.dataTransfer.setDragImage(row.querySelector(".lc"),12,12)}catch(x){}
  setTimeout(()=>row.classList.add("dragging"),0);
});
function clearDz(){canvas.querySelectorAll(".dz-before,.dz-after,.dz-into").forEach(r=>r.classList.remove("dz-before","dz-after","dz-into"))}
function dropPos(row,e){
  if(!drag)return null;
  const tk=row.dataset.k,dk=drag.k;if(row.dataset.id===drag.id)return null;
  const rc=row.getBoundingClientRect(),y=(e.clientY-rc.top)/rc.height;
  if(dk==="task"){if(tk==="task")return y<.5?"before":"after";if(tk==="proj")return"into";return null}
  if(dk==="proj"){if(tk==="proj")return y<.5?"before":"after";if(tk==="area")return"into";return null}
  if(dk==="area"){if(tk==="area")return y<.5?"before":"after";return null}
  return null;
}
canvas.addEventListener("dragover",e=>{
  if(!drag)return;const row=e.target.closest(".row");if(!row)return;
  const p=dropPos(row,e);clearDz();
  if(p){e.preventDefault();e.dataTransfer.dropEffect="move";row.classList.add("dz-"+p)}
});
canvas.addEventListener("drop",e=>{
  if(!drag)return;const row=e.target.closest(".row");if(!row)return;
  const p=dropPos(row,e);clearDz();
  if(p){e.preventDefault();moveTo(drag.id,row.dataset.id,p)}
  drag=null;
});
canvas.addEventListener("dragend",()=>{clearDz();canvas.querySelectorAll(".dragging").forEach(r=>r.classList.remove("dragging"));drag=null});

function arrOf(k){return k==="task"?S.tasks:k==="proj"?S.projects:S.areas}
function moveTo(id,tid,pos){
  const it=idx.get(id),tg=idx.get(tid);if(!it||!tg)return;
  mutate(()=>{
    const arr=arrOf(it.k),o=it.o;
    arr.splice(arr.indexOf(o),1);
    if(pos==="before"||pos==="after"){
      const ti=arr.indexOf(tg.o);arr.splice(pos==="before"?ti:ti+1,0,o);
      if(it.k==="task")o.p=tg.o.p;
      if(it.k==="proj")o.a=tg.o.a;
    }else{
      if(it.k==="task"){
        const mem=arr.filter(t=>t.p===tid);
        if(UI.exp.has(tid)&&mem.length)arr.splice(arr.indexOf(mem[0]),0,o);
        else if(mem.length)arr.splice(arr.indexOf(mem[mem.length-1])+1,0,o);
        else arr.push(o);
        o.p=tid;UI.exp.add(tid);UI.exp.add(tg.o.a);
      }else if(it.k==="proj"){
        const mem=arr.filter(p=>p.a===tid);
        if(mem.length)arr.splice(arr.indexOf(mem[mem.length-1])+1,0,o);else arr.push(o);
        o.a=tid;UI.exp.add(tid);
      }
    }
  });
  saveUI();toast("Movido");if(UI.sel===id)renderPanel();
}
function siblings(it){
  const arr=arrOf(it.k);
  if(it.k==="task")return arr.filter(t=>t.p===it.o.p);
  if(it.k==="proj")return arr.filter(p=>p.a===it.o.a);
  return arr;
}
function moveStep(id,dir){
  const it=idx.get(id);if(!it)return;
  const sb=siblings(it),i=sb.indexOf(it.o),j=i+dir;
  if(j<0){toast("Ya está primero");return}
  if(j>=sb.length){toast("Ya está último");return}
  mutate(()=>{
    const arr=arrOf(it.k);arr.splice(arr.indexOf(it.o),1);
    const ti=arr.indexOf(sb[j]);arr.splice(dir<0?ti:ti+1,0,it.o);
  });
  const row=canvas.querySelector(`.row[data-id="${id}"]`);if(row)row.scrollIntoView({block:"nearest"});
}
function moveTop(id){
  const it=idx.get(id);if(!it)return;const sb=siblings(it);
  if(sb[0]===it.o){toast("Ya está primero");return}
  mutate(()=>{const arr=arrOf(it.k);arr.splice(arr.indexOf(it.o),1);arr.splice(arr.indexOf(sb[0]),0,it.o)});
  toast("Puesta primera");
}

/* ───────── arrastrar barras (mover / estirar) ───────── */
const tipEl=document.createElement("div");tipEl.className="tip";tipEl.hidden=true;document.body.appendChild(tipEl);
let bd=null;
canvas.addEventListener("pointerdown",e=>{
  const bar=e.target.closest(".bar");if(!bar||e.button>0)return;
  const t=idx.get(bar.dataset.id)?.o;if(!t)return;
  if(RO){select(t.id);return}
  const h=e.target.closest(".h");
  bd={id:t.id,bar,mode:h?h.dataset.h:"m",x0:e.clientX,s:dn(t.s),e:dn(t.e),moved:false,ns:dn(t.s),ne:dn(t.e),pid:e.pointerId};
  try{bar.setPointerCapture(e.pointerId)}catch(x){}
  e.preventDefault();
});
canvas.addEventListener("pointermove",e=>{
  if(!bd||e.pointerId!==bd.pid)return;
  const dx=e.clientX-bd.x0;
  if(!bd.moved&&Math.abs(dx)<4)return;
  bd.moved=true;bd.bar.classList.add("drag");
  const dd=Math.round(dx/PPD);
  let s=bd.s,en=bd.e;
  if(bd.mode==="m"){s+=dd;en+=dd}
  else if(bd.mode==="l"){s=Math.min(bd.s+dd,bd.e)}
  else{en=Math.max(bd.e+dd,bd.s)}
  bd.ns=s;bd.ne=en;
  const t=idx.get(bd.id).o;
  const hito=t.ty==="hito";
  bd.bar.style.left=((s-R.s)*PPD+(hito?PPD/2:0))+"px";
  if(!hito)bd.bar.style.width=Math.max((en-s+1)*PPD,6)+"px";
  tipEl.hidden=false;
  tipEl.textContent=hito?dstr(s):`${dstr(s)} → ${dstr(en)} · ${en-s+1} d`;
  tipEl.style.left=Math.min(e.clientX+14,innerWidth-170)+"px";tipEl.style.top=(e.clientY-34)+"px";
});
function endBarDrag(e){
  if(!bd||(e&&e.pointerId!==bd.pid))return;
  const b=bd;bd=null;tipEl.hidden=true;b.bar.classList.remove("drag");
  const t=idx.get(b.id)?.o;
  if(!b.moved){if(t)select(t.id);return}
  if(t&&(b.ns!==b.s||b.ne!==b.e)){
    mutate(()=>{t.s=isoOf(b.ns);t.e=isoOf(t.ty==="hito"?b.ns:b.ne)},"bar"+t.id+Math.random());
    if(UI.sel===t.id)renderPanel();
  }else render();
}
canvas.addEventListener("pointerup",endBarDrag);
canvas.addEventListener("pointercancel",endBarDrag);
canvas.addEventListener("click",e=>{if(e.target.closest(".bar")){e.stopPropagation()}},true);

/* ───────── alta / baja ───────── */
function firstProj(){return S.projects[0]}
function addTask(projId,st){
  if(RO){toast("Solo lectura");return}
  const p=projId?idx.get(projId)?.o:ctxProject()||firstProj();
  if(!p){toast("Primero creá un área y un proyecto");return}
  const id=uid("k"),base=(UI.view==="board"&&UI.per!=="todo")?refDay():TODAY;
  mutate(()=>{
    S.tasks.push({id,p:p.id,n:"Nueva tarea",s:isoOf(base),e:isoOf(base+6),ty:"tarea",st:st||"todo",star:false});
    UI.exp.add(p.id);UI.exp.add(p.a);
  });
  UI.sel=id;saveUI();render();renderPanel(true);
  const row=canvas.querySelector(`.row[data-id="${id}"]`);if(row)row.scrollIntoView({block:"center"});
}
function ctxProject(){
  const it=UI.sel&&idx.get(UI.sel);if(!it)return null;
  if(it.k==="task")return projOf(it.o);if(it.k==="proj")return it.o;
  return S.projects.find(p=>p.a===it.o.id)||null;
}
function addProject(areaId){
  const id=uid("p");
  mutate(()=>{S.projects.push({id,a:areaId,n:"Nuevo proyecto"});UI.exp.add(areaId)});
  UI.sel=id;saveUI();render();renderPanel(true);
}
const PAL=["#2f6fed","#7c4dff","#12a37f","#e8860c","#0e9aa7","#b5539f","#e0527a","#b08a00","#6b7a8f","#c2410c"];
function addArea(){
  const id=uid("a");
  mutate(()=>{S.areas.push({id,n:"Nueva área",color:PAL[S.areas.length%PAL.length]});UI.exp.add(id)});
  UI.sel=id;saveUI();render();renderPanel(true);
}
function removeItem(id){
  const it=idx.get(id);if(!it)return;
  mutate(()=>{
    if(it.k==="task")S.tasks=S.tasks.filter(t=>t.id!==id);
    else if(it.k==="proj"){S.tasks=S.tasks.filter(t=>t.p!==id);S.projects=S.projects.filter(p=>p.id!==id)}
    else{const ps=S.projects.filter(p=>p.a===id).map(p=>p.id);S.tasks=S.tasks.filter(t=>!ps.includes(t.p));S.projects=S.projects.filter(p=>p.a!==id);S.areas=S.areas.filter(a=>a.id!==id)}
  });
  UI.sel=null;render();renderPanel();toast("Eliminado. Podés deshacerlo.");
}
function dupTask(id){
  const t=idx.get(id)?.o;if(!t)return;
  const nid=uid("k");
  mutate(()=>{const c=JSON.parse(JSON.stringify(t));c.id=nid;c.n=t.n+" (copia)";S.tasks.splice(S.tasks.indexOf(t)+1,0,c)});
  UI.sel=nid;render();renderPanel();
}
$("#addTask").addEventListener("click",()=>addTask());

/* ───────── tablero (vista tipo Trello) ───────── */
const board=$("#board");
const ST=[["todo","Pendiente","var(--muted)"],["doing","En curso","var(--accent)"],["done","Hecha","var(--ok)"]];
const refDay=()=>UI.bday?dn(UI.bday):TODAY;
function periodWin(){
  const r=refDay();
  if(UI.per==="dia")return[r,r];
  if(UI.per==="sem"){const wd=(new Date(r*DAY).getUTCDay()+6)%7;return[r-wd,r-wd+6]}
  if(UI.per==="mes"){const d=new Date(r*DAY);return[Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/DAY,Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)/DAY]}
  return null;
}
const inPeriod=t=>{const w=periodWin();return !w||(dn(t.s)<=w[1]&&dn(t.e)>=w[0])};
function boardCols(){
  const g=UI.group,f=filtering()||UI.per!=="todo",ba=UI.barea;
  const keep=t=>{if(!inPeriod(t))return false;if(filtering()&&!matches(t))return false;if(ba){const p=projOf(t);return !!p&&p.a===ba}return true};
  if(g==="estado")return ST.map(([k,n,c])=>({key:k,n,c,tasks:S.tasks.filter(t=>t.st===k&&keep(t))}));
  if(g==="area")return S.areas.filter(a=>!ba||a.id===ba).map(a=>({key:a.id,n:a.n,c:a.color,open:true,tasks:S.tasks.filter(t=>{const p=projOf(t);return p&&p.a===a.id&&keep(t)})})).filter(c=>!f||c.tasks.length);
  return S.projects.filter(p=>!ba||p.a===ba).map(p=>{const a=areaOf(p);return{key:p.id,n:p.n,sub:ba?(p.dept||""):a.n,c:a.color,tasks:S.tasks.filter(t=>t.p===p.id&&keep(t))}}).filter(c=>!f||c.tasks.length);
}
function cardHTML(t){
  const p=projOf(t),a=p?areaOf(p):{n:"",color:"#667085"},g=UI.group;
  const crumb=g==="estado"?`${esc(a.n)} › ${esc(p?p.n:"")}`:g==="area"?esc(p?p.n:""):"";
  const s=dn(t.s),e=dn(t.e),late=isLate(t);
  const when=t.ty==="hito"?dstr(s):`${dstr(s)} → ${dstr(e)}`;
  const tag=t.ty==="hito"?"Fecha clave":t.ty==="habito"?"Hábito":"";
  return `<div class="card${t.st==="done"?" is-done":""}${UI.sel===t.id?" sel":""}" draggable="true" data-id="${t.id}" style="--c:${a.color}">
   ${crumb?`<div class="cr">${crumb}</div>`:""}
   <div class="ct"><button class="sbtn ${t.st}" data-tick aria-label="Marcar como hecha" title="Marcar como hecha">${ic.check}</button><span class="cn">${esc(t.n)}</span>${t.star?ic.star:""}</div>
   <div class="cm"><span class="when${late?" late":""}">${when}${late?" · vencida":""}</span>${tag?`<span class="tag">${tag}</span>`:""}${t.links&&t.links.length?`<span class="tag" title="Enlaces">↗ ${t.links.length}</span>`:""}${t.note?`<span class="tag" title="Tiene notas">≡</span>`:""}</div></div>`;
}
function renderBoard(){
  if(UI.barea&&!idx.has(UI.barea))UI.barea="";
  const sel=$("#bArea");
  sel.innerHTML='<option value="">Todas las áreas</option>'+S.areas.map(a=>`<option value="${a.id}"${a.id===UI.barea?" selected":""}>${esc(a.n)}</option>`).join("");
  const sx=board.scrollLeft,sy={};
  board.querySelectorAll(".col").forEach(c=>{sy[c.dataset.key]=c.querySelector(".colb").scrollTop});
  const cols=boardCols();
  {const w=periodWin(),n=new Set(cols.flatMap(c=>c.tasks.map(t=>t.id))).size;
   let txt="";
   if(w){const a=dstr(w[0]),b=dstr(w[1]);txt=(UI.per==="dia"?(refDay()===TODAY?"Hoy, "+a:"El "+a):`${a} → ${b}`)+` · ${n} ${n===1?"tarea":"tareas"}`}
   $("#perNote").textContent=txt}
  let h=cols.map(c=>`<section class="col" data-key="${c.key}" style="--c:${c.c}">
    <div class="colh"><div class="tt"><b title="${c.open&&!UI.barea?"Abrir "+esc(c.n)+" como tablero":esc(c.n)}"${c.open&&!UI.barea?` data-open="${c.key}" style="cursor:pointer"`:""}>${esc(c.n)}</b>${c.sub?`<small>${esc(c.sub)}</small>`:""}</div><span class="cnt">${c.tasks.length}</span><button class="plus" data-badd="${c.key}" aria-label="Agregar tarea a ${esc(c.n)}" title="Agregar tarea">${ic.plus}</button></div>
    <div class="colb">${c.tasks.map(cardHTML).join("")||'<div class="none">Sin tareas. Arrastrá una acá.</div>'}</div>
    <button class="addc" data-badd="${c.key}">${ic.plus} Agregar tarea</button></section>`).join("");
  if(!S.areas.length)h=`<div class="empty" style="position:static;flex:1;border:1px solid var(--line);border-radius:12px"><div><h2>Todavía no hay nada en el plan</h2><div>Creá la primera área desde el menú ⋯.</div></div></div>`;
  else if(!cols.length)h=`<div class="empty" style="position:static;flex:1;border:1px solid var(--line);border-radius:12px"><div><h2>Nada coincide con los filtros</h2><div>Probá con otra búsqueda.</div></div></div>`;
  board.innerHTML=h;
  board.scrollLeft=sx;
  board.querySelectorAll(".col").forEach(c=>{const v=sy[c.dataset.key];if(v)c.querySelector(".colb").scrollTop=v});
}
function addCard(key){
  const g=UI.group;let pid=null,st;
  if(g==="proyecto")pid=key;
  else if(g==="area"){const p=S.projects.find(p=>p.a===key);if(!p){toast("Esta área todavía no tiene proyectos");return}pid=p.id}
  else{st=key;let p=ctxProject();if(UI.barea&&(!p||p.a!==UI.barea))p=S.projects.find(x=>x.a===UI.barea);p=p||firstProj();pid=p&&p.id}
  addTask(pid,st);
}
function inCol(x,key){const g=UI.group;if(g==="estado")return x.st===key;if(g==="proyecto")return x.p===key;const p=projOf(x);return !!p&&p.a===key}
function moveCard(id,key,tid,pos){
  const it=idx.get(id);if(!it)return;const t=it.o,g=UI.group;
  let np=t.p,nst=t.st;
  if(g==="estado")nst=key;
  else if(g==="proyecto")np=key;
  else{const cur=projOf(t);if(!cur||cur.a!==key){const p=S.projects.find(p=>p.a===key);if(!p){toast("Esta área todavía no tiene proyectos");return}np=p.id}}
  mutate(()=>{
    S.tasks.splice(S.tasks.indexOf(t),1);
    t.p=np;t.st=nst;
    if(tid){const ti=S.tasks.indexOf(idx.get(tid).o);S.tasks.splice(pos==="before"?ti:ti+1,0,t)}
    else{let last=-1;S.tasks.forEach((x,i)=>{if(inCol(x,key))last=i});if(last<0)S.tasks.push(t);else S.tasks.splice(last+1,0,t)}
  });
  if(UI.sel===id)renderPanel();
}
board.addEventListener("click",e=>{

  select(card.dataset.id);
});
let cdrag=null;

  const id=cdrag;cdrag=null;clearCz();moveCard(id,col.dataset.key,tid,pos);
});
board.addEventListener("dragend",()=>{clearCz();board.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));cdrag=null});
$("#segView").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;UI.view=b.dataset.v;saveUI();render();if(UI.view==="gantt"&&gantt.scrollLeft<5)goToday()});
$("#bArea").addEventListener("change",e=>{UI.barea=e.target.value;if(UI.barea&&UI.group==="area")UI.group="proyecto";saveUI();render();board.scrollLeft=0});
$("#segPer").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;UI.per=b.dataset.v;saveUI();render()});
$("#bDay").addEventListener("change",e=>{const v=e.target.value;if(!v)return;UI.bday=v===isoOf(TODAY)?"":v;saveUI();render()});
$("#segGroup").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;UI.group=b.dataset.v;saveUI();render()});

/* ───────── panel de edición ───────── */
const panel=$("#panel");
function projectOptions(sel){
  return S.areas.map(a=>`<optgroup label="${esc(a.n)}">${S.projects.filter(p=>p.a===a.id).map(p=>`<option value="${p.id}"${p.id===sel?" selected":""}>${esc(p.n)}</option>`).join("")}</optgroup>`).join("");
}
function areaOptions(sel){return S.areas.map(a=>`<option value="${a.id}"${a.id===sel?" selected":""}>${esc(a.n)}</option>`).join("")}
function renderPanel(focus){
  const it=UI.sel&&idx.get(UI.sel);
  if(!it){panel.hidden=true;panel.innerHTML="";return}
  panel.hidden=false;
  const o=it.o,dis=RO?" disabled":"";
  let c,crumb;
  if(it.k==="task"){const p=projOf(o),a=p?areaOf(p):{n:"",color:"#667085"};c=a.color;crumb=`<b style="--c:${c}"></b>${esc(a.n)} › ${esc(p?p.n:"")}`}
  else if(it.k==="proj"){const a=areaOf(o);c=a.color;crumb=`<b style="--c:${c}"></b>${esc(a.n)} › Proyecto`}
  else{c=o.color;crumb=`<b style="--c:${c}"></b>Área`}
  let body=`<div><label class="l" for="f-name">Nombre</label><input class="field name" id="f-name" value="${esc(o.n)}"${dis}></div>`;
  if(it.k==="task"){
    const s=dn(o.s),e=dn(o.e),dur=e-s+1,late=isLate(o);
    body+=`
    <div><label class="l">Estado</label><div class="seg" id="p-st">
      ${[["todo","Pendiente"],["doing","En curso"],["done","Hecha"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${o.st===v}"${dis}>${l}</button>`).join("")}</div></div>
    <div><label class="l">Tipo</label><div class="seg" id="p-ty">
      ${[["tarea","Tarea"],["hito","Fecha clave"],["habito","Hábito"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${o.ty===v}"${dis}>${l}</button>`).join("")}</div>
      <div class="hint" style="margin-top:5px">${o.ty==="hito"?"Un día puntual (baja, vencimiento, entrega).":o.ty==="habito"?"Algo que se repite en el tiempo (se muestra rayado).":"Trabajo con inicio y fin."}</div></div>
    <div><label class="l">Fechas</label>
      <div class="two"><div><input class="field" type="date" id="f-s" value="${o.s}" aria-label="Inicio"${dis}></div>
      ${o.ty==="hito"?"<div></div>":`<div><input class="field" type="date" id="f-e" value="${o.e}" aria-label="Fin"${dis}></div>`}</div>
      <div class="row2" style="margin-top:6px"><button class="btn" data-act="shift" data-d="-7"${dis}>◀ 1 sem</button><button class="btn" data-act="shift" data-d="7"${dis}>1 sem ▶</button><button class="btn" data-act="start-today"${dis}>Empezar hoy</button></div>
      <div class="dur${late?" late":""}">${o.ty==="hito"?dstr(s):`${dur} ${dur===1?"día":"días"} · ${dstr(s)} → ${dstr(e)}`}${late?" · vencida":""}</div></div>
    <div><label class="l">Prioridad</label>
      <div class="row2"><button class="btn" data-act="star" aria-pressed="${!!o.star}"${dis}>${ic.star}${o.star?"En foco":"Poner en foco"}</button>
      <button class="btn" data-act="up"${dis}>${ic.up}Subir</button><button class="btn" data-act="down"${dis}>${ic.down}Bajar</button><button class="btn" data-act="top"${dis}>${ic.top}Al tope</button></div></div>
    <div><label class="l" for="f-proj">Proyecto</label><select class="field" id="f-proj" style="width:100%"${dis}>${projectOptions(o.p)}</select></div>
    <div><label class="l" for="f-note">Notas</label><textarea class="field" id="f-note" placeholder="Detalles, contexto, próximos pasos…"${dis}>${esc(o.note||"")}</textarea></div>
    <div><label class="l">Enlaces</label>
      <div class="chips" id="chips">${(o.links||[]).map((l,i)=>`<span class="chip"><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t||l.u)}</a><button data-act="rmlink" data-i="${i}" aria-label="Quitar enlace"${dis}>${ic.x}</button></span>`).join("")||'<span class="hint">Sin enlaces</span>'}</div>
      <div class="two" style="margin-top:8px;grid-template-columns:1fr 1.4fr auto"><input class="field" id="l-t" placeholder="Título"${dis}><input class="field" id="l-u" placeholder="https://…" inputmode="url"${dis}><button class="btn" data-act="addlink"${dis}>${ic.plus}</button></div></div>
    <div class="row2"><button class="btn" data-act="dup"${dis}>Duplicar</button><button class="btn danger" data-act="del"${dis}>Eliminar</button></div>`;
  }else if(it.k==="proj"){
    const n=S.tasks.filter(t=>t.p===o.id).length;
    body+=`
    <div><label class="l" for="f-dept">Departamento del organigrama</label><input class="field" id="f-dept" value="${esc(o.dept||"")}" placeholder="Ej: Multimedia y comunicación"${dis}></div>
    <div><label class="l" for="f-area">Área</label><select class="field" id="f-area" style="width:100%"${dis}>${areaOptions(o.a)}</select></div>
    <div><label class="l">Orden</label><div class="row2"><button class="btn" data-act="up"${dis}>${ic.up}Subir</button><button class="btn" data-act="down"${dis}>${ic.down}Bajar</button><button class="btn" data-act="top"${dis}>${ic.top}Al tope</button></div></div>
    <div class="row2"><button class="btn primary" data-act="add"${dis}>${ic.plus}Agregar tarea</button><button class="btn danger" data-act="del"${dis}>Eliminar (${n} tareas)</button></div>`;
  }else{
    const n=S.projects.filter(p=>p.a===o.id).length;
    body+=`
    <div><label class="l" for="f-color">Color</label><div class="row2" style="align-items:center"><input type="color" id="f-color" value="${esc(o.color)}" style="width:44px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px"${dis}>
      ${PAL.map(p=>`<button class="btn" data-act="pal" data-c="${p}" style="width:26px;height:26px;padding:0;background:${p};border-color:${p}" aria-label="Color ${p}"${dis}></button>`).join("")}</div></div>
    <div><label class="l">Orden</label><div class="row2"><button class="btn" data-act="up"${dis}>${ic.up}Subir</button><button class="btn" data-act="down"${dis}>${ic.down}Bajar</button><button class="btn" data-act="top"${dis}>${ic.top}Al tope</button></div></div>
    <div class="row2"><button class="btn primary" data-act="add"${dis}>${ic.plus}Agregar proyecto</button><button class="btn danger" data-act="del"${dis}>Eliminar (${n} proyectos)</button></div>`;
  }
  panel.style.setProperty("--c",c);
  panel.innerHTML=`<div class="ph"><div class="crumb">${crumb}</div><button class="btn" data-act="close" aria-label="Cerrar" style="padding:4px 7px">${ic.x}</button></div><div class="pb">${body}</div>`;
  if(focus){const n=$("#f-name");if(n){n.focus();n.select()}}
}
function F(field,val,key){const it=idx.get(UI.sel);if(!it)return;mutate(()=>{it.o[field]=val},key||("f"+UI.sel+field))}
panel.addEventListener("input",e=>{
  const it=UI.sel&&idx.get(UI.sel);if(!it)return;const t=e.target,o=it.o;
  if(t.id==="f-name"){F("n",t.value||"Sin nombre")}
  else if(t.id==="f-note"){F("note",t.value)}
  else if(t.id==="f-dept"){F("dept",t.value)}
  else if(t.id==="f-color"){F("color",t.value)}
});
panel.addEventListener("change",e=>{
  const it=UI.sel&&idx.get(UI.sel);if(!it)return;const t=e.target,o=it.o;
  if(t.id==="f-s"&&t.value){
    const dur=dn(o.e)-dn(o.s);mutate(()=>{o.s=t.value;o.e=o.ty==="hito"?t.value:isoOf(dn(t.value)+dur)});renderPanel();
  }else if(t.id==="f-e"&&t.value){
    mutate(()=>{o.e=dn(t.value)<dn(o.s)?o.s:t.value});renderPanel();
  }else if(t.id==="f-proj"){
    mutate(()=>{o.p=t.value;const p=idx.get(t.value).o;UI.exp.add(p.id);UI.exp.add(p.a)});renderPanel();
  }else if(t.id==="f-area"){
    mutate(()=>{o.a=t.value;UI.exp.add(t.value)});renderPanel();
  }
});
let armT;
panel.addEventListener("click",e=>{
  const seg=e.target.closest("#p-st button,#p-ty button");
  const it=UI.sel&&idx.get(UI.sel);
  if(seg&&it){
    const o=it.o,v=seg.dataset.v;
    if(seg.parentElement.id==="p-st")mutate(()=>{o.st=v});
    else mutate(()=>{
      const was=o.ty;o.ty=v;
      if(v==="hito")o.e=o.s;else if(was==="hito"&&o.e===o.s)o.e=isoOf(dn(o.s)+6);
    });
    renderPanel();return;
  }
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="close"){UI.sel=null;render();renderPanel();return}
  if(!it)return;const o=it.o;
  if(a==="shift"){const d=+b.dataset.d;mutate(()=>{o.s=isoOf(dn(o.s)+d);o.e=isoOf(dn(o.e)+d)});renderPanel()}
  else if(a==="start-today"){const dur=dn(o.e)-dn(o.s);mutate(()=>{o.s=isoOf(TODAY);o.e=isoOf(TODAY+dur)});renderPanel()}
  else if(a==="star"){mutate(()=>{o.star=!o.star});renderPanel()}
  else if(a==="up")moveStep(o.id,-1);
  else if(a==="down")moveStep(o.id,1);
  else if(a==="top")moveTop(o.id);
  else if(a==="add"){it.k==="area"?addProject(o.id):addTask(o.id)}
  else if(a==="dup")dupTask(o.id);
  else if(a==="pal"){mutate(()=>{o.color=b.dataset.c});renderPanel()}
  else if(a==="rmlink"){mutate(()=>{o.links.splice(+b.dataset.i,1)});renderPanel()}
  else if(a==="addlink"){
    const u=$("#l-u").value.trim(),tt=$("#l-t").value.trim();if(!u)return;
    const url=/^https?:\/\//i.test(u)?u:"https://"+u;
    mutate(()=>{(o.links=o.links||[]).push({t:tt||url.replace(/^https?:\/\/(www\.)?/,"").slice(0,40),u:url})});renderPanel();
  }else if(a==="del"){
    if(b.classList.contains("arm")){removeItem(o.id)}
    else{b.classList.add("arm");b.textContent="¿Seguro? Tocá de nuevo";clearTimeout(armT);armT=setTimeout(()=>renderPanel(),3500)}
  }
});
panel.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.id==="l-u"||e.target.id==="l-t")){e.preventDefault();panel.querySelector('[data-act="addlink"]').click()}
  if(e.key==="Enter"&&e.target.id==="f-name"){e.target.blur()}
});

/* ───────── menú, exportar, importar ───────── */
const pop=$("#pop"),menuBtn=$("#menuBtn");
menuBtn.addEventListener("click",e=>{e.stopPropagation();const o=pop.hidden;pop.hidden=!o;menuBtn.setAttribute("aria-expanded",String(o))});
document.addEventListener("click",e=>{if(!e.target.closest(".menu")){pop.hidden=true;menuBtn.setAttribute("aria-expanded","false")}});
pop.addEventListener("click",async e=>{
  const b=e.target.closest("[data-m]");if(!b)return;pop.hidden=true;
  const m=b.dataset.m;
  if(m==="area")addArea();
  else if(m==="import")$("#file").click();
  else if(m==="json")saveFile(`plan-maestro-${isoOf(TODAY)}.json`,JSON.stringify({areas:S.areas,projects:S.projects,tasks:S.tasks},null,1));
  else if(m==="csv")saveFile(`plan-maestro-${isoOf(TODAY)}.csv`,toCSV());
});
async function saveFile(name,data){
  try{
    const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!d){toast("Descargas no disponibles en esta vista");return}
    await d.save({filename:name,data:name.endsWith(".csv")?"﻿"+data:data});toast("Archivo listo");
  }catch(e){if(!e||e.code!=="declined")toast("No se pudo descargar el archivo")}
}
function toCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Área","Proyecto","Tarea","Tipo","Estado","Inicio","Fin","Foco","Notas","Enlaces"]];
  for(const a of S.areas)for(const p of S.projects.filter(p=>p.a===a.id))for(const t of S.tasks.filter(t=>t.p===p.id))
    rows.push([a.n,p.n,t.n,t.ty,t.st,t.s,t.e,t.star?"sí":"",t.note||"",(t.links||[]).map(l=>l.u).join(" ")]);
  return rows.map(r=>r.map(q).join(",")).join("\r\n");
}
let pending=null;
$("#file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.areas)||!Array.isArray(d.projects)||!Array.isArray(d.tasks))throw 0;
    pending=d;
    modal("Restaurar copia",`Se va a reemplazar el plan actual por el del archivo (${d.areas.length} áreas, ${d.projects.length} proyectos, ${d.tasks.length} tareas). Podés deshacerlo después.`,"Reemplazar",()=>{
      mutate(()=>{S={areas:pending.areas,projects:pending.projects,tasks:pending.tasks}});UI.sel=null;setLevel(UI.level,true);render();renderPanel();toast("Copia restaurada");
    });
  }catch(x){toast("El archivo no parece una copia válida del plan")}
});
function modal(title,txt,okTxt,ok){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${esc(txt)}</p><div class="sbx"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok">${esc(okTxt)}</button></div></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(x||e.target===m){m.remove();if(x&&x.dataset.x==="ok")ok()}});
  document.body.appendChild(m);m.querySelector('[data-x="no"]').focus();
}

/* ───────── varios ───────── */
let toastT;
function toast(msg){
  let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);
}
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||""));
  if(e.key==="Escape"){
    const m=$(".modal");if(m){m.remove();return}
    if(!pop.hidden){pop.hidden=true;return}
    if(UI.sel){UI.sel=null;render();renderPanel()}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();undo()}
});

/* ───────── arranque ───────── */
syncControls();
render();updateStats();
requestAnimationFrame(()=>goToday());
initData().then(()=>{requestAnimationFrame(()=>{if(gantt.scrollLeft<5)goToday()})});
})();
</script>

</body></html>
