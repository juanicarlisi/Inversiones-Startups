<!doctype html><script>window.res={};</script>
<script type="module">import {x} from './m.js'; window.res.modulo = 'ok '+x;</script>
<script>try{const w=new Worker('w.js');w.onmessage=e=>window.res.worker=e.data;w.onerror=e=>window.res.worker='error';}catch(e){window.res.worker='excepcion '+e.message;}
fetch('m.js').then(()=>window.res.fetch='ok').catch(e=>window.res.fetch='error '+e.message);
try{navigator.serviceWorker?window.res.sw='existe':window.res.sw='no existe';}catch(e){window.res.sw='excepcion'}
window.res.idb = typeof indexedDB;</script>
